    {"title":"古河道","kind":"探索/观测","text":"一道**干涸的古河道**横在面前，河床宽得惊人，如今只剩沙子和鹅卵石。河岸高处还留着水线冲刷的痕迹——几百年前，这里应该是一条大河。","opts":[{"t":"沿河道走一段，找找河床里冲出来的东西","note":"补给+3 · 材料+1 · 体力-3","fx":{"stam":-3,"food":3,"mats":1}},{"t":"量一量河道宽度，记进观测笔记","note":"观测+2 · 体力-2","fx":{"stam":-2,"obs":2}},{"t":"直穿河道，不多停留","note":"体力-1","fx":{"stam":-1}}],"id":"w22"},
    {"title":"陶片","kind":"探索/观测","text":"风化的土坡下露出一截**陶罐残片**，断面光滑，纹路规整——不是现代的东西。你蹲下拨开浮土，底下还压着几片，像是某个旅队埋下的。","opts":[{"t":"小心刨出陶片，拼一拼纹路","note":"观测+2 · 材料+1 · 体力-2","fx":{"stam":-2,"obs":2,"mats":1}},{"t":"记下位置和纹样，带回罗德岛登记","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"别碰——地里的东西，说不定是谁的遗物","note":"精神-1","fx":{"mind":-1}}],"id":"w23"},
    {"title":"仙人球","kind":"采集/生存","text":"石缝里蹲着一棵**仙人球**，顶着几朵粉花，球身上还挂着晨露。这片荒原难得见到这么水灵的东西，像一颗绿色的信号弹。","opts":[{"t":"切一块仙人球肉，去刺生啃","note":"补给+3 · 体力-2","fx":{"stam":-2,"food":3}},{"t":"连花带球一起挖走，带回去种","note":"材料+1 · 体力-3","fx":{"stam":-3,"mats":1}},{"t":"不碰——荒原上长得越水灵，越要小心","note":"精神-1","fx":{"mind":-1}}],"id":"w24"},
    {"title":"干草垛","kind":"探索/补给","text":"路边立着几座**干草垛**，垛顶压着防风的油布，垛脚还码着几捆柴。周围没人，但柴刀插在地上，刀柄磨得发亮——有人常来照看这里。","opts":[{"t":"抽两捆干草，铺进帐篷防潮","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"用柴刀劈几根柴，补足路上引火的","note":"引火物+1 · 体力-3","fx":{"stam":-3,"tinder":1}},{"t":"不碰——人家的东西，动了就要记人情","note":"精神-1","fx":{"mind":-1}}],"id":"w25"},
    {"title":"路牌","kind":"探索/观测","text":"岔路口立着一根**歪斜的路牌**，木牌上的字被风沙磨得只剩下轮廓，勉强能认出两个方向：「罗德岛补给点 →」和「← 旧驿道」。箭头指向一片什么也没有的旷野。","opts":[{"t":"照路牌指的方向找找，看补给点还在不在","note":"观测+2 · 体力-3","fx":{"stam":-3,"obs":2}},{"t":"记下路牌位置和方向，补进观测笔记","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"不信路牌，按自己的图走","note":"精神-1","fx":{"mind":-1}}],"id":"w26"},
    {"title":"独轮车","kind":"探索/人性","text":"路沟里歪着一辆**独轮车**，车斗裂了一道缝，轮子陷在沙里。车把上缠着布条，磨得油亮——它推过很多东西，最后没推过这片沙。","opts":[{"t":"扶起车，看看还能不能修","note":"材料+1 · 体力-3","fx":{"stam":-3,"mats":1}},{"t":"拆下车轮，收作备用的轴承","note":"材料+2 · 体力-2","fx":{"stam":-2,"mats":2}},{"t":"不碰——这车推的东西，早就散在路上了","note":"精神-1","fx":{"mind":-1}}],"id":"w27"},
    {"title":"燕麦田","kind":"采集/补给","text":"一片被风沙半埋的**野燕麦田**在洼地里招摇，穗子已经干透，风一吹沙沙响。看得出是被人撒过种的——只是再没人回来收。","opts":[{"t":"割一捆燕麦穗，搓出麦粒","note":"补给+4 · 体力-3","fx":{"stam":-3,"food":4}},{"t":"只收一把穗子，回去试着种","note":"材料+1 · 体力-2","fx":{"stam":-2,"mats":1}},{"t":"不碰——没人收的田，收了也算欠债","note":"精神-1","fx":{"mind":-1}}],"id":"w28"},
    {"title":"野山羊","kind":"生态/狩猎","text":"陡崖顶上站着一只**野山羊**，长角弯成漂亮的弧，居高临下看着你。它咩了一声，蹄子刨了刨石面，像是警告，又像只是打个招呼。","opts":[{"t":"用弓/弩猎它，添一顿硬菜","note":"需弓或弩 · 补给+5 · 体力-4","fx":{"stam":-4,"food":5},"reqBow":true},{"t":"捡它蹭崖壁掉下来的毛，做引火绒","note":"引火物+1 · 观测+1","fx":{"obs":1,"tinder":1}},{"t":"不惹它——山崖是它的地盘，路是你的","note":"精神-1","fx":{"mind":-1}}],"id":"w29"},
    {"title":"野荞麦","kind":"采集/补给","text":"干涸的沟边，**一片野荞麦**正开着白花，花穗在风里轻轻晃。荞麦秆不高，但结的籽粒饱满，是荒原上难得的好收成。","opts":[{"t":"割一把荞麦穗，搓出籽粒炒熟","note":"补给+4 · 体力-3","fx":{"stam":-3,"food":4}},{"t":"只采几穗，留种回去试种","note":"材料+1 · 体力-2","fx":{"stam":-2,"mats":1}},{"t":"不碰——野花野麦，自有野鸟野蜂守着","note":"精神-1","fx":{"mind":-1}}],"id":"w30"},
    {"title":"盐壳地","kind":"地貌/生存","text":"前方一片**龟裂的盐壳地**，白色盐霜在阳光下刺眼，一脚踩下去，盐壳脆裂，底下是干透的泥。风一吹，细盐沫直往鼻子里钻。","opts":[{"t":"用刀尖凿一块盐壳，收作调料","note":"补给+2 · 体力-3","fx":{"stam":-3,"food":2}},{"t":"绕行盐壳地边缘，省体力","note":"体力-2 · 补给-1","fx":{"stam":-2,"food":-1}},{"t":"抓一把盐霜试试成色","note":"观测+1 · 体力-1","fx":{"stam":-1,"obs":1}}],"id":"w31"},
    {"title":"野驴","kind":"生态/观测","text":"远处，**几头野驴**正低头啃着枯草，见你走近，齐齐抬头，耳朵竖得笔直。领头那匹打了个响鼻，带着驴群往更远处挪了几步，又停下来继续吃。","opts":[{"t":"停下来看它们的走向，说不定能找到水源","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"学驴叫，看它们认不认这个声音","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不惊它们——野驴认路，跟着它们走可能绕远","note":"体力-2","fx":{"stam":-2}}],"id":"w32"},
    {"title":"铁皮桶","kind":"探索/水源","text":"半埋的沙堆旁，**一只铁皮桶**倒扣着，桶底锈穿了一个洞。桶沿系着一段新绳子——有人不久前还用它打过水，只是井早干了。","opts":[{"t":"把桶扶起来，看看周围有没有旧井口","note":"观测+2 · 体力-3","fx":{"stam":-3,"obs":2}},{"t":"取下那段新绳子，收作备用的","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"不碰——桶都锈穿了，井还能有水？","note":"精神-1","fx":{"mind":-1}}],"id":"w33"},
    {"title":"地锦","kind":"植物/探索","text":"干涸的沟壁上，**一丛地锦**贴着土爬开，叶片小而密，根须扎进干透的土缝里。地锦常沿着水脉长——它爬的方向，也许藏着点什么。","opts":[{"t":"顺着地锦爬的方向找，看它通向哪里","note":"观测+2 · 体力-3","fx":{"stam":-3,"obs":2}},{"t":"掐一把地锦，榨出汁水润润喉","note":"补给+1 · 体力-1","fx":{"stam":-1,"food":1}},{"t":"不追——草往哪爬，水就往哪流，但它未必找得到","note":"精神-1","fx":{"mind":-1}}],"id":"w34"},
    {"title":"风蚀拱门","kind":"地貌/观测","text":"前方的土崖上，**一座风蚀拱门**立在崖顶，拱洞被风掏得浑圆，像一扇嵌在天边的窗。光从拱洞穿过，在地面投下一道长长的影子。","opts":[{"t":"爬上去，用拱门当参照校准方位","note":"观测+2 · 体力-3","fx":{"stam":-3,"obs":2}},{"t":"在拱门下歇脚，等影子最短的时候对表","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"绕开走——门是风掏的，塌不塌全看运气","note":"体力-2","fx":{"stam":-2}}],"id":"w35"},
    {"title":"骆驼骨架","kind":"生态/人性","text":"沙梁上横着一具**骆驼骨架**，肋骨折断，皮肉早已风化，只剩白花花的骨头在太阳下晒着。鞍具还绑在脊骨上，缰绳断成两截，垂在沙里。","opts":[{"t":"解开鞍具，看看有没有还能用的","note":"补给+2 · 材料+1 · 体力-2","fx":{"stam":-2,"food":2,"mats":1}},{"t":"数一数肋骨，估一估它死了多久","note":"观测+2 · 精神-1","fx":{"mind":-1,"obs":2}},{"t":"不碰——骆驼倒下的地方，驼队多半也没走远","note":"精神-2","fx":{"mind":-2}}],"id":"w36"},
    {"title":"芨芨草","kind":"植物/采集","text":"干河床边，**一片芨芨草**长得比人还高，草穗在风里沙沙响。芨芨草扎根深，能固沙，也是荒原上少见的能编东西的草。","opts":[{"t":"割一把芨芨草，编一只小筐","note":"材料+1 · 补给+1 · 体力-2","fx":{"stam":-2,"food":1,"mats":1}},{"t":"在草丛里扒一扒，看有没有动物藏的粮","note":"补给+3 · 体力-3","fx":{"stam":-3,"food":3}},{"t":"不碰——草根扎得深，拔了沙就活了","note":"精神-1","fx":{"mind":-1}}],"id":"w37"},
    {"title":"狼尾草","kind":"植物/采集","text":"路沟边，**一片狼尾草**垂着毛茸茸的穗子，在风里一浪一浪地摇。草秆柔韧，割下来能搓绳，也能编个草垫。","opts":[{"t":"割一把狼尾草，搓几根备用绳","note":"材料+1 · 补给+1 · 体力-2","fx":{"stam":-2,"food":1,"mats":1}},{"t":"铺一捆在沙地上，坐着歇一会儿","note":"精神+1 · 体力-1","fx":{"stam":-1,"mind":1}},{"t":"不碰——草穗上的种子，是风要带走的","note":"精神-1","fx":{"mind":-1}}],"id":"w38"},
    {"title":"碱湖","kind":"地貌/生存","text":"前方豁然开朗——**一片碱湖**横在谷地，水面白花花的，湖岸结着厚厚的盐霜。湖水浅得能看见底，但尝一口，又苦又涩，喝不得。","opts":[{"t":"凿一块湖岸的盐霜，收作调料","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"绕湖走一圈，看有没有活水注入","note":"观测+2 · 体力-3","fx":{"stam":-3,"obs":2}},{"t":"不喝——碱湖的水，喝了比渴着还难受","note":"精神-1","fx":{"mind":-1}}],"id":"w39"},
    {"title":"盐矿","kind":"资源/探索","text":"一处塌了半边的老矿口立在沙丘后，**洞口结着一层盐霜**，风一吹簌簌往下掉。矿壁上有旧凿痕，深浅不一，显然有人在这里挖过盐。","opts":[{"t":"下矿口凿一块盐，收作补给","note":"补给+3 · 体力-3","fx":{"stam":-3,"food":3}},{"t":"只捡洞口散落的盐块，不往里走","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"不挖——塌过的矿口，进去容易出来难","note":"精神-1","fx":{"mind":-1}}],"id":"w40"},
    {"title":"旱厕","kind":"人性/探索","text":"废弃驿站的土墙边，**一间旱厕**还立着，门板歪了一半。墙缝里塞着一只油布包，包着两块压缩干粮和一张写满字的纸条——是过路人留下的，字迹被汗渍洇花了大半。","opts":[{"t":"收下干粮，把纸条抄一遍留底","note":"补给+2 · 材料+1 · 体力-2","fx":{"stam":-2,"food":2,"mats":1}},{"t":"只记纸条上的话，东西原样放回","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"不碰——过路人的东西，动了就要接他的事","note":"精神-2","fx":{"mind":-2}}],"id":"w41"},
    {"title":"苦艾","kind":"植物/生存","text":"乱石坡上，**一丛苦艾**在风里伏倒又立起，叶片泛着银灰。苦艾的苦是出了名的，但泡水能解乏，嚼一片还能压住嘴里的干渴。","opts":[{"t":"摘一把晒干，路上泡水喝","note":"补给+1 · 精神+1 · 体力-2","fx":{"stam":-2,"food":1,"mind":1}},{"t":"嚼两片叶子，忍着苦提一提神","note":"精神+2 · 体力-1","fx":{"stam":-1,"mind":2}},{"t":"不碰——苦的东西，尝过一次就记住了","note":"精神-1","fx":{"mind":-1}}],"id":"w42"},
    {"title":"水井","kind":"水源/生存","text":"塌了一半的土墙边，**一口水井**露着井口，井沿的绳子还系着一只破桶。你探头望了望，井底黑沉沉的，看不清有没有水——井口却有一股凉气冒上来。","opts":[{"t":"放桶下去打一桶，看水能不能喝","note":"补给+3 · 体力-3","fx":{"stam":-3,"food":3}},{"t":"只贴着井口听水声，估一估水位","note":"观测+2 · 体力-2","fx":{"stam":-2,"obs":2}},{"t":"不碰——荒原上的井，越深越说不清底下是什么","note":"精神-2","fx":{"mind":-2}}],"id":"w43"},
    {"title":"发菜","kind":"植物/人情","text":"雨后的砾石地上，**一窝发菜**贴着土面铺开，黑亮亮的，像散落的头发丝。发菜是荒原的稀罕物，能卖钱，也能当菜吃，就是难摘。","opts":[{"t":"蹲下来，小心收一捧发菜","note":"补给+2 · 体力-3","fx":{"stam":-3,"food":2}},{"t":"只采一半，余下的留着它继续长","note":"补给+1 · 精神+1","fx":{"food":1,"mind":1}},{"t":"不采——发菜长得慢，摘了这片，三年都缓不过来","note":"精神-1","fx":{"mind":-1}}],"id":"w44"},
    {"title":"甘草","kind":"植物/生存","text":"干河沟边，**几株甘草**从沙土里探出枝来，叶子被啃得稀稀拉拉，根却扎得深。甘草的根是甜的，嚼一根能压住嗓子里的干涩，也是赶路人的老方子。","opts":[{"t":"挖几段甘草根，收进干粮袋","note":"补给+2 · 体力-3","fx":{"stam":-3,"food":2}},{"t":"只嚼一段根，剩下的留着它长","note":"补给+1 · 精神+1","fx":{"food":1,"mind":1}},{"t":"不挖——甘草甜是甜，挖了根，这片就真秃了","note":"精神-1","fx":{"mind":-1}}],"id":"w45"},
    {"title":"野蒜","kind":"植物/生存","text":"干河沟的土坡上，**一丛野蒜**顶着细长的叶子，根须抓着一小团土。掐一片叶子，辛辣的蒜味直冲鼻子——荒原上少有的提味货，也是杀菌的老方子。","opts":[{"t":"挖一丛野蒜，收进干粮袋","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"只掐叶子，留着根让它再长","note":"补给+1 · 精神+1","fx":{"food":1,"mind":1}},{"t":"不挖——蒜味太重，带着它走夜路，人还没到味先到了","note":"精神-1","fx":{"mind":-1}}],"id":"w46"},
    {"title":"孤坟","kind":"人性/历史","text":"乱石坡的背风处，**一座孤坟**隆着土包，坟前竖了块石板，没有字，只压着一只豁口的粗陶碗。碗里还有半碗水，边沿落着新灰——不知是谁，最近还来看过它。","opts":[{"t":"添一碗水，压一块石头，替守坟的人续上","note":"精神+2 · 补给-1","fx":{"food":-1,"mind":2}},{"t":"记住坟的位置，记进观测笔记","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"绕开走——荒原上的坟，埋的不只是人","note":"精神-1","fx":{"mind":-1}}],"id":"w47"},
    {"title":"扫帚菜","kind":"植物/生存","text":"干硬的地上，**一丛扫帚菜**蓬蓬地立着，枝叶已经晒成枯黄，还稳稳扎在土里。老辈人说，这东西晒干了扎成捆，就是一把扫帚，扫完院子还能当柴烧。","opts":[{"t":"折几枝嫩叶，收进干粮袋","note":"补给+1 · 体力-1","fx":{"stam":-1,"food":1}},{"t":"记下这丛的位置，回头路过还能用","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不碰——枯了也是命，荒原上能站住的东西都不容易","note":"精神-1","fx":{"mind":-1}}],"id":"w48"},
    {"title":"枸杞","kind":"植物/生存","text":"干沟的背阴处，**一丛枸杞**伏在土坎下，枝上挂着几串晒蔫的红果。果皮皱巴巴的，撕开还有一点甜——荒原上，这点甜比水还金贵。","opts":[{"t":"摘一捧枸杞，晒干收进干粮袋","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"只摘几颗尝尝，留下根株","note":"补给+1 · 精神+1","fx":{"food":1,"mind":1}},{"t":"不摘——果还在枝上，就是给过路的人留的","note":"精神-1","fx":{"mind":-1}}],"id":"w49"},
    {"title":"石臼","kind":"人文/历史","text":"土坎下，**一只石臼**歪在一边，臼窝里积着半臼黄沙，边上滚着一根断了的杵。有人在这里住过，也在这里舂过粮——荒原上，一只石臼比一座房子活得久。","opts":[{"t":"把石臼扶正，掏干净臼窝里的沙","note":"精神+2 · 体力-1","fx":{"stam":-1,"mind":2}},{"t":"记住这处废弃的屋场，记进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不碰——住过人的东西，别去翻它","note":"精神-1","fx":{"mind":-1}}],"id":"w50"},
    {"title":"土窑","kind":"人文/历史","text":"干河沟边，**一座土窑**塌了半边，窑膛里黑黢黢的，堆着半窑烧裂的砖坯。窑口的土被踩得发亮——早年间，这里出过一窑好砖，也养过一窑的人。","opts":[{"t":"捡一块没烧透的砖坯，收进包里留个记认","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"记住这座窑的位置，记进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不进去——塌了半边的窑，站不住人的地方","note":"精神-1","fx":{"mind":-1}}],"id":"w51"},
    {"title":"石棺","kind":"人文/历史","text":"乱石坡上，**一具石棺**半埋在土里，棺盖错开了一道缝，露出里面干透的沙土。棺壁上刻着几道看不懂的纹路，边角被风磨得发亮——不知道是哪一朝的，也不知道埋的是谁。","opts":[{"t":"把棺盖推回原位，堵上那道缝","note":"精神+2 · 体力-2","fx":{"stam":-2,"mind":2}},{"t":"拓下棺壁的纹路，记进观测笔记","note":"观测+2 · 耗时","fx":{"obs":2},"time":1},{"t":"绕开走——棺盖错开的东西，别替它合上","note":"精神-1","fx":{"mind":-1}}],"id":"w52"},
    {"title":"辘轳","kind":"人文/历史","text":"枯井边，**一架辘轳**歪在井沿上，摇把断了一截，井绳只剩半根，绳头上拴着一只豁口的木桶。井口黑洞洞的，望下去，一片干底。","opts":[{"t":"把辘轳摇一摇，试着听井里有没有水声","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"扯下半根井绳，路上拴东西用","note":"补给+1 · 体力-1","fx":{"stam":-1,"food":1}},{"t":"不碰——井是枯的，辘轳是断的，都是等不来人的东西","note":"精神-1","fx":{"mind":-1}}],"id":"w53"},
    {"title":"柽柳","kind":"生态/观察","text":"干河沟边，**一丛柽柳**立着，枝条细密，被风压得朝一个方向弯。柽柳的根扎得深，越是旱的地方，它越活得倔——荒原上，看到柽柳，就说明这一片的地下还有水汽。","opts":[{"t":"顺着柽柳的根往下挖两锹，看看土色","note":"观测+1 · 体力-2","fx":{"stam":-2,"obs":1}},{"t":"折一枝柽柳，路上当探路杖","note":"补给+1 · 体力-1","fx":{"stam":-1,"food":1}},{"t":"绕开走——柽柳长的地方，蚊子也多","note":"精神-1","fx":{"mind":-1}}],"id":"w54"},
    {"title":"黄芪","kind":"生态/采集","text":"干坡上，**一片黄芪**长在乱石缝里，根茎鼓出地面，撑裂了土。黄芪的根是好东西，荒原上走惯的人认得：**挖对了，是药材；挖错了，是断根**。","opts":[{"t":"顺着一株大的往下挖，收几段根","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"记住这片黄芪的位置，标进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不挖——药材再好，也架不住这一片就剩这一茬","note":"精神-1","fx":{"mind":-1}}],"id":"w55"},
    {"title":"碉楼","kind":"人文/探索","text":"山脊上，**一座碉楼**孤零零立着，楼体裂了两道大缝，射击孔黑洞洞的。门口的半扇木门早没了，楼里空荡荡，风从破口穿过去，呜呜地响。","opts":[{"t":"进去看看，楼里没准留着前人藏的东西","note":"材料+1 · 体力-1 · 精神-1","fx":{"stam":-1,"mind":-1,"mats":1}},{"t":"记住这座碉楼的位置，标进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"绕开走——空碉楼四面漏风，藏不住人也藏不住东西","note":"精神-1","fx":{"mind":-1}}],"id":"w56"},
    {"title":"水窖","kind":"人文/补给","text":"村口废墟旁，**一口水窖**半掩在沙土下，窖口的石板裂了一道缝。撬开板子探头一看，窖底还汪着一层浑水，水面上漂着几片枯叶。","opts":[{"t":"打一壶上来，澄一澄再喝","note":"补给+2 · 体力-1","fx":{"stam":-1,"food":2}},{"t":"记下这口水窖的位置，标进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不喝——浑水漂着枯叶，喝了怕要闹肚子","note":"补给-1 · 精神-1","fx":{"food":-1,"mind":-1}}],"id":"w57"},
    {"title":"沟壑","kind":"地形/生存","text":"前路被**一道沟壑**拦腰切断，壑壁被水切出层层土纹，沟底堆着滚落的碎石。绕过去要多走半天，直接下沟爬过去，省时间，也省不了多少。","opts":[{"t":"沿沟边找一处缓坡下去，再爬上来","note":"体力-3 · 耗时","fx":{"stam":-3},"time":1},{"t":"用绳子和岩钉在沟壁上打个简易锚点，小心地攀过去","note":"材料-1 · 体力-2 · 观测+1","fx":{"stam":-2,"obs":1,"mats":-1}},{"t":"绕行，多走半天路","note":"体力-4 · 耗时","fx":{"stam":-4},"time":1}],"id":"w58"},
    {"title":"土坎","kind":"地形/观察","text":"一道**土坎**横在路前，坎高齐胸，土被晒得发白，坎面上留着几道深深的刮痕，像是有什么东西连着爬了多次，又都滑了回去。","opts":[{"t":"借力翻过土坎，继续赶路","note":"体力-2 · 耗时","fx":{"stam":-2},"time":1},{"t":"蹲下来看那几道刮痕，认认是什么留下的","note":"观测+2 · 精神-1","fx":{"mind":-1,"obs":2}},{"t":"绕到坎边找条缓处过去","note":"体力-3","fx":{"stam":-3}}],"id":"w59"},
    {"title":"枯河床的巨痕","kind":"地形/观测","text":"干涸的河床沙地上，**留着一串不属于任何野兽的足印**，足印大得离谱，深浅不一，一直延伸到河床拐弯处消失——像是有什么东西，顺着河道走了一夜。","opts":[{"t":"循着足印追出一段，看它通向哪里","note":"观测+2 · 体力-5","fx":{"stam":-5,"obs":2}},{"t":"蹲下来拓下足印的形状","note":"观测+2 · 材料+1","fx":{"mats":1,"obs":2}},{"t":"记下坐标，留给测绘同僚","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}}],"id":"w60"},
    {"title":"干涸的泉眼","kind":"地形/补给","text":"石缝间，**一眼废弃的泉眼**半掩在乱石里，石井栏裂了一道，井壁上还挂着湿痕。探头望下去，井底汪着一线湿土——水多半还在，只是不肯上来。","opts":[{"t":"挖开井底的淤沙，引出一线水","note":"补给+4 · 体力-4","fx":{"stam":-4,"food":4}},{"t":"记下泉眼位置，标进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不挖——泉眼封了这么久，挖开了也未必肯出水","note":"精神-1","fx":{"mind":-1}}],"id":"w61"},
    {"title":"风蚀的石碑","kind":"地形/人文","text":"戈壁尽头，**一块风蚀的石碑**歪在乱石间，碑面的字被风磨得只剩几道深痕。看不出是哪座城立的，只看得出立碑的人当年走得很远。","opts":[{"t":"擦净碑面，辨认残存的刻痕","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"绕碑走一圈，把它的位置记进路图","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}},{"t":"不停——碑是给后人看的，路是自己走的","note":"精神-1","fx":{"mind":-1}}],"id":"w62"},
    {"title":"旧驼铃","kind":"人文/线索","text":"半埋在沙里，**一只旧驼铃**露着半截，铜绿爬满了铃身，铃舌还在。摇一摇，声音哑得像很久没人听过——这铃的主人，多半没走出这片沙。","opts":[{"t":"把驼铃擦干净，收进包里","note":"材料+1 · 精神+1","fx":{"mind":1,"mats":1}},{"t":"把它挂回石堆上，让后来的人也能听见","note":"名声+1 · 精神+1","fx":{"mind":1,"fame":1}},{"t":"不碰——沙里的东西，拿起来就是别人的未了愿","note":"精神-1","fx":{"mind":-1}}],"id":"w63"},
    {"title":"埋在沙下的路","kind":"地形/导航","text":"风一层层掀开浮沙，**露出半截埋在底下的旧车辙**——这是早年间的古道，被沙埋了几十年。顺着辙印走，多半能接到还没被沙盖住的驿站。","opts":[{"t":"顺旧辙印走一段","note":"体力-1 · 观测+2","fx":{"stam":-1,"obs":2}},{"t":"记下辙印走向，画进路图","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}},{"t":"不停——埋在沙下的路，走着走着又埋了","note":"精神-1","fx":{"mind":-1}}],"id":"w64"},
    {"title":"沙暴前的蚂蚁","kind":"生态/预警","text":"地上的**蚂蚁正忙着搬家**，一列列往高处走，搬得比往常急。老荒原上的人都说，蚂蚁一急，沙暴就不远了。","opts":[{"t":"照蚂蚁的方向找高地扎营","note":"体力-1 · 精神+1 · 观测+1","fx":{"stam":-1,"mind":1,"obs":1}},{"t":"趁沙暴没来，加紧赶路","note":"体力-3 · 观测+1","fx":{"stam":-3,"obs":1}},{"t":"不信蚂蚁——它们搬它们的，我走我的","note":"精神-2","fx":{"mind":-2}}],"id":"w65"},
    {"title":"风蚀的骨笛","kind":"人文/物件","text":"沙堆里埋着**一支风蚀的骨笛**，孔还在，笛身被风磨得发亮。凑到耳边，风能穿过笛孔，发出呜呜的低响——这笛的主人，早把自己交给风了。","opts":[{"t":"把骨笛收好，带走","note":"材料+1 · 精神+1","fx":{"mind":1,"mats":1}},{"t":"照着孔位，吹出一个音","note":"精神+2 · 观测+1","fx":{"mind":2,"obs":1}},{"t":"放回沙里——风的东西，让风留着","note":"精神+1","fx":{"mind":1}}],"id":"w66"},
    {"title":"沙下的古井","kind":"地形/生存","text":"风掀开浮沙，**一口古井**露了出来，井沿的石圈磨得发亮，井绳的残头还挂着。井水浑浊，却是这片沙上，少有的水。","opts":[{"t":"打一桶水，沉淀了再喝","note":"补给+3 · 体力-1","fx":{"stam":-1,"food":3}},{"t":"把井沿的记号画进路图","note":"观测+2 · 名声+1","fx":{"obs":2,"fame":1}},{"t":"不喝——沙里的水，喝错了比渴更糟","note":"精神-1","fx":{"mind":-1}}],"id":"w67"},
    {"title":"夜宿风蚀柱","kind":"地形/生存","text":"风蚀柱**像一根立在荒原上的旧骨头**，背风的一面有前人歇脚留下的黑灰。夜里把睡袋贴在柱根，风被柱子挡住一半，能多睡两个时辰。","opts":[{"t":"在柱根扎营，睡到天亮","note":"体温+1 · 精神+1 · 补给-1","fx":{"food":-1,"temp":1,"mind":1}},{"t":"记下这根柱子的位置","note":"观测+2","fx":{"obs":2}},{"t":"不停——柱根虽避风，柱子太高了","note":"精神-1","fx":{"mind":-1}}],"id":"w68"},
    {"title":"沙暴前的驼队","kind":"遭遇/生存","text":"天边压着黄云，**一支驼队正急急往这边赶**，驼背上的人裹得严严实实。领队喊你：「别往前走了，沙暴比你们快！」","opts":[{"t":"跟着驼队找背风处躲","note":"体力-1 · 补给+1 · 城心+1","fx":{"stam":-1,"food":1,"cityHeart":1}},{"t":"谢过领队，仍按原路走","note":"观测+1 · 体力-2","fx":{"stam":-2,"obs":1}},{"t":"不信沙暴——天边的云看着远","note":"精神-2","fx":{"mind":-2}}],"id":"w69"},
    {"title":"沙下的井绳","kind":"地形/生存","text":"浮沙里**拖着一截旧井绳**，绳头磨得发白，一路拖到沙下——有人顺着绳找过水，可井在哪里，绳没说。","opts":[{"t":"顺绳往沙下挖","note":"体力-3 · 补给+2","fx":{"stam":-3,"food":2}},{"t":"把绳收好，留作绑东西用","note":"材料+1 · 观测+1","fx":{"obs":1,"mats":1}},{"t":"不挖——沙下的东西，挖开就塌了","note":"精神-1","fx":{"mind":-1}}],"id":"w70"},
    {"title":"沙脊上的风痕","kind":"地形/观察","text":"沙脊的**背风面，风痕一道压着一道**，像有人用巨大的梳子梳过。看风痕的方向，就知道最近一场风从哪边来，也知道下一场风大概什么时候到。","opts":[{"t":"顺着风痕判断风向，选背风处走","note":"观测+2 · 体力-1","fx":{"stam":-1,"obs":2}},{"t":"在风痕最浅的地方扎营","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"不看——风从哪来都一样走","note":"精神-1","fx":{"mind":-1}}],"id":"w71"},
    {"title":"沙下的白骨","kind":"人文/危险","text":"浮沙里，**半具白骨**露出来，骨头上还挂着半截锈掉的刀。看不出是旅人还是沙匪，只看得出他倒下的地方，水还远着。","opts":[{"t":"把白骨埋好，立一块石头","note":"精神+2 · 体力-1 · 名声+1","fx":{"stam":-1,"mind":2,"fame":1}},{"t":"收下那把锈刀","note":"材料+1 · 精神-1","fx":{"mind":-1,"mats":1}},{"t":"绕开——沙下的东西，别碰","note":"精神-1","fx":{"mind":-1}}],"id":"w72"},
    {"title":"沙谷的回声","kind":"地形/观察","text":"走进沙谷，**你说一句话，回声拖得很长**，像有谁在谷那头学你说话。风一过，回声里混进了别的声音——听不清是人，还是沙。","opts":[{"t":"站在谷中，再喊一声","note":"精神+1 · 体力-1","fx":{"stam":-1,"mind":1}},{"t":"不喊——谷里的回声，别应","note":"精神-1","fx":{"mind":-1}},{"t":"贴着谷壁走，尽快穿出去","note":"体力-2 · 观测+1","fx":{"stam":-2,"obs":1}}],"id":"w73"},
    {"title":"沙风的声音","kind":"天象/观察","text":"风起来了，**沙粒打在防风布上，沙沙作响**。听这声音的密度，就知道风有多大，也知道今晚能不能扎营。","opts":[{"t":"听风辨向，选背风处","note":"观测+2 · 体力-1","fx":{"stam":-1,"obs":2}},{"t":"不扎营，趁风小赶一段","note":"体力-3 · 观测+1","fx":{"stam":-3,"obs":1}},{"t":"不管——风大就大，睡吧","note":"体温-1 · 精神-1","fx":{"temp":-1,"mind":-1}}],"id":"w74"},
    {"title":"沙下的旧营地","kind":"探索/补给","text":"浮沙里，**半埋着一个旧营地**——半截帐篷的骨架还露着，火堆熄了，灰里埋着一点余温。不知道走的人是追上了队伍，还是没能走成。","opts":[{"t":"借旧营地扎营，把火堆拢起来","note":"补给-2 · 体力+3 · 体温+3","fx":{"food":-2,"stam":3,"temp":3}},{"t":"只借帐篷背风，烧点热水","note":"补给-1 · 精神+2 · 体温+1","fx":{"food":-1,"mind":2,"temp":1}},{"t":"连夜走——别人的营地，别留","note":"体力-6 · 精神-2","fx":{"stam":-6,"mind":-2}}],"id":"w75"},
    {"title":"风蚀的岩画","kind":"人文/观察","text":"风蚀的岩壁上，**留着一片岩画**——奔跑的影子、驮货的队、望天时的人。风把石面磨得发亮，画里的线条却还认得出。","opts":[{"t":"停下来，临摹一段","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"把岩画位置标进路图","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}},{"t":"不看——风会把它磨没的","note":"精神-1","fx":{"mind":-1}}],"id":"w76"},
    {"title":"风里的旧旗帜","kind":"人文/观察","text":"风把一面**褪色的罗德岛旧旗**从沙里吹出来，旗角磨成了条。不知道是哪一年的队，也不知道人到了没有。","opts":[{"t":"把旗子埋回沙里，插个记号","note":"名声+2 · 精神+1","fx":{"mind":1,"fame":2}},{"t":"收进包里，带回中转站","note":"材料+1 · 精神+2","fx":{"mind":2,"mats":1}},{"t":"不碰——风里的东西，别留","note":"精神-1","fx":{"mind":-1}}],"id":"w77"},
    {"title":"沙暴前的低云","kind":"天象/预警","text":"西边的云**压得很低，颜色发灰**，像一块湿布贴在天边。风里开始有沙味——这是沙暴要来的味道。","opts":[{"t":"立刻找背风处扎营","note":"补给-2 · 体力+2 · 体温+2","fx":{"food":-2,"stam":2,"temp":2}},{"t":"趁沙暴没来，再赶一段","note":"体力-4 · 观测+2","fx":{"stam":-4,"obs":2}},{"t":"不管——沙暴也不是没遇过","note":"体温-3 · 精神-2","fx":{"temp":-3,"mind":-2}}],"id":"w78"},
    {"title":"夜里的沙狐","kind":"生态/观察","text":"夜里，**一双绿莹莹的眼睛**从沙丘后面露出来——是一只沙狐。它蹲在离你不远的地方，歪着头看你，不叫也不走。","opts":[{"t":"丢一小块干粮给它","note":"补给-1 · 精神+2","fx":{"food":-1,"mind":2}},{"t":"悄悄观察它的动作","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"赶它走——夜里的东西，别留","note":"精神-1","fx":{"mind":-1}}],"id":"w79"},
    {"title":"沙海蜃楼","kind":"天象/观察","text":"远处的地平线上，**出现了一片虚幻的湖**——水面、树影、甚至还有船。可你知道那不是湖，是沙海蜃楼。","opts":[{"t":"朝蜃楼方向走，看看能不能找到真水","note":"体力-4 · 饮水-3 · 观测+2","fx":{"stam":-4,"water":-3,"obs":2}},{"t":"不追——蜃楼是假的，水也是假的","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"在沙地上画个箭头，告诉后来人","note":"名声+2 · 观测+1","fx":{"obs":1,"fame":2}}],"id":"w80"},
    {"title":"沙下的旧弹壳","kind":"人文/观察","text":"浮沙里，**露出半截旧弹壳**——锈得发黑，口径是罗德外侧旧型号的。不知道是谁打的，也不知道打中了没有。","opts":[{"t":"把弹壳埋回去","note":"名声+1 · 精神+1","fx":{"mind":1,"fame":1}},{"t":"收进包里，留个纪念","note":"材料+1 · 精神-1","fx":{"mind":-1,"mats":1}},{"t":"不碰——沙下的东西，别捡","note":"精神-1","fx":{"mind":-1}}],"id":"w81"},
    {"title":"沙暴后的天空","kind":"天象/观察","text":"沙暴过后，**天突然变得极蓝**——蓝得不正常，像被水洗过。空气里还飘着细沙，可云全散了。这种天，老信使说，第二天必起大风。","opts":[{"t":"趁天好，多赶一段","note":"体力+2 · 观测+2","fx":{"stam":2,"obs":2}},{"t":"扎营等第二天，看看风","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"不管——天蓝还不好吗","note":"体力-2 · 精神-1","fx":{"stam":-2,"mind":-1}}],"id":"w82"},
    {"title":"风里的歌","kind":"人文/观察","text":"夜里，风里传来**隐约的歌声**——不是罗德岛的歌，是罗德外侧的调子。很远，像是从沙海另一头飘过来的。","opts":[{"t":"停下听","note":"精神+2 · 观测+1","fx":{"mind":2,"obs":1}},{"t":"跟着哼两句","note":"精神+3 · 默契+1","fx":{"mind":3,"bond":1}},{"t":"不听——风里的东西，别理","note":"精神-1","fx":{"mind":-1}}],"id":"w83"},
    {"title":"沙下的旧路碑","kind":"人文/观察","text":"浮沙里，**露出半截旧路碑**——字磨平了，可碑上还留着箭头的形状。老信使说，这是罗德外侧早年立的，现在路早不在了，碑还在。","opts":[{"t":"把碑挖出来，擦一擦","note":"体力-2 · 观测+2 · 名声+1","fx":{"stam":-2,"obs":2,"fame":1}},{"t":"在碑前站一会儿","note":"精神+1 · 默契+1","fx":{"mind":1,"bond":1}},{"t":"不挖——碑在沙下比在地上安全","note":"精神+1","fx":{"mind":1}}],"id":"w84"},
    {"title":"夜里的星空","kind":"天象/观察","text":"夜里，**星空低得像要压下来**——银河横在头顶，亮得不像话。沙海没有光污染，星星比在城里多十倍。","opts":[{"t":"躺在沙地上看星","note":"精神+3 · 体力+1","fx":{"stam":1,"mind":3}},{"t":"找北极星定方向","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"不看——夜里太冷，睡觉","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}}],"id":"w85"},
    {"title":"风蚀蘑菇","kind":"地形/观察","text":"沙地里，**一块风蚀蘑菇立在那里**——上大下小，像被人用刀修过。风把沙子磨了几十年，才磨出这个形状。","opts":[{"t":"在蘑菇石下避一避","note":"体温+1 · 精神+1","fx":{"temp":1,"mind":1}},{"t":"摸一摸石头的纹路","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"不看——石头就是石头","note":"精神-1","fx":{"mind":-1}}],"id":"w86"},
    {"title":"沙下的旧车辙","kind":"人文/观察","text":"浮沙里，**两道旧车辙**——辙印很深，说明当时走的是重载。沙埋了一半，可还看得出方向。老信使蹲下来摸了摸辙印：「这是商队的车辙，至少三个月前的。」","opts":[{"t":"顺着车辙走","note":"体力-1 · 观测+2 · 补给+1","fx":{"stam":-1,"obs":2,"food":1}},{"t":"在车辙旁留个标记","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}},{"t":"不跟——车辙是车的，不是人的","note":"精神-1","fx":{"mind":-1}}],"id":"w87"},
    {"title":"沙暴前的蚂蚁线","kind":"生态/预警","text":"沙地上，**一排蚂蚁正浩浩荡荡往高处搬食物**——队伍很长，方向很统一。老信使蹲下来看了一眼：「沙暴要来了，比预报早半天。」","opts":[{"t":"立刻找地方扎营避风","note":"体力-2 · 体温+2 · 精神+1","fx":{"stam":-2,"temp":2,"mind":1}},{"t":"顺着蚂蚁洞方向挖避风坑","note":"体力-3 · 体温+3 · 观测+1","fx":{"stam":-3,"temp":3,"obs":1}},{"t":"不信蚂蚁——继续赶路","note":"体力-5 · 精神-3","fx":{"stam":-5,"mind":-3}}],"id":"w88"},
    {"title":"沙地上的旧水壶","kind":"探索/补给","text":"沙地上半埋着一个**军绿色水壶**——壶身被太阳晒得发烫，摇一摇，里面还有水。壶底刻着一个编号，是前年另一支外勤队的。","opts":[{"t":"打开水壶，闻一闻能不能喝","note":"饮水+4 · 精神-1","fx":{"water":4,"mind":-1}},{"t":"把水壶收起来，路上用","note":"材料+1 · 饮水+2","fx":{"water":2,"mats":1}},{"t":"不碰——前人的水壶，别捡","note":"精神+1","fx":{"mind":1}}],"id":"w89"},
    {"title":"沙暴后的骨堆","kind":"探索/危险","text":"沙暴过后，**沙丘边露出一堆白骨**——分不清是动物还是人，骨头被风磨得发亮。旁边插着半根断掉的手杖，杖身上刻着谢拉格的纹章。","opts":[{"t":"把手杖带走，以后还给失主","note":"材料+1 · 名声+2 · 精神-1","fx":{"mats":1,"fame":2,"mind":-1}},{"t":"把骨头埋了","note":"精神+2 · 体力-2","fx":{"stam":-2,"mind":2}},{"t":"绕开——骨头是沙暴的记号","note":"精神-1","fx":{"mind":-1}}],"id":"w90"},
    {"title":"风蚀的路标","kind":"观察/地形","text":"一块被风磨平的石碑上，**还能辨认出一个箭头**——指向前方三十公里，箭头下面刻着「罗得岛联络处」。碑顶被风刮掉了一半。","opts":[{"t":"朝箭头方向走","note":"体力-3 · 观测+1 · 名声+1","fx":{"stam":-3,"obs":1,"fame":1}},{"t":"在碑边留个记号","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"路标是旧的，别信","note":"精神-1","fx":{"mind":-1}}],"id":"w91"},
    {"title":"沙暴前的蚂蚁线","kind":"观察/预兆","text":"蚁群在沙丘边排成一条长线，**往高处搬家**——这是老信使教你的第一课：蚂蚁搬家，不出半天必有沙暴。天边已经隐隐发黄。","opts":[{"t":"立刻扎营避风","note":"体力-2 · 材料-1 · 精神+1","fx":{"stam":-2,"mats":-1,"mind":1}},{"t":"趁沙暴没来继续赶路","note":"体力-4 · 饮水-2 · 精神-1","fx":{"stam":-4,"water":-2,"mind":-1}},{"t":"再观察一会儿确认","note":"观测+2 · 时间损失","fx":{"obs":2}}],"id":"w92"},
    {"title":"沙地里的旧弹壳","kind":"观察/历史","text":"沙丘边，**一脚踢出半埋的弹壳**——是旧式弩炮的，铜壳已经发绿。老信使捡起来看了看：「十年前这里打过一仗。别再打了。」","opts":[{"t":"把弹壳埋回去","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"收起来做纪念","note":"材料+1 · 精神-1","fx":{"mats":1,"mind":-1}},{"t":"踢开继续走","note":"精神-1","fx":{"mind":-1}}],"id":"w93"},
    {"title":"沙暴后的彩虹","kind":"观察/自然","text":"沙暴刚过，天还黄着，**东边却挂了一道彩虹**——老信使说这是他跑这行二十年见过的第三次。「沙暴里出彩虹，」他说，「说明风眼刚过，别停下。」","opts":[{"t":"趁彩虹天继续走","note":"体力-1 · 精神+2 · 观测+1","fx":{"stam":-1,"mind":2,"obs":1}},{"t":"停下来拍一张","note":"材料-1 · 精神+1","fx":{"mats":-1,"mind":1}},{"t":"他说别停那就别停","note":"精神+1","fx":{"mind":1}}],"id":"w94"},
    {"title":"地缝里的旧水壶","kind":"探索/补给","text":"荒野上一道裂开的地缝里，**卡着一个锈穿了大半的军用水壶**——壶身印着半截看不清的编号，看样子是早年某支勘探队留下的。你伸手够了半天，把它拽了上来。","opts":[{"t":"摇一摇，壶底还剩半壶水","note":"饮水+12 · 观测+1","fx":{"water":12,"obs":1}},{"t":"壶已经锈穿了，扔掉","note":"精神-1 · 材料+1","fx":{"mind":-1,"mats":1}},{"t":"把壶带走，将来当纪念","note":"材料+1 · 负重+0.5 · 精神+1","fx":{"mats":1,"mind":1}}],"id":"w95"},
      {"title":"风里的旧羊皮图","kind":"人文/探索","text":"风把一张**卷了边的旧羊皮图**吹到你脚边——图纸上的墨迹已经洇开大半，只能勉强辨认出几条河道和一个打了叉的位置。老信使捡起来看了看：「这是以前跑商的人自己画的，比官方的路书还准。」","opts":[{"t":"把羊皮图收好，对照自己的路图","note":"观测+2 · 材料+1","fx":{"obs":2,"mats":1}},{"t":"按图上打叉的位置走一段","note":"体力-3 · 观测+1 · 补给+1","fx":{"stam":-3,"obs":1,"food":1}},{"t":"放回风里——旧图上的路，未必还在","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}}],"id":"w96"}    ,
    {"title":"沙下的旧水囊","kind":"探索/补给","text":"沙窝里露出半截**旧水囊**——皮质已经发硬，口上的塞子还在。你拔开塞子晃了晃，里头居然还有小半囊水，浑的，但没坏。老信使闻了闻：「放了至少半年，能喝。」","opts":[{"t":"把水滤一滤喝两口","note":"饮水+2 · 精神+1","fx":{"water":2,"mind":1}},{"t":"把水囊收好，回去装干净水","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"倒掉，不要来历不明的水","note":"精神-1 · 观测+1","fx":{"mind":-1,"obs":1}}],"id":"w97"}    ,
    {"title":"沙下的旧马鞍","kind":"探索/遗迹","text":"沙丘背风处露出**半截旧马鞍**——皮面裂了，鞍桥上的铜钉还亮着。这是以前跑长途的人用的货，现在马都少见了。老信使拨了拨沙：「鞍子在这，马呢？」他没等回答，自顾自往前走了。","opts":[{"t":"把马鞍翻过来看看","note":"观测+1 · 体力-1 · 精神-1","fx":{"stam":-1,"mind":-1,"obs":1}},{"t":"把鞍桥铜钉起下来","note":"材料+1 · 名声-1","fx":{"mats":1,"fame":-1}},{"t":"拍张照，继续走","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w98"}    ,
    {"title":"夜里的旧营火坑","kind":"探索/遗迹","text":"地上一圈**发黑的石头**——是个旧营火坑，灰里还埋着没烧完的木柴。老信使蹲下来摸了摸灰：「一周前有人在这过夜。走的时候没把火彻底扑灭，差点烧起来。」他把灰扒开，又浇了点水。","opts":[{"t":"帮着把火彻底扑灭","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"在坑里留个标记","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"绕开，不在别人的坑边扎营","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}}],"id":"w99"}    ,
    {"title":"风蚀的旧里程碑","kind":"人文/路标","text":"路边一块**歪了的里程碑**——碑上的字被风沙磨得只剩半个数字，但方向箭头还清楚。老信使把碑扶正，用脚把根部的沙踩实：「这碑立了三十年，风要吹倒它，总得有人再扶一把。」","opts":[{"t":"帮他一起扶正","note":"体力-1 · 名声+1 · 观测+1","fx":{"stam":-1,"obs":1,"fame":1}},{"t":"在碑上刻个新标记","note":"材料-1 · 名声+1","fx":{"mats":-1,"fame":1}},{"t":"拍张照，记下位置","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w100"}    ,
    {"title":"沙脊上的旧鸟骨","kind":"观察/自然","text":"沙脊上散着**几根大鸟的骨头**——翅膀展开有一人宽，不知道是什么鸟。老信使踢了踢骨头：「这种鸟不落在地上，落地就再也飞不起来。人也一样。」他没再往下说。","opts":[{"t":"把骨头收好做标本","note":"材料+1 · 精神-1","fx":{"mind":-1,"mats":1}},{"t":"把骨头埋进沙里","note":"精神+1 · 名声+1","fx":{"mind":1,"fame":1}},{"t":"拍张照继续走","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w101"}    ,
    {"title":"风墙下的旧脚印","kind":"观察/自然","text":"风墙过后的沙地上，**留着一串不属于你的脚印**——步幅短，鞋印浅，走了几十米就消失在风蚀沟里。老信使蹲下来看了看：「不是人的。是沙狐的，它比我们早到半天。」他没跟着脚印走，反而选了相反方向。","opts":[{"t":"跟着脚印走一段","note":"观测+1 · 体力-1 · 精神-1","fx":{"stam":-1,"mind":-1,"obs":1}},{"t":"照原计划走","note":"观测+1 · 体力-1","fx":{"stam":-1,"obs":1}},{"t":"问他为什么不走有脚印的路","note":"默契+1 · 观测+1","fx":{"bond":1,"obs":1}}],"id":"w102"}    ,
    {"title":"晨雾里的旧车辙","kind":"观察/人文","text":"晨雾还没散，沙地上留着**两道旧车辙**——压得很深，是重型运输卡车。老信使蹲下来量了量辙距：「不是我们的车。这种辙距，是感染者车队。」他站起来往雾里看了一眼，「他们走了至少半天了。我们跟不跟？」","opts":[{"t":"跟上车辙","note":"观测+1 · 体力-1 · 精神-1","fx":{"stam":-1,"mind":-1,"obs":1}},{"t":"不跟，走原路线","note":"观测+1 · 体力-1","fx":{"stam":-1,"obs":1}},{"t":"问他感染者车队去哪","note":"默契+1 · 观测+1","fx":{"bond":1,"obs":1}}],"id":"w103"}    ,
    {"title":"风蚀洞里的旧骨堆","kind":"观察/自然","text":"风蚀洞里堆着**一堆大小不一的兽骨**——有蹄类的肋骨，也有小型掠食者的头骨。老信使捡起一块头骨看了看：「这是沙狐的窝。它们把吃剩的东西拖回洞里，几十年就堆成这样。」他把头骨放回原处，「别拿。这是它们存的冬粮，虽然它们现在不在了。」","opts":[{"t":"帮他把洞口重新遮好","note":"体力-1 · 名声+1 · 精神+1","fx":{"stam":-1,"fame":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}}],"id":"w104"}    ,
    {"title":"沙暴后的旧石堆","kind":"观察/人文","text":"沙暴过后，风把一座**旧石堆**从沙里吹了出来——石头上刻着符号，是几百年前旅行者做的路标。老信使蹲下来擦了擦石头上的沙：「这种路标，上一代信使立的，我们这一代还在用。以后我们立的石堆，也会留给下一代。」他在石堆上又加了一块石头。","opts":[{"t":"帮他加石头","note":"体力-1 · 名声+1 · 精神+1","fx":{"stam":-1,"fame":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}}],"id":"w105"}    ,
    {"title":"日落时的旧影子","kind":"观察/自然","text":"日落时，荒原上拉出**两道长长的影子**——一道是你的，一道是老信使的。你突然发现，他走路时影子比你矮一截。他注意到你在看：「以前我师父的影子比我高。现在轮到我了。」他没回头，「这行就是这样，一代送一代。」","opts":[{"t":"放慢脚步和他并排走","note":"默契+2 · 体力-1","fx":{"stam":-1,"bond":2}},{"t":"问他师父后来怎么样了","note":"默契+1 · 精神+1","fx":{"bond":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w106"}    ,
    {"title":"晨雾里的旧石碑","kind":"观察/人文","text":"晨雾散后，沙丘顶上立着**一块半埋的旧石碑**——碑面朝下，只露出一个角。老信使跪下去擦了擦，没认出字。他站起来拍了拍手上的沙：「不是我们这个时代的。可能是五百年前，也可能更早。」他没把石碑翻过来，「就让它埋着。我们知道这儿有块碑就够了，不用打扰它。」","opts":[{"t":"帮他把碑角重新埋好","note":"体力-1 · 名声+1 · 精神+1","fx":{"stam":-1,"fame":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}}],"id":"w107"}    ,
    {"title":"风蚀沟里的旧绳子","kind":"观察/自然","text":"风蚀沟底，**一截旧尼龙绳卡在石头缝里**——绳子已经褪色，但拉一拉还结实。老信使用登山杖把它勾上来，闻了闻：「有柴油味。以前是车用的拖车绳。」他把绳子盘好塞进背包，「比买的新绳子粗。留着，万一要拽东西。」","opts":[{"t":"把绳子带走","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"留在原处","note":"名声+1 · 观测+1","fx":{"fame":1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w108"}    ,
    {"title":"日落时的旧营火","kind":"观察/人文","text":"日落时，沙地上有**一堆旧营火灰**——灰是白的，上面架着三块石头，是以前有人过夜的地方。老信使蹲下来拨了拨灰：「三天前的。烧的是干骆驼刺，烟大。」他把自己的营火选在下风处，「别人在这儿烧过，地是干的，我们接着用。石头不用搬。」","opts":[{"t":"接着用旧营火位","note":"材料-1 · 体力-1","fx":{"stam":-1,"mats":-1}},{"t":"重新找地方生火","note":"材料-1 · 体力-1","fx":{"stam":-1,"mats":-1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w109"}    ,
    {"title":"风里的旧塑料布","kind":"观察/自然","text":"风里卷着**一块破旧的银色塑料布**——被石头压住一角，其余部分被风吹得啪啪响。老信使用登山杖把它按住：「是以前空投补给的包装。留着，铺在地上防潮比报纸强。」他把塑料布叠好塞进背包，「别嫌它破。破塑料布在野外比钱有用。」","opts":[{"t":"把塑料布带走","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"留在原处","note":"名声+1 · 观测+1","fx":{"fame":1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w110"}    ,
    {"title":"风滚草里的旧铁丝","kind":"观察/自然","text":"一丛风滚草里缠著**一段旧铁丝**——铁丝锈了，但拧一拧还能捆东西。老信使用登山杖把草团拨开，把铁丝抽出来绕在手指上：「这种铁丝在荒原上捡着就别丢。捆帐篷、修背包、当临时鞋带，都用得上。」他把铁丝塞进工具袋，「别小看一根铁丝，它救过我的命。」","opts":[{"t":"把铁丝带走","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"留在原处","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w111"}    ,
    {"title":"雨后的旧车辙","kind":"观察/自然","text":"刚下过一场小雨，沙地上**两道旧车辙**印得清清楚楚——车辙很深，是重载车压的。老信使蹲下来量了量辙印宽度：「是补给车。至少三天前过的。」他站起来顺着车辙方向看了看，「车辙往东北走。我们走的方向也是东北。跟上它。」","opts":[{"t":"跟车辙走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"自己找路","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w112"}    ,
    {"title":"风蚀柱下的旧影子","kind":"观察/自然","text":"风蚀柱投下**一道长长的旧影子**——影子在地面上移动，柱子在风里不动。老信使站在影子里看了看天：「风蚀柱是几万年风吹出来的。我们在它影子里走一天，它还在这儿站一万年。」他继续往前走，「人留不下什么，但走的时候能在沙上印个脚印。风一吹就没了。」","opts":[{"t":"在影子里多站一会儿","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}}],"id":"w113"}    ,
    {"title":"峡谷口的旧路标","kind":"观察/人文","text":"峡谷口石头上，**一个用红漆画的旧箭头**——漆褪成了粉白色，但方向还清楚。老信使站在箭头上看了看：「老信使留的。箭头指进去，说明里头有路。没箭头的峡谷，别进。」他用脚把箭头前的碎石踢开，「路标是给后来人看的。看见箭头，就知道前人走过。」","opts":[{"t":"顺着箭头进峡谷","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在箭头旁边补一个新标记","note":"材料-1 · 名声+1","fx":{"mats":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w114"}    ,
    {"title":"风蚀峡谷里的旧回声","kind":"观察/自然","text":"走进风蚀峡谷，**脚步声变成了旧回声**——你走一步，峡谷回三遍。老信使用手拢在嘴边喊了一声，回声在壁间撞了四五次才散。他听了听回声的尾音：「峡谷窄，回声久。说明两边的岩壁都是实心的，没有裂缝。」他放低声音，「在这儿别大声喊。回声吓着自己事小，震落头顶的沙子事大。」","opts":[{"t":"放轻脚步走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"也喊一声试试","note":"精神+1 · 体力-1","fx":{"mind":1,"stam":-1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w115"}    ,
    {"title":"旧牧道上的旧羊粪堆","kind":"观察/人文","text":"牧道旁，**一堆风干的旧羊粪**——堆得整整齐齐，是以前牧羊人歇脚的地方。老信使蹲下来拨了拨粪堆：「牧民在这儿过夜，羊围着圈。粪堆就是记号。」他站起来指了指远处的水源方向，「有羊粪堆的地方，附近一定有水。牧民不会在没水的地方过夜。」","opts":[{"t":"顺着牧道找水","note":"饮水+1 · 体力-1","fx":{"water":1,"stam":-1}},{"t":"在粪堆旁歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w116"}    ,
    {"title":"风蚀残丘间的旧牧人棚","kind":"观察/人文","text":"两座残丘之间，**一个半塌的旧牧人棚**——顶棚是毡子压石头，墙是土块垒的。老信使弯腰钻进去：「以前牧民躲沙暴的地方。」他在棚角踢了踢，露出半截旧铁罐，「里面有火塘。沙暴来了，人在里面等风停。」他钻出棚，「棚顶留了个出气口。沙暴从门口过，烟从顶上走。」","opts":[{"t":"在棚里躲一会儿","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"把棚顶的出气口扒开","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w117"}    ,
    {"title":"月夜下的旧沙脊","kind":"观察/自然","text":"夜里月亮很亮，**一道沙脊像刀刃一样横在前面**——沙脊两侧坡度陡，风把沙面吹出了波纹。老信使蹲在沙脊背风面：「晚上别翻沙脊。看不清坡度，踩空了滚下去。」他指了指沙脊尽头缓一点的地方，「绕那头走。多走半小时，但人安全。」","opts":[{"t":"绕沙脊走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"翻沙脊走近路","note":"体力-2 · 精神-1","fx":{"stam":-2,"mind":-1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w118"}    ,
    {"title":"风蚀蘑菇下的旧阴面","kind":"观察/自然","text":"风蚀蘑菇石下面，**一小块背阴的地方**——石头影子里，草是绿的。老信使蹲在影子里：「荒原上找水，就找这种绿。」他在草根处扒开沙土，下面是湿的，「草活着，下面就湿。湿到能挤出水，就挖井。」他把土埋回去，「别全踩坏了。这点绿，是下一个过路人的命。」","opts":[{"t":"在阴影里歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"顺着草根挖水","note":"体力-1 · 饮水+1","fx":{"stam":-1,"water":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w119"}    ,
    {"title":"晨雾里的旧盐碱地","kind":"观察/自然","text":"晨雾贴着地面，**前面一片发白的盐碱地**——雾里看不清边。老信使停下脚步：「盐碱地反光，容易把人引偏。」他蹲下来抓了把土搓了搓，「土发白，说明下面是盐壳。盐壳硬，但边上软。」他指了指雾里隐约的一条旧路痕，「跟着旧车辙走。车辙压出来的路，不会陷。」","opts":[{"t":"跟着车辙走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"穿盐碱地走近","note":"体力-2 · 精神-1","fx":{"stam":-2,"mind":-1}},{"t":"等雾散再走","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}}],"id":"w120"}    ,
    {"title":"落日下的旧烽火台","kind":"观察/人文","text":"落日余晖里，**山顶上一座旧烽火台**——夯土台，已经塌了一半。老信使站在台下抬头看：「以前守夜的人在台上点火，烟飘到下一个台，一站传一站。」他用脚跺了跺台基，「现在没人点了。但台还在。站在上面能看见方圆二十里，是个好瞭望点。」","opts":[{"t":"爬上烽火台看风景","note":"体力-1 · 观测+2","fx":{"stam":-1,"obs":2}},{"t":"在台下扎营","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w121"}    ,
    {"title":"雨后的旧干河床","kind":"观察/自然","text":"雨后的干河床上，**水刚退去，泥还是黑的**——河床上留着水泡过的石印。老信使蹲在泥边摸了摸：「雨把干河床灌了。水走得快，但泥留住了。」他顺着河床走了两步，「有河床的地方，下次下雨还会积水。这就是路。跟着河床走，错不了。」","opts":[{"t":"顺着河床走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在泥边踩踩看","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w122"}    ,
    {"title":"正午烈日下的旧盐壳","kind":"观察/自然","text":"正午太阳下，**地上的盐壳亮得刺眼**——像撒了一层碎玻璃。老信使拉下帽檐挡住光：「盐壳反光，晃眼。别盯着看。」他在盐壳边缘找了块阴影，「正午别走盐壳地。反光晒人，脚底下又烫。」他蹲在阴影里等了一会儿，「等太阳偏一点再走。」","opts":[{"t":"在阴影里等太阳偏","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"硬着头皮穿过去","note":"体力-2 · 体温-1","fx":{"stam":-2,"temp":-1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w123"}    ,
    {"title":"黑夜里的旧狐踪","kind":"观察/自然","text":"夜里打灯照地面，**沙地上一串狐狸脚印**——小小的，四个爪印一组。老信使蹲下来照了照：「狐狸夜里面找吃的。它走的路比我们熟。」他顺着脚印方向看了看，「狐狸往有水的地方去。跟着它走，能找到水。」他把灯压低，「别吓它。它走它的，我们走我们的。」","opts":[{"t":"顺着狐踪找水","note":"体力-1 · 饮水+1","fx":{"stam":-1,"water":1}},{"t":"在营地周围守夜","note":"精神+1 · 体温+1","fx":{"mind":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w124"}    ,
    {"title":"沙丘背风面的旧沙蜥蜕","kind":"观察/自然","text":"沙丘背风面石头上，**一张风干的旧沙蜥皮**——完整的，连爪子都在。老信使把皮翻过来抖了抖沙：「沙蜥蜕皮。说明这儿有活物。」他把皮放回去，「有沙蜥就有虫，有虫就有小兽。食物链在，就不是死地。」他拍了拍手上的沙，「看见活物的地方，人走上去也踏实。」","opts":[{"t":"仔细看沙蜥蜕","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在背风面歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w125"}    ,
    {"title":"黄昏时的旧沙尘暴预警色","kind":"观察/自然","text":"黄昏时分，**天边压来一层土黄色的云**——不是晚霞，是沙。老信使用袖子捂住口鼻看了看风向：「沙尘暴。」他把背包带勒紧，「那层黄的过来，天就黑了。找背风的地方蹲下。」他指了指一道土沟，「蹲沟里，低头。等它过去。别跑，跑不过风。」","opts":[{"t":"躲进土沟蹲下","note":"体力-1 · 精神+1 · 体温+1","fx":{"stam":-1,"mind":1,"temp":1}},{"t":"硬着头皮继续走","note":"体力-2 · 精神-2","fx":{"stam":-2,"mind":-2}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w126"}    ,
    {"title":"夜营时听到远处的鬣狗叫","kind":"观察/自然","text":"夜里营地外远处，**传来一阵鬣狗的笑声**——尖而短，此起彼伏。老信使把篝火拨亮了些：「鬣狗。」他往火里添了一根柴，「它们不敢靠近火。但也不走远。围着营地转。」他把脚边的木棍踢到火边，「今晚守夜别睡着了。它不咬人，但会拖走我们的补给。」","opts":[{"t":"把篝火拨大","note":"材料-1 · 体温+1 · 精神+1","fx":{"mats":-1,"temp":1,"mind":1}},{"t":"整夜守夜","note":"体力-2 · 精神+1 · 默契+1","fx":{"stam":-2,"mind":1,"bond":1}},{"t":"用石头把营地围一圈","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}}],"id":"w127"}    ,
    {"title":"雨后沙地上的旧骆驼蹄印","kind":"观察/自然","text":"雨后沙地上，**一串深深的骆驼蹄印**——印子大，间距均匀。老信使蹲在印边量了量步距：「商队的骆驼。」他顺着蹄印方向看了看，「一只骆驼走十公里，能背两百斤水。它走的路，就是水源路。」他站起身拍了拍手上的沙，「跟着蹄印走，明天中午就能到下一个水坑。」","opts":[{"t":"顺着蹄印走","note":"体力-1 · 饮水+1","fx":{"stam":-1,"water":1}},{"t":"在蹄印边歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w128"}    ,
    {"title":"傍晚时沙地上的旧蜥蜴洞","kind":"观察/自然","text":"傍晚沙地上，**一个半人高的蜥蜴洞**——洞口被沙埋了一半。老信使蹲下来看了看洞口的爪痕：「沙蜥的洞。白天进去避暑，傍晚出来找虫。」他指了指洞口的方向，「洞朝南。下午晒得到太阳，洞里暖。沙蜥比人会选地方。」他绕开洞口走，「别踩。它回来找不到洞，就换地方住了。」","opts":[{"t":"绕开洞走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在洞边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w129"}    ,
    {"title":"清晨沙地上的旧盐渍","kind":"观察/自然","text":"清晨沙地上，**一片白花花的旧盐渍**——像霜，但太阳一晒不化。老信使用手指蘸了一点尝了尝：「咸的。」他把手指上的盐弹掉，「以前这儿是个盐湖。水干了，盐留在地上。」他用脚刮了刮盐壳，「盐壳下面是湿沙。有盐的地方，地下水位高。往下挖两步，能挖出水。」","opts":[{"t":"在盐壳下挖水","note":"体力-1 · 饮水+2","fx":{"stam":-1,"water":2}},{"t":"在盐壳上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w130"}    ,
    {"title":"夜营时沙地上的旧沙鼠堆","kind":"观察/自然","text":"夜营营地边，**一堆旧沙鼠推出来的沙土**——堆成小丘，中间有个洞。老信使用脚拨开沙堆看了看洞口：「沙鼠。白天出来找种子，晚上回洞。」他把沙堆推回原样，「它推的沙是松土。营地旁边有它，说明这附近有草根。有草根，就有虫。」他往火里添了根柴，「别挡它的洞。它晚上出来，我们睡觉，互不打扰。」","opts":[{"t":"绕开罗堆扎营","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在火堆边守着","note":"体力-1 · 体温+1","fx":{"stam":-1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w131"}    ,
    {"title":"午后沙地上的旧沙暴痕迹","kind":"观察/自然","text":"午后沙地上，**一片被沙暴刮过的痕迹**——地上的石头全朝一个方向倒着，沙面像刀刮过一样。老信使蹲在痕迹边看了看沙纹：「昨晚刮的。」他用手摸了摸沙面，沙面硬而滑，「沙暴过的地方，石头都被磨圆了。风把细沙全吹走，留下石头。」他指着风来的方向，「往那边走，风小。别迎着风走。」","opts":[{"t":"顺着风走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在背风处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w132"}    ,
    {"title":"午后沙地上的旧蜥蜴蜕的皮","kind":"观察/自然","text":"午后沙地上，**一张半透明的旧蜥蜴皮**——皮完整，眼睛的位置两个洞。老信使用树枝把皮挑起来看了看：「沙蜥蜕的。」他把皮放回沙地上，「蜥蜴长大，皮不够用了就蜕。旧皮留在沙上，新皮在身上。」他指了指皮旁边的小脚印，「蜕皮的时候蜥蜴不动。蜕完就走了。皮留在这儿，风一吹就碎了。」","opts":[{"t":"小心绕开","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在皮边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w133"}    ,
    {"title":"黄昏沙地上的旧沙狐脚印","kind":"观察/自然","text":"黄昏沙地上，**一串旧沙狐脚印**——四个脚趾，一个掌垫，印子很浅。老信使蹲下来顺着脚印看了看方向：「沙狐。晚上出来找沙鼠。」他用手比了比脚印大小，「比猫大一点，比狗小一点。」他指了指脚印延伸的方向，「它往那边去了。我们别生火生太大，它闻见烟就绕开。」","opts":[{"t":"绕开走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在背风处扎营","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w134"}    ,
    {"title":"夜营火堆旁的旧烧火棍","kind":"观察/人工","text":"夜营火堆旁，**一根旧烧火棍**——棍子一头烧黑了，另一头还留着树皮。老信使用棍子拨了拨火堆：「烧火棍得硬木。」他把棍子翻了个面，「软木烧两次就断。硬木一根用十年。」他指了指棍子上的刀痕，「这根是我十年前砍的。一直带在身上。」他把火堆里的柴拨得更旺，「一根棍子，管一晚上火。」","opts":[{"t":"帮他拨火","note":"体力-1 · 体温+1","fx":{"stam":-1,"temp":1}},{"t":"在火堆边歇着","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w135"}    ,
    {"title":"午后沙地上的旧胡杨枯木","kind":"观察/自然","text":"午后沙地上，**一根干枯的胡杨木**——枝丫全掉光了，树干裂成几瓣。老信使用手摸了摸树干：「胡杨死了，木头几百年不烂。」他推了推树干，树干纹丝不动，「根扎得深。活着的时候从地下几十米吸水。死了也不倒。」他指了指树干上的洞，「以前沙狐在里面做窝。现在洞也被沙填了。」","opts":[{"t":"在枯木阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看树干的裂纹","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w136"}    ,
    {"title":"清晨沙地上的旧沙蜥蜕壳","kind":"观察/自然","text":"清晨沙地上，**一片半透明的旧沙蜥蜕壳**——壳完整，还保持着爬过的形状。老信使用树枝把壳挑起来看了看：「沙蜥蜕皮了。」他把壳放回沙上，「沙蜥夏天蜕一次。蜕下来的皮留在沙上，太阳晒几天就碎。」他指了指壳旁边的小脚印，「它早上从这儿爬走的。壳上还沾着露水。」","opts":[{"t":"绕开走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在沙地上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w137"}    ,
    {"title":"黄昏沙脊上的旧野骆驼白骨","kind":"观察/自然","text":"黄昏沙脊上，**一副旧野骆驼白骨**——肋骨散在沙上，头骨上两个大洞眼。老信使用脚把一块骨头翻过来：「野骆驼死在沙上，肉被鸟和狐狸吃完，骨头留下。」他指了指头骨上的牙，「骆驼牙还齐。不是老死的。可能是找水没找到。」他把骨头放回原处，「沙上的白骨，别挪位置。过路的人看见，就知道这附近没有水。」","opts":[{"t":"绕开白骨走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在沙脊上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w138"}    ,
    {"title":"风蚀残丘上的旧风棱石","kind":"观察/自然","text":"风蚀残丘顶上，**一块旧多面风棱石**——石头被风沙磨出几个光滑的面，每个面方向都不一样。老信使用手把石头翻了个面：「风沙吹出来的。」他指着石头上的光滑面，「一年吹一个方向，几年下来就磨出好几个面。石头是沙的磨刀石。」他把石头放回原处，「这种石头，风越大面越多。」","opts":[{"t":"在残丘顶歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"仔细看风棱面","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w139"}    ,
    {"title":"戈壁滩上的旧风蚀蘑菇石","kind":"观察/自然","text":"戈壁滩上，**一块旧风蚀蘑菇石**——上面一块大石头，底下一根细石颈，像蘑菇一样。老信使用手推了推蘑菇顶，石头纹丝不动：「风蚀出来的。」他指了指细石颈，「底下的石头软，风把它磨细了。上面硬，磨得慢。几千年就磨成蘑菇了。」他绕到石头背面，「这石头再吹几千年，脖子再细，风一吹就倒。」","opts":[{"t":"在蘑菇石阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看石颈的磨痕","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w140"}    ,
    {"title":"日落戈壁上的旧井房","kind":"观察/人工","text":"日落戈壁边，**一间旧土坯井房**——屋顶塌了一半，井还在。老信使用手把井口上的木板挪开，打了一桶水上来，水清的：「以前的人在这儿挖的井。」他喝了一口水，「戈壁上打井，要挖几十米深。水脉在哪，全靠老经验。」他把水桶重新放下，「这口井，方圆百里的人都靠它。井在，路就在。」","opts":[{"t":"打一桶水喝","note":"饮水+1 · 精神+1","fx":{"water":1,"mind":1}},{"t":"在井房阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w141"}    ,
    {"title":"雅丹地貌上的旧船型土丘","kind":"观察/自然","text":"雅丹地貌里，**一座旧船型土丘**——长长的土垄像一艘搁浅的船，头朝东尾朝西。老信使用手摸了摸土丘的侧壁，土壁上有一层层的沙纹：「几十万年前，这儿是湖。」他指着土丘的走向，「水退了，风把土丘吹成东西向。一座连一座，像船队搁浅在沙上。」他站在土丘顶上，「走在雅丹里，像走在废船堆里。」","opts":[{"t":"在土丘阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看沙纹层","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w142"}    ,
    {"title":"戈壁日落时的旧风力发电机残骸","kind":"观察/人工","text":"戈壁边，**一座旧风力发电机残骸**——塔筒还在，三片叶片断了两片，剩下一片歪在半空。老信使用手敲了敲塔筒，声音空响：「以前在这儿发电。」他仰头看了看断叶，「风太大，叶片吹断了。修又不值得修，就扔在这儿。」他绕到塔筒底座，「一座风机，发的电能供一个村子。风一停就没电。」","opts":[{"t":"在塔筒阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看断叶的断面","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w143"}    ,
    {"title":"戈壁盐壳上的旧车辙印","kind":"观察/人工","text":"戈壁盐壳上，**两道旧车辙印**——深深的印子压在硬盐壳上，两道印子平行延伸到天边。老信使用手蹲下来摸了摸辙印的边缘：「卡车压的。」他指了指辙印的宽度，「载重车，后轴双胎。一趟过去，两道印子。」他顺着辙印看了一眼，「盐壳硬，车辙能留几十年。车队走一条路，走多了就成了路。」他站起来，「沿着车辙走，错不了。」","opts":[{"t":"沿车辙走","note":"体力+1 · 观测+1","fx":{"stam":1,"obs":1}},{"t":"仔细看辙印深度","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w144"}    ,
    {"title":"戈壁落日下的旧石油井架","kind":"观察/人工","text":"戈壁深处，**一座旧石油井架**——钢架锈成红褐色，塔顶上的天车还在，钻井设备早就拆走了。老信使用手拍了拍井架的钢架，铁锈簌簌往下掉：「以前在这儿打油。」他仰头看了看井架的高度，「打了几千米深，出油了。后来油采完了，井架就扔在这儿。」他指了指井架脚下的油污，「油渗到地里几十年了，土还是黑的。」","opts":[{"t":"在井架阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看钢架锈迹","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w145"}    ,
    {"title":"戈壁雅丹群里的旧风化残柱","kind":"观察/自然","text":"雅丹群里，**一根旧风化残柱**——土黄色，十几米高，顶上被风削成了鹰嘴状。老信使用手拍了拍柱根的土，土是松的：「风雕的。」他仰头看残柱，「戈壁的风一年刮几十万次。土里有沙，沙打在土上，就把土削成这样。」他指了指柱根周围散落的土块，「再过几十年，这根柱就塌了。塌了就成平地。风再把平地削成新的柱。」","opts":[{"t":"在残柱阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看风蚀纹路","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w146"}    ,
    {"title":"戈壁盐湖边的旧盐碱壳","kind":"观察/自然","text":"盐湖边，**一片旧盐碱壳**——白花花的盐结在地上，踩上去嘎吱响，壳下面是黑泥。老信使用手掰了一块盐壳看了看，壳断面是层状的：「水蒸发了，盐留下来。」他把盐壳扔回去，「盐湖每年水来一次，水退了，盐就留下来。年复一年，壳就这么厚。」他指了指盐壳上的裂纹，「盐壳硬，但下面是软泥。别使劲踩，踩穿了鞋就沾泥。」","opts":[{"t":"沿盐壳边走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在盐壳上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w147"}    ,
    {"title":"戈壁砾石滩上的旧风棱石","kind":"观察/自然","text":"砾石滩上，**一块旧风棱石**——石头有三个磨光的面，面与面之间是锋利的棱。老信使用手把石头翻了个面，三个面都磨得溜光：「风棱石。」他指了指石面上的擦痕，「戈壁的风带沙，沙打在石头上，把石头磨出平面。风从三个方向吹，石头就磨出三个面。」他把石头放回去，「这石头在戈壁上滚了几千年。每个面都被风沙磨过。」","opts":[{"t":"在砾石滩上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看风棱面","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w148"}    ,
    {"title":"戈壁干河床上的旧洪积砾石","kind":"观察/自然","text":"干河床上，**一堆旧洪积砾石**——大小不一的卵石铺满河床，石头被水磨得溜圆，大的有半人高。老信使用脚踢了踢脚边一块卵石：「洪水冲下来的。」他指了指河床两侧的冲沟，「下雨的时候，山上的洪水顺着沟下来。水里裹着石头。水退了，石头就留在这儿。」他弯腰捡起一块小卵石掂了掂，「这石头本来在山上。洪水把它冲下来，走了几十里。」","opts":[{"t":"沿干河床走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在河床石上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w149"}    ,
    {"title":"戈壁背风坡的旧梭梭林","kind":"观察/自然","text":"背风坡上，**一片旧梭梭林**——树不高，一两米，枝条灰绿，根部周围积着一圈浮沙。老信使用手掰了一根梭梭枝，枝是脆的：「梭梭固沙。」他指了指根部周围的浮沙，「风把沙吹过来，梭梭挡住了。沙就积在根周围。根越扎越深，树越长越稳。」他把断枝扔回去，「这片林子是几十年前种的。现在沙不往这边走了。」","opts":[{"t":"在梭梭林里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看梭梭根","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w150"}    ,
    {"title":"戈壁红柳丛里的旧红柳墩","kind":"观察/自然","text":"红柳丛里，**一个旧红柳墩**——红柳树砍了又长，长了又砍，树桩一年年变粗，表面是一圈圈年轮似的疤。老信使用手摸了摸红柳墩：「红柳烧火最好。」他指了指墩子周围新长的红柳枝，「砍了枝条，根还活着。明年又发新枝。」他拔了一根细枝条，「牧民砍红柳当柴。砍了几百年，这片红柳还在。」","opts":[{"t":"在红柳丛里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看红柳年轮","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w151"}    ,
    {"title":"戈壁雅丹群里的旧风蚀土丘","kind":"观察/自然","text":"雅丹群里，**一座旧风蚀土丘**——土丘是一层层沙岩叠起来的，迎风坡被风掏进去一个洞，背风坡留着竖纹。老信使用手摸了摸土丘上的层理：「雅丹。」他指了指迎风坡的洞，「风带沙，把软的岩层掏掉了。硬的留下。一年年掏，就掏出这些丘。」他绕到背风坡，「雅丹是风画出来的。」","opts":[{"t":"在土丘背风处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看岩层","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w152"}    ,
    {"title":"戈壁玛瑙滩上的旧玛瑙石","kind":"观察/自然","text":"玛瑙滩上，**几颗旧玛瑙石**散在砾石间——半透明，颜色有灰的、红的、白的，表面被水磨得溜圆。老信使用脚拨了拨，捡起一颗红玛瑙：「玛瑙。」他在手里掂了掂，「以前这里是湖。湖干了，玛瑙就露出来了。」他把玛瑙放回去，「别捡太多。捡一颗就行。这是戈壁的东西。」","opts":[{"t":"捡一颗留作纪念","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"在滩上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w153"}    ,
    {"title":"戈壁骆驼刺丛里的旧骆驼刺根","kind":"观察/自然","text":"骆驼刺丛边，**一丛旧骆驼刺根**——地面上是矮矮的刺丛，地下的根却扎得很深。老信使用手拔了拔，拔不动：「骆驼刺根深。」他指了指地面上的刺丛，「地上就这么一点。地下根扎十几米深。找地下水。」他用脚刨了刨根周围的沙，「骆驼刺活着，说明地下有水。」他把沙填回去，「别拔。拔了根，这片刺就死了。」","opts":[{"t":"在刺丛边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看刺丛","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w154"}    ,
    {"title":"戈壁风蚀残丘里的旧雅丹墙","kind":"观察/自然","text":"风蚀残丘间，**一段旧雅丹墙**——土崖直立，顶上是平的，墙面上留着一条条水平层理。老信使用手拍了拍土墙：「雅丹墙。」他指了指墙根被风掏进去的洞，「风从这儿过。带沙。把墙根掏软了。上面硬。」他沿着墙根走了两步，「这面墙再过几十年就倒了。风一直在掏。」","opts":[{"t":"在墙根背风处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看层理","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w155"}    ,
    {"title":"戈壁砾石堆里的旧风棱石","kind":"观察/自然","text":"砾石堆里，**几块旧风棱石**——石头有三个平整的面，棱线锋利，像被刀削过。老信使用手拿起一块对着光看：「风棱石。」他指了指石面的光滑纹路，「风带沙，长年吹一个方向。石头就被吹出几个平面。」他把石头放回去，「这石头在风口上待了几百年。」","opts":[{"t":"在砾石堆边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看棱面","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w156"}    ,
    {"title":"戈壁干涸河床上的旧卵石","kind":"观察/自然","text":"干涸河床上，**一滩旧卵石**——石头圆圆的，大小不一，半埋在沙里。老信使用手捡起一颗放在耳边晃了晃：「以前这儿是河。」他指了指河床两边的高坎，「河从这流过。石头被水磨圆了。后来河干了。石头留下了。」他把卵石放回滩上，「河几百年前就不在了。石头还记得水的样子。」","opts":[{"t":"在河床边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"也捡一颗听听","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w157"}    ,
    {"title":"戈壁黑戈壁上的旧火山弹","kind":"观察/自然","text":"黑戈壁滩上，**几颗旧火山弹**——黑色的、圆圆的石头，表面有一层熔壳，有的还带着气孔。老信使用手捡起一颗掂了掂：「火山弹。」他指了指石头上的气孔，「以前这儿有火山。岩浆喷出来，在空中凝成球。落下来。」他把火山弹放回去，「黑戈壁就是火山灰吹出来的。」","opts":[{"t":"在黑戈壁上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看气孔","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w158"}    ,
    {"title":"戈壁荒漠里的旧沙丘链","kind":"观察/自然","text":"荒漠里，**一道旧沙丘链**——沙丘一个接一个连成线，背风坡陡，迎风坡缓。老信使用手抓了一把迎风坡的沙，沙从指缝漏下去：「沙丘链。」他指了指沙丘移动的方向，「风从这边吹。沙丘一年挪几米。」他指了指沙丘链之间的平地，「沙丘中间这块平地，是路。别往沙丘上爬。爬上去脚陷。」","opts":[{"t":"沿沙丘链之间走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在背风坡歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w159"}    ,
    {"title":"戈壁盐碱滩上的旧盐碱壳","kind":"观察/自然","text":"低洼处，**一片旧盐碱壳**——地面白白的一层盐碱，踩上去咯吱响，壳下面是软泥。老信使用脚敲了敲盐碱壳：「盐碱滩。」他指了指壳下的黑泥，「水蒸发了。盐留在地上。」他绕开盐碱壳，「别走上面。壳一破，脚就陷进泥里。」他指了指远处的盐壳边界，「绕着走。」","opts":[{"t":"绕着盐碱滩走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在滩边歇脚","note":"体温+1 · 体力+1","fx":{"temp":1,"stam":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w160"}    ,
    {"title":"戈壁干谷里的旧冲沟","kind":"观察/自然","text":"干谷里，**一条旧冲沟**——沟壁被雨水冲出一层层纹路，沟底是干硬的泥。老信使用脚踩了踩沟底：「冲沟。」他指了指沟壁上的纹路，「下雨的时候，水从山上下来，冲出这条沟。」他抬头看了看沟两边的高坎，「雨停了，水就干了。沟留下。」他指了指沟底的软泥，「别走沟底。下雨的时候水从这儿过。」","opts":[{"t":"沿沟边走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在沟壁阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w161"}    ,
    {"title":"戈壁砾石滩上的旧雷劈木","kind":"观察/自然","text":"砾石滩上，**一棵旧雷劈木**——树干被劈成两半，一半倒在地上，一半还立着，劈面黑黢黢的。老信使用手摸了摸劈面：「雷劈的。」他指了指树干上的旧焦痕，「下雨天，雷劈在这棵树上。」他绕到树的另一边，「戈壁上没高东西。树就是最高的。雷专劈最高的。」他指了指树边的空地，「打雷的时候，别站树旁边。」","opts":[{"t":"在雷劈木旁歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看劈面","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w162"}    ,
    {"title":"戈壁风蚀垄上的旧风蚀脊","kind":"观察/自然","text":"戈壁上，**一条旧风蚀脊**——石头被风蚀成一条条平行的垄，垄与垄之间是浅沟。老信使用手沿着风蚀脊摸了摸：「风蚀脊。」他指了指垄的方向，「风长年往一个方向吹，把石头吹出沟来。」他蹲下来看了看垄的走向，「垄朝哪边，风就是常年往哪边吹。」他站起来拍了拍手上的灰，「这一片风大。风能把石头磨成粉。」","opts":[{"t":"沿风蚀脊走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在风蚀脊间歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w163"}    ,
    {"title":"戈壁雅丹壁上的旧风蚀龛","kind":"观察/自然","text":"雅丹土壁上，**一个旧风蚀龛**——土壁被风掏出一个浅洞，洞口檐上还挂着几根干了的草根。老信使用手摸了摸龛壁：「风蚀龛。」他指了指龛里的沙地，「风带着沙，打在土壁上，打出这个洞。」他指了指龛的方向，「龛口朝哪边开，风就是常从哪边来。」他往龛里看了一眼，「以前放羊的在这躲雨。」","opts":[{"t":"进龛里躲躲风","note":"体温+1 · 体力+1","fx":{"temp":1,"stam":1}},{"t":"也摸摸龛壁","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w164"}    ,
    {"title":"戈壁砾漠上的旧干裂纹","kind":"观察/自然","text":"平地上，**一片片旧干裂纹**——泥地干得裂成碎块，裂缝宽的能塞进手指。老信使用脚踩了踩裂缝边的泥块，泥块一踩就碎：「干裂缝。」他指了指裂缝的方向，「夏天热，泥里的水全蒸了。泥就缩，就裂。」他蹲下来看了看裂缝，「裂成这样，说明这地方以前是块湿地。现在干透了。」他绕开裂得厉害的地方，「别踩裂缝。泥块下面是空的。」","opts":[{"t":"绕开裂缝走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在干裂缝边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}],"id":"w165"}    ,

    {"title":"火绒草","kind":"植物/生存","text":"岩缝里，**一丛火绒草**顶着毛茸茸的白花，在风里轻轻抖。它的绒絮干透后一点就着，是雪山上最可靠的引火物，比什么都金贵。","opts":[{"t":"小心摘一把，晒干收进引火包","note":"引火物+2 · 体力-2","fx":{"stam":-2,"tinder":2}},{"t":"只摘两朵，余下的留着给后来的赶路人","note":"引火物+1 · 精神+1","fx":{"mind":1,"tinder":1}},{"t":"不摘——绒花好看，摘了这丛就没了","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"雪橇","kind":"人性/补给","text":"雪沟里歪着一架**雪橇**，滑板断了一根，橇上还捆着半袋干草。橇边留着一串脚印，深一脚浅一脚，朝山下去了——人把橇留下了，看来是走得很急。","opts":[{"t":"拆下完好的滑板，绑到你的装备上备用","note":"材料+1 · 体力-2","fx":{"stam":-2,"mats":1}},{"t":"取走干草，路上能垫一垫","note":"补给+1 · 体力-1","fx":{"stam":-1,"food":1}},{"t":"不拆——橇是别人的，也许他还要回来取","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"牦牛","kind":"生态/人情","text":"雪坡下，**一群牦牛**慢吞吞地挪着，厚厚的毛上挂满霜。放牛的老牧民倚在石头上，朝你扬了扬烟杆：「外乡人，上来烤烤火？」","opts":[{"t":"过去烤火，听他讲山里的雪情","note":"精神+3 · 补给+1 · 耗时","fx":{"food":1,"mind":3},"time":1},{"t":"帮他拢一拢走散的牛，换一句路况","note":"体力-3 · 精神+2","fx":{"stam":-3,"mind":2}},{"t":"远远绕开——牛群再温顺，也是牧人看家的宝贝","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"驯鹿","kind":"生态/人情","text":"雪坡上，**一群驯鹿**低头刨着雪，找底下的草根。放鹿的牧人冲你扬了扬鞭子：「路不好走，鹿蹄子替你蹚过的雪，人走没事。」","opts":[{"t":"跟在鹿群后面走，借它们的路","note":"体力-2 · 精神+1","fx":{"stam":-2,"mind":1}},{"t":"停下来，听牧人讲鹿群认路的本事","note":"精神+3 · 补给+1 · 耗时","fx":{"food":1,"mind":3},"time":1},{"t":"绕开鹿群——鹿怕生人，惊了它们，牧人也要急","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"玛尼堆","kind":"人文/信仰","text":"山口路边，**一座玛尼堆**码得整整齐齐，石块一层压一层，顶上压着一块白色的石头。石头被风磨得发亮，边上落着几根新系的布条——谢拉格人路过，都会添一块石头，求山神护佑。","opts":[{"t":"添一块石头，按谢拉格的规矩绕堆走一圈","note":"精神+2 · 体力-1","fx":{"stam":-1,"mind":2}},{"t":"停下来，数一数堆上的石头，记进笔记","note":"观测+2","fx":{"obs":2}},{"t":"绕开走——那是别人求山神的地方，求不来你的路","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"煨桑","kind":"人文/信仰","text":"石台边立着**一座煨桑炉**，炉膛里的柏枝还冒着细烟，松香味混着雪气往鼻子里钻。炉边的雪被人踩平了一圈，看得出，今天早上还有人来供过。","opts":[{"t":"添一把柏枝，照谢拉格的规矩让烟起得更旺","note":"精神+2 · 体力-1","fx":{"stam":-1,"mind":2}},{"t":"数一数炉边踩出的脚印，记进笔记","note":"观测+2","fx":{"obs":2}},{"t":"绕开走——煨的是别人的愿，烟熏不着你的路","note":"精神-1","fx":{"mind":-1}}]},
      {"title":"冻云下的金雕","kind":"生态/观测","text":"雪坡上空，**一只金雕**正借着上升气流盘旋，翅尖在风里纹丝不动。它忽而俯冲，忽而拔高——老山民说，金雕盘得高，天要放晴；盘得低，风雪将近。","opts":[{"t":"停下观察它盘旋的高度与方向","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"丢一小块干粮，看它会不会俯冲下来","note":"补给-1 · 观测+1","fx":{"food":-1,"obs":1}},{"t":"别耽误——雕有雕的路，你有你的路","note":"体力-1","fx":{"stam":-1}}]}     ,
      {"title":"雪线以上的脚印","kind":"探索/悬疑","text":"雪线以上，**一串脚印从你脚下延伸到悬崖边**——没有回来的脚印。雪很新，像是昨晚才留下的。","opts":[{"t":"顺着脚印走到崖边看","note":"观测+2 · 精神-3 · 体力-2","fx":{"stam":-2,"mind":-3,"obs":2}},{"t":"记下位置，继续赶路","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"不看——雪线以上的脚印，别追","note":"精神-2","fx":{"mind":-2}}]},
      {"title":"雪坡上的狐狸","kind":"生态/观察","text":"雪坡上，**一只白狐蹲在那里看你**——毛是纯白的，耳朵尖发黑。它歪了歪头，不跑也不叫。","opts":[{"t":"拿出干粮，分它一点","note":"补给-1 · 精神+3 · 观测+1","fx":{"food":-1,"mind":3,"obs":1}},{"t":"举起相机拍照","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"赶它走——雪地里的东西，别喂","note":"精神-1","fx":{"mind":-1}}]},
      {"title":"冰裂缝上的钢缆","kind":"地形/危险","text":"冰原上，**一道冰裂缝横在面前**——缝不宽，三步能跨过去，可缝里黑黢黢的，看不见底。裂缝上跨着一根旧钢缆，是早年登山队留的。","opts":[{"t":"跨步过去","note":"体力-2 · 观测+1","fx":{"stam":-2,"obs":1}},{"t":"抓着钢缆爬过去","note":"体力-3 · 体温+2 · 观测+2","fx":{"stam":-3,"temp":2,"obs":2}},{"t":"绕路走","note":"体力-4 · 精神+1","fx":{"stam":-4,"mind":1}}]},
      {"title":"雪线下的牧人笛声","kind":"人文/人情","text":"雪线下，**一阵笛声从林子里飘出来**——调子很慢，是谢拉格牧人唤牛的调子。吹笛人坐在石头上，脚边卧着一头小牛犊。他看见你，招了招手。","opts":[{"t":"走过去，坐下听他吹完","note":"精神+3 · 体温+1 · 补给+1","fx":{"mind":3,"temp":1,"food":1}},{"t":"向他讨一碗热奶","note":"补给+2 · 体温+2 · 精神+1","fx":{"food":2,"temp":2,"mind":1}},{"t":"不打扰——牧人的笛，是吹给牛听的","note":"精神+1","fx":{"mind":1}}]},
      {"title":"雪线以上的茶罐","kind":"探索/补给","text":"雪线以上的岩石缝里，**卡着一个搪瓷茶罐**——罐口封着蜡，里面居然还有半罐风干的茶叶。罐底刻着一行小字：「给后来的人。」","opts":[{"t":"烧水泡一罐茶","note":"补给+2 · 体温+2 · 精神+3","fx":{"food":2,"temp":2,"mind":3}},{"t":"把茶罐收起来留作纪念","note":"材料+1 · 精神+1","fx":{"mats":1,"mind":1}},{"t":"留在原处，等下一个人发现","note":"精神+2 · 名声+1","fx":{"mind":2,"fame":1}}]},
      {"title":"雪线附近的岩羊","kind":"观察/生物","text":"雪线以上的岩石上，**几只岩羊站在那里看着你**——它们不怕人，只是歪着头。老信使压低声音：「别靠近，它们比我们更熟这座山。」","opts":[{"t":"安静绕开","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"拍一张照","note":"材料-1 · 观测+2","fx":{"mats":-1,"obs":2}},{"t":"朝它们招手","note":"精神-1 · 体温-1","fx":{"mind":-1,"temp":-1}}]},
      {"title":"冰壁下的冰缝","kind":"地形/危险","text":"冰壁底部有一道**两指宽的冰缝**，里面传来呼呼的风声——老信使拉住你：「别凑过去，冰缝下面是空的，去年掉下去过一个。」","opts":[{"t":"绕开走","note":"体力-1 · 体温-1","fx":{"stam":-1,"temp":-1}},{"t":"趴在边上听一会儿","note":"观测+2 · 体温-2","fx":{"temp":-2,"obs":2}},{"t":"用绳子探一探深度","note":"材料-1 · 观测+2","fx":{"mats":-1,"obs":2}}]},
      {"title":"雪坡上的风声","kind":"观察/预兆","text":"雪坡上，**风的声音变了调**——从呜呜声变成尖锐的呼啸。老信使抬头看了看天：「要起风了，找背风的地方。」","opts":[{"t":"立刻找背风处","note":"体力-1 · 体温-1 · 精神+1","fx":{"stam":-1,"temp":-1,"mind":1}},{"t":"趁风没来登顶","note":"体力-3 · 体温-3 · 观测+2","fx":{"stam":-3,"temp":-3,"obs":2}},{"t":"无所谓继续走","note":"体温-5 · 精神-2","fx":{"temp":-5,"mind":-2}}]},
      {"title":"岩壁下的风雕","kind":"观察/自然","text":"岩壁下，**风把石头磨出了一道光滑的弧**——像被什么巨大的东西舔过。老信使伸手摸了摸：「这就是风走了一千年的路。」","opts":[{"t":"也摸一摸","note":"体温-1 · 观测+1","fx":{"temp":-1,"obs":1}},{"t":"在弧下躲风","note":"体温+1 · 体力+1","fx":{"temp":1,"stam":1}},{"t":"拍下来做记录","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}      ,
      {"title":"雪线上的旧冰镐","kind":"探索/人性","text":"雪线以上的岩石缝里，**卡着一把旧冰镐**——镐尖磨得发亮，腕带已经脆得一捏就碎。镐柄上刻着一个名字和年份，是二十年前的登山队留下的。它的主人没有回来取它。","opts":[{"t":"把冰镐拔出来带走","note":"材料+1 · 体力-1 · 精神-1","fx":{"stam":-1,"mind":-1,"mats":1}},{"t":"在它旁边立一块小石堆","note":"名声+2 · 精神+2","fx":{"mind":2,"fame":2}},{"t":"不动——冰镐是留给后来者的","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}}]}
      ,
      {"title":"雪窝里的旧背包","kind":"探索/人性","text":"雪窝里陷着一个**旧登山背包**——扣具全坏了，带子断成几截，但包体还鼓着。你打开看，里面是一本冻硬的笔记本和半块巧克力。笔记本最后一页写着：「我走不动了，吃的留给后来的人。」","opts":[{"t":"把巧克力分了，笔记收好","note":"补给+2 · 精神+2 · 材料+1","fx":{"food":2,"mind":2,"mats":1}},{"t":"把背包摆正，插上雪杖","note":"名声+2 · 精神+1","fx":{"mind":1,"fame":2}},{"t":"只翻一页笔记就合上","note":"观测+1 · 精神-1","fx":{"obs":1,"mind":-1}}]}
      ,
      {"title":"雪线以上的旧风镜","kind":"探索/补给","text":"雪线以上的岩石上，**卡着一副旧风镜**——镜片划了几道，但镜框还结实。绑带上还沾着褪色的绑旗绳。不知道是哪个登山队丢的。","opts":[{"t":"把风镜戴上","note":"观测+1 · 体力-1","fx":{"stam":-1,"obs":1}},{"t":"收起来，回头洗干净","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"留在原处，等主人回来找","note":"名声+1 · 精神+1","fx":{"mind":1,"fame":1}}]}
      ,
      {"title":"冰川上的旧裂缝","kind":"地形/危险","text":"冰川上横着一道**半米宽的裂缝**——桥已经塌了，只剩两边的冰沿。老信使趴下来，用冰镐敲了敲边缘：「这边结实。踩着我的脚印过，别往两边看。」","opts":[{"t":"踩着他的脚印过去","note":"体力-2 · 默契+1","fx":{"stam":-2,"bond":1}},{"t":"绕远路从冰桥过","note":"体力-4 · 观测+1","fx":{"stam":-4,"obs":1}},{"t":"先固定绳索再过去","note":"材料-1 · 体力-1 · 观测+1","fx":{"stam":-1,"mats":-1,"obs":1}}]}
      ,
      {"title":"雪坡上的旧雪铲","kind":"探索/补给","text":"雪坡上半截**插着一把旧雪铲**——铲头锈了，木柄还结实。不知道是谁埋在这儿等雪崩的。老信使拔出来掂了掂：「比我们那把顺手。拿走，别浪费。」","opts":[{"t":"把雪铲带走","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"留在原地，也许主人会回来找","note":"名声+1 · 精神+1","fx":{"mind":1,"fame":1}},{"t":"用它铲平一段雪坡","note":"体力-2 · 观测+1","fx":{"stam":-2,"obs":1}}]}
      ,
      {"title":"岩壁上的旧岩钉","kind":"探索/历史","text":"垂直的岩壁上，**一排旧岩钉打进岩石里**——间隔均匀，是以前的登山队留下的。最下面那根岩钉上还挂着一截断绳。老信使拽了拽：「还结实。这队人上去了，没下来。」","opts":[{"t":"顺着岩钉爬一段","note":"体力-3 · 观测+1","fx":{"stam":-3,"obs":1}},{"t":"在岩钉下刻个记号","note":"材料-1 · 名声+1","fx":{"mats":-1,"fame":1}},{"t":"不爬，绕过去","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}
      ,
      {"title":"雪线上的旧路标","kind":"人文/路标","text":"雪线上一根**插在石堆里的旧路标**——木牌已经发黑，上面的字被雪盖住一半。老信使跪下去把雪擦干净，露出「谢拉格」三个旧字。他站了起来，没说话，把背包带紧了紧。","opts":[{"t":"对着路标鞠个躬","note":"精神+1 · 名声+1","fx":{"mind":1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}
      ,
      {"title":"高山垭口的旧风马旗","kind":"观察/人文","text":"垭口风里，**一串褪色的旧风马旗**——布条被风吹得啪啪响。老信使站在旗下让风刮了一会儿：「垭口风大。旗子是以前路过的人挂的。」他扯了扯快断的那根绳，「旗子旧了就换。挂旗子的人不图别的，就图路过的人平安。」","opts":[{"t":"在旗下避风","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"帮他换一根新绳","note":"体力-1 · 材料-1 · 名声+1","fx":{"stam":-1,"mats":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"高山冰川边上的旧冰碛堤","kind":"观察/自然","text":"冰川边上，**一道旧冰碛堤**——石头和泥混着堆成一道长堤，堤上还压着没化完的冰。老信使用脚踢了踢堤上的石头：「冰碛堤。」他指了指冰川，「冰川推着石头和泥走。冰川退了，石头泥就留下来，堆成一道堤。」他指了指堤上的冰，「堤里压着冰。夏天化一点，堤就塌一块。」他绕开堤脚，「别在堤脚站着。塌一块石头下来砸人。」","opts":[{"t":"绕开堤脚走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在冰碛堤上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"高山流石滩上的旧流石堆","kind":"观察/自然","text":"流石滩上，**一堆堆旧流石**——石头大大小小，全是往下坡方向斜着堆的，堆与堆之间长着稀疏的草。老信使用脚踢了踢一块石头，石头顺着坡滑下去老远：「流石滩。」他指了指坡上，「山上的石头冻裂了，碎成小块。夏天化冻，石头就往下滑。」他绕开石头堆，「别踩石头。石头底下空的。踩上去石头一滑，人就跟着滑下去。」","opts":[{"t":"绕开石头堆走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在流石滩边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"高山草甸上的旧鼠兔洞","kind":"观察/自然","text":"草甸上，**一个个旧鼠兔洞**——洞口是圆的，旁边堆着新翻出来的土，洞口边还摆着几根咬剩的草茎。老信使用手指了指洞口：「鼠兔洞。」他指了指洞口，「鼠兔住这。白天出来吃草。看见人就钻洞。」他蹲下来看了看洞口边的土，「新翻的土。说明洞还在用。」他站起来退开两步，「别在洞口站着。鼠兔出来看见人就不出来了。」","opts":[{"t":"也看看洞口","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在鼠兔洞边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"高山雪线边上的旧雪蚀洼地","kind":"观察/自然","text":"雪线边上，**一个旧雪蚀洼地**——洼地是浅碗形的，里面还残着一点没化完的残雪，洼地边上的草被雪压得倒向一边。老信使用脚踩了踩残雪，雪硬邦邦的：「雪蚀洼地。」他指了指洼地，「冬天雪积在这。春天化了。水把土冲走一点，洼就越来越大。」他绕开洼地边上的残雪，「残雪下面是软泥。别踩。」","opts":[{"t":"绕开残雪走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在洼地边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

    {"title":"冰瀑","kind":"环境/观测","text":"一道**冰瀑**挂在崖壁上，冻住了半空，瀑水在冰层下还隐隐流动。阳光打在上面，整面冰墙泛着蓝绿的光，像一堵透明的墙。","opts":[{"t":"停下来看冰层里的气泡和裂纹","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"敲一块碎冰，装进水壶","note":"补给+1 · 体力-2","fx":{"stam":-2,"food":1}},{"t":"不耽搁，贴着冰瀑根部的路走","note":"体力-2","fx":{"stam":-2}}]},
    {"title":"冰桥","kind":"环境/危险","text":"两道崖壁之间，**一座天然冰桥**横跨冰缝，桥面泛着幽幽的蓝光。桥身中段有一道细纹，像随时会裂开——但绕路要多走大半天。","opts":[{"t":"压低重心，贴桥面爬过去","note":"体力-6 · 精神-3","fx":{"stam":-6,"mind":-3}},{"t":"用攀岩绳系腰，让桥断了自己也不至于摔到底","note":"需攀岩绳 · 体力-5 · 精神-1","fx":{"stam":-5,"mind":-1},"reqClimb":true},{"t":"绕路走谷底","note":"补给-3 · 体力-4","fx":{"stam":-4,"food":-3}}]},
    {"title":"冰臼","kind":"环境/观测","text":"冰面上分布着**几口碗状的冰臼**，深浅不一，边沿圆润光滑，像谁用巨大的勺子挖出来的。臼底积着薄冰，映着天光。","opts":[{"t":"蹲下来量一量臼口的尺寸，记进观测笔记","note":"观测+2 · 体力-2","fx":{"stam":-2,"obs":2}},{"t":"敲一块臼底的冰，装进水壶","note":"补给+1 · 体力-2","fx":{"stam":-2,"food":1}},{"t":"绕开走——自然挖的坑，踩进去不一定出得来","note":"体力-1","fx":{"stam":-1}}]},

    {"title":"岩羚","kind":"生态/观察","text":"岩壁上，**两只岩羚**一前一后立着，蹄子踩在几乎垂直的石棱上，一动不动。它们站的地方，只有最熟悉山路的人才能上去——岩羚走过的路，人走不得，但可以看。","opts":[{"t":"记住它们站的方向，那里多半有岩缝能过","note":"观测+2 · 体力-1","fx":{"stam":-1,"obs":2}},{"t":"停下来，数一数岩壁上有几条能落脚的棱","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"赶路要紧——岩羚看它的崖，你看你的山","note":"精神-1","fx":{"mind":-1}}]},

    {"title":"绸缎庄","kind":"人情（城心）","text":"街边，**绸缎庄**的架子上挂着一匹匹料子，阳光照进去，颜色一层层地亮。掌柜的在柜台后拨算盘，见你站住，也不招呼，只等你看够了。","opts":[{"t":"扯一尺素色料子，路上缝补用","note":"金钱-1 · 补给+1","fx":{"food":1,"money":-1}},{"t":"听掌柜讲这匹料子从哪座城运来","note":"精神+2 · 城心+1 · 耗时","fx":{"mind":2,"cityHeart":1},"time":1},{"t":"不进门——绸缎是穿给城里人看的，野外穿不了一身绸","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"糖葫芦","kind":"人情（城心）","text":"街角，**糖葫芦摊**前围了几个孩子，摊主把山楂串在竹签上，往熬好的糖浆里一转，搁在板上晾得晶晶亮。见你路过，他举了一串：「尝尝？不甜不要钱。」","opts":[{"t":"买一串，边走边吃","note":"金钱-1 · 精神+1 · 城心+1","fx":{"mind":1,"money":-1,"cityHeart":1}},{"t":"买两串，一串塞给巷口眼巴巴看的小孩","note":"金钱-2 · 城心+2","fx":{"money":-2,"cityHeart":2}},{"t":"不买——糖葫芦再甜，也甜不过这趟差事办成的踏实","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"嵌进甲板的铜币","kind":"人情（城心）","text":"甲板接缝里，**嵌着一枚被踩得发亮的铜币**，边缘翘起一角，像是有意卡进去的。老船工说，往新船甲板缝里压一枚钱，是讨「镇得住」的彩头。","opts":[{"t":"蹲下来看那枚铜币的年份与花纹","note":"观测+2 · 城心+1","fx":{"obs":2,"cityHeart":1}},{"t":"撬出来，当作这趟差事的护身钱","note":"金钱+2 · 材料+1","fx":{"money":2,"mats":1}},{"t":"不碰——压钱的人求的是整座城平安，别坏人家的彩头","note":"城心+1","fx":{"cityHeart":1}}]},
    {"title":"甲板上的歌声","kind":"人情（城心）","text":"夜班的码头工人对着河面哼起老调子，**声音压得很低**，却一句接一句。老船工说，这是起航前的习惯——唱给岸上送行的人听，也唱给这座城听。","opts":[{"t":"站在阴影里听完一段","note":"精神+2 · 城心+2","fx":{"mind":2,"cityHeart":2}},{"t":"帮着和一句，哪怕跑调","note":"城心+3 · 体力-1","fx":{"stam":-1,"cityHeart":3}},{"t":"路过，不多停留","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"甲板上的晾衣绳","kind":"人情（城心）","text":"甲板的缆绳上，**晾着一排洗得发白的工装**，被海风吹得猎猎响。管工装的老工人坐在小凳上补袖口——这城的衣服，也是要一件一件补的。","opts":[{"t":"帮着把衣服收进来，叠好","note":"城心+2 · 体力-1 · 精神+1","fx":{"stam":-1,"mind":1,"cityHeart":2}},{"t":"陪他坐一会儿，听他讲这工装的故事","note":"城心+2 · 精神+2 · 耗时","fx":{"mind":2,"cityHeart":2},"time":1},{"t":"不碰——别人的衣服，别乱动","note":"城心-1","fx":{"cityHeart":-1}}]}     ,
      {"title":"甲板上的旧邮筒","kind":"人情/细节","text":"甲板角落立着一个**掉了漆的旧邮筒**，牌子上写着「罗德岛外勤信件」。筒里塞着几封泛黄的信，收信人早不在了。","opts":[{"t":"把信整理好，交给中转站","note":"名声+3 · 精神+2","fx":{"mind":2,"fame":3}},{"t":"挑一封看看署名","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"不碰——别人的信，别翻","note":"精神+1","fx":{"mind":1}}]},
      {"title":"船尾的绳结","kind":"观察/细节","text":"船尾，**一根粗缆绳上打满了绳结**——每个结都打得规规矩矩，像有谁在上面记过事。老水手路过，看了一眼：「这是跑了三十年船的人打的，一个结一次风。」","opts":[{"t":"数一遍有多少个结","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"学打一个一样的结","note":"材料+1 · 观测+1","fx":{"obs":1,"mats":1}},{"t":"不看——绳结是绳结，故事是别人的","note":"精神-1","fx":{"mind":-1}}]},
      {"title":"甲板上的旧锚链","kind":"观察/细节","text":"甲板边，**一圈旧锚链盘在地上**——链环上的漆早磨光了，露出底下暗红的锈。水手说，这条锚链拴过这座城三次漂移，每一次都把全城从沙暴里拖回来。","opts":[{"t":"数一遍有多少个链环","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"用手掂一掂链环的分量","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"不碰——锚链是城的命根子","note":"城心+1","fx":{"cityHeart":1}}]},
      {"title":"夜里的信号灯","kind":"观察/细节","text":"午夜，**船尾灯一下一下地闪**——不是故障，是领航员在给后方的拖船发信号。红光映在甲板上，像心跳。","opts":[{"t":"站在灯旁边，跟着节奏数","note":"精神+2 · 观测+1","fx":{"mind":2,"obs":1}},{"t":"帮领航员换灯泡","note":"材料-1 · 城心+2 · 体力-1","fx":{"stam":-1,"mats":-1,"cityHeart":2}},{"t":"回舱睡觉——信号灯有人管","note":"体力+3","fx":{"stam":3}}]},
      {"title":"甲板上的货单","kind":"观察/细节","text":"甲板栏杆上贴着一张**被风吹得发白的货单**——上面列着三十吨源石、两台发电机、一箱药品。签收人那一栏空着。","opts":[{"t":"把货单撕下来收着","note":"材料+1 · 观测+1","fx":{"mats":1,"obs":1}},{"t":"照原样贴回去","note":"城心+1 · 观测+1","fx":{"cityHeart":1,"obs":1}},{"t":"货单不关你的事","note":"精神+1","fx":{"mind":1}}]},
      {"title":"船尾的缆绳工","kind":"人情/观察","text":"船尾，**一个老缆绳工在 solo 收绳**——他一声不吭，动作却极快，绳子在他手里像活的一样。他看了你一眼：「别站在我后面，缆绳弹回来要人命。」","opts":[{"t":"帮他拉一把","note":"体力-2 · 城心+2 · 观测+1","fx":{"stam":-2,"cityHeart":2,"obs":1}},{"t":"站远一点看","note":"观测+1","fx":{"obs":1}},{"t":"回舱","note":"体力+1","fx":{"stam":1}}]},
      {"title":"甲板上的送行人","kind":"人情/观察","text":"码头边，**一个女人站在送行人群里**——她没挥手，只是看着船。直到船开出去很远，她还站在那里。老水手说：「她送了三次了，他每次都说下次就回来。」","opts":[{"t":"朝她挥挥手","note":"精神+1 · 城心+1","fx":{"mind":1,"cityHeart":1}},{"t":"别过脸去看海","note":"精神-1","fx":{"mind":-1}},{"t":"问老水手更多","note":"观测+1 · 精神-1","fx":{"obs":1,"mind":-1}}]},
      {"title":"驾驶室的玻璃","kind":"观察/细节","text":"驾驶室的挡风玻璃上，**有一道很深的划痕**——从左下角斜到右上角。领航员说这是上次过陨石带时砸的，「换一块要三天，我们没时间。」","opts":[{"t":"问陨石带的事","note":"观测+2 · 精神-1","fx":{"obs":2,"mind":-1}},{"t":"帮着擦一擦玻璃","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"不关你的事","note":"精神+1","fx":{"mind":1}}]}
      ,
      {"title":"舷窗上的雨痕","kind":"观察/细节","text":"雨夜，舷窗玻璃上**一道雨痕斜斜地划下来**——比别的雨痕都深，像是有人用手指在起雾的玻璃上画了一道线。领航员凑过来看了一眼，没说话，把窗帘拉上了。","opts":[{"t":"拉开窗帘再看一眼","note":"观测+1 · 精神-1","fx":{"obs":1,"mind":-1}},{"t":"在雨痕旁边也画一道","note":"精神+1 · 城心+1","fx":{"mind":1,"cityHeart":1}},{"t":"不关你的事","note":"体力+1","fx":{"stam":1}}]}
      ,
      {"title":"通风管里的风","kind":"观察/细节","text":"底舱通风管里传来**一阵奇怪的风声**——不是呼呼响，是呜呜的，像有人在管子里低声说话。检修工拎着扳手路过，头也不抬：「别管，老管子了，风大了就这样。」","opts":[{"t":"凑近管子听一会儿","note":"观测+1 · 精神-1","fx":{"obs":1,"mind":-1}},{"t":"帮检修工一起拧紧管箍","note":"体力-2 · 城心+2","fx":{"stam":-2,"cityHeart":2}},{"t":"回甲板，不听也罢","note":"精神+1","fx":{"mind":1}}]}
      ,
      {"title":"锅炉房的旧温度计","kind":"观察/细节","text":"锅炉房墙上挂着**一支旧温度计**——玻璃管里的红液柱停在一个奇怪的位置，比实际温度高了五度。司炉工瞥了一眼：「那支表三年前就坏了，没人摘。看久了，它报多少我们就信多少。」","opts":[{"t":"问他为什么不修","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"帮他换一支新的","note":"材料-1 · 城心+2","fx":{"mats":-1,"cityHeart":2}},{"t":"笑一笑走开","note":"精神+1","fx":{"mind":1}}]}
      ,
      {"title":"舷梯上的旧防滑链","kind":"观察/细节","text":"下舷梯的时候，你注意到台阶上**缠了一圈旧防滑链**——链条锈得厉害，但每一节都嵌得很紧。水手长说这是十年前一个老水手缠的，「他说雨天这梯子能滑死人。后来他退休了，链子没拆。」","opts":[{"t":"扶着链条下梯子","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"把锈链擦一擦","note":"材料-1 · 城心+1","fx":{"mats":-1,"cityHeart":1}},{"t":"直接跳下去","note":"体力-2 · 精神+1","fx":{"stam":-2,"mind":1}}]}
      ,
      {"title":"缆车里的旧时刻表","kind":"观察/细节","text":"缆车里贴着**一张发黄的旧时刻表**——到站时间还是三年前的老班次，纸角卷了边。你问乘务员怎么不换。她笑了笑：「换了，乘客也记不住。旧的这张，他们闭着眼都知道几点。」","opts":[{"t":"对着时刻表算下一站","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"帮她把卷边抹平","note":"城心+1 · 体力-1","fx":{"stam":-1,"cityHeart":1}},{"t":"不看表，看窗外","note":"精神+1","fx":{"mind":1}}]}
      ,
      {"title":"甲板下的旧缆绳卷","kind":"观察/补给","text":"甲板角落里堆着**一卷旧缆绳**——比手臂还粗，绳头散着股。水手长说这是换下来的旧绳，「还没断，就是磨毛了。攒着，应急的时候能当安全带。」","opts":[{"t":"把缆绳盘好收起来","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"帮水手长把旧绳搬走","note":"体力-2 · 城心+2","fx":{"stam":-2,"cityHeart":2}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"豆腐坊里的旧石磨","kind":"观察/细节","text":"豆腐坊院子里，**一盘旧石磨**——上扇磨盘已经磨得中间凹下去，磨盘边上还挂着没冲干净的豆渣。豆腐坊老板推了推上扇磨，磨盘吱呀转了半圈：「石磨。」他指了指两扇磨盘中间的缝，「黄豆泡软了，从这小孔倒进去。推磨一转，豆就磨成浆。」他把上扇磨停下来，「现在有电磨了。这个旧石磨留着。磨出来的豆腐香。」","opts":[{"t":"也推推磨","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"在豆腐坊歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"醋坊里的旧醋缸","kind":"观察/细节","text":"醋坊院子里，**一排旧醋缸**——缸是粗陶的，缸口盖着木板，缸身上挂着一层旧醋垢。醋坊老板揭开一块木板看了看：「醋缸。」他指了指缸里的醋，「粮食发酵，在缸里放半年，就成醋。」他把木板盖回去，「醋缸要老。新缸不出好醋。这排缸跟了我三十年。」他指了指缸边的旧酒糟，「酒糟喂猪。不浪费。」","opts":[{"t":"也看看缸里的醋","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"在醋坊歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"杂货铺里的旧铜秤","kind":"观察/细节","text":"杂货铺柜台上，**一杆旧铜秤**——秤杆是乌木的，秤砣是铜的，秤盘已经磨得发亮。店老板用秤砣比了比秤杆上的星：「秤。」他指了指秤杆上的小铜星，「这是星。秤砣压到哪个星，就是几两。」他把秤盘里的东西称了称，「以前买东西都用这个称。现在用电子秤了。这个留着。」他把秤砣挂回秤杆上，「秤要平。不平就不准。」","opts":[{"t":"也看看秤星","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"在杂货铺歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"油盐店墙上的旧油篓","kind":"观察/细节","text":"油盐店墙上，**一个旧油篓**——篓是竹篾编的，里面糊着油纸，篓口还塞着旧木塞。店老板把油篓取下来晃了晃，里面的油哗哗响：「油篓。」他指了指篓里的油纸，「竹子不装油。里面糊一层油纸，就不渗了。」他把油篓挂回去，「以前油都这么装。一桶一桶拎着卖。」他指了指篓口的木塞，「塞子要塞紧。撒了可惜。」","opts":[{"t":"也看看油纸","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"在油盐店歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"竹器铺里的旧竹篮","kind":"观察/细节","text":"竹器铺货架上，**一个旧竹篮**——竹篾编的，篮口已经磨得发亮，提手处用旧布条缠了一圈。竹器店老板把竹篮取下来掂了掂：「竹篮。」他指了指篮底的篾片，「竹子劈开，编成篮。装菜，装粮，装东西。」他把竹篮倒过来磕了磕底，「竹篮轻。比篮子轻。就是不经摔。」他把竹篮放回去，「竹器要防虫。放久了生虫。」","opts":[{"t":"也看看编法","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"在竹器铺歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"面摊上的旧木面案","kind":"观察/细节","text":"面摊案板上，**一块旧木面案**——案面被揉面揉得发亮，边上还沾着干了的面痂。面摊老板用擀面杖在案面上擀了一下：「面案。」他指了指案面上的旧刀痕，「揉面、擀面、切面，都在这上面。」他把面案上的浮面扫掉，「面案要每天洗。不然面粘。」他拍了拍案面，「这案子跟了我二十年。」","opts":[{"t":"也看看面案","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"在面摊歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"锅炉房里的旧煤铲","kind":"观察/细节","text":"锅炉房墙边，**一把旧铁煤铲**——铲头磨得薄了，木柄上全是汗渍。锅炉工把铲在炉边磕了磕：「这把铲用了十五年。现在烧气不烧煤了，铲留着。」他把铲靠回墙边，「万一停气，还得烧煤应急。铲不能丢，丢了到时候抓瞎。」","opts":[{"t":"帮他把铲擦干净","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他烧煤什么味","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"天台花园里的旧花箱","kind":"观察/细节","text":"天台花园里，**一排旧木花箱**——箱里种着葱和蒜。管理员蹲下来拔了拔草：「住天台的老人种的。以前种花，后来改种葱蒜。」他掐了一片蒜叶闻了闻，「花不顶饿，葱蒜顶。城市里吃饭难，天台种点葱，下面条时揪一把。」","opts":[{"t":"帮他拔草","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他种了什么","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"电梯井里的旧楼层牌","kind":"观察/细节","text":"电梯井墙上，**一排旧搪瓷楼层牌**——牌上的数字掉了漆。维修工摸了摸牌面：「以前电梯停每层，牌上写着几楼。」他指了指其中一块缺角的，「后来电梯改了，只停单数层。这些牌没拆，留着。有人住了二十年，改不过来，还按旧层数找门。」","opts":[{"t":"帮他把牌擦干净","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他哪层住的人最多","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"洗衣房里的旧搓衣板","kind":"观察/细节","text":"城市洗衣房里，**一块旧木搓衣板**——立在洗衣机旁边。洗衣阿姨用它刮了刮顽固的污渍：「洗衣机洗不掉的，就用它。」她把搓衣板靠回墙边，「这是建站时住户留下的。三十年了，还没坏。新洗衣机转得快，但有些东西，搓衣板比它干净。」","opts":[{"t":"帮她拧衣服","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问她衣服都是谁的","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"缆车道上的旧缆车卡","kind":"观察/细节","text":"缆车道检修平台上，**一张旧缆车卡**——卡片塑料壳黄了，照片上的人还年轻。检修工把卡挂回钉子上：「以前坐缆车要打卡。现在缆车停运了，卡留着。」他指了指卡片上的编号，「哪天缆车重新开，这卡还能刷。人不一定回来了，卡先留着。」","opts":[{"t":"把卡擦干净","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他缆车为什么停","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"管道层里的旧阀门手轮","kind":"观察/细节","text":"管道层里，**一个旧铸铁阀门手轮**——轮子锈住了，但上面刻着字。维修工拧了拧没拧动：「这是总水阀。十年没关过。」他用布擦了擦手轮上的字，「上面刻着谁最后关的、哪年关的。城市启动那年开的，就再没关过。」","opts":[{"t":"帮他擦手轮上的锈","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他为什么不关掉","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"旧货场上的旧集装箱","kind":"观察/细节","text":"城市旧货场上，**一排锈住的旧集装箱**——门都焊死了。仓库管理员用脚踢了踢箱壁：「这些箱子是十年前搬家用的。现在东西早搬进新仓库了，箱子留着。」他拍了拍箱门，「以后要是新仓库不够用，再把它们割开当库房。现在就当围墙用。」","opts":[{"t":"帮他把集装箱门加固","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他箱子里装过什么","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"食堂后厨的旧面案","kind":"观察/细节","text":"食堂后厨里，**一张旧木面案**——案板上全是刀切的痕，中间凹下去一块。大师傅用手掌量了量案板的凹处：「这案子用了三十年。几代师傅在上面揉面。」他拍了拍案板，「中间凹了就翻个面。两面都凹了，就换。新案子没旧案子顺手。」","opts":[{"t":"帮他把案板翻个面","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他做什么面","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"维修通道里的旧安全帽","kind":"观察/细节","text":"维修通道墙上挂钩上，**一顶旧安全帽**——壳上有裂，但没破。维修工把它摘下来拍了拍灰：「上一个戴这顶帽子的人，十年前从梯子上摔下来，帽子救了他。」他把帽子挂回去，「现在没人戴了。大家都戴新的。但这顶挂在这儿，提醒我们梯子不是铁打的。」","opts":[{"t":"把帽子摆正","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他摔下来的人怎么样了","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"排水口里的旧鱼骨架","kind":"观察/细节","text":"城市排水口里，**一副旧鱼骨架**——鱼是从蓄水池里游进来的，被水冲进了管道。维修工把骨架捡出来扔了：「城市里本来没鱼。十年前蓄水池漏了，进水的时候带进几条鱼。现在鱼在蓄水池里繁殖了。」他拍了拍排水管壁，「哪天你在蓄水池里看见鱼，别意外。它比你先到。」","opts":[{"t":"帮他把骨架捡出来","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他蓄水池里有多少鱼","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"烟囱上的旧风向标","kind":"观察/细节","text":"烟囱顶上，**一个旧铁皮风向标**——形状是个箭头，已经转不动了，锈死在指向北的位置。维修工拿锤子敲了敲轴承：「风的方向早就不准了。现在靠测风仪，不靠这个。」他没换风向标，「留着吧。它指着北，我们就知道北在那边。」","opts":[{"t":"帮他扶住梯子","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问它为什么锈死了","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"锅炉房里的旧温度计","kind":"观察/细节","text":"锅炉房墙上，**一根旧玻璃温度计**——刻度到三百度，液柱停在一百八十。烧锅炉的师傅用手拍了拍温度计壳：「这表是建厂时装的。现在不准了，实际温度比表上高二十度。」他拿铅笔在墙上写了个加二十，「就靠这个数。表不换，数记在脑子里。」","opts":[{"t":"帮他把数字描清楚","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他为什么不换表","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"货梯里的旧按钮","kind":"观察/细节","text":"货梯里，**楼层按钮上数字磨没了**——只剩下一个金属坑。开货梯的师傅按了一下那个坑：「这层是三层。按钮磨了二十年，字没了，但位置记得住。」他拍了拍按钮面板，「新按钮买不到，这个面板是定制的。等它坏了，我们就靠记位置按。」","opts":[{"t":"帮他擦按钮面板","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他城市有几层","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"水塔上的旧水痕","kind":"观察/细节","text":"城市水塔外壁，**一圈黄褐色旧水痕**——是水面曾经到过的位置。管水的师傅拿锤子敲了敲塔壁：「现在的水位比这条线低了三米。」他在水痕下用油漆画了一道新线，「新线下面的水是今年攒的。上面那些空着的，以前城市满水的时候才有。」","opts":[{"t":"帮他刷油漆线","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他水位为什么降了","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"船坞里的旧油漆","kind":"观察/细节","text":"船坞边，**一排旧油漆桶**——桶身上印着城市编号，颜色是二十年前的旧绿。油漆工拿刷子蘸了蘸：「这漆是老配方，防腐。新漆半年就掉，这漆刷上去管五年。」他把刷子在桶边刮了刮，「现在买不到了。桶里剩多少用多少，用完就没了。」","opts":[{"t":"帮他刷一块甲板","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他为什么不进货","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,

      ,
      {"title":"舷窗上的旧划痕","kind":"观察/细节","text":"生活区舷窗玻璃上，**有一排深浅不一的划痕**——是指甲刮出来的。维修工长路过看了一眼：「这是刚建城那年，第一批居民刻的。那时候城市还不稳，晚上晃得厉害，有人睡不着，就用指甲在窗户上划道儿数日子。现在城市稳了，但划痕没人去磨掉。」","opts":[{"t":"伸手摸了摸划痕","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"问他第一批居民现在还在吗","note":"城心+1 · 观测+1","fx":{"cityHeart":1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"甲板下的旧通风管","kind":"观察/细节","text":"甲板下的维修通道里，**一根旧通风管裂了口**——通风口用铁皮补过，补丁上刷着和管壁一样的黑漆。维修工长用手敲了敲管壁：「这管子是城市刚开起来那年装的，五十年了。补了八次。换新的要停半边引擎三天，不换了，补丁接着打。」","opts":[{"t":"帮他把补丁再紧一圈","note":"体力-1 · 城心+1","fx":{"stam":-1,"cityHeart":1}},{"t":"问他还能撑多久","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"通风口里的旧鸟窝","kind":"观察/细节","text":"甲板通风口里，**不知什么时候被鸟筑了个窝**——几根干草，两颗没孵出来的蛋。水手长踮脚看了一眼，没掏。「城市在走，鸟不知道。它在这儿下了蛋，城市一开走，蛋就凉了。」他把通风口的格栅轻轻盖回去，「每天路过都看一眼，鸟自己会走。」","opts":[{"t":"帮他把格栅盖好","note":"城心+1 · 精神+1","fx":{"cityHeart":1,"mind":1}},{"t":"问他鸟最后走了没","note":"观测+1 · 城心+1","fx":{"obs":1,"cityHeart":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

    {"title":"花店","kind":"人情（城心）","text":"街角的花店**开门比谁都早**，老板娘正往桶里换水，康乃馨、雏菊、满天星摆了一地。她抬头见你，笑着递过一枝：「赶路的，带一枝，路上看着也舒心。」","opts":[{"t":"接过花，插在背包侧袋里","note":"精神+2 · 城心+2","fx":{"mind":2,"cityHeart":2}},{"t":"买一束，托她转送给街坊","note":"金钱-3 · 城心+2","fx":{"money":-3,"cityHeart":2}},{"t":"摆手谢过——花会谢，路还长","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"烤红薯","kind":"人情（城心）","text":"入夜，巷口的**烤红薯摊**烧得正旺，铁皮炉里透出橘红的光，甜香混着热气漫了半条街。摊主掀开炉盖，用铁夹夹出一只，掰开给你看：「起沙了，来一只？」","opts":[{"t":"买一只，掰成两半慢慢吃","note":"金钱-2 · 精神+2 · 城心+1","fx":{"mind":2,"money":-2,"cityHeart":1}},{"t":"帮摊主看一会儿炉火，听他讲起航前夜的事","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不买——甜的热的，吃进肚里都留不住","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"包子铺","kind":"人情（城心）","text":"巷口的**包子铺**刚揭笼，白汽腾起来，把半条巷子都染得暖烘烘的。老板娘掀着笼屉盖，朝你喊：「信使，热乎的，带两个上路？」","opts":[{"t":"买两个热包子，听老板娘说城里的新鲜事","note":"金钱-2 · 精神+2 · 城心+1","fx":{"mind":2,"money":-2,"cityHeart":1}},{"t":"帮她搭手搬两笼蒸格，换一袋干粮","note":"城心+3 · 补给+2 · 体力-2","fx":{"stam":-2,"food":2,"cityHeart":3}},{"t":"摆手不买——刚揭笼的包子烫，赶路的人吃不下","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"当铺","kind":"人情（城心）","text":"老街上，**一家当铺**挂着褪色的招牌，柜台高过人头，只有一扇小窗对着街。掌柜正在灯下看一件旧怀表，见了你，慢悠悠地问：「当，还是赎？」","opts":[{"t":"当一件用不上的物件，听掌柜讲铺子里收过的故事","note":"金钱+2 · 精神-1 · 城心+1","fx":{"mind":-1,"money":2,"cityHeart":1}},{"t":"只站着看一会儿，猜那些典当物后面的故事","note":"精神+2 · 城心+1","fx":{"mind":2,"cityHeart":1}},{"t":"不进门——当铺的规矩，进得去，未必出得来","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"绣庄","kind":"人情（城心）","text":"街角的**绣庄**门口，几个姑娘坐在檐下绷着绣绷，针线上下翻飞。掌柜的端出一筐线头，笑着招呼你：「过路的？坐一会儿，喝口茶，看看我们这城的针脚。」","opts":[{"t":"坐下来看她们绣一会儿，听掌柜讲这门手艺的来路","note":"精神+2 · 城心+1 · 耗时","fx":{"mind":2,"cityHeart":1},"time":1},{"t":"买一小卷结实棉线，路上缝补用","note":"金钱-1 · 补给+1","fx":{"food":1,"money":-1}},{"t":"不进门——针脚再细，也缝不住赶路人的心","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"轿夫","kind":"人情（城心）","text":"街口，**两个轿夫**蹲在轿杠边歇脚，一个揉着肩，一个数着铜板。见你路过，揉肩的那个喊了一嗓子：「过路的，上街坐轿不？路远，抬您一程。」","opts":[{"t":"掏几个铜板雇一程，顺便听他们讲城里的事","note":"金钱-1 · 城心+1 · 耗时","fx":{"money":-1,"cityHeart":1},"time":1},{"t":"摆摆手说不坐，自己走","note":"体力-1","fx":{"stam":-1}},{"t":"多给几个铜板，让他俩歇够了再抬","note":"金钱-2 · 城心+2","fx":{"money":-2,"cityHeart":2}}]},
    {"title":"引擎舱的热","kind":"环境/生存","text":"引擎舱里，**热浪裹着机油味**扑过来，温度比外面高出一截。守引擎的师傅光着膀子擦汗，见你进来，递过一杯凉茶：「进来的，都得先喝口水。」","opts":[{"t":"喝口水，陪师傅站一会儿","note":"补给+1 · 城心+2 · 精神+1","fx":{"food":1,"mind":1,"cityHeart":2}},{"t":"帮着擦一把散热片","note":"城心+2 · 体力-1","fx":{"stam":-1,"cityHeart":2}},{"t":"赶紧出去——引擎舱待久了，人会发晕","note":"城心-1","fx":{"cityHeart":-1}}]}     ],
