    {"title":"旋转木马","kind":"人情（城心）","text":"城角空地上，**一架旧旋转木马**正慢慢转着，彩绘的木马漆皮剥落，音乐盒似的曲子断断续续。看摊的老人坐在马背上打盹，手里还攥着铃铛。","opts":[{"t":"花点钱坐一圈，替老人看会儿摊","note":"金钱-3 · 精神+2 · 城心+2","fx":{"mind":2,"money":-3,"cityHeart":2}},{"t":"帮老人修一修吱呀响的轴承","note":"城心+4 · 体力-3","fx":{"stam":-3,"cityHeart":4}},{"t":"路过——木马转得再慢，也不是你的方向","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"报童","kind":"人情（城心）","text":"街角，一个**报童**正举着报纸冲路人喊：「城要起航了！最后几天的老航线都在这张纸上！」他嗓门洪亮，脚边还压着一摞没卖完的。","opts":[{"t":"买一份，听他说说城里的新闻","note":"金钱-2 · 观测+1 · 城心+1","fx":{"obs":1,"money":-2,"cityHeart":1}},{"t":"帮他把报纸理好，听他讲起航的故事","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"摆手路过——纸上的事，不如路边的真实","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"成衣铺","kind":"人情（城心）","text":"老街上开着一家**成衣铺**，门口挂着几件洗得发白的工作服和一件崭新的礼服。老板娘踩着缝纫机，头也不抬：「新城的料子都在这儿了，要什么尺码自己报。」","opts":[{"t":"请她补一补你背包的破口","note":"金钱-3 · 材料+1 · 城心+1","fx":{"mats":1,"money":-3,"cityHeart":1}},{"t":"帮她裁一匹布，听她说起航后做新衣的事","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"看看就走——衣服再新，也不如走得稳当","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"人力车","kind":"人情（城心）","text":"街角，**一辆人力车**停在檐下，车夫靠在车座上打盹，车把上挂着一只旧水壶。有人路过，他眼皮都不抬：「城要走了，拉一趟少一趟，你要坐不？」","opts":[{"t":"坐一趟，听他讲城里每条街的名字","note":"金钱-2 · 精神+2 · 城心+1","fx":{"mind":2,"money":-2,"cityHeart":1}},{"t":"帮他看一会儿车，让他去灌口水","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不坐——路不远，走着去也一样","note":"城心-1","fx":{"cityHeart":-1}}]},

    {"title":"旧剧场","kind":"人情（城心）","text":"老城区的**旧剧场**门口贴着一张泛黄的海报，戏早就散场了，但门还虚掩着。看门大爷在台口打盹，怀里抱着一把没人拉的旧琴。","opts":[{"t":"进去坐一会儿，听大爷讲城还没起飞时的戏","note":"金钱-3 · 精神+3 · 城心+1","fx":{"mind":3,"money":-3,"cityHeart":1}},{"t":"帮他把海报重新贴正","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"路过——散场的戏，不值得回头看","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"菜市场","kind":"人情（城心）","text":"早市的**菜市场**人挤人，卖菜的大娘嗓门一个赛一个：西红柿、黄瓜、现摘的青菜，都是城上暖棚里种的。秤杆起落，热闹得冒热气。","opts":[{"t":"买把青菜，听大娘唠起航后吃什么","note":"金钱-2 · 补给+2 · 城心+1","fx":{"food":2,"money":-2,"cityHeart":1}},{"t":"帮大娘搬两筐菜，换一句城里的话","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"穿过市场赶路——热闹是热闹，路是自己的","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"糖画","kind":"人情（城心）","text":"街角的**糖画摊**围着几个孩子，老匠人手腕一转，铜勺里的糖浆在石板上勾出一只展翅的鸟。他抬头见你，笑了笑：「来一只？城里要起航了，甜一口再走。」","opts":[{"t":"买一只糖画，边走边舔","note":"金钱-2 · 精神+2 · 城心+1","fx":{"mind":2,"money":-2,"cityHeart":1}},{"t":"帮老匠人拉一会儿风箱，听他说起航的老话","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不买——甜的东西，吃多了走不动路","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"街头象棋","kind":"人情（城心）","text":"树荫下，**一盘街头象棋**杀得正热闹，围了一圈人。执红的大爷拍着大腿：「将军！你走不脱了！」执黑的大叔不服：「悔一步，悔一步！」看客们起着哄。","opts":[{"t":"挤进去看几步，听他们争谁走得妙","note":"精神+2 · 城心+1","fx":{"mind":2,"cityHeart":1}},{"t":"替执红的大爷支一招，赢了分他半壶茶","note":"城心+2 · 精神+1","fx":{"mind":1,"cityHeart":2}},{"t":"看一眼就走——棋盘上的输赢，不如路走得稳","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"豆花摊","kind":"人情（城心）","text":"街角的**豆花摊**支着白布棚，老板娘舀一勺豆花，浇上卤汁，撒一把葱花，白嫩嫩的一碗。摊前围坐着几个刚下工的人，正就着豆花聊城里的事。","opts":[{"t":"坐下来吃一碗，听他们聊起航前的安排","note":"金钱-2 · 精神+2 · 城心+1","fx":{"mind":2,"money":-2,"cityHeart":1}},{"t":"帮老板娘端几碗，换一句城里的话","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不坐——豆花烫嘴，吃完就赶不上趟了","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"旅店","kind":"人情（城心）","text":"街角的**旅店**亮着灯，招牌上写着「一路平安」，柜台后面挂着一排钥匙牌。掌柜是个胖妇人，正给住客缝掉线的扣子，头也不抬：「打尖还是住店？不住店，喝碗热水也成。」","opts":[{"t":"住一晚，听掌柜讲城里南来北往的客人","note":"金钱-2 · 精神+3 · 城心+1","fx":{"mind":3,"money":-2,"cityHeart":1}},{"t":"喝碗热水，帮掌柜缠一绺线","note":"补给-1 · 城心+2","fx":{"food":-1,"cityHeart":2}},{"t":"不进门——旅店的床留得住歇脚的人，留不住赶路的人","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"豆浆摊","kind":"人情（城心）","text":"街角的**豆浆摊**支着一口大锅，热气白花花地往上冒。摊主一边舀豆浆一边和人搭话：「城里哪条街几点人多、哪家铺子几点关门，听我这儿最准。」","opts":[{"t":"买一碗热豆浆，顺便打听城里的近况","note":"金钱-1 · 精神+1 · 城心+1","fx":{"mind":1,"money":-1,"cityHeart":1}},{"t":"坐下来喝完再走，听摊主讲一早晨的事","note":"精神+2 · 耗时","fx":{"mind":2},"time":1},{"t":"不喝——热豆浆一下肚，人就容易坐下来","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"地下市场","kind":"人情（城心）","text":"下到**下城区的地下市场**，灯笼一盏接一盏，卖旧零件的、补锅的、修表的，挤在一条窄巷里。这里的东西比上面便宜，消息也比上面快。","opts":[{"t":"逛一圈，用铜板换点路上用得上的","note":"金钱-2 · 材料+1 · 城心+1","fx":{"money":-2,"mats":1,"cityHeart":1}},{"t":"听摊主们聊城里最近的事","note":"观测+2 · 城心+1 · 耗时","fx":{"obs":2,"cityHeart":1},"time":1},{"t":"穿过去——地下的东西，少沾","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"轮机舱的旧工牌","kind":"人情（城心）","text":"轮机舱的工具箱上，**别着一块旧工牌**，漆掉了大半，名字还认得出。老值班员说，这牌子的主人去年没换，牌子就一直别在这儿——轮机认得每一个替它出过力的人。","opts":[{"t":"把工牌摆正，擦干净","note":"城心+2 · 精神+1","fx":{"mind":1,"cityHeart":2}},{"t":"问一问老值班员牌子的事","note":"观测+1 · 城心+2 · 耗时","fx":{"obs":1,"cityHeart":2},"time":1},{"t":"不碰——工具箱上的东西，别动","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"下城区的台阶","kind":"人情（城心）","text":"下城区的台阶上，**坐着几个歇脚的老人**，看你背着信使包上来，其中一个招手：「上来坐会儿，喝口热水。」","opts":[{"t":"坐下，喝口水，听他们讲","note":"补给+1 · 精神+2 · 城心+2","fx":{"food":1,"mind":2,"cityHeart":2}},{"t":"帮着把台阶边的杂物清走","note":"城心+2 · 体力-1","fx":{"stam":-1,"cityHeart":2}},{"t":"赶时间，不停","note":"城心-1","fx":{"cityHeart":-1}}]}     ],

    {"title":"理发店","kind":"人情（城心）","text":"街角的**理发店**还亮着灯，老理发师正给一个客人修面，剃刀在灯下闪亮。门口的小黑板写着：「城上城下，都是一刀剪。」——排队的街坊笑作一团。","opts":[{"t":"坐下剪个利索的发型，听街坊唠城里的新鲜事","note":"金钱-3 · 精神+2 · 城心+1","fx":{"mind":2,"money":-3,"cityHeart":1}},{"t":"帮理发师收拾地上的碎发","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不剪——信使的风尘，留着也是故事","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"空轨站","kind":"人情（城心）","text":"老城区尽头的**空轨站**还亮着灯，轨道从站台上方掠过，一节老车厢停在站边，车门开着，像在等人。站长坐在长椅上擦表，见你走近，抬了抬头。","opts":[{"t":"上车坐一站，看看城上城的风景","note":"金钱-3 · 精神+2 · 城心+1","fx":{"mind":2,"money":-3,"cityHeart":1}},{"t":"帮站长擦一会儿站牌，听他讲空轨的历史","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"路过——轨道再长，也不是你的归途","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"码头灯","kind":"人情（城心）","text":"老码头边，**一盏孤零零的航标灯**还亮着，红一下，白一下，照着一段废弃的栈桥。看灯的老人坐在灯下补网，抬头见你：「城要走了，这灯是最后几盏了。」","opts":[{"t":"坐下来，听老人讲这座码头送走过多少船","note":"精神+2 · 城心+2","fx":{"mind":2,"cityHeart":2}},{"t":"帮老人换一截灯芯，让灯再亮久一点","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"看一眼就走——灯会熄，城会走，路在脚下","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"卖艺人","kind":"人情（城心）","text":"广场的台阶下，**一个卖艺人**正顶着一摞碗走圈，走几步，碗在头顶颤一颤，看客就跟着吸一口气。他稳稳站定，摘碗鞠躬，铜板雨点似的落进帽子里。","opts":[{"t":"丢一枚铜板，听他说一路闯码头的旧事","note":"金钱-1 · 精神+2 · 城心+1","fx":{"mind":2,"money":-1,"cityHeart":1}},{"t":"帮他把碗摞回去，换一句城里的老话","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不驻足——他耍他的碗，你赶你的路","note":"城心-1","fx":{"cityHeart":-1}}]},
    {"title":"杂货铺","kind":"人情（城心）","text":"巷子深处，**一家杂货铺**的柜台后堆着针头线脑、油盐酱醋，玻璃柜里摆着各色纽扣和顶针。老板娘正给一个孩子称糖球，称完又抓了一把添进去。","opts":[{"t":"买一小包糖球，听老板娘说铺子传了三代","note":"金钱-2 · 精神+2 · 城心+1","fx":{"mind":2,"money":-2,"cityHeart":1}},{"t":"帮她把货架上的罐子擦一遍，换一句城里的话","note":"城心+3 · 体力-2","fx":{"stam":-2,"cityHeart":3}},{"t":"不买——铺子再老，起航时也带不走柜台","note":"城心-1","fx":{"cityHeart":-1}}]},

    {"title":"锡匠铺","kind":"人情（城心）","text":"街边的**锡匠铺**里，老锡匠坐在矮凳上，把一块锡料敲得叮当响，脚边堆着做好的锡壶锡碗。见你停在门口，他抬了抬眼皮：「过路的？要修什么，坐下说。」","opts":[{"t":"请他给水壶补个漏，等的时候听他讲这门手艺","note":"金钱-1 · 补给+1 · 城心+1 · 耗时","fx":{"food":1,"money":-1,"cityHeart":1},"time":1},{"t":"买一只小锡碗，路上舀水用","note":"金钱-1 · 补给+1","fx":{"food":1,"money":-1}},{"t":"不进门——锡器易冷，跟这城里的交情一样","note":"城心-1","fx":{"cityHeart":-1}}]},

    {"title":"盐壳下的脚印","kind":"危险/探索","text":"盐壳上，**一串脚印一直延伸到湖心**，到了中间就断了——像是有人走进了盐壳底下，再没上来。脚印旁的盐面，还留着半只踩裂的鞋印。","opts":[{"t":"沿着脚印小心探到湖心","note":"观测+2 · 体力-3","fx":{"stam":-3,"obs":2}},{"t":"远远绕开，只记下位置","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"不看——盐壳上的东西，别去追","note":"精神-2","fx":{"mind":-2}}]},
    {"title":"沙暴过后的铜壶","kind":"探索/补给","text":"沙暴过后，**沙地里露出半个铜壶**——壶嘴被沙子磨得发亮，壶里还有半壶水，用蜡封着口。壶底刻着一个商队的记号。","opts":[{"t":"打开蜡封，喝一口","note":"饮水+5 · 精神+1","fx":{"water":5,"mind":1}},{"t":"把铜壶收起来，以后用","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"把壶留在原地，记个位置","note":"观测+1 · 名声+1","fx":{"obs":1,"fame":1}}]},
    {"title":"盐沼的浮壳","kind":"生态/探索","text":"盐沼上，**一片片白壳浮在卤水上面**，壳下是深不见底的黑泥。远处的水鸟站在壳上，一步一颤——这地方，踩错一步就陷下去。","opts":[{"t":"踩着硬壳，小心过","note":"体力-3 · 观测+1","fx":{"stam":-3,"obs":1}},{"t":"沿沼泽边走，绕过去","note":"体力-2 · 观测+1","fx":{"stam":-2,"obs":1}},{"t":"不看——浮壳下面的东西，别惹","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"盐沼的盐花","kind":"地形/观察","text":"盐沼边，**白花花的盐花**结在硬壳上，像霜。舔一点，又苦又涩——这地方的盐，比沙还多。","opts":[{"t":"刮一点盐花收好","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"记下盐花的位置，做标记","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"不刮——盐花是沼泽的，别乱拿","note":"精神-1","fx":{"mind":-1}}]}     ],

    {"title":"雨后蘑菇","kind":"植物/补给","text":"一场少见的雨刚停，峡谷的岩缝里**冒出一圈蘑菇**，伞盖水灵灵的，在燥热的空气里格外显眼。雨在萨尔贡是稀罕事，蘑菇更是。","opts":[{"t":"采几朵，先掰开闻一闻能不能吃","note":"补给+3 · 体力-2","fx":{"stam":-2,"food":3}},{"t":"只采一朵，收作样本带回去鉴定","note":"材料+1 · 观测+1","fx":{"obs":1,"mats":1}},{"t":"不碰——雨后的蘑菇，越鲜艳越要当心","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"肉苁蓉","kind":"植物/采集","text":"梭梭根边的沙地上，**一株肉苁蓉**拱出沙面，顶着肥厚的茎，通体黄褐色，埋在沙里的部分比露出来的还长。这是沙漠里难得的药材，也是抢手货。","opts":[{"t":"小心挖出来，收作药材","note":"材料+2 · 补给+1 · 体力-3","fx":{"stam":-3,"food":1,"mats":2}},{"t":"只记下位置，等回程再来挖","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"不挖——药材值钱，挖了它，这一窝梭梭也活不久","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"沙蟒","kind":"生态/危机","text":"干河谷的阴影里，**一条沙蟒**盘在石头上，鳞片黄褐相间，足有人小腿粗。它缓缓抬起头，吐了吐信子，又慢慢伏下去——像是在晒太阳，又像是在等什么。","opts":[{"t":"屏住呼吸，绕开它盘着的那片石头","note":"体力-3 · 精神-2","fx":{"stam":-3,"mind":-2}},{"t":"记下它的位置，往后绕远路","note":"观测+1 · 体力-2","fx":{"stam":-2,"obs":1}},{"t":"不惹它——沙蟒饿着的时候，谁都是它的猎物","note":"精神-2","fx":{"mind":-2}}]},
    {"title":"黑曜石","kind":"矿物/探索","text":"干涸的河谷里，**一片黑曜石**露出沙面，断面闪着玻璃一样的光，边缘薄得像刀。有人捡过，砸过，留下几片碎碴——黑曜石打出的刃口，比铁还利。","opts":[{"t":"挑一片边缘整齐的，收进包里备用","note":"材料+2 · 体力-1","fx":{"stam":-1,"mats":2}},{"t":"记住这片黑曜石的位置，标进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不碰——黑得发亮的东西，往往也割手","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"龙葵","kind":"生态/采集","text":"干河沟的背阴处，**一丛龙葵**结着黑紫的浆果，果子一串串坠着，捏一下，汁水染了一手。龙葵果熟的能吃，青的不能碰——这一丛，一半熟一半青。","opts":[{"t":"挑熟透的摘一把，路上解渴","note":"补给+2 · 体力-1","fx":{"stam":-1,"food":2}},{"t":"记住这丛龙葵的位置，标进路图","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"不摘——青的熟的挤在一处，手一急就容易摘错","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"水泽","kind":"生态/补给","text":"沙原边缘凹下一片**水泽**，水不深，映着天光，泽边踩出一圈圈脚印，深浅不一。这地方是附近村子取水的地方——也是渴极的野兽守猎的地方。","opts":[{"t":"打满水袋，快步离开","note":"补给+2 · 体力-1","fx":{"stam":-1,"food":2}},{"t":"躲起来观察一会儿，看脚印是人的还是兽的","note":"观测+2 · 精神+1 · 耗时","fx":{"mind":1,"obs":2},"time":1},{"t":"不靠近——水泽边的安静，比沙暴还让人不踏实","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"峡谷间的回声","kind":"环境/生存","text":"走在窄窄的**峡谷**里，脚下的石子一踢，声音就在两壁之间来回撞，越撞越远，最后化成一丝嗡鸣。你喊一声，回声却比你晚了好几拍才回来——这谷比看上去深得多。","opts":[{"t":"停住听回声的方向，判断谷的纵深","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"贴着壁走，把脚步放轻","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"不管回声，径直穿过去","note":"体力-2","fx":{"stam":-2}}]},
    {"title":"峭壁上的隼巢","kind":"生态/观察","text":"峡谷的**峭壁半腰，有一个隼巢**，两只小隼探出头，被亲隼按回去。谷里的人抬头看了一眼就低头走——这巢在这，几十年了。","opts":[{"t":"停下来，看一会儿小隼","note":"精神+2 · 观测+1","fx":{"mind":2,"obs":1}},{"t":"在路图上标下这个巢的位置","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"不看——谷里抬头，不如低头走","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"峡谷的回声","kind":"地形/观察","text":"峡谷里，**你说一句话，回声一层一层弹回来**，像谷里有很多人在应你。风一过，回声里混进了别的声音——听不清是人，还是石。","opts":[{"t":"站在谷中，再喊一声","note":"精神+1 · 体力-1","fx":{"stam":-1,"mind":1}},{"t":"贴着谷壁走，尽快穿出去","note":"体力-2 · 观测+1","fx":{"stam":-2,"obs":1}},{"t":"不喊——谷里的回声，别应","note":"精神-1","fx":{"mind":-1}}]}     ],

    {"title":"毒蝎","kind":"危险/生存","text":"你刚翻过一块碎石坡，**一只黑亮的毒蝎**竖着尾针从石缝里钻出来，正挡在你取水的必经之路上。","opts":[{"t":"用靴跟碾过去，给它个痛快","note":"体力-3 · 补给+1","fx":{"stam":-3,"food":1}},{"t":"绕开它，多走一段路","note":"体力-4 · 耗时","fx":{"stam":-4},"time":1},{"t":"蹲下来观察它的行动规律","note":"观测+2 · 精神-1","fx":{"mind":-1,"obs":2}}]},

    {"title":"蜥蜴蛋","kind":"生态/补给","text":"石缝里埋着一窝**蜥蜴蛋**，蛋壳薄得透光，能看见里面蜷着的小蜥蜴影子。母蜥蜴不在附近，大概是被你脚步声惊走了。","opts":[{"t":"捡两颗蛋，烤了吃","note":"补给+3 · 精神-1","fx":{"food":3,"mind":-1}},{"t":"拍张照记进观测笔记，别动它们","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"加快脚步离开，别让母蜥蜴回来找不到窝","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"旱龟","kind":"生态/补给","text":"一块晒得滚烫的岩石上，**一只旱龟**正一动不动地趴着，龟壳上落着细沙。它见你走近，慢慢缩回脑袋，却连挪都没挪一下。","opts":[{"t":"捉住它，烤一锅龟汤","note":"补给+5 · 精神-2","fx":{"food":5,"mind":-2}},{"t":"用刀背敲敲龟壳，听它结实不结实","note":"补给+3 · 体力-2","fx":{"stam":-2,"food":3}},{"t":"绕过它——晒着太阳的老家伙，就别惊动了","note":"精神+1","fx":{"mind":1}}]},
    {"title":"沙丘龟","kind":"生态/观测","text":"砾石坡上，**一只沙丘龟**正慢慢刨沙，把蛋埋进坑里。它见你走近，停下动作，伸长脖子盯着你看了好一会儿，又低下头继续刨。","opts":[{"t":"蹲远一点，看它把蛋埋完","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"记下巢的位置，画进观测笔记","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"绕开——它刨它的坑，你走你的路","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"砾石滩","kind":"探索/补给","text":"一条干涸的河床铺满**砾石**，大大小小，被晒得滚烫。石缝间偶尔露出几片瓷器的碎片，像是旧商队摔碎的家当。","opts":[{"t":"翻一翻砾石，找有用的铁器和碎片","note":"补给+3 · 材料+1 · 体力-3","fx":{"stam":-3,"food":3,"mats":1}},{"t":"挑几片花纹好看的瓷片，收作样品","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"走河床上沿，不踩石头","note":"体力-2","fx":{"stam":-2}}]},
    {"title":"沙鼠","kind":"生态/观测","text":"石堆下，**一只沙鼠**探出头，胡须一颤一颤，抱着一颗干瘪的种子啃得正香。它看见你，也不躲，只把种子换了个方向，继续啃。","opts":[{"t":"蹲下来看它藏粮的动作","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"丢一小块干粮过去，看它收不收","note":"补给-1 · 观测+1","fx":{"food":-1,"obs":1}},{"t":"不逗它——沙鼠攒的粮，是拿命换的","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"梭梭树","kind":"植物/生存","text":"砾石滩上立着几棵**梭梭树**，树皮皴裂，枝干却硬挺，顶着一点稀稀拉拉的绿。树根周围的沙土鼓起，是它们把流沙钉住的地方。","opts":[{"t":"折几根干枝，收作引火的好柴","note":"引火物+1 · 体力-2","fx":{"stam":-2,"tinder":1}},{"t":"挖一棵幼苗，带回去试着种","note":"材料+1 · 体力-3","fx":{"stam":-3,"mats":1}},{"t":"不折——梭梭树钉着这片沙，折了沙就活了","note":"精神+1","fx":{"mind":1}}]},

    {"title":"砾石滩的陶窑","kind":"人文/补给","text":"砾石滩背风处，**一座旧陶窑**还留着火膛的余温。窑口堆着刚出窑的粗陶，窑主不在——可陶还热着，人没走远。","opts":[{"t":"挑一只结实的水罐带上","note":"补给+2 · 材料-1 · 城心+1","fx":{"food":2,"mats":-1,"cityHeart":1}},{"t":"在窑口留个信物，等窑主回来","note":"城心+2 · 名声+1 · 耗时","fx":{"cityHeart":2,"fame":1},"time":1},{"t":"不碰——热窑的东西，别乱拿","note":"精神-1","fx":{"mind":-1}}]},

    {"title":"石磨","kind":"人性/补给","text":"绿洲村口的空地上，**一盘石磨**立着，磨盘上落着细沙，但磨眼周围有一圈新磨过的痕迹。旁边搭着个凉棚，棚下搁着半袋没碾完的谷子。","opts":[{"t":"帮着把谷子碾完，换一碗热粥","note":"补给+3 · 体力-4","fx":{"stam":-4,"food":3}},{"t":"只取一把谷子，路上自己想办法","note":"补给+2 · 体力-1","fx":{"stam":-1,"food":2}},{"t":"不碰——人家的磨，碾的是人家的日子","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"沙鹤","kind":"生态/观测","text":"绿洲的水洼边，**两只沙鹤**正低头喝水，长腿立在浅水里，影子被晚霞拉得长长的。它们喝完水，振翅飞起，在绿洲上空绕了一圈才落回原处。","opts":[{"t":"蹲下来，看它们落地的路径","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"照沙鹤飞的方向，判断下一个水点的位置","note":"观测+1 · 材料+1","fx":{"obs":1,"mats":1}},{"t":"不惊它们——沙鹤认的水，比地图上的准","note":"精神+1","fx":{"mind":1}}]},
    {"title":"沙蚤","kind":"卫生/生存","text":"夜里歇脚，天亮时**小腿上多了几个沙蚤咬的红点**，又痒又肿。沙蚤不致命，可在这片沙地里，小伤口能拖成大麻烦。","opts":[{"t":"用火烤过的针挑破脓包，上一点药","note":"体力-2 · 补给-1","fx":{"stam":-2,"food":-1}},{"t":"把裤脚扎紧，检查睡处周围","note":"补给-1 · 精神+1","fx":{"food":-1,"mind":1}},{"t":"不管它——痒一阵就过去了","note":"精神-2","fx":{"mind":-2}}]},
    {"title":"绿洲的水井","kind":"生存/人文","text":"绿洲中央，**一口老石井**砌着半人高的石沿，绳痕一道压着一道。打水的人排着队，谁也不催——在这片沙上，井水比什么都金贵。","opts":[{"t":"排队打满水袋","note":"补给+2 · 体力-1","fx":{"stam":-1,"food":2}},{"t":"帮老人摇辘轳，换一句绿洲的老话","note":"城心+2 · 体力-2 · 精神+1","fx":{"stam":-2,"mind":1,"cityHeart":2}},{"t":"不碰——井水是绿洲的，别喝白了","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"绿洲的废弃灌溉渠","kind":"地形/观察","text":"绿洲边，**一条废弃的灌溉渠**干在沙里，渠壁上还留着水线。早年这渠引过井水，现在水线越来越低——绿洲也在缩。","opts":[{"t":"沿渠走，看渠通向哪里","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"把渠口清一清，引一点水进渠","note":"城心+1 · 体力-2","fx":{"stam":-2,"cityHeart":1}},{"t":"不看——干渠的水，回不来了","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"峡谷里的风","kind":"地形/观察","text":"绿洲边上，**风从峡谷方向灌过来**，带着干热的沙和远处石粒相撞的细响。风里夹着一股味道——不是绿洲的湿气，是更深、更荒的那种。","opts":[{"t":"迎风走一段，看风从哪来","note":"观测+2 · 体力-1","fx":{"stam":-1,"obs":2}},{"t":"在绿洲背风处扎营","note":"补给-1 · 体温+1 · 精神+1","fx":{"food":-1,"temp":1,"mind":1}},{"t":"不迎风——峡谷的风，引着人往回走","note":"精神-1","fx":{"mind":-1}}]}     ],

    {"title":"星砂","kind":"环境/探索","text":"入夜后，一片风化的岩台上，**细砂泛着幽蓝的光**，像把星星碾碎了撒在地上。你伸手一拢，光点顺着指缝流下来——是某种发光的矿物碎屑。","opts":[{"t":"装一小袋星砂，带回去研究","note":"材料+2 · 观测+1","fx":{"obs":1,"mats":2}},{"t":"坐下来看一会儿，记下位置","note":"观测+2 · 精神+2","fx":{"mind":2,"obs":2}},{"t":"别碰——会发光的东西，往往也有毒","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"变色龙","kind":"生态/观察","text":"你盯着面前一截枯枝看了半天，才发觉那不是枯枝——**一只变色龙**正趴在枝头，体色和树皮严丝合缝，只有眼珠缓慢地转了转。","opts":[{"t":"蹲下来观察它变换体色","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"试着用手指引它换色","note":"观测+1 · 体力-1","fx":{"stam":-1,"obs":1}},{"t":"别打扰它——藏得越深的东西，越有自己的道理","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"沙漠玫瑰","kind":"探索/补给","text":"干涸的河床上，**一朵石质的花朵**半埋着，花瓣层层叠叠，像真的玫瑰，却是盐和砂结晶成的。晨光一照，边缘泛着粉色的光。","opts":[{"t":"挖出来，收作样品","note":"材料+1 · 观测+1 · 体力-2","fx":{"stam":-2,"obs":1,"mats":1}},{"t":"掰下一片花瓣，尝了尝咸淡","note":"补给+1 · 体力-1","fx":{"stam":-1,"food":1}},{"t":"只看不碰——石头开的花，碰了就不美了","note":"精神+1","fx":{"mind":1}}]},
    {"title":"沙泉","kind":"水源/生存","text":"台地的背阴面，**一眼沙泉**从岩缝里渗出来，汇成一线细流，流过沙面又消失不见。泉眼边围着几圈动物脚印，深深浅浅，都是来喝水的。","opts":[{"t":"蹲下来，灌满水壶","note":"补给+3 · 体力-2","fx":{"stam":-2,"food":3}},{"t":"照脚印认一认都有什么动物来过","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"不惊动泉眼——这口泉，动物们先排的队","note":"精神+1","fx":{"mind":1}}]},
    {"title":"蜈蚣","kind":"生态/生存","text":"翻石头时，**一条沙蜈蚣**从石底窜出来，足有半尺长，通体发红，一圈圈的足在沙面上飞快地爬。它钻进石缝，又回头朝你扬了扬头，才彻底消失。","opts":[{"t":"记住它钻的方向，绕开那片石堆","note":"观测+2 · 体力-2","fx":{"stam":-2,"obs":2}},{"t":"把它翻出来，收作药材","note":"材料+1 · 精神-2","fx":{"mind":-2,"mats":1}},{"t":"不惹它——蜈蚣的牙，咬一口够你疼半天","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"沙葱","kind":"植物/采集","text":"台地裂缝里，**一丛沙葱**顶着细长的绿叶，在风里轻轻晃。沙葱耐旱，掐一把就有葱味，是沙漠里提味的好东西，也是赶路人解腻的宝贝。","opts":[{"t":"掐一把沙葱，收进干粮袋","note":"补给+2 · 体力-2","fx":{"stam":-2,"food":2}},{"t":"连根挖几株，找个地方种下","note":"材料+1 · 体力-2","fx":{"stam":-2,"mats":1}},{"t":"不掐——沙葱一茬就这点，留给下一拨赶路的","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"鬣狗","kind":"威胁/生存","text":"沙丘背后，**三只鬣狗**弓着背慢慢逼近，塌着腰，咧着嘴，涎水挂在牙上。它们不急着扑，只绕着圈子，等着你露出破绽。","opts":[{"t":"捡起石块砸过去，逼它们退开","note":"体力-3 · 精神-2","fx":{"stam":-3,"mind":-2}},{"t":"举着火把慢慢后退，退到开阔地","note":"补给-1 · 体力-2","fx":{"stam":-2,"food":-1}},{"t":"原地不动，和它们对峙","note":"观测+1 · 体力-2 · 精神-3","fx":{"stam":-2,"mind":-3,"obs":1}}]},

    {"title":"沙漠绿洲边的旧芦苇丛","kind":"观察/自然","text":"绿洲边，**一片旧芦苇丛**——芦苇长得比人还高，芦花白花花的一片，风一吹沙沙响。老信使用手拨开芦苇看了看根：「芦苇。」他指了指芦苇根，「有芦苇的地方，水就在地下浅浅的。」他指了指芦苇丛边的小水洼，「芦苇根把水吸上来。人也能喝。」他绕开芦苇丛，「芦苇里有蛇。别钻进去。」","opts":[{"t":"也看看根","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在芦苇丛边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠沙丘上的旧沙丘滑落面","kind":"观察/自然","text":"沙丘背风坡，**一个旧沙丘滑落面**——坡面光滑，上面留着一道道沙滑落的痕迹，坡脚下堆着新滑下来的沙。老信使用脚踢了踢坡脚的沙：「滑落面。」他指了指滑面，「沙丘迎风坡缓。背风坡陡。沙被风吹到坡顶，坡太陡，沙就滑下来。」他绕开滑落面，「别在滑落面下面站着。上面沙滑下来，人就被埋。」他指了指沙丘的脊线，「走沙丘走脊线。别爬坡面。」","opts":[{"t":"绕到脊线上走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在沙丘背风处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠戈壁上的旧兽骨化石","kind":"观察/人文","text":"戈壁上，**几块旧兽骨化石**——骨头已经半石化了，白花花的，半埋在沙里。老信使用手捡起一块骨头看了看：「化石。」他指了指骨头上的纹路，「几万年前，这地方有湖。湖边有动物。动物死了，骨头埋在沙里。慢慢就变成石头。」他把骨头放回去，「现在湖干了，沙吹走了，骨头就露出来。」","opts":[{"t":"也捡起一块看","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在化石边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠戈壁上的旧风棱石","kind":"观察/自然","text":"戈壁滩上，**几块旧风棱石**——石头有好几个磨光的面，面与面之间是锋利的棱。老信使用手捡起一块风棱石看了看：「风棱石。」他指了指石头上平的面，「风带着沙，长年吹石头。把石头的几个面磨平。」他把石头放回去，「石头有几个面，就说明这地方刮过几个方向的风。」他指了指棱的方向，「棱尖朝哪边，风就是常年往哪边吹。」","opts":[{"t":"也捡起一块看","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在风棱石边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠山脚下的旧冲洪积扇","kind":"观察/自然","text":"山脚下，**一个旧冲洪积扇**——从山口往外，石头从大到小铺开成扇形，扇面上有几条旧干沟。老信使用脚踢了踢扇根的大石头：「冲洪积扇。」他指了指山口方向，「下雨的时候，山洪从山口冲出来。石头泥沙全带出来。出了山口，坡一缓，东西就铺开。」他指了指扇缘方向，「扇根石头大。扇缘泥沙细。水在扇缘冒出来，就成绿洲。」","opts":[{"t":"沿扇缘走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在冲洪积扇上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠沙丘间的旧干盐湖床","kind":"观察/自然","text":"沙丘中间，**一片旧干盐湖床**——床底平得像石板，上面裂成一块块多边形泥皮，泥皮翘着边。老信使用脚踩了踩泥皮，泥皮嘎巴一声裂了：「干盐湖。」他指了指泥皮上的裂纹，「以前是个湖。水干了。泥裂了。」他绕开裂得厉害的地方，「别看地平。泥皮下面是软泥。踩塌了陷脚。」他指了指远处沙丘上的白印，「下一个湖在那边。」","opts":[{"t":"绕着盐床走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在干盐床边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠戈壁上的旧玛瑙石","kind":"观察/自然","text":"戈壁碎石滩上，**几颗旧玛瑙石**——半透明的小石头，颜色是红的黄的，被风沙磨得溜圆。老信使用手捡起一颗玛瑙对着光照了照：「戈壁玛瑙。」他指了指石头的颜色，「风沙磨了几千年，磨成这样。」他把玛瑙放回去，「别拿。戈壁上的石头，看可以。带走就不好了。」他踢了踢脚边的碎石，「玛瑙就在这长着。」","opts":[{"t":"也捡起一颗看","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在碎石滩边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠盐湖边的旧盐壳","kind":"观察/自然","text":"盐湖边，**一片旧盐壳**——地面白花花的，盐壳厚的地方能站住人，薄的地方一踩就破。老信使用脚敲了敲盐壳：「盐湖。」他指了指盐壳下面的黑泥，「水是咸的。蒸发了，盐留下。」他绕开盐壳薄的地方，「别走薄地方。一踩破，脚就陷进盐水泥里。」他指了指远处的湖面，「湖在那边。水是咸的，不能喝。」","opts":[{"t":"绕着盐壳走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在盐壳厚处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠胡杨林里的旧胡杨枯木","kind":"观察/自然","text":"胡杨林里，**一棵旧胡杨枯木**——树已经死了，树干发白，枝桠光秃秃地指着天，但树根还扎在沙里。老信使用手摸了摸树干上的裂纹：「胡杨死了。」他指了指树干上的旧刀口，「死了也不倒。在这站着。」他绕着枯树走了半圈，「胡杨活着一千年，死了站一千年，倒了烂一千年。」","opts":[{"t":"在枯树下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看树干","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠沙丘背风面的旧沙波纹","kind":"观察/自然","text":"沙丘背风坡上，**一层层旧沙波纹**——沙面被风吹出均匀的纹路，像水波纹一样。老信使用手沿着沙波纹摸了摸：「沙波纹。」他指了指波纹的方向，「风一吹，沙就排成这样。」他蹲下来看了看，「波纹朝哪边斜，风就是从那边吹过来的。」他站起来拍了拍手上的沙，「看波纹就知道风向。」","opts":[{"t":"也看沙波纹","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在背风坡歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠绿洲边的旧坎儿井井口","kind":"观察/人文","text":"绿洲边，**一个旧坎儿井井口**——井口是圆的，用石头砌了一圈，井里黑黢黢的。老信使用手趴在井口往下看：「坎儿井。」他指了指井壁上的脚窝，「从这儿下去。井底有暗渠。水从暗渠流到绿洲。」他往井里扔了一颗小石子，过了很久才听见水声，「井深。水是地下的。」","opts":[{"t":"也往井里看","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在绿洲边歇脚","note":"体力+1 · 水分+1","fx":{"stam":1,"water":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠岩画点上的旧岩画","kind":"观察/人文","text":"一面朝东南的石壁上，**一组旧岩画**——刻着骆驼、羊和骑马的人，线条简单，被风沙磨得有些模糊。老信使用手抹了抹岩画上的沙：「古人刻的。」他指了指画里的骆驼，「几千年前，这儿人骑着骆驼，赶着羊。」他绕到石壁另一边，「现在没人了。就画还在。」","opts":[{"t":"仔细看岩画","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在石壁阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠戈壁滩上的旧风蚀蘑菇石","kind":"观察/自然","text":"戈壁滩上，**一块旧风蚀蘑菇石**——下面是细细的石柄，上面是一个大圆石，像蘑菇一样。老信使用手推了推石帽，石帽纹丝不动：「风蚀蘑菇。」他指了指下面细细的石柄，「下面软，上面硬。风把软的掏了。硬的留下。」他绕到石柄下面，「别站蘑菇下面。不知道哪天它就倒了。」","opts":[{"t":"在蘑菇石阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看石柄","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠胡杨树下的旧胡杨泪","kind":"观察/自然","text":"胡杨树皮上，**一滴滴旧胡杨泪**——黄褐色的胶块，凝在树皮裂纹处，硬硬的。老信使用手抠下一块捏了捏：「胡杨泪。」他指了指树皮裂纹，「树受伤了，就流出这个。干了，就结在树上。」他把胶块放在鼻尖闻了闻，「以前人用它做胶。粘东西。」他把胶块放回去，「别抠太多。树会疼。」","opts":[{"t":"也闻闻胡杨泪","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在胡杨树下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,

    {"title":"沙漠砾石戈壁的旧戈壁漆","kind":"观察/自然","text":"戈壁石滩上，**石头表面一层旧戈壁漆**——黑褐色的一层，像在石头表面镀了一层釉。老信使用手刮了刮石面，戈壁漆刮不掉：「戈壁漆。」他指了指石面的光泽，「几百年风吹日晒，石头表面就长出这层黑壳。」他把石头翻过来，背面没有漆，「向阳的一面才有。几百年才长这么一层。」","opts":[{"t":"在石滩上歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看戈壁漆","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠沙丘间的旧新月形沙丘","kind":"观察/自然","text":"沙漠里，**一座旧新月形沙丘**——沙丘迎风坡缓，背风坡陡，两头伸出两个尖角，像一弯月牙。老信使用脚踢了踢沙脊：「新月形沙丘。」他指了指迎风坡上的沙纹，「风从这边吹。沙被吹到脊上，从背风坡滑下来。沙丘就慢慢往前移。」他沿着沙脊走了两步，「一年移几米。几百年，能移一座山的距离。」","opts":[{"t":"爬上沙丘顶","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在沙丘背风处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠绿洲里的旧老桑树下","kind":"观察/人文","text":"绿洲中央，**一棵旧老桑树**——树干要两个人合抱，树荫盖了半个晒谷场。老信使用手摸了摸粗糙的树皮：「这树比绿洲还老。」他指了指树下的石墩，「以前村里人在这儿歇凉。乘凉，吃饭，聊天。」他在石墩上坐下来，「桑树耐旱。根扎到地下水。绿洲有了，人就来了。先有树，后有村。」","opts":[{"t":"在树荫下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看树干纹理","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠胡杨林里的旧枯胡杨","kind":"观察/自然","text":"胡杨林里，**一棵旧枯胡杨**——树干空了一半，树皮裂成条状，枝桠光秃秃地伸向天空。老信使用手敲了敲树干，声音是空的：「胡杨活着一千年，死了站着一千年。」他指了指树根周围新长的小胡杨苗，「这棵死了。根还活着。旁边小苗是它根上发出来的。」他绕到树后，树干上有一个被风沙磨出的光滑面，「风把它磨了几十年。」","opts":[{"t":"在枯树下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看树皮裂纹","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠山脚下的旧骆驼刺灌丛","kind":"观察/自然","text":"山脚下，**一丛丛旧骆驼刺**——刺棵矮矮地贴着地面长，根部扎得很深，叶子小而厚。老信使用手拨开一丛骆驼刺看了看根部：「骆驼刺是沙漠的命。」他指了指刺丛周围一圈无沙的平地，「根深，能扎到地下十几米找水。别的植物活不了，它能活。」他把刺枝放回去，「骆驼吃它的叶子。别的草都枯了，它还绿着。」","opts":[{"t":"在刺丛阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看根系","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠古城外的旧土城墙残段","kind":"观察/遗迹","text":"沙漠边缘，**一段旧夯土城墙残段**——高约三米，厚两米，墙面上还有当初夯土时木板留下的横纹。老信使用手摸了摸墙面，土是硬的：「以前的城墙。」他指了指残段尽头被沙埋住的部分，「全城有多大，埋在沙下面了。露出来的这一段，还是风把沙吹走才露出来的。」他沿着墙根走了两步，「几百年前这里有人住。沙一来，城就扔了。」","opts":[{"t":"爬上残墙看风景","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在墙根阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠绿洲外的旧坎儿井暗渠口","kind":"观察/人工","text":"绿洲外戈壁上，**一口旧竖井**——井壁是石头砌的，井口盖着木板，揭开盖板下面是黑的。老信使用手把盖板压回去：「坎儿井。」他指了指戈壁上一排间距整齐的竖井，「雪水从山里渗到地下。人挖暗渠把水引出来。这一排竖井，就是暗渠的通风口。」他沿着竖井点走了几步，「暗渠在地下几十米。水在渠里流，晒不到太阳，不蒸发。」","opts":[{"t":"往井里看一眼","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在井口边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙漠边缘的旧烽燧遗址","kind":"观察/遗迹","text":"沙漠边缘，**一座旧夯土烽燧遗址**——方方的土台，顶部塌了半边，墙上还有烟熏的黑印。老信使用手敲了敲夯土墙：「以前的烽火台。」他指了指墙顶的残垣，「有敌来，台上点狼烟。烟一起，下一个台就看见，接着点。一路传到城里。」他站在台基上朝远处看，「站在这儿能看几十里。烽燧都修在高处。」","opts":[{"t":"爬上残台看风景","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在台基阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"沙暴过后的旧骆驼刺","kind":"观察/自然","text":"沙暴过后，**一丛丛旧骆驼刺**——枝上挂满了细沙，枝条被风吹得朝一个方向歪。老信使用手把枝上的沙拍掉：「骆驼刺是沙里最硬的草。」他折了一根枝条，枝条刺手，「别的草在沙里活不过一年。骆驼刺能活几十年。根扎十几米深，找地下水。」他把枝条扔回沙里，「骆驼全靠它。没骆驼刺，沙里就没有骆驼。」","opts":[{"t":"在骆驼刺边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看根系","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"棕榈树下的旧石水槽","kind":"观察/人工","text":"棕榈树下，**一条旧石头凿的水槽**——槽里还留着半槽清水，水面上浮着落叶。绿洲老把水槽边的落叶捞出来：「水从渠里引过来，流进槽里。」他指了指水槽的出口，「人喝的，牲口也喝的。先给人喝，再给羊喝。」他舀了一瓢水喝了一口，「石头水槽不晒热。太阳晒一天，槽里的水还是凉的。」","opts":[{"t":"喝一瓢水","note":"饮水+1 · 精神+1","fx":{"water":1,"mind":1}},{"t":"在水槽边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"绿洲外的旧篱笆","kind":"观察/人工","text":"绿洲边，**一圈旧红柳枝扎的篱笆**——柳条上还挂着干枯的叶子。绿洲老农把一根歪了的柳桩扶正：「篱笆挡羊。」他把柳条往泥里踩了踩，「羊进来，一口把庄稼啃光。扎一圈篱笆，羊进不来。」他指了指篱笆上的绑绳，「每年都要修一次。风一吹，柳条就松。」","opts":[{"t":"帮他扶篱笆","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"在篱笆边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"干河谷里的旧水磨遗迹","kind":"观察/人文","text":"干河谷里，**一座旧石头砌的水磨房**——轮子早没了，只剩一个石槽和一根木轴。老信使用手转了转石轴，轴锈住了转不动：「以前靠水磨面。」他指了指石槽，「山上的水引下来，冲轮子转。轮子转，磨盘就动。」他蹲下来摸了摸磨盘上的纹路，「河水干了，水磨就停了。一村人都搬走了。」","opts":[{"t":"在水磨房阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看磨盘纹路","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"黑沙沙漠里的旧商队营地遗址","kind":"观察/人文","text":"黑沙漠里，**一圈旧石头摆成的营地圈**——石头围成圆圈，中间是火塘。老信使用脚把一块石头挪了挪：「以前商队就在这儿扎营。」他蹲在火塘边看了看，「一圈石头挡风，中间生火。晚上骆驼拴在圈外面。」他指了指圈外被踩平的沙地，「几百头骆驼，一夜把周围沙都踩实。」","opts":[{"t":"在石圈里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"在火塘边生火","note":"材料-1 · 体温+1","fx":{"mats":-1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"盐沼边的旧盐砖","kind":"观察/人文","text":"盐沼边，**几块压成方块的旧盐砖**——砖上压着商队的印记。老信使用手拿起一块盐砖舔了舔，咸得皱眉：「商队用盐砖当钱。」他把盐砖放回去，「以前没有纸币，一块盐砖换一头羊。盐在这儿比金子贵。」他指了指盐砖上的绳印，「用绳子捆着，驮在骆驼两边。一块一块码整齐。」","opts":[{"t":"绕开盐沼走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在盐砖边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"绿洲外的旧驼铃","kind":"观察/人文","text":"绿洲外的木桩上，**挂着一个旧铜驼铃**——铃身被绳子磨出了沟，铃舌还在。老信使取下驼铃摇了摇，铃声哑哑的：「以前商队挂在驼脖子上。」他把驼铃挂回木桩，「驼队走远了，听铃声就知道往哪边走。风大的时候铃声听不见。」他指了指木桩上的刀痕，「商队在这儿歇脚。在木桩上刻一道，记一笔。」","opts":[{"t":"把驼铃挂回原位","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"听驼铃响","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"黑沙漠边缘的旧玄武岩块","kind":"观察/自然","text":"黑沙漠边缘，**一堆旧黑色玄武岩块**——石头黑得发亮，棱角被沙磨圆了。老信使用脚踢了踢石块：「火山喷出来的。」他捡起一块石头看了看断面，「石头里有气泡。岩浆喷出来，气泡没跑掉，冻在石头里。」他把石头放回地上，「这种石头吸热。太阳一晒，石头烫得能煎蛋。别光脚踩。」","opts":[{"t":"绕开石块走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}},{"t":"在石块阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"老绿洲旁的旧废弃水井","kind":"观察/人文","text":"老绿洲边上，**一口旧石砌废弃水井**——井栏塌了一半，井里干得见底。老信使蹲在井边往下看了看：「以前人从这儿打水。」他捡起一块石头扔下去，半天听见井底一声响，「井干了。水位下降，水抽不上来。」他指了指井边塌了一半的辘轳架，「井一干，人就搬走了。绿洲也就荒了。」","opts":[{"t":"往井里看一眼","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在井栏边歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,

    {"title":"干谷里的旧商队营地遗址","kind":"观察/人文","text":"干谷避风处，**一圈旧石头围成的商队营地遗址**——石头被烟熏黑，中间有灶坑。老信使蹲在灶坑边拨了拨灰：「商队在这儿住过。」他指了指地上的马粪印，「几十头骆驼在这儿过夜。灶上煮着茶，人围着火坐。」他把灶坑边的一块黑石头翻过来，「灰里还有茶渣。商队走了几十年了，灰还在。」","opts":[{"t":"在遗址里扎营","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}},{"t":"仔细看灶坑的灰","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"岩洞里的旧蝙蝠粪层","kind":"观察/自然","text":"岩洞里地上，**一层旧蝙蝠粪**——黑而细，踩上去沙沙响。老信使用脚拨了拨粪层：「蝙蝠住的洞。」他抬头看了看洞顶，洞顶黑糊糊一片，「蝙蝠白天在洞顶睡，晚上出去吃虫。它们的粪落在地上，一年积一层。」他走出洞外，「这层粪有几尺厚。说明这洞蝙蝠住了几百年。」","opts":[{"t":"小心走过岩洞","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在洞里避风","note":"体温+1 · 精神+1","fx":{"temp":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"绿洲边的旧棕榈残干","kind":"观察/自然","text":"绿洲边上，**一根枯死的旧棕榈残干**——叶子掉光了，树干还立着。老信使用手敲了敲树干，声音是空的：「旱死的。」他绕着树干走了一圈，「绿洲的水线往后退了。以前棕榈长在水边，现在水边在它五十步外。」他把残干上的枯叶子扯下来，「它死了，但根还在沙里。根在，沙就不往下陷。」","opts":[{"t":"在残干背阴处歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"量一量到水边的距离","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}}]}    ,
    {"title":"干河床上的旧鱼化石","kind":"观察/自然","text":"干河床上石头缝里，**一块嵌在岩里的旧鱼化石**——鱼骨完整，连鱼刺都看得清。老信使用手擦了擦化石上的沙：「这地方以前是海。」他把化石对着太阳看了看，「鱼死在海里，泥沙把它埋了。埋了几百万年，海干了，鱼变成石头了。」他把化石放回原处，「别带走。它在这儿几百万年了，让它待着。」","opts":[{"t":"仔细看化石","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"在河床上继续找","note":"体力-1 · 材料+1","fx":{"stam":-1,"mats":1}}]}    ,
    {"title":"红岩壁上的旧岩画","kind":"观察/人文","text":"红岩壁上，**一片暗红色的旧岩画**——画的是骆驼、人和太阳，线条简单。老信使仰着头看了半天：「以前住在这儿的人画的。」他用手指沿着画边描了描，「颜料是红土。风吹了几千年，还没掉。」他退后几步看整体，「他们画太阳，画骆驼，画人。没画别的。说明那时候他们的日子，就是太阳、骆驼和走路。」","opts":[{"t":"仔细看岩画内容","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"在岩画下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}}]}    ,
    {"title":"热风墙根下的旧风蚀柱","kind":"观察/自然","text":"热风墙根，**一根立着的旧风蚀柱**——上粗下细，像一根指头指着天。老信使绕着柱子走了一圈：「风把周围的沙吹走了，就剩这根硬的。」他用手按了按柱身，「它硬。周围的石头软。软的被风吹走了，硬的留下来。」他退后一步看了看柱顶，「柱子立了几千年。风刮它，雨打它，它还在。」","opts":[{"t":"在柱影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"仔细看柱身的纹理","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"旱谷里的旧骆驼刺","kind":"观察/自然","text":"旱谷沙地上，**一丛丛矮骆驼刺**——带刺，但根系深。老信使拨开一丛看了看根：「骆驼刺是救命草。它根扎得深，能找到水。」他折了一小枝尝了尝，「叶子苦，但骆驼吃。我们不指望它吃，但有骆驼刺的地方，地下一定有水。」","opts":[{"t":"顺着骆驼刺找水","note":"体力-1 · 饮水+1","fx":{"stam":-1,"water":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"在刺丛边歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}}]}    ,
    {"title":"风蚀残丘间的旧岩羊骨","kind":"观察/自然","text":"残丘脚下，**一具风化了的旧岩羊骨**——骨头白了，角还完整。老信使蹲下来看了看骨头的朝向：「岩羊往高处跑，摔在这儿的。」他把骨头摆正让角对着坡上，「它死的时候在躲狼。骨头留着，狼看见羊骨头，知道这儿的羊不好抓。」","opts":[{"t":"把骨头摆正","note":"体力-1 · 名声+1 · 精神+1","fx":{"stam":-1,"fame":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}    ,
    {"title":"沙丘间的旧商队墓","kind":"观察/人文","text":"沙丘背风面，**几堆石头垒成的旧墓**——石头简单，没有碑。老信使在墓前站了一会儿：「走商队死在半路上的，就埋在这儿。」他把一块被风吹歪的石头扶正，「没有名字。但路过的人看见石头堆，就知道这儿埋过人。」他退后一步，「别踩上去。走过去就行。」","opts":[{"t":"帮他扶正石头","note":"体力-1 · 名声+1 · 精神+1","fx":{"stam":-1,"fame":1,"mind":1}},{"t":"默立一会儿","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"绕开走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}    ,
    {"title":"热风洞边的旧陶罐","kind":"观察/人文","text":"热风洞边石头上，**一个半埋在沙里的旧陶罐**——罐口碎了一半。老信使把陶罐拔出来磕了磕沙：「以前路过的人在这儿存水。」他把罐翻过来，罐底还有一层干了的水痕，「风洞边热风大，人走到这儿最渴。存一罐水，给下一个路过的人喝。」他把罐放回原处，「我们也留点水进去。」","opts":[{"t":"把自己的水留一罐","note":"饮水-1 · 名声+1 · 默契+1","fx":{"water":-1,"fame":1,"bond":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"在风洞边歇脚","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}}]}    ,
    {"title":"古城墙根下的旧石磨","kind":"观察/人文","text":"古城墙根，**一盘旧石磨**——上扇磨盘歪在下扇上，磨槽里全是沙。老信使把上扇推了转了半圈：「以前在这儿磨谷子。」他拍了拍磨盘上的沙，「人走了，磨还在。沙把磨槽填了，但石头不会坏。哪天有人回来，清掉沙还能磨。」","opts":[{"t":"帮他把磨槽清干净","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"推磨转一圈试试","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"绿洲边上的旧椰枣林","kind":"观察/自然","text":"绿洲边上，**一片老椰枣林**——树干歪歪扭扭，但还在结果。老信使用竹竿打了几颗枣下来：「这片林子种了一百年。以前商队在这儿补给，全靠椰枣。」他把枣擦了擦递给你，「现在绿洲里有商店了，枣不卖了。树还在结，路过的人自己打。」","opts":[{"t":"吃几颗枣","note":"饱食+1 · 饮水+1","fx":{"food":1,"water":1}},{"t":"帮他把枣打下来","note":"体力-1 · 材料+1","fx":{"stam":-1,"mats":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"干盐湖上的旧盐壳裂纹","kind":"观察/自然","text":"干盐湖面上，**一张裂纹织成的旧网**——裂纹把盐壳切成一块块多边形。老信使用脚踩了踩裂纹块：「盐壳晒裂了。裂纹深的地方下面是软泥。」他绕开一道宽裂纹，「走裂纹块中间，别踩缝。缝下面是空的，踩穿了脚陷进去。」","opts":[{"t":"踩着裂纹块走","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"绕开盐湖走","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}    ,
    {"title":"风蚀土林里的旧古城废墟","kind":"观察/人文","text":"土林深处，**一片被风削了一半的旧古城废墟**——墙是夯土的，还站着的墙面上有窗洞。老信使在残墙间穿了穿：「以前这儿是座城。沙暴埋了它一半，风又削了另一半。」他摸了摸夯土墙，「墙里掺了稻草。稻草都腐了，但墙还在。」","opts":[{"t":"在废墟里走走","note":"观测+2 · 体力-1","fx":{"obs":2,"stam":-1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"把松动的砖扶稳","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}}]}    ,
    {"title":"棕榈林间的旧商队坑","kind":"观察/人文","text":"棕榈林间空地上，**一个被沙填了一半的旧深坑**——坑壁有绳痕。老信使趴在坑沿看了看：「以前商队在这儿挖井。水干了，井废了，人走了。」他抓了把坑里的沙搓了搓，「沙是后来填的。以前井深十米，现在露出来不到一米。再过十年，就看不见了。」","opts":[{"t":"帮他把沙再清掉一点","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}    ,
    {"title":"风蚀峡谷里的旧淘金坑","kind":"观察/人文","text":"峡谷沙地上，**一排被人挖过的旧沙坑**——坑口都圆，像舀出来的。老信使蹲在一个坑边看了看：「以前有人在这儿淘金。沙金，一点点。」他抓了把坑边的沙搓了搓，「淘金的人走了几十年了，坑还在。沙填上一半，再过几年就平了。」","opts":[{"t":"帮他把坑填平","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"仔细看沙里有没有金","note":"观测+1 · 材料-1","fx":{"obs":1,"mats":-1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"盐滩上的旧盐壳","kind":"观察/自然","text":"盐碱滩上，**一层硬壳的旧盐盖**——踩上去咔嚓响。老信使用脚跺了跺盐壳：「下面是泥。盐盖硬，但薄。别踩边儿上，踩中间。」他蹲下来刮了点盐尝了尝，「苦的。不能吃，但能存着。以后伤口撒盐消毒，就用这个。」","opts":[{"t":"刮一点盐带走","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"帮他把盐壳踩实","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,
    {"title":"古神庙里的旧壁画","kind":"观察/人文","text":"古神庙残墙内侧，**一幅褪色的旧壁画**——画的是几百年前人对着沙丘跪拜。老信使站在壁画前看了很久：「他们拜的不是神。是沙暴。沙暴来了，他们以为是神罚。」他伸手没碰壁画，「现在我们知道沙暴是天灾，不是神罚。但他们当时只有壁画。」","opts":[{"t":"仔细看壁画内容","note":"观测+2 · 精神+1","fx":{"obs":2,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"把残墙扶好","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}}]}    ,
    {"title":"岩画洞里的旧炭笔","kind":"观察/人文","text":"岩画洞角落里，**半截旧炭笔**——是以前画岩画的人留下的。老信使捡起来看了看：「炭笔还能画。画岩画的人走了几千年，笔还在。」他没往墙上画，只在地上画了个圈，「在这儿画可以，别碰墙。墙是他们的。」","opts":[{"t":"在地上学画一个符号","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把炭笔放回原处","note":"名声+1 · 精神+1","fx":{"fame":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}    ,

    {"title":"沙丘后的旧仙人掌","kind":"观察/自然","text":"沙丘后，**一棵孤零零的旧仙人掌**——主干弯了，但还活着，顶上开了一朵小花。老信使站在花前看了一会儿：「这棵活了至少五十年。沙埋了它一半，它从沙里钻出来接着长。」他绕着仙人掌走了一圈，「萨尔贡的东西都命硬。」","opts":[{"t":"帮它把根边的沙扒开","note":"体力-1 · 名声+1 · 观测+1","fx":{"stam":-1,"fame":1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"继续赶路","note":"体力-1 · 精神+1","fx":{"stam":-1,"mind":1}}]}    ,

      {"title":"坠落的货舱门","kind":"探索/补给","text":"机身中段，**货舱门被冲击力撕开一半**，露出里面压得变形的货架。几箱物资还没散架，封条上印着某个跨国公司的徽记——罗盘指的方位，它原本该运到别处。","opts":[{"t":"钻进去，小心翻找完好的箱子","note":"成功率70% · 补给+6 · 材料+2","prob":0.7,"ok":"你在压扁的纸箱里摸出几罐密封口粮和一卷工具（**补给+6 · 材料+2**）。","fail":"你刚探进去，整面货架哗啦塌下来，你抽身时被铁皮划了一道（**体力-7**）。","failFx":{"stam":-7}},{"t":"卸下舱门，当一块能遮雨的板子","note":"材料+1 · 体力-4","fx":{"stam":-4,"mats":1}},{"t":"记下舱号与封条，报给罗德岛","note":"观测+1 · 名声+3","fx":{"obs":1,"fame":3}}]},
    {"title":"坠毁点的残骸","kind":"探索/危险","text":"坠机点周围，**残骸散得七零八落**，有些还挂在树上，有些埋在土里。风一吹，铝皮发出细细的嗡鸣——你得在这堆东西里，找出还能用、又不会炸的。","opts":[{"t":"小心翻拣能用的零件","note":"材料+2 · 体力-3 · 观测+1","fx":{"stam":-3,"mats":2,"obs":1}},{"t":"围着残骸走一圈，记下扩散范围","note":"观测+2 · 精神+1","fx":{"mind":1,"obs":2}},{"t":"不碰——残骸堆里，什么都可能藏着","note":"精神-1","fx":{"mind":-1}}]},
    {"title":"高地上的信标","kind":"探索/导航","text":"高地上，**一座旧信标**歪在风里，灯还亮着，只是一闪一闪。坠机以来，这是第一个看得见的、还在动的人工信号。","opts":[{"t":"朝信标方向走","note":"体力-2 · 观测+2 · 精神+1","fx":{"stam":-2,"mind":1,"obs":2}},{"t":"把自己的信标也打开，对一下频率","note":"材料-1 · 观测+2","fx":{"mats":-1,"obs":2}},{"t":"不信——信标太旧，引过去未必是路","note":"精神-1","fx":{"mind":-1}}]}     ,
      {"title":"机翼下的求救信号","kind":"探索/情报","text":"烧焦的机翼下，**用炭画了一个罗德岛的求救标记**——箭头指着东北方。不是你画的。","opts":[{"t":"顺着标记方向找","note":"体力-4 · 观测+2 · 名声+2","fx":{"stam":-4,"obs":2,"fame":2}},{"t":"把标记擦掉，不留痕迹","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"不管——别人的信号，别跟","note":"精神-2","fx":{"mind":-2}}]},
      {"title":"残骸里的收音机","kind":"探索/细节","text":"砸开一块变形的仪表盘，**里面卡着一个旧收音机**——你拧开开关，居然还有反应，喇叭里沙沙响了一阵，然后冒出一段断断续续的莫尔斯电码。","opts":[{"t":"抄下电码，回去翻译","note":"观测+3 · 材料+1 · 精神+1","fx":{"obs":3,"mats":1,"mind":1}},{"t":"把收音机修好当联络用","note":"材料-1 · 观测+2","fx":{"mats":-1,"obs":2}},{"t":"关掉——死人的收音机别听","note":"精神-2","fx":{"mind":-2}}]},
      {"title":"雪窝里的日记","kind":"探索/剧情","text":"翻 shelter 里的背包，**你找到一本冻硬的日记**——最后一页写着：「信号枪打了三发，没人来。食物还够两天。」字迹到这里突然断了。","opts":[{"t":"把日记收好","note":"观测+2 · 精神-2 · 材料+1","fx":{"obs":2,"mind":-2,"mats":1}},{"t":"在最后一页补一行","note":"精神+1 · 名声+1","fx":{"mind":1,"fame":1}},{"t":"放回原处","note":"精神-1","fx":{"mind":-1}}]},
      {"title":"雪线上的求救信号","kind":"探索/剧情","text":"远处雪坡上，**有一排石头堆成的求救信号**——三个箭头，指向同一个方向。石头很新，不超过一个星期。","opts":[{"t":"朝信号方向找","note":"体力-4 · 观测+2 · 名声+2","fx":{"stam":-4,"obs":2,"fame":2}},{"t":"把信号擦掉","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"不管——别人的信号别跟","note":"精神-2","fx":{"mind":-2}}]},
      {"title":"残骸下的物资箱","kind":"探索/补给","text":"撬开机翼残骸，**下面压着一个没摔坏的物资箱**——里面有三罐压缩饼干、两管药膏、一卷绷带。箱子上印着罗德岛的标志。","opts":[{"t":"全部带走","note":"补给+2 · 药品+1 · 绷带+1 · 观测+1","fx":{"food":2,"med":1,"bandage":1,"obs":1}},{"t":"留一半在原处","note":"名声+2 · 精神+1","fx":{"fame":2,"mind":1}},{"t":"只拿药膏","note":"药品+1 · 补给+1","fx":{"food":1,"med":1}}]},
      {"title":"座椅下的急救包","kind":"补给/治疗","text":"烧焦的乘客座椅下方，**一只帆布急救包被安全带缠着**，竟没被烧到。你扯开拉链，里面有一卷没拆封的绷带和一小瓶消毒酒精。伤口又开始渗血，你顾不得脏。","opts":[{"t":"收好绷带和酒精","note":"绷带+1","fx":{"bandage":1}},{"t":"就地用酒精冲洗伤口、绷带扎紧","note":"伤口处理 · 体力+6","crashHeal":1},{"t":"抓上绷带就走，不敢久留","note":"绷带+1 · 体力-2","fx":{"bandage":1,"stam":-2}}]},
      {"title":"雪顶的云影","kind":"观察/预兆","text":"雪顶上，**一片云的影子正慢慢移过来**——影子的边缘特别清楚，像刀裁的。老信使抬头看了一眼：「云影过的地方要起白雾，跟紧我。」","opts":[{"t":"跟紧老信使","note":"体力-1 · 体温-1 · 默契+2","fx":{"stam":-1,"temp":-1,"bond":2}},{"t":"趁没雾拍一张","note":"材料-1 · 体温-2","fx":{"mats":-1,"temp":-2}},{"t":"没事继续走","note":"体温-3 · 观测-1","fx":{"temp":-3,"obs":-1}}]}
      ,
      {"title":"残骸边的旧信号旗","kind":"探索/人性","text":"坠毁点旁边的碎石堆上，**插着一面褪了色的信号旗**——旗面被风撕成了条，旗杆还立得笔直。不知道是谁立的，也许是前一批搜救的人，也许是飞行员自己。老信使把旗扶正了些。","opts":[{"t":"把信号旗收好带回","note":"材料+1 · 精神+1","fx":{"mind":1,"mats":1}},{"t":"在旗杆下压一张字条","note":"名声+1 · 精神+1","fx":{"mind":1,"fame":1}},{"t":"拍一张照存档","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"翼面上的旧弹孔","kind":"观察/历史","text":"机翼残骸上，**一排整齐的弹孔从翼根排到翼尖**——不是事故撞的，是打的。老信使蹲下来数了数：「这架飞机不是自己掉下来的。」他没再往下说，把风衣领子竖了起来。","opts":[{"t":"把弹孔位置拍下来","note":"材料-1 · 观测+2 · 精神-1","fx":{"mats":-1,"obs":2,"mind":-1}},{"t":"绕开，不想知道更多","note":"精神+1 · 体力-1","fx":{"mind":1,"stam":-1}},{"t":"用手量弹孔直径","note":"观测+2 · 体力-1","fx":{"stam":-1,"obs":2}}]}
      ,
      {"title":"座舱里的旧耳机","kind":"探索/遗物","text":"座舱残骸里，**一副旧耳机挂在断裂的操纵杆上**——耳罩皮面裂了，线还连着。你凑过去听了一下，当然没有声音。老信使站在舱门口没进来，只说了句：「别戴那玩意儿。」","opts":[{"t":"把耳机摘下来收好","note":"材料+1 · 精神-2","fx":{"mind":-2,"mats":1}},{"t":"挂回操纵杆上","note":"精神+1 · 名声+1","fx":{"mind":1,"fame":1}},{"t":"不碰，退出座舱","note":"体力+1 · 精神+1","fx":{"stam":1,"mind":1}}]}
      ,
      {"title":"尾翼上的旧编号","kind":"观察/历史","text":"你绕到尾翼后面，**尾翼上的编号被人用漆涂掉了**——但刮一刮，底下还能看见原来的编号。老信使过来看了一眼，没说话，把风衣领子竖起来。这个编号，他显然认识。","opts":[{"t":"把编号刮清楚记下来","note":"观测+2 · 精神-2","fx":{"obs":2,"mind":-2}},{"t":"不刮，尊重别人涂掉的决定","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"问老信使这是谁的飞机","note":"默契+1 · 精神-1","fx":{"bond":1,"mind":-1}}]}
      ,
      {"title":"货舱里的旧货运单","kind":"探索/遗物","text":"货舱残骸里，**一张货运单被压在货箱下面**——纸已经黄了，但字还能辨认。单子上写着货物是「医疗物资」，收件方是一个你没听过的小镇。老信使看了一眼，把单子折好放回原处：「这飞机上载的不是货，是人。」","opts":[{"t":"把单子带走存档","note":"材料+1 · 精神-2","fx":{"mind":-2,"mats":1}},{"t":"原样放回","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"问他那个小镇后来怎么了","note":"默契+1 · 精神-1","fx":{"bond":1,"mind":-1}}]}
      ,
      {"title":"机翼下的旧救生筏","kind":"探索/补给","text":"机翼残骸下，**塞着一个旧救生筏**——包装还没拆，上面的日期是坠毁那一年。老信使用刀割开包装，筏子已经瘪了，但帆布还完整。「这东西本来是给人逃命用的。逃命的人没来得及用它。」","opts":[{"t":"把救生筏帆布带走","note":"材料+1 · 精神-1","fx":{"mind":-1,"mats":1}},{"t":"重新包好塞回去","note":"精神+1 · 名声+1","fx":{"mind":1,"fame":1}},{"t":"坐在筏子上歇一会儿","note":"体力+1 · 精神-1","fx":{"stam":1,"mind":-1}}]}
      ,
      {"title":"货舱里的旧降落伞绳","kind":"探索/补给","text":"货舱残骸里堆着**几卷旧降落伞绳**——白色伞绳已经发黄，但拉力还在。老信使抽出一根拽了拽：「结实。这种绳比买的登山绳还好用。」他把三卷绳塞进背包，「别人用不上了，我们用得上。」","opts":[{"t":"把伞绳带走","note":"材料+2 · 精神-1","fx":{"mind":-1,"mats":2}},{"t":"只拿一卷","note":"材料+1 · 名声+1","fx":{"mats":1,"fame":1}},{"t":"不碰，留在这里","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}}]}
      ,
      {"title":"尾翼上的旧编号","kind":"探索/遗物","text":"尾翼残骸上，**出厂编号还清晰可见**——老信使把编号抄在本子上，「回去查一下这架飞机的档案。」他用手拂去编号上的灰，「每架飞机都有名字。有人造它，有人开它，有人坐它。它掉在这儿，不是一块铁，是一段故事。」","opts":[{"t":"帮他一起抄编号","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"问他能查到什么","note":"默契+1 · 观测+1","fx":{"bond":1,"obs":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼下的旧挂架","kind":"探索/遗物","text":"机翼下面，**几个旧挂架**——金属挂架已经锈成深褐色，挂架上的挂点螺栓全松了，还挂着一段掉下来的旧挂架梁。老信使用手晃了晃挂架，挂架在机翼下晃了晃：「挂架。」他指了指挂架，「飞机挂导弹、挂炸弹，就挂在这上面。」他指了指挂架上的螺栓，「现在弹都没挂。就剩空架子。」他把挂架上的锈块掰掉一块，「以前这地方挂满弹。飞出去就是打仗。」","opts":[{"t":"也晃晃挂架","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在机翼下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"尾翼上的旧方向舵调整片","kind":"探索/遗物","text":"垂尾后缘，**一片旧方向舵调整片**——金属小翼面已经歪了，铰链上挂着一根断了的钢索。老信使用手扳了扳调整片，调整片在铰链里晃了晃：「调整片。」他指了指调整片，「飞行员踩方向舵，舵动。这小片跟着动。帮舵省力。」他指了指断了的钢索，「钢索断了。调整片就不动了。」他把调整片扳回原位，「以前飞行员手不离杆脚不离舵。」","opts":[{"t":"也扳扳调整片","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在垂尾下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"座舱里的旧油门杆","kind":"探索/遗物","text":"座舱两个飞行员座位中间，**两根旧油门杆**——杆把上已经磨得发亮，杆头上的卡钳已经松了。老信使用手拉了拉油门杆，杆在滑轨里动了动：「油门杆。」他指了指杆，「两个发动机，两根杆。推前面快，拉后面慢。」他把油门杆推到底，「以前飞行员手就放在这上面。」他指了指杆旁边的旧开关，「这几个开关，管发动机。」","opts":[{"t":"也拉拉油门杆","note":"体力-1 · 观测+1","fx":{"stam":-1,"obs":1}},{"t":"在座舱里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"垂尾上的旧磁罗盘","kind":"探索/遗物","text":"垂尾根部，**一个旧磁罗盘**——罗盘玻璃已经裂了，里面的磁针歪在一边不动了。老信使用手把罗盘扶起来看了看：「磁罗盘。」他指了指罗盘里的磁针，「飞行员靠这个知道机头朝哪。」他把罗盘转了个方向，磁针还是歪着不动，「现在磁针卡住了。不准了。」他把罗盘放回垂尾根部，「以前没有卫星导航。就靠这个飞。」","opts":[{"t":"也转转罗盘","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在垂尾下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机头上的旧空速管","kind":"探索/遗物","text":"机头最前面，**一根旧空速管**——金属细管伸在最前面，管口已经歪了，管身上结着蜘蛛网。老信使用手摸了摸空速管：「空速管。」他指了指管口，「飞机飞的时候，空气冲进这根管。仪表就知道飞机飞多快。」他把空速管上的蜘蛛网抹掉，「这根管伸在最前面。最先碰到东西。现在管口都歪了。」他指了指机头的方向，「以前飞行员就靠这个看速度。」","opts":[{"t":"也看看管口","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在机头下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机腹下的旧起落架舱门","kind":"探索/遗物","text":"机腹下面，**一扇旧起落架舱门**——门半开着，铰链已经锈死，门边上还挂着一块掉下来的液压管。老信使用手晃了晃舱门，门纹丝不动：「起落架舱门。」他指了指舱门里面黑乎乎的起落架舱，「飞机起飞后，起落架收进这舱里。这扇门就关上。」他指了指锈死的铰链，「现在门打不开了。起落架也收不回去了。」","opts":[{"t":"也看看舱里","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在机腹下歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"机翼上的旧翼刀","kind":"探索/遗物","text":"机翼前缘，**几片旧金属翼刀**——薄薄一片，垂直于机翼表面，像小刀片。老信使用手摸了摸翼刀的边缘，边缘有点钝了：「翼刀。」他指了指翼刀的位置，「机翼上的气体会往翼尖流。翼刀把气流挡住，不让它往翼尖跑。」他顺着机翼看过去，「气流不往翼尖跑，飞机就稳。」他敲了敲翼刀，「这东西不起眼，但少了它飞机抖。」","opts":[{"t":"仔细看翼刀位置","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在机翼阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"机翼上的旧翼尖小翼","kind":"探索/遗物","text":"机翼最外端，**两片旧翼尖小翼**——向上弯起，表面有一道被鸟撞过的凹痕。老信使用手摸了摸那个凹痕：「翼尖小翼。」他指了指小翼的形状，「飞机机翼两头，空气往下漏，形成涡流。小翼把涡流挡住，飞机省油。」他敲了敲那个凹痕，「这是撞鸟撞的。鸟撞在翼尖上，鸟没了，翼尖凹一块。」","opts":[{"t":"仔细看鸟撞凹痕","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在机翼阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"尾部的旧减速板","kind":"探索/遗物","text":"飞机尾部，**几块旧金属减速板**——板子半开着，表面有液压杆。老信使用手推了推减速板，板子纹丝不动：「降落的时候打开。」他指了指板子，「飞机落地太快，打开板子增加阻力，减速。」他绕到液压杆边看了看，「这几块板，落地那一下打开，滑跑几百米就收回去。」他拍了拍板子，「迫降的时候，板子应该是打开的。飞行员知道要摔，提前减速。」","opts":[{"t":"仔细看液压杆","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在尾部阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"机头整流罩里的旧空速管","kind":"探索/遗物","text":"机头最前端，**一根旧金属空速管**——管口堵着一块布，管身有点弯。老信使用手把堵管口的布取下来：「飞机靠它知道飞多快。」他指了指管口，「空气从管口进去，压在仪器上。管里压力大，就知道飞得快。」他把布重新堵回去，「堵上，是怕虫子和沙子进去。管子一堵，飞行员就不知道速度了。」","opts":[{"t":"仔细看管身","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把管口的布重新堵好","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"货舱里的旧货单","kind":"探索/遗物","text":"货舱地板上，**一沓旧货运单**——纸被水泡过，字还能认出几个。老信使用手把单据展开：「这飞机拉的是货。」他指着单子上的字，「一箱子药品，两箱子机器零件，还有几箱新鲜水果。」他把单据折好放进口袋，「飞机迫降的时候，货还捆在舱里。人没事，货也没摔坏。」","opts":[{"t":"仔细看单据","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把单据收进背包","note":"材料+1 · 名声+1","fx":{"mats":1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼下的旧喷气引擎","kind":"探索/遗物","text":"机翼下挂着**一台旧喷气引擎**——进气口风扇叶片上有一处打痕，尾喷管熏黑了。老信使用手敲了敲引擎外壳，声音闷实：「双发客机，一边一台。」他指了指进气口的风扇，「飞机飞得快，靠它。风扇转起来，前面吸气后面喷气。」他绕到尾喷口看了看，「这台引擎的一片叶断了。可能就是因为它，飞机才迫降的。」","opts":[{"t":"仔细看断裂的叶片","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"在引擎阴影里歇脚","note":"体力+1 · 体温+1","fx":{"stam":1,"temp":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"客舱里的旧救生衣","kind":"探索/遗物","text":"客舱座位下，**一件件旧橙色救生衣**——袋子上写着座位号，拉链还能拉。老信使用手把一件救生衣抽出来，把里面的二氧化碳钢瓶拧了拧：「水上迫降穿的。」他把救生衣塞回袋子，「飞机落水上，人漂在海上。救生衣一吹，胸口鼓起来。」他指了指座位下的小灯，「夜里穿，救生衣上有灯。海面上一闪一闪。」","opts":[{"t":"仔细看钢瓶","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把救生衣一件件塞回原位","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"驾驶舱里的旧操纵杆套","kind":"探索/遗物","text":"驾驶舱座位上，**一个旧皮操纵杆套**——套在杆头上，皮面磨得发亮。老信使用手握了握杆套，套子软塌塌的：「飞行员的手，几十年握出来的。」他把杆套转了转，「操纵杆往后拉，机头抬起。往前推，机头压下。」他指了指座位上的安全带，「飞行员系着这个，把飞机迫降在地上。」","opts":[{"t":"仔细握一握操纵杆","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把座位上的碎玻璃扫掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"尾翼上的旧防撞灯罩","kind":"探索/遗物","text":"尾翼顶端，**一个旧红色防撞灯罩**——灯罩裂了一条缝，里面的灯泡还在。老信使用手把灯罩转了转：「晚上闪的。」他指了指灯罩里的灯泡，「飞机晚上飞，这个灯一闪一闪。别的飞机看见它，就知道这儿有飞机。」他把灯罩上的灰擦掉，「它现在不闪了。电池早用完了。」","opts":[{"t":"仔细看灯泡","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把灯罩上的灰擦干净","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼上的旧天线拉线","kind":"探索/遗物","text":"机身上，**几根旧天线拉线**——钢丝拉着垂直尾翼，线上挂着一串旧磁环。老信使用手拨了拨拉线，拉线嗡地响了一声：「高频天线。」他指了指磁环，「磁环是调谐用的。拉线越长，波长越长，传得越远。」他把拉线上的土擦掉，「飞机上的无线电全靠这几根线。线断一根，地面就听不见飞机说话。」","opts":[{"t":"仔细看磁环","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把拉线上的土擦干净","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"货舱里的旧降落伞包","kind":"探索/遗物","text":"货舱架子上，**一排旧降落伞包**——包是帆布的，伞绳整齐地扎着。老信使用手按了按伞包，包硬邦邦的，「这是备份伞。」他指了指伞包上的标签，「客机上不带伞。这是跳伞运动员跳的。」他把伞包拉链拉开一条缝看了看，伞叠得整整齐齐，「不知道谁把这些伞放上来的。人都跑了，伞留下了。」","opts":[{"t":"仔细看伞包标签","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把伞包拉链拉好","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"客舱里的旧氧气面罩","kind":"探索/遗物","text":"客舱座椅上方，**垂着一个旧氧气面罩**——黄色的橡胶面罩，管子还连在头顶。老信使用手把面罩拉下来看了看：「失压的时候自动掉下来。」他捏了捏面罩上的袋子，袋子瘪了，「飞机飞到高空，客舱失压，面罩就下来。人吸面罩里的氧气。」他把面罩挂回去，「它现在还挂着。说明迫降的时候，客舱没破。」","opts":[{"t":"仔细看面罩管子","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把面罩挂回原位","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼下的旧副翼铰链","kind":"探索/遗物","text":"机翼后缘，**一排旧副翼铰链**——铰链销子还在，但副翼歪着动不了。老信使用手扳了扳副翼，副翼纹丝不动：「液压管断了。」他指了指铰链后面的油管，油管瘪了，「副翼靠液压动。油管断了，油漏光了，副翼就卡死了。」他把副翼上的沙擦掉，「飞的时候副翼是好的。落地那一下，管子蹭断了。」","opts":[{"t":"仔细看油管断口","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把副翼上的沙擦干净","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"尾翼上的旧雷达罩","kind":"探索/遗物","text":"垂直尾翼顶端，**一个旧半球形雷达罩**——罩子是玻璃纤维做的，表面有一道裂纹。老信使用手敲了敲罩子，声音闷：「气象雷达。」他指了指罩子里面，看不见里面，「里面转着天线，照天气用。罩子裂了，但没掉下来。」他退后一步看尾翼整体，「飞机最后是尾翼先着地的。但雷达罩没碎。说明接地的时候，尾翼蹭得很轻。」","opts":[{"t":"仔细看罩子裂纹","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把罩子上的灰擦掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼上的旧航行灯灯罩","kind":"探索/遗物","text":"机翼尖上，**一个旧航行灯灯罩**——玻璃裂了，但还没掉下来。老信使用手轻轻摇了摇灯罩：「左边的红灯。」他指了指另一边机翼尖，「那边是绿灯。左红右绿，夜里飞行时别的飞机能看见。」他把灯罩上的土擦掉，「碎了但没掉。说明迫降时机翼没蹭地。灯是撞的时候震裂的。」","opts":[{"t":"仔细看灯罩裂纹","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把灯罩碎片收好","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"货舱里的旧货舱门铰链","kind":"探索/遗物","text":"货舱门边，**一副旧铰链**——门上的铰链销子还插着，门板歪在一边。老信使晃了晃门板，铰链发出闷响：「迫降的时候门变形了，打不开。」他把铰链上的沙擦掉，「门没飞出去，是因为铰链销子卡住了。门要是飞了，货就全散了。」他把门板推回原位，「铰链还结实。说明这架飞机最后落地的时候，舱门是关上的。」","opts":[{"t":"仔细看铰链销子","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把门推回原位","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"驾驶舱里的旧操纵杆握把","kind":"探索/遗物","text":"驾驶舱座椅间，**一根旧操纵杆握把**——橡胶握套裂了，顶上还留着手汗的印子。老信使用手握住握把晃了晃，杆还卡着没掉下来：「他最后就握着这个。」他松开手，「握把上有汗印。说明他手攥得很紧。迫降那一下，他没松手。」他把握把擦了擦灰，「能把飞机落下来的人，都是最后一刻没松手的。」","opts":[{"t":"也握一下握把","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把握把上的灰擦干净","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼油箱上的旧密封胶","kind":"探索/遗物","text":"机翼油箱外壁，**一圈旧密封胶**——胶发黑了，裂了几条缝。老信使用手按了按胶边：「以前补过漏。」他把脸凑近闻了闻，没有油味，「胶裂了，但不漏。说明补完之后油箱再没出过问题。」他拍了拍油箱壁，「补胶的人手艺不错。裂了这么多年，油没漏出来。」","opts":[{"t":"仔细看胶缝","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把油箱边的沙清掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"货舱里的旧货签","kind":"探索/遗物","text":"货舱地板上，**一张褪了色的旧货签**——挂在一个烂箱子把手上。老信使用手指捏起来看了看：「标签上写着编号。」他翻过来，背面还有一半地址，「他运的是备件。不是人，是货。」他把货签放回箱子上，「货没到。箱子碎了，签还在。」","opts":[{"t":"仔细看货签上的编号","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把货签夹进笔记本","note":"材料-1 · 名声+1","fx":{"mats":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}
      ,
      {"title":"机翼上的旧除冰带支架","kind":"探索/遗物","text":"机翼前缘，**一排旧金属支架**——除冰带没了，支架还在。老信使用手掰了掰支架，掰不动：「除冰带老化被拆掉了。支架留着，是因为下次装新带还要用。」他顺着支架走到翼尖，「支架没变形。说明这架机翼面没怎么受力。迫降主要伤在机头。」","opts":[{"t":"顺着支架走一遍","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把支架边的沙扫掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"尾翼上的旧航行灯","kind":"探索/遗物","text":"尾翼尖上，**一个旧航行灯**——灯罩裂了但没掉。老信使仰着头看了看：「晚上飞，这灯亮着。红的，从下面能看见。」他绕到另一侧，另一侧也有一个，绿的，「左边红右边绿。地面看灯，就知道飞机往哪儿飞。」他把灯罩上的灰擦掉，「灯不亮了。但还在。尾翼在，灯就在。」","opts":[{"t":"仔细看灯罩里的灯泡","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把灯罩边的碎玻璃清掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"前起落架上的旧轮胎印","kind":"探索/遗物","text":"迫降场地上，**两道旧轮胎印**——从飞机一直延伸到机头位置，印子深而重。老信使蹲在胎印边量了量深度：「他重着陆。轮胎砸在地上，弹了一下，又砸了一下。」他顺着胎印走到机头，「第二下弹起来的时候，起落架没坏。他运气好。弹第三下，起落架就断了。」","opts":[{"t":"顺着胎印走一遍","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}},{"t":"把胎印边的石头清掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}}]}

      {"title":"客舱里的旧氧气面罩","kind":"探索/遗物","text":"客舱座位上方，**一个垂下来的旧氧气面罩**——胶皮管已经硬化。老信使把面罩拿起来看了看：「高空失压的时候用的。」他捏了捏面罩，「他迫降在低空，没用上。面罩垂下来，是因为迫降时震动把它震出来了。」他把面罩挂回原位，「挂着吧。让后来的人知道，这架飞机曾经到过那么高。」","opts":[{"t":"仔细看面罩","note":"观测+1 · 精神+1","fx":{"obs":1,"mind":1}},{"t":"把面罩挂回去","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

      {"title":"机尾上的旧国籍标志","kind":"探索/遗物","text":"机尾上，**一个褪色的旧国籍标志**——颜色被太阳晒成了灰白，但形状还认得出。老信使站在标志下看了一会儿：「不是干我们这行的。是别的公司的运输机。」他绕到机尾另一面，「他在这片迫降，说明他也迷航了。和我们一样。」","opts":[{"t":"默立一会儿","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"把标志上的灰擦掉","note":"体力-1 · 名声+1","fx":{"stam":-1,"fame":1}},{"t":"拍张照","note":"材料-1 · 观测+1","fx":{"mats":-1,"obs":1}}]}

    {"title":"救生筏","kind":"探索/材料","text":"河滩的淤泥里，**一只充气救生筏**半埋着，橙色的布面晒得发白，气早就漏完了，边缘裂了一道口子。筏子边上，还拖着一截断掉的缆绳。","opts":[{"t":"把筏子拖出来，割下完好的布料","note":"材料+2 · 体力-3","fx":{"stam":-3,"mats":2}},{"t":"检查缆绳和筏子的编号","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"不碰——救生筏漏了气，就是一块死皮","note":"精神-2","fx":{"mind":-2}}]},

    {"title":"军用饭勺","kind":"探索/补给","text":"机舱地板的缝隙里，**一把军用饭勺**卡在铝板下面，勺柄磨得发亮，勺底磕出一道凹痕。这种勺子，行军的人吃饭、挖土、撬东西都用它——一把勺子，能看出主人走了多远的路。","opts":[{"t":"把饭勺撬出来，收进包里","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"翻一翻地板缝里还有没有别的东西","note":"材料+1 · 观测+1","fx":{"obs":1,"mats":1}},{"t":"不碰——勺子还卡在原处，像是主人还会回来拿","note":"精神-2","fx":{"mind":-2}}]},
    {"title":"军用铁锹","kind":"探索/装备","text":"战壕边，**一把军用铁锹**插在土里，锹刃卷了边，木柄上缠着胶带。锹面上刻着一个模糊的记号，像是编号，又像是随手划的。","opts":[{"t":"把铁锹拔出来，收进装备里","note":"材料+1 · 体力-1","fx":{"stam":-1,"mats":1}},{"t":"翻一翻战壕壁，看有没有埋着的东西","note":"材料+2 · 观测+1","fx":{"obs":1,"mats":2}},{"t":"不碰——插在原地的铁锹，像主人只是临时走开","note":"精神-2","fx":{"mind":-2}}]},
    {"title":"军用铜锣","kind":"探索/装备","text":"残骸舱门边，**一面军用铜锣**挂在支架上，铜面敲出几道深痕，旁边拴着一根断了一半的锣槌。这种锣，是营地报信用的——一响，方圆几里都知道有情况。","opts":[{"t":"敲一下试试声响，记下能传多远","note":"观测+1 · 精神+1","fx":{"mind":1,"obs":1}},{"t":"把铜锣和锣槌收进包里","note":"材料+2 · 体力-1","fx":{"stam":-1,"mats":2}},{"t":"不碰——锣挂在这儿，像是还有人等着敲它","note":"精神-2","fx":{"mind":-2}}]},

    {"title":"路边的蜗牛","kind":"互动（心性/精神）","text":"雨后的石头上，**一只蜗牛正驮着壳慢慢爬**，留下一道亮晶晶的痕迹。小信使蹲在旁边看了半天，忽然小声说：「前辈，它爬一天，也就走咱们一步路吧？」","opts":[{"t":"顺着他的话，讲\"慢有慢的走法\"","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"教他把蜗牛壳上的螺纹画进测绘笔记","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"「蜗牛能走到的地方，咱们早就走过了。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"刺猬","kind":"互动（心性/判断）","text":"落叶堆里拱出一团**褐色的刺球**，试探着探出鼻尖，见有人来又缩了回去。小信使蹲在旁边看了半晌，小声说：「前辈，它是不是也觉得外面太吵了？」","opts":[{"t":"教他别去碰它——野生的东西，留它自己走","note":"心性+3 · 精神+1","fx":{"mind":1,"heart":3}},{"t":"跟他聊\"刺猬的刺也是它的房子\"","note":"心性+4","fx":{"heart":4}},{"t":"「又慢又扎手，赶路要紧。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"蚂蚱","kind":"互动（心性/观测）","text":"草丛里蹦出一只**大蚂蚱**，小信使眼疾手快一把扣住，隔着指缝看它蹬腿。他咧嘴笑：「前辈，它劲儿还挺大！」","opts":[{"t":"教他看蚂蚱后腿的关节，讲虫子的结构","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"让他放生——抓着玩一会儿就好","note":"心性+4","fx":{"heart":4}},{"t":"「放了吧，抓来抓去它活不过今晚。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"蟾蜍","kind":"互动（心性/判断）","text":"雨后路边的水洼里蹲着一只**蟾蜍**，鼓着腮帮子一声一声地叫。小信使蹲在边上看了好一会儿，忽然问：「前辈，它叫这么大声，不累吗？」","opts":[{"t":"教他听蟾蜍的叫声——雨要来了，它在报信","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"陪他蹲着看一会儿，什么也不说","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"「它叫它的，咱们走咱们的。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"蟋蟀","kind":"互动（心性/精神）","text":"夜里的草丛传来**清亮的蟋蟀声**，一声接一声，像在给夜色打拍子。小信使翻了个身，悄悄说：「前辈，它是不是在数星星？」","opts":[{"t":"顺着他的话说，蟋蟀在替夜守更","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"教他循着声音找蟋蟀，看清它躲在哪","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"「睡吧，蟋蟀叫完，明早还得赶路。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"壁虎","kind":"互动（心性/观测）","text":"歇脚的老屋墙角，**一只壁虎**正贴着墙缓缓爬动，忽然尾巴一甩，捉住一只小飞虫。小信使看得入神，小声问：「前辈，它怎么不掉下来？」","opts":[{"t":"教他看壁虎脚掌的吸盘，讲爬墙的道理","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"陪他看壁虎捕食，直到它钻进墙缝","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"「看它做什么，屋漏的墙才招壁虎。」","note":"心性-2","fx":{"heart":-2}}]},

    {"title":"瓢虫","kind":"互动（心性/精神）","text":"测绘休息时，**一只红壳瓢虫**落在小信使的测绘笔上，慢悠悠爬了两步。他屏住呼吸，大气不敢出，只拿眼睛瞟你：「前辈，它是不是走错路了？」","opts":[{"t":"教他把瓢虫放到草叶上，让它自己找家","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"陪他数瓢虫背上的星点","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"「瓢虫去哪，跟咱们没关系——放下笔，干活。」","note":"心性-2","fx":{"heart":-2}}]},

    {"title":"蚕","kind":"互动（心性/精神）","text":"路边的桑树上，**一只蚕**正埋头啃桑叶，沙沙沙，像在下雨。小信使看得入迷，凑近了问：「前辈，它吃这么多，是不是就能吐出丝来？」","opts":[{"t":"教他看蚕吃叶的样子，讲吐丝结茧要攒多久","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"摘一片桑叶，让他托着蚕观察","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"「蚕吐它的丝，你走你的路——叶子摘了，蚕吃什么？」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"知了","kind":"互动（心性/精神）","text":"正午的树荫下，**知了**叫得正欢，一声接一声，像要把夏天喊破。小信使捂着耳朵靠过来：「前辈，它不累吗？」","opts":[{"t":"教他听知了的节奏，讲它叫一个夏天就为这一声","note":"心性+3 · 精神+1","fx":{"mind":1,"heart":3}},{"t":"陪他在树荫里坐一会儿，等蝉声歇一歇","note":"心性+4 · 体力-2","fx":{"stam":-2,"heart":4}},{"t":"「它累不累不关你事——帽子戴好，该走了。」","note":"心性-2","fx":{"heart":-2}}]},

    {"title":"蚯蚓","kind":"互动（心性/观测）","text":"翻开的湿土里，**一条蚯蚓**正缓缓钻回土里，半截身子还露在外面，被阳光照得发亮。小信使蹲在边上，伸手想拦，又缩了回去：「前辈，它会迷路吗？」","opts":[{"t":"教他看蚯蚓钻土的痕迹，讲泥土是谁翻松的","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"陪他把蚯蚓轻轻送回土里","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"「它钻进土里才是回家——别拦它，拦了也白拦。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"天牛","kind":"互动（心性/观测）","text":"测绘时，**一只天牛**不知什么时候爬上了小信使的测绘架，两根长长的触须一摇一摆，像在量什么。他不敢动，只小声喊：「前辈，它也在测绘！」","opts":[{"t":"顺着他的话，陪他看天牛的量法","note":"心性+4 · 观测+1","fx":{"obs":1,"heart":4}},{"t":"教他轻轻把天牛引回树干上","note":"心性+3 · 体力-1","fx":{"stam":-1,"heart":3}},{"t":"「它量的是树，你量的是地——把它放回去，干活。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"金龟子","kind":"互动（心性/观测）","text":"午后，**一只金龟子**不知从哪飞来，一头撞在小信使的帽檐上，翻了个身，六脚朝天乱蹬。他小心把它翻过来，捧在手心：「前辈，它是不是飞太急了？」","opts":[{"t":"顺着他的话，讲赶路也要看路","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"教他观察金龟子的鞘翅花纹","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"「它撞帽子是它的事——帽子戴好，别学它。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"蟑螂","kind":"互动（心性/精神）","text":"夜宿的老屋里，**一只蟑螂**从墙缝探出触须，飞快地蹿过月光照到的一小块地面。小信使睡得迷迷糊糊，翻了个身嘟囔：「前辈……是不是有东西过去了？」","opts":[{"t":"轻声应他「是风」，等他重新睡熟","note":"心性+3 · 精神+1","fx":{"mind":1,"heart":3}},{"t":"起来把墙角缝隙堵一堵，让他睡得踏实","note":"心性+4 · 体力-2","fx":{"stam":-2,"heart":4}},{"t":"「蟑螂而已，怕什么——睡你的觉。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"野莓","kind":"互动（心性/补给）","text":"坡地的灌木丛里，**一蓬野莓**熟得发紫，挂着晨露。小信使摘了一颗，先举到你面前：「前辈，你尝，甜的。」","opts":[{"t":"接过来尝一颗，教他认哪些莓子不能吃","note":"心性+4 · 补给+2","fx":{"food":2,"heart":4}},{"t":"陪他摘满一小袋，路上当零嘴","note":"心性+3 · 补给+3 · 体力-2","fx":{"stam":-2,"food":3,"heart":3}},{"t":"「甜归甜，别多吃——野莓吃多了拉肚子。」","note":"心性-1","fx":{"heart":-1}}]},
    {"title":"彩虹","kind":"互动（心性/精神）","text":"骤雨初歇，**一道彩虹**横跨河谷，一头搭在对岸的山梁上。小信使仰着头，手指沿着虹弧慢慢划：「前辈，走到那头，是不是就能摸到它？」","opts":[{"t":"顺着他的话，讲虹是水汽照出来的光","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"陪他在河边站着，等彩虹慢慢淡掉","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"「摸不到——虹是走不到的，看两眼就该走了。」","note":"心性-2","fx":{"heart":-2}}]},
    {"title":"日落","kind":"互动（心性/精神）","text":"收工前，**太阳正落到山脊上**，把整片天染成一层一层的橘红。小信使站在测绘架边，影子拖得老长，轻声说：「前辈，天快黑了，咱们还赶得回去吗？」","opts":[{"t":"陪他看完日落，再收拾行装","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"教他按太阳的位置估天黑的时间","note":"心性+3 · 观测+1","fx":{"obs":1,"heart":3}},{"t":"「太阳落山是它的规矩，咱们有咱们的路——收架子，走。」","note":"心性-2","fx":{"heart":-2}}]},

    {"title":"斗笠","kind":"互动（心性/补给）","text":"歇脚时，**小信使的斗笠**被风掀翻了，骨碌碌滚下坡。他追了两步又跑回来，举着斗笠朝你笑：「前辈，帽绳松了，你给我系系呗。」","opts":[{"t":"蹲下来给他重新系紧帽绳，教他打活结","note":"心性+4 · 精神+1","fx":{"mind":1,"heart":4}},{"t":"顺手给斗笠补一道边，下雨天不漏水","note":"心性+3 · 补给+1 · 体力-2","fx":{"stam":-2,"food":1,"heart":3}},{"t":"「自己系——绳松了要会自己紧，路上没人替你系。」","note":"心性-2","fx":{"heart":-2}}]},

    {"id":"o13","title":"老鼠","text":"半夜，储物间传来**窸窸窣窣的动静**，像是有什么东西在翻腾纸箱。值班笔记里夹着张旧字条：「站里有老鼠，别放吃的在外头。—— 上一位」","opts":[{"t":"设个简单的陷阱","note":"补给-1 · 精神+2 · 观测+1","fx":{"food":-1,"mind":2,"obs":1}},{"t":"拎灯进去看看是什么","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"当没听见","note":"精神-1","fx":{"mind":-1}}]},
    {"id":"o14","title":"货梯","text":"走廊尽头是一台**生锈的货梯**，按钮面板蒙着灰，指示灯全灭。电梯井深处偶尔传来一声闷响，像有东西在下面挪动。","opts":[{"t":"按一下按钮，看它会不会来","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"举灯检查电梯井道","note":"观测+3 · 精神-3 · 体力-3","fx":{"stam":-3,"mind":-3,"obs":3}},{"t":"不碰——这站里，有些门不该打开","note":"精神-1","fx":{"mind":-1}}]},
    { id:'n1', title:'窗外的影子', text:'夜半，你看见**窗外有个人影贴着玻璃站着**。可这是三层，窗外是荒原。',

    { id:'n3', title:'食堂的椅子', text:'食堂的椅子**被摆成整整齐齐的一排，正对门口**——像在开站会，等人到齐。',

    { id:'n4', title:'门缝的绿光', text:'设备间的门缝里透出**幽幽的绿光**，像是恒温柜的指示灯在独自亮着。',

    { id:'n13', title:'响起的广播', text:'凌晨，**广播自己开了**。一阵刺耳的电流尖啸划破安静，三秒后戛然而止——像被人一把掐断。',

    { id:'n15', title:'陌生的字迹', text:'值班日志上多了一行字，**不是你的笔迹**：「第五天，来者不善。」你确定昨晚睡前还没这行字。',
