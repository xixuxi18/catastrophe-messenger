    recordEnding(ending);
    var obsTotal=(gearFx().obs||0)+S.obs;
    var avg=(S.stam+S.temp+S.food+S.mind)/4;
    var score=Math.round(Math.min(100, n*14 + obsTotal*2 + avg*0.3 + rescued*6 + (mode==='radio'?6:(mode==='people'?5:(mode==='deal'?3:1)))));
    S.score=score; S.grade=crashGrade(score); S.obsTotal=obsTotal; S.avg=Math.round(avg);
    if(score>S.best){ S.best=score; try{ localStorage.setItem('tm_best_v4',String(score)); }catch(e){} }
    crashUnlockColl(ending,n);
    addLog('sys','撤离 · '+crashEvacName(mode)+' · 带回文件 '+n+' / 3');
    aftermath();
    render();
  }
  function crashGrade(score){
    return score>=90?'S':score>=75?'A':score>=60?'B':score>=45?'C':'D';
  }
  // —— crash 专属藏品（蚊子腿） ——
  function crashUnlockColl(ending,n){
    var got=[];
    bumpFlag('cAny');
    unlockColl('c_letter'); got.push(collectionById('c_letter'));
    if(n>=3){ bumpFlag('cFull'); unlockColl('c_record'); got.push(collectionById('c_record')); }
    if(ending==='c_people'){ bumpFlag('cPeople'); unlockColl('c_scarf'); got.push(collectionById('c_scarf')); }
    S.newColls=got.filter(function(x){return x;});
  }

  function continueMarch(){
    if(S.phase!=='trans') return;
    if(S.initialMarch){
      S.initialMarch=false;
      S.phase='travel';
    } else if(S.turn%3===2){
      // 晚段行军结束 → 夜间扎营
      S.campStage='choose';
      S.campText=makeCamp();
      S.phase='camp';
    } else {
      S.turn++;
      if(S.mission==='survival'){ survivalAdvance(); setCurEv(); S.phase='travel'; render(); return; }
      if(S.turn>0 && S.turn<SEGS && regionOf(S.turn)!==regionOf(S.turn-1)){ addTrack('▣','进入'+REGIONS[regionOf(S.turn)].name); }
      if(S.turn>=SEGS){ if(S.mission==='sargon'){ sargonArrive(false); } else if(S.mission==='crash'){ crashArrive(); } else { beginFinal(); } }
      else { S.weather=S.wchain[S.turn]; setCurEv(); S.phase='travel'; }
    }
    render();
  }

  function campChoose(idx){
    if(S.phase!=='camp' || S.campStage!=='choose') return;
    var c=CAMP_TYPES[idx];
    var fx={};
    for(var k in c.fx){ fx[k]=c.fx[k]; }
    // 菲林：扎营消耗减半
    if(S.race==='feline'){
      if(fx.food<0) fx.food=Math.ceil(fx.food*0.75);
      if(fx.temp<0) fx.temp=Math.ceil(fx.temp*0.75);
    }
    applyFx(fx);
    var res;
    if(Math.random()<c.risk){ applyFx(c.night.fx); res=c.name+'。'+c.night.text; }
    else { res=c.name+'。'+c.ok; }
    S.campResultText=res;
    S.campStage='result';
    addLog('sys','第'+day()+'日晚宿营：'+c.name);
    if(checkDead()){ render(); return; }
    render();
  }

  function continueCamp(){
    if(S.phase!=='camp' || S.campStage!=='result') return;
    S.turn++;
    if(S.turn>0 && S.turn<SEGS && regionOf(S.turn)!==regionOf(S.turn-1)){ addTrack('▣','进入'+REGIONS[regionOf(S.turn)].name); }
    if(S.turn>=SEGS){ if(S.mission==='sargon'){ sargonArrive(false); } else if(S.mission==='crash'){ crashArrive(); } else { beginFinal(); } }
    else { S.weather=S.wchain[S.turn]; setCurEv(); S.phase='travel'; }

  }

  // ===== 终局 =====

  function sysSettleLabels(){

        tb0:'时间刚好踩线，点火准备容不下一点差错 → 校准 **+0**', tbNeg:'你已**超时**，仓促抵达雪线，点火准备捉襟见肘 → 校准 **',
        fbPos:'你在雪线上的名声，带来了愿意替你守夜的山民 → 校准 **+', fbNeg:'你冷漠的名声让山民远远避开，没人愿为你多等一刻 → 校准 **',

        tb0:'时间刚好踩线，启程窗口容不下一点差错 → 测算 **+0**', tbNeg:'你已**超时**，仓促抵达舰桥，启程校准捉襟见肘 → 测算 **',
        fbPos:'你在城市里的名声，换来了愿意替你复核数据的领航员 → 测算 **+', fbNeg:'你冷漠的名声让城市对你保持距离，没人愿为你多看一眼仪表 → 测算 **',
        sbL:'你帮过的人，会在最关键的时刻替你盯着航向 → 测算 **+' };

      tb0:'时间刚好踩线，容不下一点差错 → 预警 **+0**', tbNeg:'你已**超时**，仓促抵达观测点，布防捉襟见肘 → 预警 **',
      fbPos:'你在荒原上的名声，为你带来了心甘情愿的援手 → 预警 **+', fbNeg:'你冷漠的名声让荒原选择沉默，没人愿为你多等一刻 → 预警 **',
      sbL:'你救过的人，会在最关键的时刻挺身而出 → 预警 **+' };

  function beginFinal(){
    S.phase='final';
    S.finalStage=0;
    S.obsTotal=(gearFx().obs||0)+S.obs;
    var base=Math.min(20, Math.floor(S.obs/2));   // 整局观测积累加成
    var tb=timeBonus();                            // 时间：提前抵达→从容布防
    var fb = S.fame>=75 ? 5 : (S.fame<=25 ? -5 : 0);  // 名声：善意带来援手/冷漠换来沉默
    var sb = S.saved>=2 ? 6 : (S.saved>=1 ? 3 : 0);   // 救人：有人替你冒死传数据
    S.finalPts = base+tb+fb+sb;
    // 旅程回声文本（按系统标签）
    var L=sysSettleLabels();
    var lines=[];
    lines.push(L.baseL+base+'**');
    if(tb>0) lines.push(L.tbL+tb+'**');
    else if(tb===0) lines.push(L.tb0);
    else lines.push(L.tbNeg+tb+'**');
    if(fb>0) lines.push(L.fbPos+fb+'**');
    else if(fb<0) lines.push(L.fbNeg+fb+'**');
    if(sb>0) lines.push(L.sbL+sb+'**');
    if(S.crystal>=3) lines.push('⚠ 你携带的**源石结晶与天象共鸣**，风暴将更猛烈地撕咬你（终局精神压力增大）');
    S.finalEcho=lines;
    var ft=FINAL_TYPES[S.finalType];
    var msn=missionById(S.mission);
    var arriveTxt = msn&&msn.id==='beacon' ? '你抵达了谢拉格雪线' : (msn&&msn.id==='launch' ? '你抵达了启航城市' : '你抵达了观测点');
    var proLine = msn&&msn.id==='beacon' ? '观测员，信标能不能亮，就看你这一路了。' : (msn&&msn.id==='launch' ? '观测员，城市升不升得起来，看你的测算。' : '观测员，我在看着你。把数据发出来，我们就赢了。');
    addLog('sys', arriveTxt+'。'+ft.name+'正在逼近——这是最后的机会。');
    addLog('pro', proLine);
    render();
  }
  function finalChoose(idx){
    if(S.phase!=='final') return;
    var ft=FINAL_TYPES[S.finalType];
    var ev=ft.stages[S.finalStage];
    var opt=ev.opts[idx];
    if(optDisabled(opt)) return;
    var fx=raceFx(ev,opt);
    applyFx(fx);
    // 雪山信标 · 点亮仪式（一次性检验：燃料/火种/体温）
    if(S.beaconUnit && ev.stage===3 && opt.lit){
      if(opt.lit.fail){
        S.beaconLit=false;
        addLog('sys','你的双手在寒风里失去知觉，信标始终没能亮起。');
      } else {
        // 登山站燃料（litBuff）让 50% 的孤注一掷提升到 65%
        var lc=opt.lit.chance||0;
        if(S.temp<40 && !opt.lit.needFlare) lc=lc*0.5;   // V10.6：体温过低 → 徒手打火成功率减半（不再完全禁选）
        if(S.litBuff>0 && opt.lit.chance<=0.5) lc=Math.min(1, lc+0.15);
        if(UPS.ignite>=2) lc=Math.min(1, lc+0.05);   // 信标引燃术 Lv2：徒手打火成功率 +5%
        if(Math.random()<lc){
          S.beaconLit=true;
          S.finalPts+=45;
          addLog('sys','信标在风雪中「腾」地亮起，火光穿透雪幕——雪线之上，罗德岛的接应看到了那一点微光。');
        } else {
          S.beaconLit=false;
          addLog('sys','火种在寒风里熄灭了。你手忙脚乱地又试了一次，雪幕却已经合拢——信标，没能亮起。');
        }
      }
      if(checkDead()){ render(); return; }
      S.finalStage++;
      if(S.finalStage>=3){ finalize(); }
      else { render(); }
      return;
    }
    // 源石结晶与天灾共鸣：携带越多，终局越凶
    var cp = S.crystal>=6 ? 4 : (S.crystal>=3 ? 2 : 0);
    if(cp){ S.mind=Math.max(0,S.mind-cp); }
    S.finalPts+=opt.pts;
    // V10.8 移动城市：城心贯穿终局——城心越高，居民越愿与你并肩，每段额外加分
    if(S.mission==='launch'){
      var ch=(S.cityHeart||0);
      var chB=(ch>=85?6:(ch>=75?4:(ch>=60?2:0)));
      if(chB){ S.finalPts+=chB; addLog('sys','城心 '+ch+' · 居民协同 +'+chB); }
    }
    addLog('sys','终局第'+(S.finalStage+1)+'段「'+ev.title.split(' · ')[1]+'」：'+opt.t);
    if(checkDead()){ render(); return; }
    S.finalStage++;
    if(S.finalStage>=3){ finalize(); }
    else { render(); }
  }
  // 终局旅程回声选项：由你的旅途塑造（观测/救人/名声）
  function finalEcho(idx){
    if(S.phase!=='final') return;
    var ex=finalExtras();
    var o=ex[idx];
    if(!o) return;
    if(S.echoUsed[o.key]) return;
    S.echoUsed[o.key]=true;
    applyFx(o.fx||{});
    S.finalPts+=o.pts;
    addLog('sys','终局「'+o.title+'」：'+o.t);
    if(checkDead()){ render(); return; }
    render();
  }
  // 结算：剩余材料/结晶折算为跨局功勋（每局仅一次）
  function settleOnce(){
    if(S.settled) return;
    S.settled=true;
    var parts=[], total=0;
    if(S.mats>0){ var g1=S.mats*2; total+=g1; parts.push('材料 x'+S.mats+' → 功勋 +'+g1); }
    if(S.crystal>0){ var g2=S.crystal*5; total+=g2; parts.push('源石结晶 x'+S.crystal+' → 功勋 +'+g2); }
    if(total>0){ addGlory(total); S.settleText=parts.join(' · ')+'。本次回收 <b class="hl">'+total+' 功勋</b>，罗德岛账户现有 <b class="hl">'+GLORY_BALANCE+'</b>。'; }
    else { S.settleText='此行所剩无几，罗德岛回收站一无所获。账户现有功勋 '+GLORY_BALANCE+'。'; }
  }
  function renderGlorySettle(){
    if(!S.settled) return '';
    return '<div class="app-label" style="margin-top:16px">罗德岛功勋 · 物资回收</div>'
      +'<div class="ev-text" style="border-left-color:rgba(82,207,196,.55)">'+rich(S.settleText)+'</div>';
  }

  function retreat(){
    if(S.phase!=='final') return;
    settleOnce();
    S.phase='end'; S.ended='retreat'; S.arrived=false; S.finalSuccess=false;
    S.score=endScore(); S.grade='—';
    recordEnding('retreat');
    addLog('pro','……活着回来，也是一种胜利。');
    aftermath();
    render();
  }
  function finalize(){
    settleOnce();
    S.phase='end';
    if(S.mission==='beacon'){ S.finalSuccess = S.finalPts>=50 && S.beaconLit; }
    else if(S.mission==='launch'){ S.finalSuccess = S.finalPts >= launchSuccessLine(); } // V10.9 城心联动成败线
    else { S.finalSuccess = S.finalPts>=50; }
    S.arrived = S.finalSuccess;
    var f=gearFx();
    var obsTotal=(f.obs||0)+S.obs;
    var avg=(S.stam+S.temp+S.food+S.mind)/4;
    var score=Math.round(Math.min(100, obsTotal*10 + avg*0.4 + (S.finalSuccess?10:0)));
    var grade = score>=90?'S':score>=75?'A':score>=60?'B':score>=45?'C':'D';
    S.score=score; S.grade=grade; S.obsTotal=obsTotal; S.avg=Math.round(avg);
    if(score>S.best){ S.best=score; try{ localStorage.setItem('tm_best_v4',String(score)); }catch(e){} }
    S.ending = pickEnding();
    recordEnding(S.ending);
    aftermath();
    render();
  }
  // V10.9：移动城市「启程成功线」随城心浮动——城心高，居民兜底、成功线下降；城心低，城市离心、成功线上升
  function launchSuccessLine(){
    var ch=S.cityHeart||0;
    var sl=62 - Math.min(20, Math.floor(ch/10)*2);
    return Math.max(42, Math.min(62, sl));
  }
  function pickEnding(){
    var f=gearFx();
    if(!S.finalSuccess) return S.mission==='beacon' ? 'b_fail' : (S.mission==='launch' ? 'l_fail' : 'fail');
    // V10：谢拉格雪原线专属结局（点亮为核心）
    if(S.mission==='beacon'){
      if(!S.beaconLit) return 'b_fail';
      if(S.finalPts>=70 && S.fame>=80 && S.saved>=2) return 'b_lit_true';
      if(S.saved>=1) return 'b_lit_hero';
      if(S.avg<45) return 'b_lit_bare';
      return 'b_lit_steady';
    }
    // V10.5：移动城市线专属结局（城心为核心；V10.8 提升城心权重，门槛需实际积累）
    if(S.mission==='launch'){
      if(S.finalPts>=70 && S.fame>=80 && S.cityHeart>=85) return 'l_true';
      if(S.saved>=1 || S.cityHeart>=75) return 'l_hero';
      if(S.avg<45 || S.cityHeart<40) return 'l_bare';
      return 'l_steady';
    }
    if(S.finalPts>=70 && S.fame<=25 && S.obsTotal>=25 && S.crystal>=3) return 'lone';
    if(S.finalPts>=75 && S.fame>=80 && S.obsTotal>=25 && S.crystal>=1) return 'trueEnd';
    if(S.finalPts>=75 && S.fame>=26 && S.fame<=79 && S.obsTotal>=30 && S.crystal>=2) return 'gauge';
    if(S.finalPts>=70 && S.obsTotal>=25 && S.temp<40 && S.crystal>=1) return 'snowline';
    if(S.finalPts>=70 && S.obsTotal>=25 && S.mind<40 && S.crystal>=1) return 'whisper';
    if(f.rifle && S.fought>=1) return 'soldier';
    if(S.saved>=1) return 'hero';
    if(S.avg<45) return 'battered';
    if(S.finalPts>=70 && S.obsTotal>=20) return 'perfect';
    return 'steady';
  }
  // V10：结算面板判定文案按系统
  function sysEndGrade(){
    var g='评级 <b>'+S.grade+'</b>';
    if(S.mission==='beacon'){ return '点亮仪式判定 · 信标 '+(S.beaconLit?'已点亮':'未点亮')+' · 校准 '+S.finalPts+' / 成功线 50 · '+g; }
    if(S.mission==='launch'){
      var ch=S.cityHeart||0, sl=launchSuccessLine();
      var chB=(ch>=85?6:(ch>=75?4:(ch>=60?2:0)));
      var hl = sl<S.finalPts ? '<b class="hl">已越过成功线 '+sl+'</b>' : '成功线 '+sl;
      return '启程判定 · 测算 '+S.finalPts+' / '+hl+' · 城心 '+ch+'（居民协同每段 +'+chB+'） · '+g;
    }
    return '天灾降临判定 · 预警 '+S.finalPts+' / 成功线 50 · '+g;
  }

  function makeTransit(){
    var r=REGIONS[regionOf(S.turn)];
    var pool = (Math.random()<0.5) ? r.env : sysTransit()[tod()];
    var txt=pool[Math.floor(Math.random()*pool.length)];
    var roll=Math.random(), tail;
    // 坠机线通讯全断：只用独行/战场环境尾巴，绝不出现任何通讯（V12.6 修复通讯穿越）
    if(S.mission==='crash'){
      if(roll<0.4){ tail=stormLine(); }
      else { tail=CRASH_TAILS[Math.floor(Math.random()*CRASH_TAILS.length)]; }
      return { txt:txt, tail:tail };
    }
    if(roll<0.4){ tail=stormLine(); }
    else if(roll<0.52){ tail=TAIL_LINES.pro[Math.floor(Math.random()*TAIL_LINES.pro.length)]; }
    else if(roll<0.76){ tail=TAIL_LINES.sai[Math.floor(Math.random()*TAIL_LINES.sai.length)]; }
    else { tail=TAIL_LINES.cou[Math.floor(Math.random()*TAIL_LINES.cou.length)]; }
    return { txt:txt, tail:tail };
  }

  function obsPlus(){ if(UPS.obs>=2) return true; if(collHas('obsPlus')) return true; return false; }
  function matPlus(){ if(UPS.obs>=2) return true; return false; }
  function applyFx(fx){
    if(!fx) return;
    if(fx.stam) S.stam+=fx.stam;
    if(fx.temp) S.temp+=fx.temp;
    if(fx.food) S.food+=fx.food;
    if(fx.mind) S.mind+=fx.mind;
    if(fx.obs){ S.obs+=fx.obs; if(fx.obs>0 && obsPlus()) S.obs+=1; S.obs=Math.max(0,S.obs); }
    if(fx.ammo) S.ammo+=fx.ammo;
    if(fx.arrow) S.arrow=Math.max(0,S.arrow+fx.arrow);
    if(fx.bandage) S.bandage=Math.max(0,(S.bandage||0)+fx.bandage);
    if(fx.med) S.medLeft=Math.max(0,(S.medLeft||0)+fx.med);   // V12.6：修复 fx.med 被忽略导致坠机线买不到药、腿伤无法处理
    if(fx.tinder) S.tinder=Math.max(0,S.tinder+fx.tinder);
    if(fx.bait) S.bait=Math.max(0,S.bait+fx.bait);
    if(fx.bolt) S.bolt+=fx.bolt;
    if(fx.huntBuff) S.huntBuff+=fx.huntBuff;
    if(fx.mats){ S.mats=Math.max(0,S.mats+fx.mats); if(fx.mats>0 && matPlus()) S.mats+=1; }
    if(fx.trap) S.trapLeft+=fx.trap;
    if(fx.crystal) S.crystal+=fx.crystal;
    if(fx.fame) S.fame=Math.max(0,Math.min(100,S.fame+fx.fame));
    if(fx.money){ S.moneyBudget=(S.moneyBudget||0)+fx.money; if(fx.money<0){ CAREER.goldSpent=(CAREER.goldSpent||0)-fx.money; saveCareer(); } }   // V12.4b：途中负向龙门币收支记入累计消耗
    if(fx.saved){ S.saved+=fx.saved; S.fame=Math.max(0,Math.min(100,S.fame+ (S.mission==='sargon'?1:fx.saved*12) )); }   // V11.3：救人名声 +12 → 萨尔贡 +1（数据已同步缩水）
    if(fx.flare) S.flareCnt=(S.flareCnt||0)+fx.flare;
    if(fx.litBuff) S.litBuff=(S.litBuff||0)+fx.litBuff;
    if(fx.cityHeart) S.cityHeart=Math.max(0,Math.min(100,S.cityHeart+fx.cityHeart));
    if(fx.water) S.water=Math.max(0,Math.min(100+(gearFx().canteen||0)*20,(S.water===undefined?80:S.water)+fx.water));
    if(fx.insight) S.insight=Math.max(0,Math.min(100,S.insight+fx.insight));
    // F28：求生线废弃补给点——补 S.surv 道具字段
    if(S.surv){
      if(fx.survRations) S.surv.rations=Math.max(0,S.surv.rations+fx.survRations);
      if(fx.survWater) S.surv.waterLeft=Math.max(0,S.surv.waterLeft+fx.survWater);
      if(fx.survFlares) S.surv.flares=Math.max(0,S.surv.flares+fx.survFlares);
    }
    clamp();
  }

  function checkDead(){
    // 萨尔贡无尽：软性死亡——被救起后在村醒来，名望受损、见闻保留（不直接死亡）
    if(S.mission==='sargon'){
      var sKeys=['stam','temp','food','mind'];
      for(var sk=0;sk<sKeys.length;sk++){
        if(S[sKeys[sk]]<=0){ sargonRescue(); return true; }
      }
      return false;
    }
    // 裂谷勘探：软性死亡——救援队找到你，直接结算（不继续）
    if(S.mission==='survival'){
      var svKeys=['stam','temp','food','mind'];
      for(var svk=0;svk<svKeys.length;svk++){
        if(S[svKeys[svk]]<=0){ survivalRescue(); return true; }
      }
      return false;
    }
    var keys=['stam','temp','food','mind'];
    for(var i=0;i<keys.length;i++){
      if(S[keys[i]]<=0){
        settleOnce();
        S.phase='end';
        S.arrived=false;
        S.death=keys[i];
        CAREER.deathBy[S.death]++; saveCareer();
        recordEnding('d_'+keys[i]);
        addLog('pro','……撑住。罗德岛会记住你传回的数据。');
        aftermath();
        return true;
      }
    }
    return false;
  }

  function shareCopy(){
    var txt=shareText();
    function ok(){ uiToast('战绩文案已复制，去粘贴发群吧'); }
    function fallback(){
      var ta=document.createElement('textarea');
      ta.value=txt;
      ta.style.cssText='position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ uiToast('复制失败，请手动复制'); }
      if(ta.parentNode) ta.parentNode.removeChild(ta);
    }
    if(navigator && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok,fallback);
    }else{ fallback(); }
  }
  // C4：按难度阶梯推荐下一条尚未体验的任务线（只依据图鉴解锁，不夹带个人偏好）
  var NEXT_LADDER=['warn','beacon','launch','observatory','crash','sargon','mentor','survival'];
  function missionDone(id){
    if(id==='survival') return false;   // 无终点沙盒，不做完成判定
    return CODEX.some(function(c){ return c.sys===id && S.unlocked[c.id]; });
  }
  function nextMissionId(){
    var start=NEXT_LADDER.indexOf(S.mission);
    if(start<0) return null;
    for(var k=1;k<=NEXT_LADDER.length;k++){
      var id=NEXT_LADDER[(start+k)%NEXT_LADDER.length];
      if(!missionDone(id)) return id;
    }
    return null;
  }

    if(!S || S.mission==='prologue') return '';
    var id=nextMissionId();

    var m=missionById(id);

    var lead=d.isFail?'这条线还没走通，想换个节奏也可以看看下一条线——':'这条线走过了，接下来可以试试——';
    return '<div class="next-line"><div class="nl-t">下一条线推荐</div>'
      +'<div class="nl-name">'+m.icon+' '+m.name+'</div>'
      +'<div class="nl-desc">'+lead+' '+m.desc+'</div>'
      +'<button class="btn" data-act="goNextMission" data-id="'+id+'">去看看「'+m.name+'」</button></div>';

      { title:'武器', items: GEAR.filter(function(x){return x.cls==='weapon';}) },
      { title:'通用装备', items: GEAR.filter(function(x){return x.cls==='gear' && !x.sys;}) }
    ];
    if(sysShown.length){ groups.push({ title:(S.mission==='beacon'?'雪原专属装备':(S.mission==='launch'?'移动城市专属装备':(S.mission==='sargon'?'荒漠专属装备':'任务专属装备'))), items:sysShown }); }
    for(var gi=0;gi<groups.length;gi++){
      var grp=groups[gi];
      html+='<div class="gear-sec" style="font-size:11.5px;font-weight:700;color:#52cfc4;letter-spacing:.5px;margin:10px 2px 4px;padding-top:8px;border-top:1px solid rgba(255,255,255,.09)">'+grp.title+'</div>';
      for(var i=0;i<grp.items.length;i++){

      var e=MENTOR_SURVIVE[i];
      // 冻僵/恍惚只由低属性强制触发，不进入随机池（V12.5c）

  // ===== 流程 =====
  function mentorBegin(){
    if(!(S.mName||'').trim()){
      S.mMsg='请先填写见习信使的姓名——档案室需要这个名字。';
      render(); return;
    }
    S.mName=S.mName.trim();
    S.gear=[];   // 师徒测绘不携带通用装备，只带测绘工具
    recordDepartSeen();
    if(mentorLoad() && S.mExped>0 && !S.mGrad && S.mStage<3){
      S.phase='mreturn'; S.mMsg='（接续师徒档案：第 '+S.mExped+' 次出勤后）';
      render(); return;
    }
    mentorReset();
    S.mStep=0; S.mIntroTxt=''; S.mLastLine='';
    S.phase='mintro'; render();
  }
  function setMTool(id){ if(S.phase!=='config'||S.mission!=='mentor') return; if(!mentorToolById(id)) return; S.mTool=id; render(); }
  function setMArea(id){ if(S.phase!=='mconfig') return; if(!mentorAreaById(id)) return; S.mArea=id; render(); }
  function mentorGo(){
    if(S.phase!=='mconfig') return;
    var a=mentorAreaById(S.mArea);
    S.mSegs=a.days*4; S.mTurns=0; S.mDone=0; S.mTod=MENTOR_TODS[0];
    mentorEvForTurn();
    S.turn=S.mTurns; SEGS=S.mSegs;
    S.phase='mtravel'; render();
  }
  // 段事件生成：固定槽位（第2段、倒数第2段）为师徒判定，其余按区域+时段抽生存/测绘
  function mentorEvForTurn(){
    var a=mentorAreaById(S.mArea);
    S.mTod=MENTOR_TODS[S.mTurns%4];
    // 低体温/低精神：强制触发危机事件（V12.5b）
    if(S.temp<25){ S.mEv=MENTOR_SURVIVE[MENTOR_SURVIVE.length-2]; return; }
    if(S.mind<30){ S.mEv=MENTOR_SURVIVE[MENTOR_SURVIVE.length-1]; return; }
    if(S.mTurns===1 || S.mTurns===S.mSegs-2){
      var mm=MENTOR_MEET[Math.floor(Math.random()*MENTOR_MEET.length)];
      S.mEv={ title:'师徒时刻 · '+mm.title, kind:'判定', text:mm.txt,
        opts:[{ t:'看他做得如何', note:'徒弟'+mentorStatName(mm.stat)+' · 判定', j:mm.stat }] };
      return;
    }
    if(Math.random()<0.75){ S.mEv=mentorSurviveFor(a.id, S.mTod); }
    else { S.mEv=MENTOR_DRAW[Math.floor(Math.random()*MENTOR_DRAW.length)]; }
  }
  function mentorPickNext(){
    if(S.mTurns>=S.mSegs){ mentorReturn(); return; }
    mentorEvForTurn();
    S.turn=S.mTurns; SEGS=S.mSegs;
    render();
  }
  // 每段固定消耗：体力/补给 + 精神/体温按昼夜（V12.5b）
  function mentorSegmentCost(){
    S.stam=Math.max(1,S.stam-1); S.food=Math.max(0,S.food-1);
    S.mind=Math.max(1,S.mind-1);
    if(S.mTod==='午') S.temp=Math.max(1,S.temp-1);
    else if(S.mTod==='晚') S.temp=Math.max(1,S.temp-1);
    else if(S.mTod==='夜') S.temp=Math.max(1,S.temp-2);
  }
  function mentorChoose(i){
    if(S.phase!=='mtravel'||!S.mEv) return;
    var o=S.mEv.opts[i];
    if(!o) return;
    if(o.j){
      S.mJudgeEv={stat:o.j, txt:o.t};
      S.mJudgeRes=undefined; S.mJudgeResBad=false;
      mentorSegmentCost();
      render(); return;
    }
    if(o.hunt){ mentorHunt(); return; }
    if(o.crisis){ mentorCrisis(); return; }
    mentorSegmentCost();
    mentorApplyFx(o.fx);
    S.mResultTitle='途中';
    S.mMsg=mentorFxText(o.fx);
    S.mResultActive=true; S.mTeachPending=false;
    render();
  }
  function mentorHunt(){
    if(S.phase!=='mtravel') return;
    var base=Math.round((S.mObs+S.mJudge)/2);
    var tool=mentorToolById(S.mTool);
    if(tool && (tool.fx==='obs'||tool.fx==='judge')) base+=3;
    var roll=mentorRoll(base);
    S.mResultTitle='狩猎';
    if(roll===2){ S.food=Math.min(99,S.food+15); S.stam=Math.min(100,S.stam+15); S.mDone=Math.min(100,S.mDone+4); S.mMsg='你伏低身子，借着风向摸到兽群侧翼。一声闷响，一头獠牙兽应声倒下。**小信使扛着猎物，脚步都轻快起来**——今晚的篝火上有肉了。'; }
    else if(roll===1){ S.mMsg='你出手时偏了半寸，兽群轰然散开。**只赶跑了一头，什么都没猎到**。小信使安慰你说：「前辈，明天还有机会。」'; }
    else { S.stam=Math.max(1,S.stam-2); S.mind=Math.max(1,S.mind-1); S.mMsg='那队兽比看上去警觉得多，你追了几步就放弃了，**白耗了一身力气**。小信使把水囊递过来，什么也没说。'; }
    S.mResultActive=true; S.mTeachPending=false;
    render();
  }
  function mentorCrisis(){
    if(S.phase!=='mtravel') return;
    var o=S.mEv&&S.mEv.opts&&S.mEv.opts.length?S.mEv.opts[0]:null;
    var stat=(o&&o.cstat)?o.cstat:'judge';
    var base=mentorStatVal(stat);
    var roll=mentorRoll(base);
    S.mResultTitle='险情';
    if(roll===2){
      S.mBond=Math.min(100,S.mBond+1);
      S.mMsg='千钧一发，你带着他避开了。**他抓着你袖口的手在抖，却一步都没乱**。你拍拍他：「站住了，就是好样的。」';
    } else if(roll===1){
      S.stam=Math.max(1,S.stam-3);
      S.mMsg='有惊无险。**你们灰头土脸地脱了身**，图板护在怀里没散，只是手脚都软了。';
    } else {
      S.stam=Math.max(1,S.stam-3); S.food=Math.max(0,S.food-2);
      S.mBond=Math.min(100,S.mBond+1);
      S.mMsg='那一下没能完全躲开。**他扑过来替你挡了一记**，自己磕在石头上，胳膊擦破一大片。你把他按坐下来包扎，他咬着牙说「不疼」——**但你看见他眼圈红了一下。**';
    }
    S.mResultActive=true; S.mTeachPending=false;
    render();
  }
  function mentorNext(){
    if(S.phase!=='mtravel') return;
    S.mResultActive=false; S.mResultTitle=''; S.mMsg='';
    S.mJudgeEv=null; S.mJudgeRes=undefined; S.mJudgeResBad=false;
    S.mTurns++;
    mentorPickNext();
  }
  function mentorFxText(fx){
    if(!fx) return '你们收拾好行装，继续向前。';
    var s=[];
    if(fx.done) s.push('完成度 +'+fx.done);
    if(fx.food) s.push('补给 +'+fx.food);
    if(fx.bond) s.push('默契 +'+fx.bond);
    if(fx.obs) s.push('观测 +'+fx.obs);
    if(fx.stam) s.push('体力 +'+fx.stam);
    if(fx.judge) s.push('判断 +'+fx.judge);
    if(fx.heart) s.push('心性 +'+fx.heart);
    return s.length?('这一程，'+s.join('，')+'。'):'你们收拾好行装，继续向前。';
  }
  function mentorApplyFx(fx){
    if(!fx) return;
    if(fx.bond) S.mBond=Math.min(100,S.mBond+fx.bond);
    if(fx.obs) S.mObs=Math.min(100,S.mObs+fx.obs);
    if(fx.stam) S.mStam=Math.min(100,S.mStam+fx.stam);
    if(fx.judge) S.mJudge=Math.min(100,S.mJudge+fx.judge);
    if(fx.heart) S.mHeart=Math.min(100,S.mHeart+fx.heart);
    if(fx.done) S.mDone=Math.min(100,S.mDone+fx.done);
    if(fx.food) S.food=Math.min(99,S.food+fx.food);
    if(fx.mind) S.mind=Math.min(100,Math.max(1,S.mind+fx.mind));
    if(fx.temp) S.temp=Math.min(100,Math.max(1,S.temp+fx.temp));
  }
  function mentorJudgeRoll(){
    if(S.phase!=='mtravel'||!S.mJudgeEv) return;
    var st=S.mJudgeEv.stat;
    var base=mentorStatVal(st);
    var tool=mentorToolById(S.mTool);
    if(tool && tool.fx===st) base+=3;
    var roll=mentorRoll(base);
    var res=mentorJudgeText(st, roll);
    if(roll===2){ S.mObs+=3; S.mBond=Math.min(100,S.mBond+1); S.mGood++; S.mDone=Math.min(100,S.mDone+10); if(S.mJudgeEv&&S.mJudgeEv.waterFind) S.food=Math.min(99,S.food+2); if(S.mJudgeEv&&S.mJudgeEv.forageFind) S.food=Math.min(99,S.food+2); }
    else if(roll===1){ S.mDone=Math.min(100,S.mDone+5); }
    else { S.mBond=Math.max(0,S.mBond-1); S.mBad++; S.mBadGuard++; S.mDone=Math.min(100,S.mDone+2); }
    S.mJudgeStat=st;
    S.mResultTitle='他做得如何';
    S.mMsg=res;
    S.mResultActive=true; S.mTeachPending=(roll===0);
    S.mJudgeEv=null; S.mJudgeRes=undefined; S.mJudgeResBad=false;
    render();
  }
  function mentorTeach(kind){
    if(S.phase!=='mtravel') return;
    S.mStyle[kind]=(S.mStyle[kind]||0)+1;
    if(kind==='teach'){ S.mJudge+=4; S.mObs+=1; S.mMsg='你把他带到一边，一处处指给他看：**「错不要紧，要紧的是知道错在哪。」**他在旁边点头，把那片地形重新看了一遍，比刚才认真得多。'; }
    else if(kind==='protect'){ S.mHeart+=4; S.mMsg='你没提那茬，只把图板接过来自己扛上：「**这片我来，下片换你。**」他愣愣地看着你，忽然把步子走得稳了一些。'; }

  function mentorReturn(){

  var GRAD_MAIL_KEY='tm_grad_mail_v1';
  function gradStageByPhase(ph){
    for(var i=0;i<GRAD_STAGES.length;i++){ if(GRAD_STAGES[i].phase===ph) return GRAD_STAGES[i]; }
    return null;

  function gradMailLoad(){ try{ return JSON.parse(localStorage.getItem(GRAD_MAIL_KEY)||'{}'); }catch(e){ return {}; } }
  function gradMailSave(d){ try{ localStorage.setItem(GRAD_MAIL_KEY, JSON.stringify(d)); }catch(e){} }
  function gradMailInit(name){
    var d=gradMailLoad();
    if(d.gradOk && (d.letters||0) < GRAD_LETTERS.length){ return; }  // 上一位的信未收完，保留
    d.gradOk=true; d.name=name||'小信使'; d.letters=0; d.tasks=0;

  // 测绘结果补充文本
  function gradSurveySuffix(approach, survey){
    if(approach==='free'){
      if(survey===2) return '\n\n**他自己走完了全程**，三个观测点的数据干净利落。你站在高地上，看着他收起水准仪的背影，心里有什么东西轻轻落了地。';
      if(survey===1) return '\n\n他选对了大方向，但第二处读数犹豫了很久，有一个点的数据只勉强够用。**不算差，只是还不够笃定。**';
      return '\n\n他在岔沟前绕了弯路，一个观测点的数据明显偏了。他回头望向你的时候，**眼神有些发虚。**';
    }
    if(approach==='hint'){
      if(survey===2) return '\n\n有了你的手势，他走得稳了，后面的观测点再没有犹豫，数据漂亮。**这一次，方向是你给的，路是他自己走的。**';
      return '\n\n有了你的手势，他顺利走完了剩下的路，数据合格。他还需要一点确认，但比过去少了。';
    }
    return '\n\n在你陪伴下他走完了这段，判断没错——**但你心里清楚，这一程还不能完全算他自己的。**';
  }
  function gradCrisisSuffix(crisisType, crisis){
    if(crisisType!=='trust') return '';
    if(crisis===2) return '\n\n他把那个旅人扶到背风处，检查了伤势，又把自己的水囊递了过去。**一套动作慌乱，却完整。**';
    if(crisis===1) return '\n\n他扶着人走回安全的地方，自己淋得透湿，但人和他都没事。';
    return '\n\n他跑过去的时候自己也滑了一跤，好在人拉住了，**只是测绘架在石头上磕坏了一处。**';
  }
  function gradChoose(i){
    var cur=gradStageByPhase(S.phase);
    if(!cur) return;
    var o=cur.opts[i]; if(!o) return;
    if(S.phase==='mgrad0'){
      mentorApplyFx(o.fx);
      S.mGradPrep=o.prep;
      S.mGradResult=o.txt; S.mGradResultNext='mgrad1'; S.phase='mgradres'; render();
    } else if(S.phase==='mgrad1'){
      var survey;
      if(o.approach==='free'){
        survey=mentorRoll(S.mJudge);
      } else if(o.approach==='hint'){
        var r=mentorRoll(Math.min(100,S.mJudge+18));
        survey=(r===2)?2:1;
      } else { survey=1; }
      S.mGradSurvey=survey; S.mGradApproach=o.approach;
      S.mGradResult=o.txt+gradSurveySuffix(o.approach,survey);
      S.mGradResultNext='mgrad2'; S.phase='mgradres'; render();
    } else if(S.phase==='mgrad2'){
      var ct=o.crisis, crisis;
      if(ct==='trust'){ crisis=mentorRoll(S.mHeart); }
      else if(ct==='split'){ crisis=1; S.mStam=Math.max(0,S.mStam-8); }
      else { crisis=0; }
      S.mGradCrisis=crisis; S.mGradCrisisType=ct;
      S.mGradResult=o.txt+gradCrisisSuffix(ct,crisis);
      S.mGradResultNext='mgradjudge'; S.phase='mgradres'; render();
    }
  }
  function gradNext(){
    if(S.phase!=='mgradres') return;
    var nx=S.mGradResultNext;
    if(nx==='mgrad1'||nx==='mgrad2'){ S.phase=nx; render(); return; }
    if(nx==='mgradjudge'){ gradJudge(); return; }
  }
  function gradScoreEnding(){
    var survey=S.mGradSurvey, ct=S.mGradCrisisType, crisis=S.mGradCrisis, score=0;
    if(S.mGradApproach==='free'){ score+= survey===2?40:(survey===1?24:6); }
    else if(S.mGradApproach==='hint'){ score+= survey===2?34:22; }
    else { score+=16; }
    if(ct==='trust'){ score+= crisis===2?40:(crisis===1?30:18); }
    else if(ct==='split'){ score+=28; } else { score+=12; }
    score+=5;   // 前夜准备协同
    S.mGradScore=score;
    var heartShown=(ct==='trust');
    if(score>=70 && heartShown && crisis>=1 && survey>=1) return 'm_triumph';
    if(score>=50 && survey>=1) return 'm_success';
    if(score>=30) return 'm_half';
    return 'm_giveup';
  }
  function gradJudge(){
    var id=gradScoreEnding();
    var e=GRAD_ENDINGS[id];
    S.mGrad=true;
    S.mFinal={id:id,title:e.title,text:e.text};
    recordEnding(id);
    if(id==='m_triumph'||id==='m_success'){ gradMailInit(S.mName); }
    mentorSave();
    S.phase='mfinal';
    render();
  }

    d.tasks=(d.tasks||0)+1;
    if((d.letters||0)>=GRAD_LETTERS.length){ gradMailSave(d); return; }
    if(d.tasks>=2){
      var p=Math.min(0.95,0.55+(d.tasks-2)*0.15);
      if(Math.random()<p){
        S.mLetterData=GRAD_LETTERS[d.letters];
        S.mLetterFrom=d.name||'小信使';
        d.letters++; d.tasks=0; S.phase='mletter';

    gradMailSave(d);

    if(S.phase==='trans'){

        +'<div class="march-bar">本段行军 · 体力 <b class="neg">-'+c.stam+'</b> · 补给 <b class="neg">-'+c.food+'</b> · 体温 <b class="neg">-'+c.temp+'</b> · 精神 <b class="neg">-'+c.mind+'</b>'
        +(S.mission==='sargon' ? ' · 饮水 <b class="neg">-'+((c.water||0))+'</b>'+(S.water<=0?'（<b class="neg">脱水！体力精神额外损耗</b>）':'') : '')
        +'</div>'
        +'<button class="btn-main" data-act="cont">继续前进</button>';
      card.innerHTML=html;
      return;
    }
    if(S.phase==='camp'){
      if(S.campStage==='choose'){
        var html='<div class="ev-kind wx">夜幕降临 · 旅途第 '+day()+' 日 · 晚</div>'
          +'<div class="ev-title">夜间宿营</div>'
          +'<div class="ev-text">'+rich(S.campText)+'</div>'
          +'<div class="ev-text" style="border-left-color:rgba(255,255,255,.25)">你该决定今晚怎么过了。扎营方式影响夜间消耗，也可能引来不速之客。</div>';

            +'<span class="lbl">'+cc.name+'</span>'
            +'<span class="note">'+cc.desc+'</span>'
            +'<span class="note" style="margin-top:3px">本夜结算：'+campFxHtml(cc.fx)+'</span>'
            +'</button>';
        }
        card.innerHTML=html;
        return;
      }
      // result
      var html='<div class="ev-kind wx">宿营结束 · 旅途第 '+day()+' 日 · 晚</div>'

      card.innerHTML=html;

    if(S.phase==='final' && (S.finalType==='survival_evac' || S.finalType==='survival_rescue')){
      var survDays=S.surv.day;
      var survTrack=S.track.slice(-12).map(function(t){ return t.icon+' '+t.text; }).join('<br>');
      var isRescue = S.finalType==='survival_rescue';
      var survTitle = isRescue ? '你在医务室醒来' : '你登上了返航的飞行器';
      var survSub = isRescue
        ? '站长坐在床边，把一杯温水递到你手里。「数据拿回来一半，命也拿回来一半。下次别这样。」'
        : '驾驶员递过来一杯热水。你回头望——裂谷在旋翼下缓缓缩成一条红缝，仿佛从未有人来过。';
      var survColor = isRescue ? '#e8a0a0' : '#7fdfa0';
      var survHead = isRescue ? '裂谷勘探 · 被救回舰' : '裂谷勘探 · 成功撤离';
      var html='<div class="ev-kind final" style="color:'+survColor+'">'+survHead+'</div>'
        +'<div class="ev-title">'+survTitle+'</div>'
        +'<div class="ev-text final-text">'+survSub+'<br><br>'
        +'你在裂谷里活了 <b class="hl">'+survDays+' 天</b> · 深度：'+survDepthName()+'<br>'
        +'观测值 <b>'+S.obs+'</b>'+(isRescue?'（已折损50%）':'')+' · 材料 <b>'+S.mats+'</b><br>'
        +'撤离方式：<b>'+(S.surv.evacMethod||'徒步')+'</b>'+(isRescue?' · 累计被救 '+S.surv.rescued+' 次':'')+'<br><br>'

    if(S.phase==='final'){

      var ev=ft.stages[S.finalStage];
      var ptsLabel = S.mission==='beacon' ? ('当前校准 '+S.finalPts) : (S.mission==='launch' ? ('当前测算 '+S.finalPts) : ('当前预警 '+S.finalPts));
      var kindTag = (S.beaconUnit && ev.stage===3) ? ('终局阶段 3 / 3 · 点亮仪式 · 需燃料/火种/体温') : ('终局阶段 '+(S.finalStage+1)+' / 3 · '+ptsLabel);
      var html='<div class="ev-kind final">'+ev.kind+' · '+ft.name+' · '+kindTag+'</div>'
        +'<div class="ev-title">'+ev.title+'</div>'
        +'<div class="ev-text final-text">'+rich(ev.text)+'</div>';
      if(S.finalStage===0 && S.finalEcho && S.finalEcho.length){
        html+='<div class="echo-text"><b class="hl">旅程的回声</b><br>'+S.finalEcho.map(function(l){return rich(l);}).join('<br>')+'</div>';
      }
      var echoOpts=finalExtras();
      var optsHtml=renderOpts(ev.opts,'finalChoose');
      for(var ei=0;ei<echoOpts.length;ei++){
        var eo=echoOpts[ei];
        optsHtml+='<button class="opt" data-act="echoFinal" data-i="'+ei+'">'
          +'<span class="lbl">'+eo.t+'</span>'
          +'<span class="note hunt">'+eo.note+'</span>'
          +'</button>';
      }
      html+=optsHtml;
      if(S.finalStage===0){
        html+='<button class="opt" data-act="retreat" style="opacity:.55">放弃观测，撤离保命</button>';
      }
      card.innerHTML=html;
      return;
    }
    // end
    // 玻利瓦尔坠机：被处决（越狱 2 次后再败）走专属结算
    if(S.mission==='crash' && S.death==='exec' && S.phase==='end'){
      card.innerHTML=crashEndHTML();
      return;
    }
    if(S.death){
      var dt=DEATHS[S.death]||'遇难';
      var html='<div class="end-title fail">'+dt+'</div>'
        +'<div class="grade">旅途第 '+day()+' 日 · '+todCN()+' · 距观测点还有 '+Math.max(0,DAYS-day())+' 天</div>'
        +'<div class="ev-text">'+rich(DEATH_TEXTS[S.death])+'</div>'
        +'<div class="score-row">'
        +'<div class="score-cell"><div class="k">本局生存分</div><div class="v">'+endScore()+'</div></div>'
        +'<div class="score-cell"><div class="k">最高纪录</div><div class="v">'+S.best+'</div></div>'
        +'</div>'
        +renderTrackPanel()
        +renderGlorySettle()
        +renderCareerSummary()
        +shareBlockHTML()
        +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-main" data-act="restart">再来一局</button>'+codexBtn()+'</div>';
      card.innerHTML=html;
      return;
    }
    if(S.ended==='retreat'){
      var en=ENDINGS.retreat;
      var retreatTxt = S.mission==='beacon' ? ('旅途第 '+day()+' 日 · 你在暴风雪吞没雪线前撤离了') : (S.mission==='launch' ? ('旅途第 '+day()+' 日 · 你在兽潮逼近时撤离了舰桥') : ('旅途第 '+day()+' 日 · 你在天灾前撤离了观测点'));
      var html='<div class="end-title fail">'+en.title+'</div>'
        +'<div class="grade">'+retreatTxt+'</div>'
        +'<div class="ev-text">'+rich(en.text)+'</div>'
        +'<div class="score-row">'
        +'<div class="score-cell"><div class="k">本局生存分</div><div class="v">'+S.score+'</div></div>'
        +'<div class="score-cell"><div class="k">最高纪录</div><div class="v">'+S.best+'</div></div>'
        +'</div>'
        +renderTrackPanel()
        +renderGlorySettle()
        +renderCareerSummary()
        +shareBlockHTML()
        +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-main" data-act="restart">再来一局</button>'+codexBtn()+'</div>';
      card.innerHTML=html;
      return;
    }
    // 玻利瓦尔坠机：专属结算页（撤离成功）
    if(S.mission==='crash' && S.phase==='end' && !S.death){
      card.innerHTML=crashEndHTML();
      return;
    }
    // 正常结局
    var e=ENDINGS[S.ending]||ENDINGS.steady;
    var rtt=routeById(S.route);
    var html='<div class="end-title '+(e.cls==='ok'?'ok':'fail')+'">'+e.title+'</div>'
      +'<div class="grade">'+sysEndGrade()+((rtt&&routeSysName(rtt))?' · '+routeSysName(rtt):'')+' · 本次旅途 '+DAYS+' 日 '+SEGS+' 段</div>'
      +'<div class="ev-text">'+rich(e.text)+'</div>'
      +'<div class="score-row">'
      +'<div class="score-cell"><div class="k">观测数据</div><div class="v">'+S.obsTotal+'</div></div>'
      +'<div class="score-cell"><div class="k">平均生存</div><div class="v">'+S.avg+'</div></div>'
      +'<div class="score-cell"><div class="k">本局评分</div><div class="v">'+S.score+'</div></div>'
      +'<div class="score-cell"><div class="k">最高纪录</div><div class="v">'+S.best+'</div></div>'
      +'</div>'
      +renderTrackPanel()
      +renderGlorySettle()
      +renderCareerSummary()
      +shareBlockHTML()
      +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn-main" data-act="restart">再来一局</button>'+codexBtn()+'</div>';
    card.innerHTML=html;
  }

  function renderBar(){
    if(S.phase==='config'){
      var r=raceById(S.race);
      var tt=tireById(S.tire), ms=missionById(S.mission);
      if(S.mission==='sargon'){
        $('bar').innerHTML='<span>萨尔贡无尽 · 无尽巡游中 · '+SARGON_TIRE_MAP['mid'].name+'起步 · 请配装并接下第一个委托</span>'
          +'<span class="badge">功勋 '+GLORY_BALANCE+'</span>'

        $('bar').innerHTML='<span>坠机信使 · 玻利瓦尔 · 重伤开局 · 请选择随身武器</span>'
          +'<span class="badge">功勋 '+GLORY_BALANCE+'</span>'
          +'<span class="badge">最高纪录 '+S.best+'</span>';
        return;
      }
      if(S.mission==='mentor'){
        $('bar').innerHTML='<span>旧名 · 师徒测绘 · 带一名见习信使走测绘路 · 请填写姓名并配装</span>'
          +'<span class="badge">功勋 '+GLORY_BALANCE+'</span>'
          +'<span class="badge">最高纪录 '+S.best+'</span>';
        return;
      }
      $('bar').innerHTML='<span>出勤配置中 · 种族 '+r.name+' · '+(tt?tt.name:'')+' · '+(ms?ms.name:'')+' · 评级 '+UPS.rating+' · 请选择任务线、档位、路线与随身装备</span>'
        +'<span class="badge">功勋 '+GLORY_BALANCE+'</span>'
        +'<span class="badge">最高纪录 '+S.best+'</span>';
      return;
    }
    var timeCls = S.timeLeft>=8?'time-ok':(S.timeLeft>=0?'':'time-out');
    var timeTxt = S.timeLeft>=0?String(S.timeLeft):('超时'+(0-S.timeLeft));
    var fameCls = S.fame>=70?'fame-high':(S.fame<=30?'fame-low':'');
    // 萨尔贡无尽：委托板/确认/到村结算等中间阶段显示巡游状态，不显示旅行信息
    if(S.mission==='sargon' && (S.phase==='quest'||S.phase==='config2'||S.phase==='arrive')){
      var stageTxt = S.phase==='quest' ? ('委托板 · 第 '+(S.sargonStage+1)+' 阶段') : (S.phase==='config2' ? '委托确认' : ('村中结算 · '+S.destVillage));
      $('bar').innerHTML='<span>萨尔贡无尽 · '+stageTxt+'</span>'
        +'<span class="badge '+fameCls+'">名望 '+S.fame+' · Lv'+sargonLv()+' '+sargonTier()+'</span>'
        +'<span class="badge">见闻 '+S.insight+'</span>'
        +'<span class="badge">资金 '+S.moneyBudget+' 龙门币</span>'
        +'<span class="badge">功勋 '+GLORY_BALANCE+'</span>'
        +(sargonMarks()?'<span class="badge">印记 ×'+sargonMarks()+'</span>':'')
        +'<span class="badge">最高纪录 '+S.best+'</span>';
      return;
    }
    // 玻利瓦尔坠机：进行中顶栏（文件 / 伤势 / 势力关系 / 资金 / 局势）
    if(S.mission==='crash' && S.phase==='crashbrief'){
      $('bar').innerHTML='<span>坠机信使 · 玻利瓦尔 · 任务简报</span>'
        +'<span class="badge">资金 '+S.moneyBudget+' 龙门币</span>'
        +'<span class="badge">最高纪录 '+S.best+'</span>';
      return;
    }
    if(S.mission==='crash' && (S.phase==='travel'||S.phase==='trans'||S.phase==='crashfinal'||S.phase==='crashcaptive')){
      var docs=crashDocsOnYou();
      $('bar').innerHTML='<span>旅途第 <b>'+day()+'</b> 日 · '+todCN()+'</span>'
        +'<span class="badge">'+REGIONS[regionOf(S.turn)].name+'</span>'
        +'<span class="badge" style="'+(docs>0?'':'color:#e0706f;border-color:rgba(224,112,111,.5)')+'">文件 '+docs+' / 3</span>'
        +'<span class="badge" style="color:#e0706f">'+crashWoundDesc()+'</span>'
        +(S.capturedNow?'<span class="badge" style="color:#e0706f;border-color:rgba(224,112,111,.5)">被俘中</span>':'')
        +'<span class="badge">'+crashFactionDesc()+'</span>'
        +'<span class="badge">资金 '+S.moneyBudget+' 龙门币</span>'
        +'<span class="badge storm">坠机求生 · 局势'+crashTension()+'<span class="storm-prog"><i style="width:'+Math.min(100,Math.round(S.turn/SEGS*100))+'%"></i></span></span>'
        +'<span class="badge">最高纪录 '+S.best+'</span>';
      return;
    }
    // 旧名 · 师徒测绘：进行中顶栏（称呼 / 默契 / 学员四维 / 出勤数）
    if(S.mission==='mentor' && (S.phase==='mintro'||S.phase==='mconfig'||S.phase==='mtravel'||S.phase==='mstory'||S.phase==='mreturn'||S.phase==='mfinal')){
      var mtTxt;
      if(S.phase==='mintro') mtTxt='序幕 · 罗德岛';
      else if(S.phase==='mconfig') mtTxt='第 '+(S.mExped+1)+' 次出勤 · 选择测绘区';

      else if(S.phase==='mfinal') mtTxt='出师 · 毕业考';
      else if(S.mJudgeEv) mtTxt='师徒判定 · 第 '+(Math.floor(S.mTurns/4)+1)+' 天 · '+S.mTod;
      else mtTxt='测绘中 · 第 '+(Math.floor(S.mTurns/4)+1)+' 天 · '+S.mTod;
      $('bar').innerHTML='<span>旧名 · '+mtTxt+'</span>'
        +'<span class="badge">称呼 '+mentorTitle()+'</span>'
        +'<span class="badge">默契 '+S.mBond+'</span>'

        +'<span class="badge">最高纪录 '+S.best+'</span>';
      return;

    }
    else if(S.phase==='end'){
      prog=100;
      if(S.mission==='sargon'){ stormTxt='本季巡游结束'; }
      else {
        var msn2=missionById(S.mission);
        var doneTxt = msn2&&msn2.id==='beacon' ? '信标已点亮' : (msn2&&msn2.id==='launch' ? '城市已启程' : '预警已发出');
        stormTxt=S.arrived?doneTxt:(S.ended==='retreat'?'已撤离':'信号中断');
      }
    }
    else { prog=Math.min(100, Math.round(S.turn/SEGS*100)); 
      var msn=missionById(S.mission);
      if(S.mission==='sargon'){ stormTxt='委托 '+S.sargonStage+' · 目的地 '+S.destVillage; }
      else { stormTxt = msn&&msn.id==='beacon' ? ('信标组件 · 距雪线 '+Math.max(1,DAYS-day())+' 天') : (msn&&msn.id==='launch' ? ('启程测算 · 距窗口 '+Math.max(1,DAYS-day())+' 天') : ('天灾云团 · 距观测窗 '+Math.max(1,DAYS-day())+' 天')); }
    }
    var w=bestWeapon();
    var wTxt='';
    if(w && S.phase!=='end' && S.phase!=='final'){
      var am = w.cost==='ammo' ? (' · 铳弹'+S.ammo) : (w.cost==='bolt' ? (' · 弩箭'+S.bolt) : (w.cost==='trap' ? (S.trapLeft>0?' · 可用':'') : ''));
      wTxt='<span class="badge">'+w.label+am+'</span>';
    }
    var html='<span>旅途第 <b>'+day()+'</b> 日 · '+todCN()+'</span>'
      +(S.phase==='travel'||S.phase==='trans'||S.phase==='final'?'<span class="badge">'+REGIONS[regionOf(S.turn)].name+'</span>':'')
      +wTxt
      +((S.beaconUnit && S.phase!=='end')?'<span class="badge" style="color:#c9a7e8;border-color:rgba(201,167,232,.45)">信标组件随行</span>':'')
      +(S.mats>0?'<span class="badge">材料 '+S.mats+'</span>':'')
      +(S.phase==='travel'||S.phase==='trans'||S.phase==='final'?'<span class="badge">观测值 '+obsTotal()+'</span>':'')
      +((S.phase==='travel'||S.phase==='trans'||S.phase==='final')&&S.mission==='sargon'?'<span class="badge">见闻 '+S.insight+'</span>':'')
      +((S.phase==='travel'||S.phase==='trans'||S.phase==='final')?weatherInfo():'')
      +((S.phase==='travel'||S.phase==='trans'||S.phase==='final')?'<span class="badge '+timeCls+'">时间 '+timeTxt+'</span>':'')

  // ===== F34 交互提示音（Web Audio 现场合成，零音频文件、零外链） =====
  var SND_KEY='catastrophe_sound';
  var SND_CTX=null;
  function sndOn(){
    try{ return localStorage.getItem(SND_KEY)==='1'; }catch(e){ return false; }
  }
  function sndSet(on){
    try{ localStorage.setItem(SND_KEY, on?'1':'0'); }catch(e){}
    if(on){ sndEnsure(); }
  }
  function sndCtx(){
    if(typeof window==='undefined') return null;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    if(!SND_CTX){ try{ SND_CTX=new AC(); }catch(e){ return null; } }
    return SND_CTX;
  }
  function sndEnsure(){
    var c=sndCtx();
    if(c && c.state==='suspended' && typeof c.resume==='function'){ try{ c.resume(); }catch(e){} }
    return c;
  }
  function sndTone(freq,start,dur,type,vol){
    var c=sndCtx(); if(!c) return;
    var t0=c.currentTime+start;
    var osc=c.createOscillator();
    var g=c.createGain();
    osc.type=type||'sine';
    osc.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }
  function sndPlay(kind){
    if(!sndOn()) return;
    if(!sndEnsure()) return;
    if(kind==='click'){ sndTone(520,0,0.06,'triangle',0.045); }
    else if(kind==='success'){ sndTone(523.25,0,0.09,'sine',0.055); sndTone(783.99,0.08,0.13,'sine',0.055); }
    else if(kind==='danger'){ sndTone(311.13,0,0.10,'sawtooth',0.04); sndTone(207.65,0.09,0.15,'sawtooth',0.04); }
    else if(kind==='discover'){ sndTone(1046.5,0,0.16,'sine',0.05); sndTone(1567.98,0.05,0.14,'sine',0.035); }
  }

  // ===== F35 环境氛围音（Web Audio 合成，独立开关、默认关） =====
  var AMB_KEY='catastrophe_ambient';
  var AMB=null;
  function ambOn(){
    try{ return localStorage.getItem(AMB_KEY)==='1'; }catch(e){ return false; }
  }
  function ambSet(on){
    try{ localStorage.setItem(AMB_KEY, on?'1':'0'); }catch(e){}
    if(on){ ambStart(); } else { ambStop(); }
  }
  function makeNoiseBuffer(ctx){
    var len=ctx.sampleRate*2;
    var buf=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=Math.random()*2-1; }
    return buf;
  }
  function ambStart(){
    if(typeof window==='undefined') return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(AMB){ ambSetMode(AMB.mode); return; }
    var ctx;
    try{ ctx=new AC(); }catch(e){ return; }
    if(ctx.state==='suspended' && typeof ctx.resume==='function'){ try{ ctx.resume(); }catch(e){} }
    var master=ctx.createGain(); master.gain.value=0.0001; master.connect(ctx.destination);
    var noise=ctx.createBufferSource(); noise.buffer=makeNoiseBuffer(ctx); noise.loop=true;
    var filter=ctx.createBiquadFilter(); filter.type='bandpass'; filter.Q.value=0.7;
    var noiseGain=ctx.createGain(); noiseGain.gain.value=0;
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(master);
    var lfo=ctx.createOscillator(); lfo.frequency.value=0.08;
    var lfoGain=ctx.createGain(); lfoGain.gain.value=0;
    lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
    var hum=ctx.createOscillator(); hum.frequency.value=55;
    var humGain=ctx.createGain(); humGain.gain.value=0;
    hum.connect(humGain); humGain.connect(master);
    noise.start(); lfo.start(); hum.start();
    AMB={ctx:ctx,master:master,noise:noise,filter:filter,noiseGain:noiseGain,lfo:lfo,lfoGain:lfoGain,hum:hum,humGain:humGain,mode:'wind',crackleTimer:null};
    ambSetMode('wind');
  }
  function ambCrackle(a){
    if(a.crackleTimer && typeof clearInterval==='function'){ clearInterval(a.crackleTimer); }
    if(typeof setInterval!=='function') return;
    a.crackleTimer=setInterval(function(){
      if(!AMB||AMB.mode!=='fire') return;
      var ctx=a.ctx;
      var n=Math.random()<0.5?1:2;
      for(var k=0;k<n;k++){
        var t=ctx.currentTime+Math.random()*0.2;
        var o=ctx.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(400+Math.random()*1200,t);
        var g=ctx.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.018+Math.random()*0.02,t+0.005);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.04+Math.random()*0.05);
        o.connect(g); g.connect(a.master);
        o.start(t); o.stop(t+0.12);
      }
    },180);
  }
  function ambSetMode(mode){
    if(!AMB) return;
    var a=AMB, ctx=a.ctx, t=ctx.currentTime;
    a.mode=mode;
    if(mode==='wind'){
      a.filter.type='bandpass'; a.filter.Q.value=0.7;
      a.filter.frequency.cancelScheduledValues(t); a.filter.frequency.setValueAtTime(520,t);
      a.lfoGain.gain.cancelScheduledValues(t); a.lfoGain.gain.setValueAtTime(280,t);
      a.noiseGain.gain.cancelScheduledValues(t); a.noiseGain.gain.setValueAtTime(a.noiseGain.gain.value,t); a.noiseGain.gain.linearRampToValueAtTime(0.4,t+0.6);
      a.humGain.gain.cancelScheduledValues(t); a.humGain.gain.setValueAtTime(a.humGain.gain.value,t); a.humGain.gain.linearRampToValueAtTime(0,t+0.4);
      if(a.crackleTimer && typeof clearInterval==='function'){ clearInterval(a.crackleTimer); a.crackleTimer=null; }
    } else if(mode==='fire'){
      a.filter.type='lowpass'; a.filter.Q.value=0.5;
      a.filter.frequency.cancelScheduledValues(t); a.filter.frequency.setValueAtTime(320,t);
      a.lfoGain.gain.cancelScheduledValues(t); a.lfoGain.gain.setValueAtTime(0,t);
      a.noiseGain.gain.cancelScheduledValues(t); a.noiseGain.gain.setValueAtTime(a.noiseGain.gain.value,t); a.noiseGain.gain.linearRampToValueAtTime(0.25,t+0.6);
      a.humGain.gain.cancelScheduledValues(t); a.humGain.gain.setValueAtTime(a.humGain.gain.value,t); a.humGain.gain.linearRampToValueAtTime(0,t+0.4);
      ambCrackle(a);
    } else {
      a.filter.type='lowpass'; a.filter.Q.value=0.5;
      a.filter.frequency.cancelScheduledValues(t); a.filter.frequency.setValueAtTime(180,t);
      a.lfoGain.gain.cancelScheduledValues(t); a.lfoGain.gain.setValueAtTime(0,t);
      a.noiseGain.gain.cancelScheduledValues(t); a.noiseGain.gain.setValueAtTime(a.noiseGain.gain.value,t); a.noiseGain.gain.linearRampToValueAtTime(0.15,t+0.6);
      a.humGain.gain.cancelScheduledValues(t); a.humGain.gain.setValueAtTime(a.humGain.gain.value,t); a.humGain.gain.linearRampToValueAtTime(0.04,t+0.6);
      if(a.crackleTimer && typeof clearInterval==='function'){ clearInterval(a.crackleTimer); a.crackleTimer=null; }
    }
    a.master.gain.cancelScheduledValues(t); a.master.gain.setValueAtTime(Math.max(0.0001,a.master.gain.value),t);
    a.master.gain.linearRampToValueAtTime(0.35,t+0.8);
  }
  function ambStop(){
    if(!AMB) return;
    var a=AMB;
    if(a.crackleTimer && typeof clearInterval==='function'){ clearInterval(a.crackleTimer); a.crackleTimer=null; }
    var ctx=a.ctx, t=ctx.currentTime;
    var toStop=[a.noise,a.lfo,a.hum];
    try{ a.master.gain.cancelScheduledValues(t); a.master.gain.setValueAtTime(a.master.gain.value,t); a.master.gain.linearRampToValueAtTime(0.0001,t+0.4); }catch(e){}
    if(typeof setTimeout==='function'){
      setTimeout(function(){
        try{ for(var i=0;i<toStop.length;i++) toStop[i].stop(); }catch(e){}
        try{ ctx.close(); }catch(e){}
        AMB=null;
      },500);
    } else {
      AMB=null;
    }
  }
  // F35：根据当前场景推断氛围——观测站室内 hum、扎营/夜 fire、行进 wind
  function ambModeForState(){
    if(S.mission==='observatory') return 'hum';
    if(S.phase==='travel' && tod()==='night') return 'fire';
    return 'wind';

  function ambRefresh(){
    if(!ambOn()){ if(AMB) ambStop(); return; }
    if(!AMB){ ambStart(); return; }
    var want=ambModeForState();
    if(AMB.mode!==want) ambSetMode(want);
  }

  function obsvPickEnv(){
    var used=S.obsvEnvUsed||(S.obsvEnvUsed=[]);

  function tabGuardInit(){

      for(var i=0;i<localStorage.length;i++){

      }
      return ids;

    function heartbeat(){ try{ localStorage.setItem(HB_PREFIX+tabId, String(Date.now())); }catch(e){} }
    function showBanner(){

    window.addEventListener('beforeunload', function(){ try{ localStorage.removeItem(HB_PREFIX+tabId); }catch(e){} });

  // ===== 启动 =====

// ===== src/core/line_engine.js =====
/* ============================================================
 * line_engine.js · 线性测试剧本引擎（独立于现有 7 条线）
 * 模式：夜渡界河 —— 固定一夜旅程，唯一变量是开局整备
 * 规则：吃东西/用物品/看背包不耗时间；赶路/生火/扎营才耗时间
 * ============================================================ */

// 读 meta 计数器
function lineReadMeta(){
  return {
    deaths: parseInt(localStorage.getItem('cm_line_deaths')||'0',10),
    clears: parseInt(localStorage.getItem('cm_line_clears')||'0',10),
    best: parseInt(localStorage.getItem('cm_line_best')||'0',10)
  };
}
function lineAddDeath(){
  localStorage.setItem('cm_line_deaths', String(parseInt(localStorage.getItem('cm_line_deaths')||'0',10)+1));
}
function lineAddClear(){
  localStorage.setItem('cm_line_clears', String(parseInt(localStorage.getItem('cm_line_clears')||'0',10)+1));
}

// 进入线性模式
function lineStart(){
  var m=lineReadMeta();
  var budget=LINE_BUDGET;
  var bonus={};
  if(m.deaths>=1) bonus.temp=(bonus.temp||0)+2;
  if(m.deaths>=3) bonus.food=(bonus.food||0)+3;
  if(m.deaths>=5) bonus.water=(bonus.water||0)+3;
  if(m.clears>=2) budget+=100;
  S.phase='line';
  S.line={
    meta:m,
    budget:budget,
    spent:0,
    pack:null,
    bought:[],          // 已购物品 id
    freeItem:(m.clears>=1),  // 通关1次解锁免费多带一件
    freeChosen:false,
    stepMin:0,          // 出发后分钟数（0 = 17:00）
    stam:100+ (m.clears>=3?0:0),
    food:100+(bonus.food||0),
    water:100+(bonus.water||0),
    temp:100+(bonus.temp||0),
    mind:100,
    gear:{},            // id -> count
    msg:'',
    stage:'pack',
    gearOpen:false,       // pack / buy / trip / end
    nodeIdx:0,          // 当前节点索引
    campUsed:false,
    fireUsed:false,
    clearTitle:(m.clears>=3?'夜渡者':null)
  };
  render();
}

// 时间格式化：分钟数 -> HH:MM（17:00 起）
function lineFmtMin(min){
  var totalMin=17*60+min;
  var h=Math.floor(totalMin/60)%24;
  var m=totalMin%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}

// 当前温度（按节点表近似）
function lineCurTemp(min){
  var t=LINE_NODES[0].temp;
  for(var i=0;i<LINE_NODES.length;i++){
    if(min>=LINE_NODES[i].t) t=LINE_NODES[i].temp;
  }
  return t;
}

// 当前节点
function lineCurNode(min){
  var cur=LINE_NODES[0];
  for(var i=0;i<LINE_NODES.length;i++){
    if(min>=LINE_NODES[i].t) cur=LINE_NODES[i];
  }
  return cur;
}

// 选背包
function linePickPack(id){
  var L=S.line;
  if(L.stage!=='pack') return;
  L.pack=id;
  L.stage='buy';
  L.msg='';
  render();
}

// 买/退物品
function lineBuy(id){
  var L=S.line, g=null;
  for(var i=0;i<LINE_GEAR.length;i++){ if(LINE_GEAR[i].id===id){ g=LINE_GEAR[i]; break; } }
  if(!g) return;
  var idx=L.bought.indexOf(id);
  if(idx>=0){
    L.bought.splice(idx,1);
    L.spent-=g.price;
    if(L.freeChosen && g.id===L.freeItemId){ L.freeChosen=false; }
    L.msg='已取消：'+g.name;
  }else{
    var isFree=(L.freeItem && !L.freeChosen);
    if(!isFree && (L.budget-L.spent)<g.price){ L.msg='龙门币不够。'; render(); return; }
    // 重量检查
    var curKg=0;
    for(var j=0;j<L.bought.length;j++){
      var g2=null;
      for(var k=0;k<LINE_GEAR.length;k++){ if(LINE_GEAR[k].id===L.bought[j]){ g2=LINE_GEAR[k]; break; } }
      if(g2) curKg+=g2.weight;
    }
    var packMax=0;
    for(var p=0;p<LINE_PACKS.length;p++){ if(LINE_PACKS[p].id===L.pack) packMax=LINE_PACKS[p].maxKg; }
    if(curKg+g.weight>packMax){ L.msg='超重了（当前 '+curKg.toFixed(1)+'kg / 上限 '+packMax+'kg）。'; render(); return; }
    L.bought.push(id);
    if(isFree){ L.freeChosen=true; L.freeItemId=id; L.msg='免费多带：'+g.name; }
    else{ L.spent+=g.price; L.msg='已购入：'+g.name+'（-'+g.price+' 龙门币）'; }
  }
  render();
}

// 出发
function lineBeginTrip(){
  var L=S.line;
  if(L.bought.length===0){ L.msg='至少带点东西再走。'; render(); return; }
  for(var i=0;i<L.bought.length;i++){
    var id=L.bought[i], g=null;
    for(var j=0;j<LINE_GEAR.length;j++){ if(LINE_GEAR[j].id===id){ g=LINE_GEAR[j]; break; } }
    if(g && g.use && g.use.cnt){ L.gear[id]=g.use.cnt; }
    else if(g){ L.gear[id]=1; }
  }
  L.stage='trip';
  L.msg='';
  render();
}

// 赶路（+40 分钟）
function lineContinue(){
  var L=S.line;
  if(L.stage!=='trip') return;
  var oldMin=L.stepMin;
  L.stepMin+=40;

  // tick：每过 60 分钟扣一次
  var hoursPassed=Math.floor(L.stepMin/60)-Math.floor(oldMin/60);
  for(var h=0;h<hoursPassed;h++){
    L.food=Math.max(0,L.food-2);
    L.water=Math.max(0,L.water-1);
    var stamPen=1;
    for(var p=0;p<LINE_PACKS.length;p++){
      if(LINE_PACKS[p].id===L.pack && L.pack==='heavy') stamPen=2;
    }
    L.stam=Math.max(0,L.stam-stamPen);
  }

  // 夜间体温/精神
  var curTemp=lineCurTemp(L.stepMin);
  if(curTemp<=3){ L.temp=Math.max(0,L.temp-(3-curTemp)); }
  var isNight=(curTemp<=5);
  if(isNight){
    var hasTorch=(L.gear.torch && L.gear.torch>0);
    if(hasTorch){ L.gear.torch--; }
    else{
      L.stam=Math.max(0,L.stam-2);
      L.mind=Math.max(0,L.mind-(L.gear.compass?1:2));
    }
  }

  // 节点触发
  var newNode=lineCurNode(L.stepMin);
  var oldNode=lineCurNode(oldMin);
  if(newNode.title!==oldNode.title && newNode.special){
    if(newNode.special==='bridge'){
      if(L.gear.rope && L.gear.rope>0){
        L.gear.rope=0;
        L.msg='**断桥** —— 你把绳子甩过断口，攀着过去，绳子救了你一命。';
      }else{
        L.stam=Math.max(0,L.stam-6);
        L.msg='**断桥** —— 没绳子，贴着桥索爬过去，体力 -6，手掌磨破了。';
      }
    }else if(newNode.special==='ford'){
      if(L.gear.blanket && L.gear.blanket>0){
        L.gear.blanket=0;
        L.msg='**河滩浅雾** —— 你裹着保温毯蹚过去，出来时没失温。';
      }else{
        L.temp=Math.max(0,L.temp-8);
        L.msg='**河滩浅雾** —— 水冷刺骨，体温 -8。';
      }
    }else if(newNode.special==='slope'){
      if(L.gear.stick){
        L.msg='**绝望坡** —— 登山杖撑着你上去，没额外耗体力。';
      }else{
        L.stam=Math.max(0,L.stam-4);
        L.msg='**绝望坡** —— 没登山杖，硬爬上去，体力 -4。';
      }
    }else if(newNode.special==='coldest'){
      if(L.gear.tent && L.gear.tent>0){
        L.msg='**最冷时刻** —— 你摸到帐篷了，但现在扎营要停很久。';
      }else{
        L.temp=Math.max(0,L.temp-5);
        L.msg='**最冷时刻** —— 风冷得像刀，体温 -5。';
      }
    }
  }

  // 死亡判定
  if(L.stam<=0 || L.temp<=0 || L.mind<=0 || L.food<=0 && L.stepMin>300){
    L.stage='end'; L.endBad=true;
    lineAddDeath();
    localStorage.setItem('cm_line_best', String(Math.max(L.meta.best, Math.floor(L.stepMin))));
  }

  // 到站
  if(L.stepMin>=LINE_NODES[LINE_NODES.length-1].t && L.stage==='trip'){
    L.stage='end';
    L.endBad=false;
    lineAddClear();
    localStorage.setItem('cm_line_best', String(Math.max(L.meta.best, 999)));
  }

  render();
}

// 生火（+30 分钟，恢复体温/精神）
function lineFire(){
  var L=S.line;
  if(L.stage!=='trip') return;
  if(L.fireUsed){ L.msg='你已经生过火了。'; render(); return; }
  L.stepMin+=30;
  L.temp=Math.min(100,L.temp+8);
  L.mind=Math.min(100,L.mind+5);
  L.fireUsed=true;
  L.msg='你生了一堆火，烤了烤手——体温 +8，精神 +5。（+30 分钟）';
  // 生火也可能推进时间到下一个节点
  var newNode=lineCurNode(L.stepMin);
  if(newNode && newNode.special==='coldest' && L.gear.rope===undefined){}
  if(L.stepMin>=LINE_NODES[LINE_NODES.length-1].t){ L.stage='end'; L.endBad=false; lineAddClear(); }
  render();
}

// 扎营（跳到清晨）
function lineCamp(){
  var L=S.line;
  if(L.stage!=='trip') return;
  if(!L.gear.tent || L.gear.tent<=0){ L.msg='你没带帐篷。'; render(); return; }
  L.gear.tent=0;
  L.stam=Math.min(100,L.stam+30);
  L.temp=Math.min(100,L.temp+20);
  L.mind=Math.min(100,L.mind+15);
  L.stepMin=Math.max(L.stepMin, 570); // 跳到 05:00
  L.campUsed=true;
  L.msg='你支起帐篷，烤了烤火，睡了一觉。醒来已是黎明——体力 +30 / 体温 +20 / 精神 +15。';
  if(L.stepMin>=LINE_NODES[LINE_NODES.length-1].t){ L.stage='end'; L.endBad=false; lineAddClear(); }
  render();
}

// 使用物品（不耗时间）
function lineUse(id){
  var L=S.line;
  if(L.stage!=='trip') return;
  var g=null;
  for(var i=0;i<LINE_GEAR.length;i++){ if(LINE_GEAR[i].id===id){ g=LINE_GEAR[i]; break; } }
  if(!g || !L.gear[id] || L.gear[id]<=0){ L.msg='这件东西已经用完或没有。'; render(); return; }
  var u=g.use||{};
  if(u.type==='food'){ L.food=Math.min(100,L.food+u.val); L.gear[id]--; L.msg='你啃了一块'+g.name+'——饱食 +'+u.val+'。'; }
  else if(u.type==='water'){ L.water=Math.min(100,L.water+u.val); L.gear[id]--; L.msg='你投了一片'+g.name+'——饮水 +'+u.val+'。'; }
  else if(u.type==='heal'){ L.stam=Math.min(100,L.stam+u.stam); L.mind=Math.min(100,L.mind+u.mind); L.gear[id]--; L.msg='你用了'+g.name+'——体力 +'+u.stam+'，精神 +'+u.mind+'。'; }
  else{ L.msg='这件东西现在用不上。'; }
  render();
}


// 切换背包展开/收起
function lineToggleGear(){
  var L=S.line;
  L.gearOpen=!L.gearOpen;
  render();
}

// 返回主菜单
function lineExit(){
  S.phase='config';
  S.line=null;
  render();
}

// ===== 渲染 =====

  var html='';

        '<span class="rc-desc">'+pk.desc+'</span></button>';

    html+='</div></div>';

    for(var p=0;p<LINE_PACKS.length;p++){ if(LINE_PACKS[p].id===L.pack) packMax=LINE_PACKS[p].maxKg; }

    for(var j=0;j<L.bought.length;j++){
      for(var k=0;k<LINE_GEAR.length;k++){ if(LINE_GEAR[k].id===L.bought[j]) curKg+=LINE_GEAR[k].weight; }

      '<div class="bar" style="margin:8px 0">'+

      '</div>'+
      '<div class="route-grid" style="margin-top:8px">';
    for(var i=0;i<LINE_GEAR.length;i++){
      var g=LINE_GEAR[i];
      var has=L.bought.indexOf(g.id)>=0;
      var freeThis=(L.freeItem && !L.freeChosen && !has);

        '<span class="rc-name">'+g.name+' <span style="color:#ffb057">'+(freeThis?'免费':(g.price+' 龙门币'))+'</span> <span style="color:#8ba0ad">'+g.weight+'kg</span></span>'+
        '<span class="rc-desc">'+g.desc+'</span></button>';

    html+='<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn-main" data-act="lineGo">出发夜渡</button>'+
      '<button class="btn-ghost" data-act="lineExit">返回主菜单</button></div></div>';
  }
  else if(L.stage==='trip'){
    var node=lineCurNode(L.stepMin);

    for(var gid in L.gear){ if(L.gear[gid]>0) gearCount++; }
    html='<div class="card" style="margin:14px 0">'+

  }
  else{ // end
    var ed=L.endBad?'你没能走到北岸。第二天，巡逻队在河滩上找到你——文件还在怀里。':'你推开中转站的门，值守干员抬头，笑了一下：「回来了？喝点热的。」';
    var title=L.clearTitle?'<div class="psub" style="color:#ffd27a;margin-top:6px">称号：'+L.clearTitle+'</div>':'';
    html='<div class="card" style="margin:14px 0">'+
      '<h3>'+(L.endBad?'半路倒下':'平安抵达')+title+'</h3>'+

      '<span class="badge">饱食 '+L.food+'</span>'+
      '<span class="badge">饮水 '+L.water+'</span>'+

      '<span class="badge">精神 '+L.mind+'</span></div>'+

  }
  app.innerHTML=html;
}

// ===== src/core/prologue_engine.js =====
/* ============================================================
 * prologue_engine.js · 新手固定线性序章引擎（B3）
 * 自包含状态 S.prologue（不驱动随机局 S.turn），仅复用：
 *   - 游戏 UI 样式类（.card / .opt / .badge / .ev-* / .btn-*）
 *   - 真实装备 ID（弓/弩/铳/观测仪/引火物/陷阱等）
 *   - 早/中/晚三段标签（展示用，进度由固定节点驱动）
 * 全程保底通关、不致死（体征下限 18）；仅第一夜无引火物时一次濒死警示。
 * 通关写 cm_prologue_v1（进存档码）、解锁图鉴 pro_first，并解锁完整任务。
 * ============================================================ */

var PROLOGUE_SEGCN = { pre:'出发前', early:'早', mid:'中', night:'晚' };
var PROLOGUE_VITAL_FLOOR = 18;
var PROLOGUE_SHELL = '';

function prologueCleared(){
  try{ return localStorage.getItem('cm_prologue_v1')==='1'; }catch(e){ return false; }
}

// ---------- 启动 / 退出 ----------
function prologueStart(){
  var app=$('app');
  if(app && !PROLOGUE_SHELL) PROLOGUE_SHELL=app.innerHTML;
  S.phase='prologue';
  S.prologue={
    stage:'briefing',
    budget:PROLOGUE_BUDGET, spent:0,
    bought:[], gear:{},
    nodeIdx:0,
    v:{stam:92,temp:82,food:88,mind:90},
    obs:0, fame:0,
    warnShown:false,
    result:'', msg:'',
    forecast:null, score:0, grade:'',
    log:[],
    done:false
  };
  render();
}
function prologueExit(){
  var app=$('app');
  if(app && PROLOGUE_SHELL) app.innerHTML=PROLOGUE_SHELL;
  S.prologue=null;
  S.phase='config';
  render();
}

// ---------- 商店数据小工具 ----------
function proShopItem(id){
  for(var c=0;c<PROLOGUE_SHOP.length;c++){
    var g=PROLOGUE_SHOP[c].items;
    for(var i=0;i<g.length;i++){ if(g[i].id===id) return g[i]; }
  }
  return null;
}
function proHas(id){ return !!(S.prologue && S.prologue.gear && S.prologue.gear[id]>0); }
function proHasAny(ids){
  for(var i=0;i<ids.length;i++){ if(proHas(ids[i])) return true; }
  return false;
}
function proShopTotals(){
  var P=S.prologue, price=0, weight=0;
  for(var i=0;i<P.bought.length;i++){
    var it=proShopItem(P.bought[i]);
    if(it){ price+=it.price; weight+=it.weight; }
  }
  return {price:price, weight:Math.round(weight*10)/10};
}

// ---------- 通讯记录（系统消息，填充终端壳底部通讯栏） ----------
function prologueLog(who,text){
  var P=S.prologue; if(!P) return;
  if(!P.log) P.log=[];
  P.log.push({who:who,text:text});
}

// ---------- 阶段切换 ----------
function prologueToShop(){
  S.prologue.stage='shop';
  S.prologue.msg='';
  render();
}
function prologueBuy(id){
  var P=S.prologue, it=proShopItem(id);
  if(!it) return;
  var idx=P.bought.indexOf(id);
  if(idx>=0){ P.bought.splice(idx,1); P.msg='已移除「'+it.name+'」。'; }
  else {
    var t=proShopTotals();
    if(t.price+it.price>P.budget){ P.msg='预算不足：'+it.name+' 需 '+it.price+' 龙门币。'; render(); return; }
    if(t.weight+it.weight>PROLOGUE_CAP_KG){ P.msg='负重超限：'+it.name+' 重 '+it.weight+'kg。'; render(); return; }
    P.bought.push(id);
    P.msg='已加入「'+it.name+'」。';
  }
  render();
}
function prologueRec(){
  var P=S.prologue;
  for(var i=0;i<PROLOGUE_REC.length;i++){
    var id=PROLOGUE_REC[i];
    if(P.bought.indexOf(id)<0) P.bought.push(id);
  }
  var t=proShopTotals();
  P.msg='已按推荐配置整备（荒原弓 + 引火物 + 便携观测仪 + 干粮），花费 '+t.price+' 龙门币，重 '+t.weight+'kg。你也可以继续增减。';
  render();
}
function prologueGo(){
  var P=S.prologue;
  if(!P.bought.length){ P.msg='空手出勤太冒险，请至少选择一件装备。'; render(); return; }
  // 初始化实际携带量（消耗品给足附带份数）
  for(var i=0;i<P.bought.length;i++){
    var id=P.bought[i];
    if(id==='tinder') P.gear[id]=3;
    else if(id==='bandage') P.gear[id]=2;
    else if(id==='bait') P.gear[id]=2;
    else P.gear[id]=1;
  }
  P.stage='trip';
  P.nodeIdx=0;
  P.result='';
  // 通讯记录：出发时写终端启动与配装确认
  var names=P.bought.map(function(id){ var it=proShopItem(id); return it?it.name:id; }).join('、');
  var goT=proShopTotals();
  P.log=[];
  prologueLog('sys','外勤终端启动。任务：追踪源石云团，三天内抵达荒原观测点，完成天灾预警。');
  prologueLog('sys','配装确认：'+names+'，负重 '+goT.weight+' / '+PROLOGUE_CAP_KG+'kg。');
  render();
}

// ---------- 体征与判定 ----------
function proClamp(k){
  var P=S.prologue;
  if(P.v[k]>100) P.v[k]=100;
  if(P.v[k]<PROLOGUE_VITAL_FLOOR) P.v[k]=PROLOGUE_VITAL_FLOOR;
}
function proApply(fx){
  var P=S.prologue;
  if(!fx) return;
  for(var k in fx){ if(k in P.v){ P.v[k]+=fx[k]; proClamp(k); } }
  if(typeof fx.obs==='number') P.obs+=fx.obs;
  if(typeof fx.fame==='number') P.fame+=fx.fame;
}
function proUse(consume){
  var P=S.prologue;
  if(!consume) return;
  for(var id in consume){
    if(P.gear[id]>0) P.gear[id]=Math.max(0, P.gear[id]-consume[id]);
  }
}
function proAvailable(o){
  if(o.need) return proHas(o.need);
  if(o.needAny) return proHasAny(o.needAny);
  return true;
}
function proNeedName(o){
  var ids=o.needAny?o.needAny:(o.need?[o.need]:[]);
  var names=[];
  for(var i=0;i<ids.length;i++){ var it=proShopItem(ids[i]); if(it) names.push(it.name); }
  return names.join(' 或 ');
}

// 动态节点：把好选项的文案/消耗按实际装备补全
function proResolve(node,o){
  var out={label:o.t, note:o.note, consume:o.use?o.use:null};
  if(!o.need && !o.needAny) return out; // 无装备要求的选项不改动
  if(node.resolve==='hunt'){
    var order=[['pistol','源石手铳',70],['trap','捕猎陷阱',60],['xbow','手弩',55],['bow','荒原弓',40]];
    for(var i=0;i<order.length;i++){
      if(proHas(order[i][0])){
        out.label='用'+order[i][1]+'狩猎（'+order[i][2]+'% 命中）';
        out.note='命中：补给 +5（教程为固定剧情，此次必中）';
        break;
      }
    }
  } else if(node.resolve==='tool'){
    if(proHas('climb')) out.label='放攀岩绳速降（体力 -3）';
    else if(proHas('scope')) out.label='用望远镜选定缓坡（体力 -3）';
  } else if(node.resolve==='dogs'){
    if(proHas('tinder')){ out.label='点火驱赶兽群'; out.consume={tinder:1}; out.note='引火物 -1 · 精神 -2（安全守夜）'; }
    else if(proHas('bait')){ out.label='抛诱饵引开兽群'; out.consume={bait:1}; out.note='诱饵 -1 · 精神 -2（安全守夜）'; }
    else if(proHasAny(['bow','xbow','pistol'])){ out.label='持械对峙，逼退兽群'; out.consume=null; out.note='精神 -2（安全守夜）'; }
  }
  return out;
}

// ---------- 节点推进 ----------
function prologueChoose(i){
  var P=S.prologue;
  var node=PROLOGUE_NODES[P.nodeIdx];
  var o=node.opts[i];
  if(!o) return;
  if(!proAvailable(o)){ P.msg='这个选项需要：'+proNeedName(o)+'。'; render(); return; }

  var r=proResolve(node,o);
  var resultTxt='';

  // 濒死警示（第一夜无引火物保底）：先压到警戒体温，再回升
  if(node.nearWarn && o.dip && o.dip.temp){
    P.v.temp=o.dip.temp;
    proClamp('temp');
    P.warnShown=true;
    resultTxt='体温一度降到 <b>'+P.v.temp+'</b>，你手脚发麻、牙关打颤——系统提示：<b>再低就会倒下</b>。';
    prologueLog('sys','体温告急！濒死警示已触发，再低就会倒下。');
  }
  if(o.dip && !node.nearWarn){
    for(var dk in o.dip){ P.v[dk]=o.dip[dk]; proClamp(dk); }
  }
  if(r.consume) proUse(r.consume);
  proApply(o.fx);

  // 该选项的结果反馈（覆盖在该节点下方也会在下一步保留，这里先记）
  var fb=o.note||'';
  if(resultTxt){ resultTxt+='<br>'+(fb?('好在火终于生起来了。'+fb):''); }
  else resultTxt=fb;
  P.result=resultTxt;
  prologueLog('sys', (node.loc?node.loc+' · ':'')+r.label);

  // 终局
  if(node.type==='final'){
    prologueFinish();
    return;
  }
  P.nodeIdx++;
  P.msg='';
  render();
}

function prologueFinish(){
  var P=S.prologue;
  var tier=PROLOGUE_FORECAST[PROLOGUE_FORECAST.length-1];
  for(var i=0;i<PROLOGUE_FORECAST.length;i++){
    if(P.obs>=PROLOGUE_FORECAST[i].min){ tier=PROLOGUE_FORECAST[i]; break; }
  }
  P.forecast=tier;
  var vitalAvg=(P.v.stam+P.v.temp+P.v.food+P.v.mind)/4;
  P.score=60 + P.obs*6 + P.fame*4 + Math.round((vitalAvg-60)/2);
  if(P.score<0) P.score=0;
  P.grade = P.score>=150 ? '优秀' : (P.score>=110 ? '良好' : '合格');
  prologueLog('sys','预警已送达：'+tier.name+'，观测 '+P.obs+'，名声 '+P.fame+'，评分 '+P.score+'（'+P.grade+'）。');
  // 解锁：图鉴 + 本机序章标记（cm_ 前缀自动进存档码）
  try{ recordEnding('pro_first'); }catch(e){}
  try{ localStorage.setItem('cm_prologue_v1','1'); }catch(e){}
  P.done=true;
  P.stage='end';
  render();
}

// ---------- 渲染 ----------
// ---------- 行进阶段：复用主线终端壳（与随机局同一套双栏 UI） ----------
// 左栏 · 生存体征（类名、颜色阈值与主线 renderVitals 完全一致）
function proVitalsHTML(){
  var P=S.prologue;
  var rows=[
    {k:'体力',v:P.v.stam},{k:'体温',v:P.v.temp},{k:'补给',v:P.v.food},{k:'精神',v:P.v.mind}
  ];
  var html='';
  for(var i=0;i<rows.length;i++){
    var r=rows[i], c=vitColor(r.v);
    html+='<div class="vrow">'
      +'<div class="vlab">'+r.k+'</div>'
      +'<div class="vbar"><div class="vfill" style="width:'+r.v+'%;background:'+c+'"></div></div>'
      +'<div class="vnum">'+r.v+'</div>'
      +'</div>';
  }
  html+='<div class="vtag">'+rows.map(function(r){return r.k+' '+vitLabel(r.v);}).join(' · ')+'</div>';
  return html;
}

// 左栏 · 随身装备（只读，附弹药/消耗品余量）
function proAmmoTxt(id){
  var P=S.prologue;
  if(id==='bow') return '箭矢 6';
  if(id==='xbow') return '弩箭 6';
  if(id==='pistol') return '铳弹 6';
  if(id==='trap') return '一次性';
  if(id==='tinder') return '引火物 '+(P.gear.tinder||0);
  if(id==='bandage') return '绷带 '+(P.gear.bandage||0);
  if(id==='bait') return '诱饵 '+(P.gear.bait||0);
  return '';
}
function proGearHTML(){
  var P=S.prologue;
  var html='';
  for(var i=0;i<P.bought.length;i++){
    var it=proShopItem(P.bought[i]);
    if(!it) continue;
    var isWep=(it.id==='bow'||it.id==='xbow'||it.id==='pistol'||it.id==='trap');
    var am=proAmmoTxt(it.id);
    html+='<button class="gear-card readonly" disabled>'
      +'<span class="box"></span>'
      +'<span>'+(isWep?'<span class="gkind">武器</span>':'')
      +'<span class="gname">'+it.name+'</span><span class="gdesc">'+it.desc+'</span></span>'
      +'<span class="gmeta">'+it.weight.toFixed(1)+'kg'+(am?'<br><span class="am">'+am+'</span>':'')+'</span>'
      +'</button>';
  }
  var t=proShopTotals();
  $('loadRow').innerHTML='<span>已选 <b>'+P.bought.length+' 件</b></span>'
    +'<span>负重 <b>'+t.weight+' / '+PROLOGUE_CAP_KG+'kg</b></span>';
  return html;
}

// 顶部状态条（对齐主线 renderBar：旅途日段 + 地点 + 观测/名声 + 天灾进度条）
function proBarHTML(node){
  var P=S.prologue;
  var prog=Math.round(P.nodeIdx/(PROLOGUE_NODES.length-1)*100);
  return '<span>旅途第 <b>'+node.day+'</b> 日 · '+PROLOGUE_SEGCN[node.seg]+'</span>'
    +'<span class="badge">'+(node.loc||'荒原')+'</span>'
    +'<span class="badge">观测值 '+P.obs+'</span>'
    +'<span class="badge">名声 '+P.fame+'</span>'
    +'<span class="badge storm">天灾云团 · 距终局预报<span class="storm-prog"><i style="width:'+prog+'%"></i></span></span>'
    +'<span class="badge" style="color:#9df0e8;border-color:rgba(82,207,196,.45)">新手序章 · 固定剧情</span>';
}

// 底部路线（罗德岛 → 第1/2/3日 → 观测点）
function proRouteHTML(node){
  var curDay=node.day;
  var html='<span class="rnode done">罗德岛</span>';
  for(var i=1;i<=3;i++){
    html+='<span class="rlink '+(i<curDay?'done':'')+'"></span>';
    var cls='rnode';
    if(i<curDay) cls+=' done';
    else if(i===curDay) cls+=' cur';
    html+='<span class="'+cls+'">第'+i+'日</span>';
  }
  var endCls=node.type==='final'?'storm':'target';
  html+='<span class="rlink"></span><span class="rnode '+endCls+'">观测点</span>';
  return html;
}

// 底部通讯记录
function proCommHTML(){
  var P=S.prologue;
  var html='';
  for(var i=0;i<P.log.length;i++){
    var l=P.log[i];
    var who = l.who==='sys' ? '<span class="who sys">系统</span>' : '<span class="who">'+(l.who||'系统')+'</span>';
    html+='<p>'+who+' · '+l.text+'</p>';
  }
  return html;
}

// 行进阶段总渲染：还原终端壳，逐格填充
function prologueRenderTrip(){
  var app=$('app');
  var P=S.prologue;
  var node=PROLOGUE_NODES[P.nodeIdx];
  if(PROLOGUE_SHELL) app.innerHTML=PROLOGUE_SHELL;
  // 序章装备栏始终展开，禁用主线折叠点击（置空 data-act 让点击落空）
  var gt=$('gearTitle');
  if(gt){ gt.setAttribute('data-act',''); var ga=$('gearArrow'); if(ga) ga.textContent='▾'; }
  $('bar').innerHTML=proBarHTML(node);
  $('vitals').innerHTML=proVitalsHTML();
  $('gearList').innerHTML=proGearHTML();
  $('route').innerHTML=proRouteHTML(node);
  $('comm').innerHTML=proCommHTML();
  var cEl=$('comm'); if(cEl) cEl.scrollTop=cEl.scrollHeight;
  // 右栏事件卡（与主线 travel 卡同一套 .ev-* / .opt 类）
  var html='<div class="ev-kind'+(node.trans?' region':'')+'">'
    +(node.trans?'行进过渡 · ':'')+'第 '+node.day+' 日 · '+PROLOGUE_SEGCN[node.seg]+' · '+(node.loc||'荒原')+'</div>'
    +'<div class="ev-title">'+node.title+'</div>'
    +'<div class="ev-text"'+(node.trans?' style="font-style:italic;color:#9fb3c0"':'')+'>'+node.text+'</div>';
  if(node.tip) html+='<div class="psub" style="border-left:3px solid #52cfc4;padding-left:10px;margin:12px 0;color:#9df0e8">'+node.tip+'</div>';
  if(P.result) html+='<div class="march-bar">'+P.result+'</div>';
  html+='<div class="opts">'+proOptsHTML(node)+'</div>'
    +'<div style="margin-top:12px"><button class="btn-ghost" data-act="prologueExit" style="font-size:12px">放弃并退出序章</button></div>';
  $('panelCard').innerHTML=html;
}
function proOptsHTML(node){
  var html='';
  for(var i=0;i<node.opts.length;i++){
    var o=node.opts[i];
    var ok=proAvailable(o);
    var r=proResolve(node,o);
    var note=ok? r.note : ('需要：'+proNeedName(o)+'（本次未携带）');
    html+='<button class="opt" data-act="prologueChoose" data-i="'+i+'"'+(ok?'':' disabled')+'>'
      +'<span class="lbl">'+(ok?r.label:o.t)+'</span>'
      +'<span class="note">'+note+'</span>'
      +'</button>';
  }
  return html;
}

  if(P.stage==='briefing'){

      +'<div class="ev-text">正式出勤前，你会按任务<b>自行购买装备</b>。新手可直接点「按推荐配置整备」一键配齐；想自己摸索，就点物品卡片增减。预算和负重都要留意。</div>'
      +'<div class="route" style="padding:10px 12px;margin:12px 0;display:flex;gap:10px;flex-wrap:wrap">'
      +'<span class="badge" style="background:#0d141b"><b>预算</b>'+(P.budget-t.price)+' / '+P.budget+'</span>'
      +'<span class="badge" style="background:#0d141b"><b>负重</b>'+t.weight+' / '+PROLOGUE_CAP_KG+' kg</span>'
      +'<span class="badge" style="background:#0d141b"><b>已选</b>'+P.bought.length+' 件</span>'
      +'</div>';
    if(P.msg) html+='<div class="psub" style="color:#ffd27a;margin:6px 0">'+P.msg+'</div>';
    html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px">'
      +'<button class="btn-main" data-act="prologueRec">按推荐配置整备（弓+引火物+观测仪+干粮）</button>'
      +'</div>';
    for(var c=0;c<PROLOGUE_SHOP.length;c++){
      var cat=PROLOGUE_SHOP[c];
      html+='<div class="app-label" style="margin:12px 0 6px">'+cat.catName+'</div><div class="route-grid">';
      for(var i=0;i<cat.items.length;i++){
        var it=cat.items[i];
        var sel=P.bought.indexOf(it.id)>=0;
        html+='<button class="route-card'+(sel?' sel':'')+'" style="text-align:left;cursor:pointer" data-act="prologueBuy" data-id="'+it.id+'">'
          +'<span class="rc-name">'+(sel?'已选 · ':'')+it.name+'</span>'
          +'<span class="rc-desc">'+it.desc+'</span>'
          +'<span class="rc-desc" style="color:#9df0e8">'+it.price+' 龙门币 · '+it.weight+'kg</span>'
          +'</button>';
      }
      html+='</div>';
    }
    html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">'
      +'<button class="btn-main" data-act="prologueGo">整备完成，出发</button>'
      +'<button class="btn-ghost" data-act="prologueExit">返回</button>'
      +'</div></div>';
    app.innerHTML=html;
    return;
  }

  if(P.stage==='trip'){
    prologueRenderTrip();
    return;
  }

  if(P.stage==='end'){
    var fc=P.forecast;
    html+='<div class="card" style="max-width:760px;margin:16px auto">'
      +'<div class="ev-kind">第 3 日 · 晚 · 结算</div>'
      +'<div class="ev-title">第一次出勤 · 完成</div>'
      +'<div class="ev-text">'+(fc?fc.text.replace(/\*\*/g,''):'')+'</div>'
      +'<div class="route" style="padding:12px;margin:14px 0">'
      +'<div class="track-stats">'
      +'<div class="track-stat"><div class="k">预报评价</div><div class="v">'+fc.name+'</div></div>'
      +'<div class="track-stat"><div class="k">总观测值</div><div class="v">'+P.obs+'</div></div>'
      +'<div class="track-stat"><div class="k">名声</div><div class="v">'+P.fame+'</div></div>'
      +'<div class="track-stat"><div class="k">出勤评分</div><div class="v">'+P.score+'</div></div>'
      +'<div class="track-stat"><div class="k">评级</div><div class="v">'+P.grade+'</div></div>'
      +'</div></div>';
    if(P.warnShown) html+='<div class="psub" style="color:#ffb057;margin:8px 0">这一夜你曾险些失温——正式出勤里，体征归零会受伤甚至失败；带齐引火物、保温毯，能让你远离这条警戒线。</div>';
    html+='<div style="text-align:left;font-size:12.5px;color:#b8cdd8;background:rgba(82,207,196,.08);border-left:3px solid #52cfc4;padding:8px 12px;border-radius:0 6px 6px 0;margin:10px 0;line-height:1.75">碎碎念：正式出勤是<b>随机旅途</b>，没有固定路线——<b>四项体征归零会倒下</b>，留意补给与保暖；<b>沿途多做观测、攒够观测值再到终点</b>，预报才准。</div>';
    html+='<div class="ev-text">已为你解锁：<b>结局图鉴「第一次出勤」</b>、<b>完整任务选择</b>（荒原 / 雪山 / 移动城市 / 萨尔贡 / 坠机 / 观测站）。正式出勤会按表现结算<b>功勋与永久升级</b>，并把真正的随机旅途交给你。<br>推荐你的第一趟正式出勤：<b>荒原 · 天灾预警</b>。</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'
      +'<button class="btn-main" data-act="prologueExit">前往任务选择</button>'
      +'<button class="btn-ghost" data-act="prologueReplay">重玩一次序章</button>'
      +'</div></div>';
    app.innerHTML=html;
    return;
  }
}


})();
</script>
