    {"title":"停走的怀表","kind":"悬念/探索","text":"值班室抽屉里躺着一块**停走的怀表**，表盖内侧刻着一行小字：「时间会记住你。」——表针停在凌晨三点十七分。","opts":[{"t":"上紧发条，看它走不走","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"收好，等回罗德岛交公","note":"精神+2","fx":{"mind":2}},{"t":"不碰——时间在这站里早就乱了","note":"精神-1","fx":{"mind":-1}}],"id":"o15"},
    {"title":"窗外的风筝","kind":"悬念/心理","text":"窗外飘过一只**红色的风筝**，摇摇晃晃，像是在有人扯着线。可这座观测站方圆几十里，不该有放风筝的人。","opts":[{"t":"追到窗边，看它飘向哪里","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"记下它的方向，写进值班日志","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"拉上窗帘——站里的东西，越看越不对劲","note":"精神-2","fx":{"mind":-2}}],"id":"o16"},
    {"title":"雪花玻璃球","kind":"悬念/心理","text":"铁柜深处摸到一只**雪花玻璃球**，倒过来，细雪纷纷落在小木屋上。底座刻着一行字：「送给你，愿你别忘了我。」——这座站里，没有人收到过礼物。","opts":[{"t":"倒过来，看它下一场雪","note":"精神-3 · 观测+2","fx":{"mind":-3,"obs":2}},{"t":"把它放回铁柜，当作没看见","note":"精神-1","fx":{"mind":-1}},{"t":"收进怀里，离站时带回去","note":"精神+2 · 观测+1","fx":{"mind":2,"obs":1}}],"id":"o17"},
    {"title":"蝴蝶","kind":"悬念/心理","text":"值班室桌上，**一只黑底红斑的蝴蝶**正一动不动地停着，翅膀一张一合。你走近时它没飞走，反而把触须朝你偏了偏——像是在等什么。","opts":[{"t":"伸出手指，看它会不会落上来","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"记下它的花纹，翻图鉴对照","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"开窗赶它出去——这站里不该有活物","note":"精神-2","fx":{"mind":-2}}],"id":"o18"},
    {"title":"墨水瓶","kind":"悬念/心理","text":"书桌抽屉里躺着一只**墨水瓶**，瓶口干涸的墨渍结成一圈黑边。瓶底压着一张信纸，纸上只有一个字，笔迹用力到划破了纸：「走。」","opts":[{"t":"把\"走\"字临一遍，看笔迹力道","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"收好信纸，等离站时一并带回去","note":"精神+2","fx":{"mind":2}},{"t":"把墨水瓶放回抽屉，假装没翻过","note":"精神-2","fx":{"mind":-2}}],"id":"o19"},
    {"title":"旧钥匙","kind":"悬念/心理","text":"值班室抽屉底压着一串**旧钥匙**，铜的，拴着根褪色的红绳。钥匙环上刻着一个编号，和你宿舍门上的那个，一模一样。","opts":[{"t":"拿去试试宿舍的门锁","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"把钥匙挂回原处，记下编号","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"不去想它——钥匙能开的，未必是门","note":"精神-2","fx":{"mind":-2}}],"id":"o20"},
    {"title":"旧闹钟","kind":"悬念/心理","text":"铁柜深处传来**滴答、滴答**的声响。你拉开柜门，一只老式闹钟正走着字，指针指向凌晨三点十七分——和抽屉里那块怀表停走的时间，一模一样。","opts":[{"t":"把闹钟和怀表对在一起，看它们是不是同一时刻","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"按下闹钟的止闹键，让声音停下来","note":"精神+1","fx":{"mind":1}},{"t":"关紧柜门——这站里的时间，不该由你管","note":"精神-2","fx":{"mind":-2}}],"id":"o21"},
    {"title":"旧相框","kind":"悬念/心理","text":"铁柜底层压着一只**旧相框**，玻璃裂了一道缝。照片上是一群穿制服的人站在站房前合影，笑得整整齐齐。最右边那个人脸上，被什么东西划花了。","opts":[{"t":"仔细看那张划花的脸，记下轮廓","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"把相框翻过去扣在桌上","note":"精神+1","fx":{"mind":1}},{"t":"收好相框，等离站时带回去","note":"精神+2 · 观测+1","fx":{"mind":2,"obs":1}}],"id":"o22"},
    {"title":"旧棋盘","kind":"悬念/心理","text":"活动室桌上摊着一盘**下到一半的棋**，黑子白子错落，像是有人刚起身去倒水，再没回来。棋盘的角上，用铅笔写着一串日期，正是你报到那天。","opts":[{"t":"坐下来，替白方走一步","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"数一数棋盘上的子，记下局面","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"把棋盘盖起来——这盘棋，不该有人续","note":"精神-2","fx":{"mind":-2}}],"id":"o23"},
    {"title":"旧邮票","kind":"悬念/心理","text":"书页里夹着一张**旧邮票**，印着这座观测站的剪影，邮戳的日期是很多年前。邮票背面用铅笔写着三个字：「寄不出。」","opts":[{"t":"把邮票贴在一张空信封上，写好又撕掉","note":"观测+1 · 精神-4","fx":{"mind":-4,"obs":1}},{"t":"夹回书里，记住它原本的位置","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"收进口袋，等离站时寄出去试试","note":"精神+2","fx":{"mind":2}}],"id":"o24"},
    {"title":"铜哨","kind":"悬念/心理","text":"储物柜深处躺着一只**铜哨**，系着一段褪色的红绳。哨身被磨得发亮，看得出常被人含在嘴里吹。你举到嘴边，还没吹，指尖先凉了一下。","opts":[{"t":"吹响它，听回声在走廊里撞来撞去","note":"观测+1 · 精神-5","fx":{"mind":-5,"obs":1}},{"t":"把哨子挂回柜里，记住位置","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"收进怀里——哨声响起时，也许有人需要听见","note":"精神+2","fx":{"mind":2}}],"id":"o25"},
    {"title":"胶卷","kind":"悬念/心理","text":"暗室抽屉里摸到一卷**没冲完的胶卷**，片头露在外面，已经曝了光。片盒上贴着标签，只写了一个日期——正是你到站报到的前一天。","opts":[{"t":"找暗房冲出来看看","note":"观测+2 · 精神-5 · 耗时","fx":{"mind":-5,"obs":2},"time":1},{"t":"记下日期，翻值班日志对照","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"放回抽屉——没冲完的胶卷，别去冲它","note":"精神-2","fx":{"mind":-2}}],"id":"o26"},
    {"title":"旧徽章","kind":"悬念/心理","text":"储物柜底层压着一枚**旧徽章**，铜面磨得发亮，刻着观测站的徽记——正是你胸口别着的那枚。唯一不同的是，这枚徽章背面，多刻了一个名字。","opts":[{"t":"把名字抄进值班日志","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"别在胸口，跟自己的徽章叠在一起","note":"精神+1 · 观测+1","fx":{"mind":1,"obs":1}},{"t":"放回原处——一枚徽章只认一个人","note":"精神-2","fx":{"mind":-2}}],"id":"o27"},
    {"title":"煤油灯","kind":"悬念/心理","text":"走廊尽头的窗台上，**一盏煤油灯**还亮着，火苗稳稳的，像刚被人点着。可这站里早就断了电，更没人添过煤油——你白天路过时，它明明是灭的。","opts":[{"t":"凑近看灯芯，数一数灯油还剩多少","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"吹灭它，看火苗会不会自己再亮起来","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"别碰——亮着的灯，是在给谁照路？","note":"精神-3","fx":{"mind":-3}}],"id":"o28"},
    {"title":"老鼠夹","kind":"悬念/生存","text":"储物间地上摆着一排**老鼠夹**，夹子全绷着，却没一个夹到东西。最里面那支夹子上，压着一张纸条，字迹很新：「它不吃这些。」","opts":[{"t":"数一数夹子，记下位置和纸条内容","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"换个位置重新布夹，看今晚有没有动静","note":"观测+1 · 体力-2 · 精神-2","fx":{"stam":-2,"mind":-2,"obs":1}},{"t":"把夹子全部收走——它不吃，就别摆给谁看","note":"精神-2","fx":{"mind":-2}}],"id":"o29"},
    {"title":"空抽屉","kind":"悬念/心理","text":"办公桌的**抽屉开着一条缝**，里面空空荡荡，只有一角压着一张收据的边。抽屉的滑轨上，有一道很新的划痕——像是被人急急忙忙抽开过。","opts":[{"t":"拉出抽屉，看那道划痕有多长","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"照收据的日期，去翻当天的值班日志","note":"观测+1 · 精神-2 · 耗时","fx":{"mind":-2,"obs":1},"time":1},{"t":"把抽屉推回去——空的抽屉，装着的东西最沉","note":"精神-2","fx":{"mind":-2}}],"id":"o30"},
    {"title":"废报纸","kind":"悬念/心理","text":"储物间垫桌脚的**一叠旧报纸**，日期停在你报到前一周。头版印着观测站的照片，标题被水渍泡得模糊，只认得出半个字：「站……」报纸边角，有人用铅笔圈了一则小广告。","opts":[{"t":"抽出来看那则小广告写的是什么","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"记下日期和头版标题，翻旧档对照","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"把报纸压回桌脚——垫桌脚的东西，别翻它","note":"精神-2","fx":{"mind":-2}}],"id":"o31"},
    {"title":"铜钟","kind":"悬念/心理","text":"走廊尽头的小钟楼里，**一口铜钟**挂在梁上，钟舌系着红布，布边已经发白。你抬头时，钟身轻轻晃了一下——可这楼里，没有风。","opts":[{"t":"走近看钟身有没有新刻的痕迹","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"敲一下，听它响多久","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"别碰——钟自己会晃的楼，少待为妙","note":"精神-2","fx":{"mind":-2}}],"id":"o32"},
    {"title":"白蜡烛","kind":"悬念/心理","text":"值班室的桌上立着**半截白蜡烛**，烛身上没有烧过的痕迹，却放着一盒火柴，火柴盒上写着一个日期——又是你报到前那几天。","opts":[{"t":"划一根火柴点上，看它烧到哪一行字","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"记下日期，与日志对照","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"不点——没烧过的蜡烛，别替谁点它","note":"精神-2","fx":{"mind":-2}}],"id":"o33"},
    {"title":"蜡笔","kind":"悬念/心理","text":"杂物间角落的纸箱里，**一盒蜡笔**散着，笔身短得只剩半截，盒盖上画着一幅歪歪扭扭的画——一座房子、一个人、一颗很大的太阳。画角写着一个名字，不是站里任何一名员工。","opts":[{"t":"照名字翻人事档案，看有没有这个人","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"把画收好，夹进值班日志里","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"不碰——站里没有孩子，这盒蜡笔不该出现","note":"精神-3","fx":{"mind":-3}}],"id":"o34"},
    {"title":"摇篮","kind":"悬念/心理","text":"空房间的角落里，**一只摇篮**轻轻晃着，像是刚有人推过。摇篮里空荡荡，只有一张折角的小毯。你伸手按住摇篮，它停下——可你的手，明明没有用力。","opts":[{"t":"检查摇篮的底部，看有没有记号","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"抱起小毯，闻一闻有没有留下什么","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"退出房间，把门带上——摇篮不该在这站里","note":"精神-3","fx":{"mind":-3}}],"id":"o35"},
    {"title":"档案柜","kind":"悬念/心理","text":"资料室最里面立着一只**档案柜**，柜门锁着，锁眼周围没有多少灰尘——有人最近还开过它。柜顶压着一本翻旧的花名册，册子停在某一页。","opts":[{"t":"记下花名册翻开的那一页是哪个名字","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"试着撬开档案柜，看锁得这么紧的是什么","note":"观测+1 · 体力-3 · 精神-3","fx":{"stam":-3,"mind":-3,"obs":1}},{"t":"不碰——锁着的柜子，别替它开门","note":"精神-2","fx":{"mind":-2}}],"id":"o36"},
    {"title":"信笺","kind":"悬念/心理","text":"旧书桌的夹层里摸出一沓**信笺**，第一张写了半行字就停了：「如果你们看到这封信——」后面的字被水渍洇成一片，底下压着一支没盖帽的笔。","opts":[{"t":"照笔迹对照站里的值班日志","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"把信笺晾干，收进档案袋","note":"材料+1 · 精神-1","fx":{"mind":-1,"mats":1}},{"t":"不读——没写完的信，读完也没结局","note":"精神-2","fx":{"mind":-2}}],"id":"o37"},
    {"title":"断线电话","kind":"悬念/心理","text":"值班室的桌上，**一部老式电话**搁着，听筒没有挂好，悬在桌沿一晃一晃。你拿起来听了听，只有忙音；再拨回罗德岛，线路那头，也是一片寂静。","opts":[{"t":"试拨几个号码，听会不会有人接","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"检查电话线，看是从哪里断的","note":"观测+1 · 体力-2 · 精神-2","fx":{"stam":-2,"mind":-2,"obs":1}},{"t":"把听筒挂回原处——断了的线，别让它响","note":"精神-2","fx":{"mind":-2}}],"id":"o38"},
    {"title":"台历","kind":"悬念/心理","text":"值班室的**台历**停在某一页，日期正好是你报到那天。台历上，那天画了一个圈，旁边用铅笔写了两个字：「来了。」——你翻遍整本台历，只有这一页有过字迹。","opts":[{"t":"对照台历日期，翻当天的登记簿","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"记住那两个字的位置，别擦掉","note":"观测+1 · 精神-1","fx":{"mind":-1,"obs":1}},{"t":"把台历翻到今天就合上——来了，就来了","note":"精神-2","fx":{"mind":-2}}],"id":"o39"},
    {"title":"工牌","kind":"悬念/心理","text":"工具间的挂钩上，**一块工牌**孤零零挂着，照片朝里，名字朝外。你翻过来看——照片被人用墨水涂掉了，只剩名字那栏还清楚，可那个名字，不在站里的花名册上。","opts":[{"t":"记下这个名字，回去翻全站登记","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"把工牌挂回原处，照片朝里","note":"精神-1","fx":{"mind":-1}},{"t":"收好工牌，也许以后用得上","note":"材料+1 · 精神-2","fx":{"mind":-2,"mats":1}}],"id":"o40"},
    {"title":"黑胶唱片","kind":"悬念/心理","text":"休息室的唱机上，**一张黑胶唱片**还在缓缓转着，唱针落在最末尾的空槽里，一下一下地跳，发出细碎的嗒嗒声。唱片封套放在一边，封面朝下。","opts":[{"t":"掀开封套，看唱片是哪一年的","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"把唱针拨回开头，听它从头放一遍","note":"精神-2 · 观测+1 · 耗时","fx":{"mind":-2,"obs":1},"time":1},{"t":"把唱机关掉——唱片转着，人却不在，这声音不该有","note":"精神-2","fx":{"mind":-2}}],"id":"o41"},
    {"title":"蓑衣","kind":"悬念/心理","text":"门后的挂钩上，**一件蓑衣**挂着，还在往下滴水。可外面已经一个星期没下过雨了。你伸手摸了摸，水珠是凉的，指尖沾上的那一滴，带着淡淡的锈味。","opts":[{"t":"把蓑衣翻过来，看里面缝着的东西","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"摸了摸滴水的下摆，顺着水迹找来源","note":"观测+1 · 体力-3 · 精神-2","fx":{"stam":-3,"mind":-2,"obs":1}},{"t":"不碰——站里没人，蓑衣却在滴水，这不是好兆头","note":"精神-3","fx":{"mind":-3}}],"id":"o42"},
    {"title":"地窖","kind":"悬念/心理","text":"厨房的地板下，**一个地窖口**被铁板盖着，铁板上没有锁，但锈得发黑。你掀开一条缝——一股潮气涌上来，里面黑得看不清底，隐约有东西在晃。","opts":[{"t":"点着灯下去，看清里面是什么","note":"观测+2 · 体力-3 · 精神-4","fx":{"stam":-3,"mind":-4,"obs":2}},{"t":"只照一照窖口，看木板上的痕迹","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"把铁板盖回去——地窖是藏东西的，不是给人看的","note":"精神-2","fx":{"mind":-2}}],"id":"o43"},
    {"title":"温度计","kind":"悬念/心理","text":"墙上的**温度计**指着零下十二度——可屋里生着火，火苗还蹿着。你伸手摸了摸温度计，玻璃管冰凉，水银柱却在缓缓往下走，像是有什么在一点一点把热抽走。","opts":[{"t":"盯着温度计，看它到底会停在哪","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"把火拨大些，看温度计动不动","note":"体力-1 · 精神-2","fx":{"stam":-1,"mind":-2}},{"t":"不去看它——有些数，看了只会更冷","note":"精神-2","fx":{"mind":-2}}],"id":"o44"},
    {"title":"蛾","kind":"悬念/心理","text":"灯罩上，**一只蛾子**扑着翅，撞一下灯，落下来，又扑上去。它已经少了一只翅膀，壳却还亮着。你忽然发现——它停下的地方，灯罩内侧积了一层灰，那形状像一只手掌。","opts":[{"t":"凑近看那掌印，记住它的朝向","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"把蛾子赶走，擦掉灯罩上的灰","note":"体力-1 · 精神-2","fx":{"stam":-1,"mind":-2}},{"t":"熄灯——蛾子扑的是火，你看的是它","note":"精神-3","fx":{"mind":-3}}],"id":"o45"},
    {"title":"婴儿脚印","kind":"悬念/心理","text":"走廊的灰地上，**一串婴儿脚印**从走廊尽头一路通到你脚边，然后消失了。脚印很新，边缘的灰还没有被风带走——可这座观测站，已经半年没有登记过孩子了。","opts":[{"t":"顺着脚印往回走，看它从哪扇门里出来","note":"观测+2 · 精神-4 · 耗时","fx":{"mind":-4,"obs":2},"time":1},{"t":"蹲下来量一量脚印的大小","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"转身走开——有些路，不该往来的方向走","note":"精神-2","fx":{"mind":-2}}],"id":"o46"},
    {"title":"棉大衣","kind":"悬念/心理","text":"门后挂着**一件棉大衣**，袖口磨得发亮，口袋里鼓鼓的。你伸手一摸，摸出一只空火柴盒，还有一张叠得很小的纸。纸展开，上面只写着一行字：「别在夜里开门。」","opts":[{"t":"把纸收好，再摸一遍所有口袋","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"只记下那句话，把纸放回原处","note":"观测+1 · 精神-2","fx":{"mind":-2,"obs":1}},{"t":"把大衣摘下来，挂到别的房间去","note":"体力-1 · 精神-3","fx":{"stam":-1,"mind":-3}}],"id":"o47"},
    {"title":"陀螺","kind":"悬念/心理","text":"值班室的桌上，**一只陀螺还在转**。木头的，刷着红漆，转得又稳又慢，像刚被人拧过一把。你环顾四周——屋里没有人，门是关着的，窗户也没有风。","opts":[{"t":"伸手按住陀螺，看它停下","note":"观测+1 · 精神-4","fx":{"mind":-4,"obs":1}},{"t":"记住陀螺转的方向，走出门去听动静","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"不碰——屋里没人，陀螺却在转，碰了它，说不清","note":"精神-3","fx":{"mind":-3}}],"id":"o48"},
    {"title":"肥皂","kind":"悬念/心理","text":"洗手池边，**半块肥皂**搁在台沿上，还滴着水。池子是干的，水龙头拧着，可肥皂是湿的——像是几分钟前，刚有人在这里洗过手。","opts":[{"t":"摸一下肥皂，看水是凉的还是温的","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"检查台面上有没有别的痕迹","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"转身走开——池子是干的，肥皂是湿的，这个站不太对","note":"精神-3","fx":{"mind":-3}}],"id":"o49"},
    {"title":"被褥","kind":"悬念/心理","text":"里间的床上，**被褥掀开一半**，枕头窝里还留着压痕，被角垂到地上。被窝是凉的，可那形状，像是人刚起身，还没来得及叠。","opts":[{"t":"伸手探一探被窝，试还有没有余温","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"记住枕头上压痕的朝向，比一比屋里别的痕迹","note":"观测+2 · 精神-3 · 耗时","fx":{"mind":-3,"obs":2},"time":1},{"t":"把被子拉平整，盖回去——就当没人睡过","note":"精神-3","fx":{"mind":-3}}],"id":"o50"},
    {"title":"门闩","kind":"悬念/心理","text":"走廊尽头的门，**门闩从外面别着**。门是往里开的，闩却卡在外侧的铁环里——像是有人走进去，又有人从外面把门别上，不让里面的人出来。","opts":[{"t":"握住门闩，试着拉开它","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"蹲下来，从门缝往里面看","note":"观测+1 · 精神-3 · 耗时","fx":{"mind":-3,"obs":1},"time":1},{"t":"转身走开——门闩别在外头，这门里的意思，不是给你开的","note":"精神-3","fx":{"mind":-3}}],"id":"o51"},
    {"title":"手术钳","kind":"悬念/心理","text":"医务室的托盘里，**一把手术钳**搁在纱布上，钳口夹着一小缕灰白色的东西，像是线，又像是头发。托盘边沿有一圈干涸的水痕，像是刚消过毒，还没来得及收拾。","opts":[{"t":"凑近看钳口夹着的是什么","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"把纱布和钳子原样放好，记住位置","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"退出医务室——托盘收拾了一半，干活的人没走远","note":"精神-3","fx":{"mind":-3}}],"id":"o52"},
    {"title":"解剖刀","kind":"悬念/心理","text":"医务室抽屉拉开一半，**一把解剖刀**躺在里面，刃口擦得雪亮，刀柄上缠着发黄的纱布。纱布上有一道暗色的痕迹，像是很久以前渗进去的，再没洗掉。","opts":[{"t":"握住刀柄，看那道痕迹是水渍还是别的","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"把抽屉推回去，记住这把刀的位置","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"退出医务室——抽屉拉开一半，像是有人刚翻过","note":"精神-3","fx":{"mind":-3}}],"id":"o53"},
    {"title":"镊子","kind":"悬念/心理","text":"医务室的托盘里，**一把镊子**搁在纱布边上，镊尖夹着一小块灰白色的碎屑。托盘底有一层没擦净的印子，像是放过什么东西，又被人端走了。","opts":[{"t":"凑近看镊尖夹着的是什么碎屑","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"把托盘原样端回柜子里，记住位置","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"退出医务室——托盘端走了一半，收拾的人还没回来","note":"精神-3","fx":{"mind":-3}}],"id":"o54"},
    {"title":"听诊器","kind":"悬念/心理","text":"医务室的柜门开着一条缝，**一副听诊器**挂在柜子里的挂钩上，胶管垂下来，金属头搭在一本翻开的书上。书页被压出一个圆印，像是有人经常把它夹在这儿听什么。","opts":[{"t":"拿起听诊器，贴在墙上听隔壁的动静","note":"观测+2 · 精神-5 · 耗时","fx":{"mind":-5,"obs":2},"time":1},{"t":"把柜门合上，记住听诊器的位置","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"退出医务室——柜门开一条缝，像是主人刚走开","note":"精神-3","fx":{"mind":-3}}],"id":"o55"},
    {"title":"氧气瓶","kind":"悬念/心理","text":"医务室角落里，**一只氧气瓶**靠在墙边，压力表的指针停在零。瓶口的胶管垂到地上，管口压着一块干掉的污渍——像是有人在这里接过氧气，又没人把它收起来。","opts":[{"t":"拧开阀门，听瓶里还有没有气","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"蹲下来看胶管口的污渍是什么","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"退出医务室——瓶是空的，管是脏的，像是很久没人来过","note":"精神-3","fx":{"mind":-3}}],"id":"o56"},
    {"title":"葡萄糖","kind":"悬念/心理","text":"医务室柜子里，**几瓶葡萄糖**码得整整齐齐，标签上写着日期，最新的那瓶拆了封，针头还插在瓶口的胶塞上，液面只下去了一小截。","opts":[{"t":"记下这瓶葡萄糖的日期和开封状态","note":"观测+2 · 精神-3","fx":{"mind":-3,"obs":2}},{"t":"拔掉针头，把瓶口重新封好","note":"材料+1 · 精神-3","fx":{"mind":-3,"mats":1}},{"t":"退出医务室——输到一半的人，不会自己拔针","note":"精神-5","fx":{"mind":-5}}],"id":"o57"},
    {"title":"牙刷","kind":"悬念/心理","text":"洗手台上，**一支牙刷**插在杯子里，刷毛还是湿的。牙膏管口敞着，挤过的痕迹还新鲜。可这屋子里的水，早该停了——这刷毛上的湿，像是几分钟前的事。","opts":[{"t":"用手背碰一下刷毛，感觉那点湿","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"记下杯子、牙刷、牙膏的位置，退出洗手间","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"不碰——水停了，牙刷还湿着，这屋子在骗你","note":"精神-4","fx":{"mind":-4}}],"id":"o58"},
    {"title":"输液架","kind":"悬念/心理","text":"医务室墙角，**一架输液架**立着，挂钩上还吊着半瓶空了的盐水袋，软管垂到地上，针头那一头卷了卷，没有插进谁的手臂。地上没有水渍，可软管末端，还挂着一滴。","opts":[{"t":"凑近看那滴挂着的液体","note":"观测+2 · 精神-5","fx":{"mind":-5,"obs":2}},{"t":"记下输液架的位置和状态，退出房间","note":"观测+1 · 精神-3","fx":{"mind":-3,"obs":1}},{"t":"别靠近——那一滴没落下来，是在等你抬头","note":"精神-4","fx":{"mind":-4}}],"id":"o59"},
    {"title":"走廊尽头的灯","kind":"悬念/心理","text":"深夜，走廊尽头**那盏坏了三个月的应急灯，忽然自己亮了**。灯管吱吱地闪了两下，稳定下来，把那段走廊照得清清楚楚——光下的走廊空无一人，只有光，没有影子。","opts":[{"t":"走过去，看灯座下有没有新的痕迹","note":"观测+2 · 精神-4","fx":{"mind":-4,"obs":2}},{"t":"记进值班日志：第四夜，走廊尽头的灯自行点亮","note":"观测+1","fx":{"obs":1}},{"t":"关掉这层楼的总闸","note":"精神+2 · 观测-1","fx":{"mind":2,"obs":-1}}],"id":"o60"},
    {"title":"镜子里的人","kind":"悬念/心理","text":"盥洗室的镜子上，**蒙着一层水雾**，雾里用手指写了一行字——不是你写的。字迹歪歪扭扭，像是刚写完没多久，水珠还在往下淌。","opts":[{"t":"伸手把字擦掉","note":"精神-3 · 观测+1","fx":{"mind":-3,"obs":1}},{"t":"对着镜子，看一眼雾里的自己","note":"精神-5","fx":{"mind":-5}},{"t":"不看，直接关灯走出去","note":"精神-1","fx":{"mind":-1}}],"id":"o61"},
    {"title":"空了的床位","kind":"悬念/心理","text":"走廊尽头那间宿舍，**床上的被褥叠得整整齐齐**，枕头边还放着半本翻开的笔记——可排班表上，这间屋子的人早就不在名单上了。笔记的纸页，还留着新折过的痕。","opts":[{"t":"把笔记合上，放回原位","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"翻开笔记看一眼最后写的日期","note":"精神-4 · 观测+1","fx":{"mind":-4,"obs":1}},{"t":"不看——叠得太整齐的床，不要去碰","note":"精神-1","fx":{"mind":-1}}],"id":"o62"},
    {"title":"第三把椅子","kind":"悬念/心理","text":"值班室里，**三把椅子围着一张桌子**——排班表上今天只有两个人。第三把椅子上，坐垫被坐得微微下陷，像刚有人起身离开。桌上，放着一杯还冒热气的茶。","opts":[{"t":"把那杯茶端走，倒掉","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"在第三把椅子上坐下来","note":"精神-5","fx":{"mind":-5}},{"t":"不看——三把椅子的屋子，坐两个人正好","note":"精神-1","fx":{"mind":-1}}],"id":"o63"},
    {"title":"空了的值班室","kind":"悬念/心理","text":"推开值班室的门，**桌子对面的椅子是空的**，可桌上的搪瓷杯里，茶还剩半杯，杯壁上留着一个清晰的唇印——排班表上，这间屋今天只排了你一个。","opts":[{"t":"把那半杯茶倒掉，洗干净","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"坐进那把椅子，喝一口剩下的茶","note":"精神-5","fx":{"mind":-5}},{"t":"不坐——空椅子上的茶，别碰","note":"精神-1","fx":{"mind":-1}}],"id":"o64"},
    {"title":"镜子上的指纹","kind":"悬念/心理","text":"值班室的镜子上，**一枚新鲜的指纹**按在镜面上，按得很用力。可这一层楼，今天就你一个人——指纹的方向，是从镜子里面按出来的。","opts":[{"t":"把镜子擦干净","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"对着镜子比一比那枚指纹","note":"精神-4","fx":{"mind":-4}},{"t":"不看——镜子上的东西，越擦越清楚","note":"精神-1","fx":{"mind":-1}}],"id":"o65"},
    {"title":"第六步的脚印","kind":"悬念/心理","text":"走廊的水磨石地上，**一串脚印**从门口一直走到值班室门口——一共六步。可你从门口走到值班室，今天数过，是七步。","opts":[{"t":"蹲下来，从门口重新数一遍","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"用手量一量脚印的大小","note":"精神-3 · 观测+1","fx":{"mind":-3,"obs":1}},{"t":"不数——地上的东西，越数越长","note":"精神-1","fx":{"mind":-1}}],"id":"o66"},
    {"title":"值班室的钟","kind":"悬念/心理","text":"值班室墙上的挂钟，**忽然当当敲了六下**——可现在排班表上写的是八点。钟面上，指针倒着走了一格。","opts":[{"t":"把钟拨回正点","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"盯着钟看它再走一格","note":"精神-4","fx":{"mind":-4}},{"t":"不看——钟倒着走的屋子，别待","note":"精神-1","fx":{"mind":-1}}],"id":"o67"},
    {"title":"墙上的刻痕","kind":"悬念/心理","text":"值班室的墙根下，**一排小小的刻痕**——一道一道，数到第七道就停了。可值班表上，你是这层楼这个月的第八个人。","opts":[{"t":"用手指量一量刻痕的深浅","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"在第八道旁边，也刻一道","note":"精神-3","fx":{"mind":-3}},{"t":"不看——墙上的东西，越看越多","note":"精神-1","fx":{"mind":-1}}],"id":"o68"},
    {"title":"熄灯后的广播","kind":"悬念/心理","text":"熄灯后，**走廊的广播忽然沙沙响了起来**——先是静电，然后是一个很轻的女声，在报一串排班。可这层楼，排班表上早就没有这个名字了。","opts":[{"t":"走过去，把广播关掉","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"站在原地，听完那串排班","note":"精神-4","fx":{"mind":-4}},{"t":"不听——广播里的声音，越听越近","note":"精神-1","fx":{"mind":-1}}],"id":"o69"},
    {"title":"值班桌上的水杯","kind":"悬念/心理","text":"值班室桌上，**一只水杯**里的水，结着一层薄冰。现在是夏天。杯子外壁上，还挂着一滴正在往下掉的水珠——可这层楼，今天没人用过这张桌子。","opts":[{"t":"把水倒掉，杯子倒扣过来","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"用手指沾一点水，尝一尝","note":"精神-4","fx":{"mind":-4}},{"t":"不碰——桌上的水，别碰","note":"精神-1","fx":{"mind":-1}}],"id":"o70"},
    {"title":"值班室的抽屉","kind":"悬念/心理","text":"值班室的抽屉，**半开着**，里面是一摞旧值班记录。你翻到最后一页，签名栏里，是你自己的笔迹——可你今天第一次来这层楼。","opts":[{"t":"把记录合上，塞回抽屉","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"翻一翻前面几页","note":"精神-4","fx":{"mind":-4}},{"t":"不看——抽屉里的东西，别翻","note":"精神-1","fx":{"mind":-1}}],"id":"o71"},
    {"title":"走廊的脚步声","kind":"悬念/心理","text":"走廊里，**一串脚步声**从那头走过来，一步一步，很慢。你屏住呼吸——可脚步声到了你门口，停了。门外，再没动静。","opts":[{"t":"推门出去看","note":"精神-3 · 观测+1","fx":{"mind":-3,"obs":1}},{"t":"贴着门，听门外","note":"精神-4","fx":{"mind":-4}},{"t":"关灯，假装没人","note":"精神-1","fx":{"mind":-1}}],"id":"o72"},
    {"title":"观测窗的霜","kind":"悬念/心理","text":"观测窗上，**结着一层霜**——可这层楼，空调一直开着暖气。霜花在玻璃上，慢慢开出一朵花的形状，像有人哈了一口气。","opts":[{"t":"把霜擦掉，看看窗外","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"不擦——霜花的形状，别细看","note":"精神-1","fx":{"mind":-1}},{"t":"用手指在霜上画了一道","note":"精神-3","fx":{"mind":-3}}],"id":"o73"},
    {"title":"值班室的灯","kind":"悬念/心理","text":"值班室的灯，**关了又亮，亮了又关**，一明一灭。你走过去看——开关在你手里。可这层楼，今天除了你，没有别人。","opts":[{"t":"把灯关掉，离开","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"站着看灯再闪一次","note":"精神-4","fx":{"mind":-4}},{"t":"不管——灯闪就闪","note":"精神-1","fx":{"mind":-1}}],"id":"o74"},
    {"title":"观测窗的倒影","kind":"悬念/心理","text":"夜里，**观测窗的玻璃上映出你的影子**。你动，影子也动——可影子比你，慢了半拍。","opts":[{"t":"把窗帘拉上","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"盯着影子看","note":"精神-4","fx":{"mind":-4}},{"t":"不看——窗上的影子，别细看","note":"精神-1","fx":{"mind":-1}}],"id":"o75"},
    {"title":"值班室的表","kind":"悬念/心理","text":"值班室墙上，**一台旧表**滴答走着。你对了一下自己的表——值班室这台，慢了整整四十分钟。可你明明记得，进来时它还在走。","opts":[{"t":"把它拨回正确时间","note":"精神-2 · 观测+1","fx":{"mind":-2,"obs":1}},{"t":"记下它现在的时间","note":"观测+2","fx":{"obs":2}},{"t":"不碰——表慢，也许是楼慢","note":"精神-3","fx":{"mind":-3}}],"id":"o76"},

  function campFxHtml(fx){

  // 委托按难度分档：难度决定阶段天数与事件密度；难度越高的委托，报酬与名望越丰厚
  
  
  // 委托池抽取：同一难度去重后取 2~3 个候选（按难度 +1 个）
  function questCandidates(){
    var d = S.questDiff || (S.quest?S.quest.diff:'mid');
    var pool=SARGON_QUESTS.filter(function(q){return q.diff===d;});
    var used = S.sargonUsedQuests || (S.sargonUsedQuests=[]);
    var cand=shuffle(pool).filter(function(q){return used.indexOf(q.title)<0;}).slice(0,3);
    if(cand.length<2){ cand=shuffle(pool).slice(0,3); }
    return cand;
  }
  function randVillage(){
    var used=S.stageVillages||[];
    var v=shuffle(SARGON_VILLAGES).filter(function(x){return used.indexOf(x)<0;})[0] || SARGON_VILLAGES[(S.stageVillages.length||0)%SARGON_VILLAGES.length];
    return v;
  }

  function pickWeatherIdx(notIdx){

  }

    var p=sysWeather();

    for(var i=0;i<SEGS;i++){

  // ===== E5-1 存档码导出导入 =====
  var SAVE_CODE='';
  var SAVE_MSG='';
  function saveCollectKeys(){
    var out={};
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && (k.indexOf('tm_')===0 || k.indexOf('cm_')===0)){
        try{ out[k]=localStorage.getItem(k); }catch(e){}
      }
    }
    return out;
  }
  function saveGen(){
    try{
      var data=saveCollectKeys();
      var n=0; for(var k in data) n++;
      var payload={v:1,ts:Date.now(),keys:n,data:data};
      SAVE_CODE='CM1|'+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
      SAVE_MSG='已生成存档码：'+n+' 个存档键，'+SAVE_CODE.length+' 字符。可复制或下载保存。';
    }catch(e){ SAVE_MSG='生成失败：'+e.message; }
    render();
  }
  function saveCopyFallback(txt){
    var ta=document.getElementById('saveCodeTA');
    if(ta){ ta.value=txt; ta.focus(); ta.select(); ta.setSelectionRange(0,99999); try{ document.execCommand('copy'); SAVE_MSG='已复制到剪贴板。'; }catch(e){ SAVE_MSG='复制失败，请手动全选文本框复制。'; } }
    else SAVE_MSG='复制失败，请手动复制。';
    render();
  }
  function saveCopy(){
    var ta=document.getElementById('saveCodeTA');
    var txt=(ta&&ta.value)?ta.value:'';
    if(!txt){ SAVE_MSG='请先生成存档码。'; render(); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ SAVE_MSG='已复制到剪贴板。'; render(); },function(){ saveCopyFallback(txt); });
    }else{ saveCopyFallback(txt); }
  }
  function saveDownload(){
    var ta=document.getElementById('saveCodeTA');
    var txt=(ta&&ta.value)?ta.value:'';
    if(!txt){ SAVE_MSG='请先生成存档码。'; render(); return; }
    try{
      var blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='天灾信使-存档码-'+new Date().toISOString().slice(0,10)+'.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}},1000);
      SAVE_MSG='已下载存档码文件。';
    }catch(e){ SAVE_MSG='下载失败：'+e.message; }
    render();
  }

    var career=parse('tm_career_v82');
    if(career){
      rows.push(['累计死亡', (career.deaths||0)+' 次']);
      rows.push(['最高观测值', String(career.maxObs||0)]);
    }
    var pro=parse('cm_prologue_v1');
    if(pro) rows.push(['新手序章', '已完成']);
    var men=parse('tm_mentor_v1');
    if(men) rows.push(['旧名 · 师徒', '有档案']);
    var sar=parse('tm_sargon_v2');
    if(sar) rows.push(['萨尔贡巡游', '有档案']);
    var pref=parse('tm_pref_v9');
    if(pref){ var m=missionById(pref.mission); rows.push(['上次出勤', (m?m.name:pref.mission)]); }
    var n=0; for(var key in d) n++;
    rows.push(['存档键总数', String(n)]);
    var time='';
    if(payload.ts){
      try{
        var dt=new Date(payload.ts);
        time=dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2)
          +' '+('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
      }catch(e){}
    }
    return {rows:rows,time:time,n:n};
  }
  function saveImport(){
    var ta=document.getElementById('saveCodeTA');
    var raw=(ta&&ta.value)?ta.value.trim():'';
    if(!raw){ SAVE_MSG='请先粘贴存档码到文本框。'; render(); return; }
    if(raw.indexOf('CM1|')!==0){ SAVE_MSG='存档码格式不正确（应以 CM1| 开头）；请确认完整复制了整串文本。'; render(); return; }
    var payload;
    try{
      payload=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));
    }catch(e){
      SAVE_MSG='存档码无法解码或不完整：可能复制时缺了字符、混入了空格或换行，或被改动过。请重新完整复制后再试。';
      render(); return;
    }
    if(!payload || typeof payload!=='object'){ SAVE_MSG='存档码内容不是有效数据。'; render(); return; }
    if(payload.v!==1){ SAVE_MSG='存档码版本不被识别（v='+payload.v+'）；请确认这是《天灾信使》生成的存档码。'; render(); return; }
    if(!payload.data){ SAVE_MSG='存档码里没有可恢复的数据。'; render(); return; }
    var n=0; for(var k in payload.data) n++;
    if(!n){ SAVE_MSG='存档码为空，没有可导入的内容。'; render(); return; }
    var pv=savePreview(payload);
    var rowsHtml='';
    for(var i=0;i<pv.rows.length;i++){
      rowsHtml+='<div style="display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed rgba(255,255,255,.08);padding:3px 0"><span style="color:#9fb3c0">'+pv.rows[i][0]+'</span><b>'+pv.rows[i][1]+'</b></div>';
    }
    var body='<div class="tip">这是存档码将恢复的内容，请先确认：</div>'
      +'<div style="font-size:13px;line-height:1.8;margin:8px 0 6px">'+rowsHtml+'</div>'
      +(pv.time?'<div style="color:#7f95a3;font-size:12px;margin-bottom:6px">备份时间：'+pv.time+'</div>':'')
      +'<div class="tip warn">确认后将<b>覆盖当前本机的全部履历、功勋、永久升级、藏品与结局解锁</b>，此操作不可撤销。建议先点「生成存档码」备份当前进度。</div>';
    SAVE_MSG='已生成导入预览，请确认后覆盖。';
    uiModal({title:'导入存档 · 预览', danger:true, okLabel:'确认导入（覆盖）', cancelLabel:'取消', body:body,
      onCancel:function(){ SAVE_MSG='已取消导入，当前进度未改动。'; render(); },
      onOk:function(){ saveApplyImport(payload); } });
  }
  // F5/F6：确认后再写入；先写后删，出错不丢键
  function saveApplyImport(payload){
    try{
      for(var key in payload.data){ localStorage.setItem(key,payload.data[key]); }
      var toRemove=[];
      for(var i=0;i<localStorage.length;i++){
        var kk=localStorage.key(i);
        if(kk && (kk.indexOf('tm_')===0||kk.indexOf('cm_')===0) && !(kk in payload.data)) toRemove.push(kk);
      }
      for(var j=0;j<toRemove.length;j++) localStorage.removeItem(toRemove[j]);
      var n=0; for(var k in payload.data) n++;
      SAVE_MSG='导入成功：'+n+' 个键已写入，页面即将刷新。';
      render();
      if(typeof setTimeout==='function'){ setTimeout(function(){ location.reload(); },900); }
      else { try{ location.reload(); }catch(e){} }
    }catch(e){
      SAVE_MSG='写入失败：'+e.message+'；当前进度未被清空，可重试或先导出备份。';
      render();
    }
  }

  // ===== 武器命中（含种族加成） =====
  function weaponPct(w, mode){
    var p=w.pct+(S.huntBuff||0);
    if(mode==='hunt' && S.race==='lupo') p+=5;
    if(mode==='fight' && S.race==='cautus') p+=5;
    if((S.race==='sankta'||S.race==='mythfeli') && (w.id==='pistol'||w.id==='rifle')) p+=5;
    return Math.min(100,p);
  }
  function bestWeapon(){
    var f=gearFx();
    if((f.pistol||f.rifle) && S.ammo>0) return { id: f.rifle?'rifle':'pistol', pct: f.rifle?90:70, label: f.rifle?'源石长铳':'源石手铳', cost:'ammo' };
    if(f.xbow && S.bolt>0) return { id:'xbow', pct:55, label:'手弩', cost:'bolt' };
    if(f.trap && S.trapLeft>0) return { id:'trap', pct:60, label:'捕猎陷阱', cost:'trap' };
    if(f.bow && (S.arrow||0)>0) return { id:'bow', pct:40, label:'荒原弓', cost:'arrow' };
    return null;
  }
  function hunt(ev){
    var w=bestWeapon();
    if(!w){ return ''; }
    var pct=weaponPct(w,'hunt');
    if(collHas('huntPct')) pct+=3;
    var gain=ev.gain||12;
    var result;
    if(Math.random()*100 < pct){
      S.food+=gain;
      if(S.mission==='sargon') S.water=Math.max(0,Math.min(100+(gearFx().canteen||0)*20,(S.water===undefined?80:S.water)+Math.ceil(gain/2)));   // 荒漠狩猎也能解渴
      CAREER.huntOK++; saveCareer();
      result='狩猎成功（'+w.label+'）：**猎物命中倒地**，你收获补给 +'+gain+(S.mission==='sargon'?'、饮水 +'+Math.ceil(gain/2):'')+'。';
      addLog('sys','狩猎成功：'+w.label+' 收获补给 +'+gain);
    } else {
      S.stam-=3; S.mind-=2;
      CAREER.huntFail++; saveCareer();
      result='狩猎落空（'+w.label+'）：箭头擦过，**猎物惊逃而去**，你一无所获（体力-3 · 精神-2）。';
      addLog('sys','狩猎落空：'+w.label+' 没打中，猎物惊逃（体力-3 · 精神-2）');
    }
    if(w.cost==='ammo'){ S.ammo--; }
    else if(w.cost==='bolt'){ S.bolt--; }
    else if(w.cost==='arrow'){ S.arrow=Math.max(0,S.arrow-1); }
    else if(w.cost==='trap'){ S.trapLeft=0; }
    clamp();
    return result;
  }
  function loseGear(){
    var nonW=[];
    for(var i=0;i<S.gear.length;i++){ if(!WEAPON_KIND[S.gear[i]]) nonW.push(S.gear[i]); }
    if(nonW.length){
      var rm=nonW[Math.floor(Math.random()*nonW.length)];
      S.gear.splice(S.gear.indexOf(rm),1);
      S.lastLose=gearById(rm).name;
    }
  }
  function fight(ev){
    var w=bestWeapon();
    if(!w){ return ''; }
    var pct=weaponPct(w,'fight');
    var result;
    if(Math.random()*100 < pct){
      S.food+=10; S.mats+=1; S.ammo+=2; S.fought++;
      CAREER.fightWin++; saveCareer();
      result='你**击退了'+ev.enemy+'**（'+w.label+'），缴获补给 +10 · 材料 +1 · 弹药 +2。';
      addLog('sys','战斗胜利：击退'+ev.enemy+'，缴获补给/材料/弹药');
    } else {
      S.food-=8; S.mats=Math.max(0,S.mats-1); S.robbed++;
      CAREER.fightLose++; saveCareer();
      result='你不敌'+ev.enemy+'，**被抢走补给 -8 · 材料 -1**。';
      if(Math.random()<0.3){ loseGear(); result+='慌乱中遗失了「'+S.lastLose+'」。'; }
      addLog('sys','战斗失利：被'+ev.enemy+'抢走补给和材料');
    }
    if(w.cost==='ammo'){ S.ammo--; }
    else if(w.cost==='bolt'){ S.bolt--; }
    else if(w.cost==='arrow'){ S.arrow=Math.max(0,S.arrow-1); }
    else if(w.cost==='trap'){ S.trapLeft=0; }
    clamp();
    return result;
  }

  // ===== 选项可用性 =====
  function optDisabled(o){
    if(o.reqMed && S.medLeft<=0) return true;
    if(o.hunt && !bestWeapon()) return true;
    if(o.combat && !bestWeapon()) return true;
    if(o.reqBow && !(gearFx().bow||gearFx().xbow)) return true;
    if(o.reqWeapon && !bestWeapon()) return true;
    if(o.reqMats && S.mats<(o.reqMats||0)) return true;
    if(o.reqObs && !(gearFx().obs)) return true;
    if(o.reqArmor && !(gearFx().armor)) return true;
    if(o.reqFlare && !(gearFx().flare)) return true;
    if(o.reqGuest && !S.metPeer) return true;
    if(o.reqBlanket && !(gearFx().blanket)) return true;
    if(o.reqSpade && !(gearFx().spade)) return true;
    if(o.reqClimb && !(gearFx().climb)) return true;
    if(o.reqScope && !(gearFx().scope)) return true;
    if(o.reqCamo && !(gearFx().camo)) return true;
    if(o.reqBandage && (S.bandage||0)<=0) return true;
    if(o.reqTinder && (S.tinder||0)<=0) return true;
    if(o.reqBait && (S.bait||0)<=0) return true;
    if(o.reqCity && (S.cityHeart||0)<(o.reqCity||0)) return true;   // V10.5 移动城市：城心门槛
    // 雪山信标点亮：燃料/火种检验（V10.6：体温过低不再是硬门槛，改为成功率减半，见点亮仪式）
    if(o.lit && S.beaconUnit){
      if(o.lit.fail) return false;
      if(o.lit.need){ var lNeed=o.lit.need-(UPS.ignite>=1?1:0); if(S.food<lNeed) return true; }        // 补给不足（信标引燃术可减 1 燃料）
      if(o.lit.needFlare && !(gearFx().flare) && !(S.flareCnt>0)) return true;  // 无信号弹/火种引火
      return false;
    }
    if(o.time && S.timeLeft<=0) return true;   // 时间耗尽，不能再耗时
    if(o.sellMats && S.mats<=0) return true;   // 无材料可卖
    if(o.reqComm) return false;
    return false;
  }
  function optNote(o){
    var note=o.note||'';
    if(o.hunt||o.combat){
      var w=bestWeapon();
      if(w){ var pct=weaponPct(w, o.hunt?'hunt':'fight'); note='成功率 '+pct+'% · '+w.label; }
      else note='需要武器';
    } else if(o.reqMed && S.medLeft<=0){ note='（无急救包）'+note; }
    else if(o.reqMats && S.mats<o.reqMats){ note='（材料不足）'+note; }
    else if(o.reqBow && !(gearFx().bow||gearFx().xbow)){ note='（需弓/弩）'+note; }
    else if(o.reqWeapon && !bestWeapon()){ note='（需武器）'+note; }
    else if(o.reqObs && !(gearFx().obs)){ note='（需观测仪）'+note; }
    else if(o.reqArmor && !(gearFx().armor)){ note='（需防护服）'+note; }
    else if(o.reqFlare && !(gearFx().flare) && !(S.flareCnt>0)){ note='（需信号弹/火种）'+note; }
    else if(o.reqGuest && !S.metPeer){ note='（需遇到同行信使）'+note; }
    else if(o.reqBlanket && !(gearFx().blanket)){ note='（需保温毯）'+note; }
    else if(o.reqCity && (S.cityHeart||0)<(o.reqCity||0)){ note='（城心不足）'+note; }
    else if(o.lit && S.beaconUnit && S.temp<40 && !o.lit.fail){ note='（体温偏低 · 点亮成功率减半）'+note; }   // V10.6
    else if(o.time && S.timeLeft<=0){ note='（时间不足）'+note; }
    else if(o.sellMats){ note='材料 x'+S.mats+' → 功勋 +'+S.mats*3; }
    return note;
  }

  // ===== 种族天赋对事件 fx 的修正 =====
  function raceFx(ev, opt){
    var nf={};
    var fx=opt.fx||{};
    for(var k in fx){ nf[k]=fx[k]; }
    if((S.race==='savra'||S.race==='fidia') && ev.heat && nf.temp<0){ nf.temp=Math.ceil(nf.temp/2); }
    if(S.race==='feline' && ev.night){
      if(nf.temp<0) nf.temp=Math.ceil(nf.temp/2);
      if(nf.stam<0) nf.stam=Math.ceil(nf.stam/2);
      if(nf.food<0) nf.food=Math.ceil(nf.food/2);
      if(nf.mind<0) nf.mind=Math.ceil(nf.mind/2);
    }
    if(S.race==='libolai' && nf.obs>0) nf.obs+=1;
    if(S.race==='fidia' && opt.evade && nf.stam<0) nf.stam+=3;
    if(S.race==='cautus' && opt.evade && nf.stam<0) nf.stam=Math.ceil(nf.stam*0.8);
    if(S.race==='sarkaz' && nf.mind<0) nf.mind=Math.ceil(nf.mind*0.6);
    return nf;
  }

  // ===== 当前段事件（绝境 > 固定剧情 > 天象替换） =====
  function setCurEv(){
    if(S.mission==='sargon'){ sargonEvent(); return; }
    if(S.mission==='crash'){ crashEvent(); return; }
    if(S.mission==='survival'){ survivalEvent(); return; }
    var crit=criticalStat();
    if(crit){
      S.curEv=CRISIS[crit]; S.curEv._crisis=true; sndPlay('danger');
      if(!S.crisisUsed) S.crisisUsed={};
      S.crisisUsed[crit]=true;   // V10.6：绝处逢生每属性一次，防无限续命
      var lastT=S.track.length?S.track[S.track.length-1].text:'';
      if(lastT.indexOf('绝境时刻')<0) addTrack('⚠','绝境时刻 · '+CRISIS[crit].title);
      return;
    }
    var base=S.queue[S.turn];
    if(!base){ S.curEv=null; return; }
    if(base.who || base.enemy || base.fork || base._contact){ S.curEv=base; S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false; return; }
    // 名声回声：善意或冷漠都会被荒原记住（概率触发替换普通事件）
    if((S.fame>=75 || S.fame<=25) && Math.random()<0.16){
      var fpool = S.fame>=75 ? FAME_EVENTS.good : FAME_EVENTS.bad;
      S.curEv=fpool[Math.floor(Math.random()*fpool.length)];
      S.curEv._fame=true; S.curEv._wx=false; S.curEv._crisis=false;
      return;
    }
    var w=weatherById(S.weather);
    var wxp=sysWxEvents();
    if(w && wxp[w.id] && Math.random()<0.5){
      var pool=wxp[w.id];
      S.curEv=pool[Math.floor(Math.random()*pool.length)];
      S.curEv._wx=true;
      S.curEv._crisis=false;
      S.curEv._fame=false;
    } else {
      S.curEv=base;
      S.curEv._wx=false;
      S.curEv._crisis=false;
      S.curEv._fame=false;
    }
  }

  // ===== 裂谷勘探 · 荒野求生（survival） =====
  // 复用现有 S.turn 时间系统（3段/天：清晨/中午/夜晚）
  // 四条撤离路：徒步集合点 / 紧急信标 / 信号枪+测绘机 / 旧勘探站
  // 补给道具化：S.surv.rations（干粮份数）、S.surv.waterLeft（水壶升数）
  function survDepthName(){ return ['裂谷边缘','裂谷中部','裂谷深处'][S.surv.depth||0]; }
  function survivalEvent(){
    var crit=criticalStat();
    if(crit){
      S.curEv=CRISIS[crit]; S.curEv._crisis=true; sndPlay('danger');
      if(!S.crisisUsed) S.crisisUsed={};
      S.crisisUsed[crit]=true;
      addTrack('⚠','绝境时刻 · '+CRISIS[crit].title);
      return;
    }
    // 撤离进行中：飞机到了
    if(S.surv.evacPending && S.turn>=S.surv.evacAtTurn){
      S.curEv=survivalEvacArriveEv();
      return;
    }
    // F28 保底：干粮/水/信号弹/信标全部耗尽时，累计 12 段后强制给一次废弃补给点
    var noSupply=(S.surv.rations||0)<=0 && (S.surv.waterLeft||0)<=0 && (S.surv.flares||0)<=0 && (S.surv.beaconsLeft||0)<=0;
    if(noSupply){ S.surv.noSupplySegs=(S.surv.noSupplySegs||0)+1; } else { S.surv.noSupplySegs=0; }
    if(noSupply && S.surv.noSupplySegs>=12){
      S.surv.noSupplySegs=0;
      S.curEv=survivalCacheEv();
      S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false;
      return;
    }
    // 从荒原主池随机抽，过滤夜间错配
    var todSeg=tod();
    var pool=[];
    for(var i=0;i<EVENTS.length;i++){
      var e=EVENTS[i];
      if(e._contact || e.who || e.enemy || e.fork) continue;
      if(S.surv.usedEv.indexOf(e.id)>=0) continue;
      if(todSeg!=='night' && /夜|守夜|深夜|篝火/.test((e.title||'')+(e.text||''))) continue;
      pool.push(e);
    }
    if(!pool.length){
      S.surv.usedEv=[];
      pool=EVENTS.filter(function(e){ return !e._contact && !e.who && !e.enemy && !e.fork; });
    }
    var ev=pool[Math.floor(Math.random()*pool.length)];
    S.surv.usedEv.push(ev.id);
    S.curEv=ev;
    S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false;
  }
  // F28 保底：全部消耗品耗尽时强制出现的废弃补给点
  function survivalCacheEv(){
    return { id:'surv_cache', kind:'补给 · 废弃点', title:'山壁下的废弃补给箱',
      text:'你在一处背风的山壁下，发现了一个被遗弃的旧勘探补给箱。铁皮已经锈了，锁扣却还完好——你撬开一看，里面竟还留着一点没坏的东西。',
      opts:[
        { t:'收好干粮和水', note:'干粮+2 · 水+2 · 体力+4', fx:{survRations:2,survWater:2,stam:4},
          ok:'你把两包没拆封的压缩干粮和一壶没漏的水收好（**干粮+2 · 水+2**）。' },
        { t:'翻找信号物', note:'信号弹+1 · 精神+3', fx:{survFlares:1,mind:3},
          ok:'箱底压着一支还没潮的信号弹，你小心地收进怀里（**信号弹+1**）。' },
        { t:'只拿些能用的就走', note:'体力+2', fx:{stam:2} }
      ] };
  }
  function survivalAdvance(){
    S.food=Math.max(0,S.food-2);
    S.water=Math.max(0,(S.water===undefined?80:S.water)-2);
    S.stam=Math.max(0,S.stam-1);
    if(tod()==='night'){ S.temp=Math.max(0,S.temp-3); S.mind=Math.max(0,S.mind-1); }
    S.turn++;
    if(S.turn%3===0){
      S.surv.day=day();
      S.stam=Math.min(100,S.stam+6);
      S.mind=Math.min(100,S.mind+3);
      addTrack('日','第 '+S.surv.day+' 天 · 清晨');
    }
    var expectedDepth=Math.min(2, Math.floor((S.surv.day-1)/3));
    if(expectedDepth>(S.surv.depth||0)){
      S.surv.depth=expectedDepth;
      addTrack('深','进入'+survDepthName());
    }
    clamp();
  }
  function survivalFreeAct(kind){
    if(S.phase!=='travel') return;
    var surv=S.surv;
    if(kind==='eat'){
      if((surv.rations||0)<=0){ addLog('sys','干粮吃完了。'); render(); return; }
      surv.rations--;
      S.food=Math.min(100,S.food+20);
      addTrack('食','吃了一份干粮 · 补给+20（剩 '+surv.rations+' 份）');
    } else if(kind==='water'){
      if((surv.waterLeft||0)<=0){ addLog('sys','水壶空了。'); render(); return; }
      surv.waterLeft--;
      S.water=Math.min(100,S.water+25);
      addTrack('水','喝了一壶水 · 饮水+25（剩 '+surv.waterLeft+' 升）');
    } else if(kind==='camp'){
      if(surv.tent){
        S.stam=Math.min(100,S.stam+25); S.temp=Math.min(100,S.temp+20); S.mind=Math.min(100,S.mind+10);
      } else {
        S.stam=Math.min(100,S.stam+10); S.temp=Math.min(100,S.temp+5); S.mind=Math.min(100,S.mind+3);
      }
      if(surv.tent && Math.random()<0.08){
        surv.tent=false;
        addTrack('坏','帐篷在夜里被风刮破了！');
        addLog('sys','帐篷布料被风扯了个大口子——以后只能蜷缩着睡了。');
      }
    } else if(kind==='fire'){
      S.temp=Math.min(100,S.temp+18); S.mind=Math.min(100,S.mind+5);
    }
    clamp();
    if(checkDead()){ render(); return; }
    render();
  }
  function survivalFlare(){
    if((S.surv.flares||0)<=0){ addLog('sys','信号弹没了。'); render(); return; }
    if(tod()!=='night'){ addLog('sys','信号弹要天黑才看得见——等入夜。'); render(); return; }
    if(S.surv.evacPending){ addLog('sys','已经有一架飞机在路上了。'); render(); return; }
    S.surv.flares--;

      var depth=S.surv.depth||0;

      S.surv.evacPending=true;
      S.surv.evacAtTurn=S.turn+waitDays*3;
      S.surv.evacMethod='信号枪';
      addTrack('射','信号弹升空！测绘机已上报 · '+waitDays+' 天后飞行器来接');
      addLog('sys','红色信号弹在夜空中炸开——远处传来测绘机引擎的回响。它看见了。');
    } else {
      addTrack('射','信号弹打偏了……浪费一发');
      addLog('sys','信号弹打歪了，拖着烟在峡谷壁上撞了一下，灭了。');
    }
    render();
  }
  function survivalBeacon(){
    if((S.surv.beaconsLeft||0)<=0){ addLog('sys','紧急信标已经用过了。'); render(); return; }

  // ===== 萨尔贡无尽模式（sargon） =====
  // 阶段制村→村奔波：接委托→途中事件→到村结算→新委托；名望(待遇)+见闻(荒漠能力)双轨成长；
  // 独立水源资源；撤离艺术；软性死亡(被救)；述职终局 + 名望/见闻 30% 跨季继承。
  // V11.3 声望商人事件（Lv2 游走信使起触发）：商队认出你，待遇随等级提升

    } else {
      e.text+='你这名声，算你便宜些。」';

  // V12.4b：观测发现——观测值影响探索发现（B 方案）：观测≥10 起，随观测值提高更容易在途中"看穿"水痕/商队/沙暴等增益
  function sargonObsFind(){
    if((S.obs||0)<10) return null;
    var ch=0.10+(S.obs-10)*0.006;   // obs10→10% · obs50→34% · obs90→58%
    if(Math.random()>=ch) return null;
    var finds=[
      { kind:'观测发现', title:'渗水的沙痕', text:'背风沙丘下有一线更深的颜色——是渗水的痕迹。你顺着那道印记挖下去，果然找到一小洼冰凉的地下水。',
        opts:[ { t:'取水灌满水囊', note:'水+10', fx:{water:10} }, { t:'标记位置，留待回程', note:'观测+1', fx:{obs:1} } ] },
      { kind:'观测发现', title:'远处的驼铃', text:'风沙里，你辨认出一串微弱的驼铃——一支商队正沿你推算的路线行进。',
        opts:[ { t:'赶上去搭个伴', note:'补给+6 · 精神+4', fx:{food:6,mind:4} }, { t:'记下商队的路线', note:'见闻+2', fx:{insight:2} } ] },
      { kind:'观测发现', title:'绕行的沙暴', text:'云层与沙面的光影告诉你，一场沙暴正在绕行。你提前调整了路线，避开了最凶的一段。',
        opts:[ { t:'抄近路避开沙暴', note:'体力+6', fx:{stam:6} } ] },
      { kind:'观测发现', title:'风掀开的岩层', text:'一处被风掀开的岩层下，躺着几枚古钱币和一截完好的皮革。',
        opts:[ { t:'拾起古钱币', note:'龙门币+25 · 材料+1', fx:{money:25,mats:1} }, { t:'研究皮革的来历', note:'见闻+2', fx:{insight:2} } ] },
      { kind:'观测发现', title:'远方的烟柱', text:'远处升起一道烟柱——方向、高度、颜色你都记在眼里：那是村落炊烟，不是沙暴。',
        opts:[ { t:'安心加快脚步', note:'精神+3', fx:{mind:3} } ] }
    ];
    var f=finds[Math.floor(Math.random()*finds.length)];
    f._obsFind=true;
    return f;
  }
  function sargonEvent(){
    var crit=criticalStat();
    if(crit && !S.crisisUsed[crit]){
      S.curEv=CRISIS[crit]; S.curEv._crisis=true; sndPlay('danger');
      S.crisisUsed[crit]=true;
      var lastT=S.track.length?S.track[S.track.length-1].text:'';
      if(lastT.indexOf('绝境时刻')<0) addTrack('⚠','绝境时刻 · '+CRISIS[crit].title);
      return;
    }
    // V12.4b：观测发现（绝境之后、商人之前，观测越高越容易触发）
    var of=sargonObsFind();
    if(of){ S.curEv=of; S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false; S.curEv._bias=false; addTrack('◎','观测发现'); return; }
    // V11.3 声望商人：沙海名士（Lv3）起，路上商队认得出你，给老主顾价
    if(sargonHas('merchant') && Math.random()<0.15){
      S.curEv=sargonMerchantEvent();
      S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false; S.curEv._bias=false;
      return;
    }
    var w=weatherById(S.weather);
    var wxp=sysWxEvents();
    if(w && wxp[w.id] && Math.random()<0.45){
      var pool=wxp[w.id];
      S.curEv=pool[Math.floor(Math.random()*pool.length)];
      S.curEv._wx=true; S.curEv._crisis=false; S.curEv._fame=false; S.curEv._bias=false;
      return;
    }
    if(S.quest && Math.random()<0.30){
      var b=S.quest.bias, bp=SARGON_BIAS_EVENTS[b];
      if(bp && bp.length){
        S.curEv=bp[Math.floor(Math.random()*bp.length)];
        S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false; S.curEv._bias=true;
        return;
      }
    }
    var rp=sysRegionEvents();
    var segsPer=Math.max(1,Math.floor(SEGS/REGIONS.length));
    var ri=Math.min(REGIONS.length-1, Math.floor(S.turn/segsPer));
    var rk=(REGIONS[ri]&&REGIONS[ri].id)?REGIONS[ri].id:'dunes';
    var pool2=rp[rk]||REGION_EVENTS_SARGON.dunes;
    S.curEv=pool2[Math.floor(Math.random()*pool2.length)];
    S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false; S.curEv._bias=false;
  }
  // V11.3 声望等级制：名望从 0 起步、跨季累积，等级决定功能解锁（20/40/60/80/100）
  function sargonLv(){
    var f=S.fame||0;
    if(f>=100) return 6;
    if(f>=80) return 5;
    if(f>=60) return 4;
    if(f>=40) return 3;
    if(f>=20) return 2;
    return 1;
  }
  function sargonTier(){
    var lv=sargonLv();
    if(lv>=6) return '传说信使';
    if(lv>=5) return '荒漠传说';
    if(lv>=4) return '荒漠名宿';
    if(lv>=3) return '沙海名士';
    if(lv>=2) return '游走信使';
    return '无名信使';
  }
  // 等级解锁门：休整档 / 难度档 / 商人优待 / 救援优待 / 免费补给 / 转生
  function sargonHas(door){
    var lv=sargonLv();
    if(door==='reborn') return (S.fame||0)>=100;
    if(door==='freeRest') return lv>=5;
    if(door==='rescue') return lv>=4;
    if(door==='quest_hard') return lv>=4;
    if(door==='merchant') return lv>=2;      // Lv2 起商人开始认出你（原话：声望到20，路上商人更认识你）
    if(door==='rest_rich') return lv>=3;
    if(door==='quest_mid') return lv>=2;
    if(door==='rest_mid') return lv>=2;
    return true;
  }
  // 出发：进入新阶段（区域/天数/天气按委托难度重建）
  function sargonDepart(){
    if(!S.quest) return;
    S.destVillage=randVillage();
    (S.stageVillages=S.stageVillages||[]).push(S.destVillage);
    S.sargonStage++;
    (S.sargonUsedQuests=S.sargonUsedQuests||[]).push(S.quest.title);
    var tire=sargonTire();
    DAYS=tire.days; SEGS=tire.segs; TIME_BASE=tire.timeBase; BUDGET=tire.budget;
    // 送信任务：时间宽裕，低压缓冲（不和时间赛跑）
    if(S.quest && S.quest.mail){ TIME_BASE += 10; }
    rebuildRegions('sargon', tire);
    S.turn=0; S.timeLeft=TIME_BASE; S.weather=null; S.wchain=[]; S.queue=[];
    S.wchain=genWeather(); S.weather=S.wchain[0];
    S.phase='trans'; S.initialMarch=true; S.arrived=false; S.crisisUsed={};
    S.curEv=null; S.lastHunt=null; S.lastFork=null; S.lastContact=null;
    S.finalPts=0; S.finalStage=0;
    // 首次出发初始化弹药/材料（之后阶段间保留——弹药在荒漠是稀缺品）
    if(!S.gearInited){
      var f2=gearFx();
      S.medLeft=(f2.med||0);
      S.ammo=(f2.pistol||f2.rifle)?(S.race==='sankta'?9:(S.race==='mythfeli'?11:6)):0;
      S.bolt=f2.xbow?6:0;
      S.trapLeft=f2.trap?1:0;
      S.gearInited=true;
      // V12.4b：开局随身装备总价记入累计龙门币消耗（本季投入）
      CAREER.goldSpent=(CAREER.goldSpent||0)+S.gear.reduce(function(m,x){return m+(gearById(x).price||0);},0);
      saveCareer();
    }
    S.log.push({who:'sys','text':'【第 '+S.sargonStage+' 阶段】你接下委托：「'+S.quest.title+'」'});
    S.log.push({who:'sys','text':'目标：'+S.destVillage+'。'+S.quest.desc});
    S.log.push({who:'sys','text':'途程 '+DAYS+' 天 '+SEGS+' 段 · 报酬 '+S.quest.reward+' 龙门币 · 难度「'+SARGON_TIRE_MAP[S.quest.diff].name+'」'});
    addTrack('◎','出发 · 前往'+S.destVillage+'（委托 '+S.sargonStage+'）');
    S.transit=makeTransit();
    applyMarch();
    recordDepartSeen();
    setCurEv();
    if(checkDead()){ render(); return; }
    render();
  }
  // 到村结算：完成委托 → 报酬/名望/见闻；随后摆出难度选择与新委托
  function sargonArrive(rescued){
    S.phase='arrive';
    var q=S.quest;
    if(rescued){
      S.log.push({who:'sys','text':'「'+q.title+'」没能送达——你倒在了半路，被救回村里。'});
      addTrack('❉','委托失败 · 半路被救');
    } else {
      var bonus=(S.sargonStage===1 && sargonMarks()>0)?Math.round(q.reward*sargonMarks()*0.05):0;   // 信使印记：首委托报酬 +5%/点
      S.moneyBudget=(S.moneyBudget||0)+q.reward+bonus;
      var gainF=Math.round(q.fame*((UPS.rating>=2&&S.fame>=70)?1.15:1));
      var gainI=q.insight;
      S.fame=Math.min(100,S.fame+gainF);
      S.insight=Math.min(100,S.insight+gainI);
      S.sargonFame=(S.sargonFame||0)+gainF;
      S.sargonIns=(S.sargonIns||0)+gainI;
      S.log.push({who:'sys','text':'「'+q.title+'」送达 '+S.destVillage+'。'+q.o});
      S.log.push({who:'sys','text':'报酬 '+(q.reward+(bonus?'+'+bonus:''))+' 龙门币 · 名望 +'+gainF+'（'+sargonTier()+'）· 见闻 +'+gainI+(bonus?'（信使印记加成）':'')});
      addTrack('✦','委托完成 · 名望+'+gainF);
    }
    render();
  }
  // 自选难度：简单/常规/远征（按自身状态斟酌）；难度档位随声望等级解锁
  function sargonDiff(d){
    if(S.phase!=='arrive' && S.phase!=='quest') return;
    if(d==='mid' && !sargonHas('quest_mid')) return;
    if(d==='hard' && !sargonHas('quest_hard')) return;
    S.questDiff=d;
    S.phase='quest';
    render();
  }
  function sargonPickQuest(i){
    if(S.phase!=='quest') return;
    var cand=questCandidates();
    var q=cand[i];
    if(!q) return;
    S.quest=q;
    S.phase='config2';
    render();
  }
  // 休整：花销龙门币恢复状态（可选，阶段结算时的额外服务）；高档位随声望等级解锁
  function sargonRest(kind){
    if(S.phase!=='arrive') return;
    if(kind==='free'){   // V11.3 Lv5 荒漠传说特权：到村免费大补给（每季一次）
      if(!sargonHas('freeRest') || S.freeRestUsed){ return; }
      S.freeRestUsed=true;
      S.stam=100; S.temp=100; S.food=100; S.mind=100; S.water=100;
      S.log.push({who:'sys','text':'荒漠传说之名让全村为你张罗——最好的饭食、滚烫的热水澡、干净的床铺，你睡到日上三竿（**全状态回满**）。'});
      S.restMsg='传说休整 · 全状态回满';
      render();
      return;
    }
    var plans={
      cheap:{ cost:80,  fx:{stam:15,food:8,temp:8,mind:10,water:20}, txt:'在村口的茶棚喝了一碗热茶，啃了块馕，靠在墙根晒了会儿太阳。' },
      mid:  { cost:180, fx:{stam:30,food:18,temp:18,mind:22,water:35}, txt:'租了村里最好的土屋，洗了个热水澡，吃了一顿正经饭，睡了个整觉。' },
      rich: { cost:320, fx:{stam:50,food:35,temp:35,mind:45,water:50}, txt:'村长亲自安排的招待——好酒好肉，还有人替你保养装备。' }
    };
    var p=plans[kind];
    if(kind==='mid' && !sargonHas('rest_mid')) return;
    if(kind==='rich' && !sargonHas('rest_rich')) return;
    if((S.moneyBudget||0)<p.cost){ return; }
    S.moneyBudget-=p.cost;
    CAREER.goldSpent=(CAREER.goldSpent||0)+p.cost; saveCareer();   // V12.4b：休整花销记入累计消耗
    var fx={stam:p.fx.stam,food:p.fx.food,temp:p.fx.temp,mind:p.fx.mind,water:p.fx.water};
    applyFx(fx);
    S.log.push({who:'sys','text':'休整 · 龙门币 -'+p.cost+'。'+p.txt});
    S.restMsg='休整后：体力'+S.stam+' · 补给'+S.food+' · 体温'+S.temp+' · 精神'+S.mind+' · 水源'+S.water;
    render();
  }
  // 撤离艺术：体面凯旋（名望够）或狼狈撤离（保命）
  function sargonRetreat(kind){
    if(S.phase!=='arrive') return;
    if(kind==='grace' && S.fame<40){ return; }   // 体面需要足够的名望支撑
    var grace = kind==='grace';
    S.odysseyOver=true;
    S.ending = grace ? 's_grace' : 's_haste';
    S.ended = grace ? 'grace' : 'haste';
    var col = grace?13:9;
    S.avg=Math.round((S.stam+S.temp+S.food+S.mind)/4);
    S.obsTotal=(gearFx().obs||0)+S.obs;

    var grade=sargonSeasonGrade();

    S.sgGrade=grade;
    sargonInherit(grade);
    aftermath();   // V12.4：萨尔贡撤离也把本局救人计入履历档案（累计助人）
    if(grace){
      S.moneyBudget=(S.moneyBudget||0)+Math.round(S.fame*1.5);   // 名望带来的返乡资助
      S.finalPts=S.finalPts||0;

  // 述职终局：名望/见闻双轨到顶 → 向罗德岛述职 → 顶格评级继承
  function sargonReport(){
    if(S.phase!=='arrive') return;

    S.odysseyOver=true; S.odysseyLegend=true;

  // V11.2 实绩评级：不看名望单值，看这一季真正做的事（S/A/B/C/D/E）
  // V12.4 上调实绩权重：任务数×8、救人×6、名望×1.0、见闻×1.4——正常做完几个中短任务+救过人，应稳定落在 B/A，不再轻易掉到 C
  function sargonSeasonGrade(){
    var score = (S.sargonStage||0)*8 + (S.saved||0)*6 + (S.fame||0)*1.0 + (S.insight||0)*1.4 + (S.obs||0)*2;
    if(score>=150) return 'S';
    if(score>=100) return 'A';
    if(score>=70) return 'B';
    if(score>=45) return 'C';
    if(score>=25) return 'D';
    return 'E';
  }
  function sargonGradePct(g){ var m={S:50,A:40,B:32,C:24,D:16,E:8}; return m[g]||24; }   // V12.4：结转整体上调（C 24%），带装备正常打完不再纯亏
  // V11.3 跨季继承：声望/见闻 100% 累积（只增不减，撤离不清零），资金按评级结转（S40%→E6%），写入 tm_sargon_v2（含转生印记）
  function sargonInherit(grade){
    try{
      var pct=sargonGradePct(grade||'C');
      var gold=Math.round((S.moneyBudget||0)*pct/100);
      var d={ fame:Math.min(100,(S.fame||0)),
              ins:Math.min(100,(S.insight||0)),
              gold:gold,
              grade:grade||'C', stages:S.sargonStage||0, rescued:S.odysseyRescued||0, marks:sargonMarks() };
      CAREER.goldCarried=(CAREER.goldCarried||0)+gold; saveCareer();   // V12.4b：本季带出龙门币记入累计
      localStorage.setItem('tm_sargon_v2', JSON.stringify(d));
    }catch(e){}
  }
  // 信使印记：转生获得的永久蚊子腿，可累积
  function sargonMarks(){
    try{ var d=JSON.parse(localStorage.getItem('tm_sargon_v2')||'null'); return (d&&d.marks)?d.marks:0; }catch(e){ return 0; }
  }
  // 转生：名望满 100 后自愿放弃本季声望，换 1 点信使印记（新周目拿一点奖励）
  function sargonReborn(){
    if(S.phase!=='end' || (S.fame||0)<100) return;   // V11.3：满级（名望 100）才可转生
    try{
      var d={}; try{ d=JSON.parse(localStorage.getItem('tm_sargon_v2')||'{}')||{}; }catch(e){}
      d.marks=(d.marks||0)+1; d.fame=0; d.ins=0; d.gold=0;

  // 软性死亡：被救（多种被救方式随机），名望受损、见闻保留、损失部分物资后在村醒来
  function sargonRescue(){
    S.odysseyRescued=(S.odysseyRescued||0)+1;
    var ways=[
      '一支过路的商队发现倒在沙丘后的你。他们给你灌了水，把你裹在毯子里，捎到了最近的村子。',
      '你曾经救过的那户人家，认出了你腰间褪色的信使徽记——他们顺着你的足迹找了过来，把你背回了村。',
      '你在岩壁上留的记号，被下一支路过的信使看见。那人顺着记号一路找到了你，半背半拖把你带到了村口。'
    ];
    var txt=ways[Math.floor(Math.random()*ways.length)];
    // V11.3：失败代价——名望受损（3~6，印记减免、Lv4 救援队更熟你再少扣）+ 见闻折损（1~3）
    var mk=sargonMarks();
    var loss=Math.max(1, Math.round(3+Math.random()*4) - mk*2 - (sargonHas('rescue')?2:0));
    var insLoss=Math.max(1, Math.round(1+Math.random()*2));
    S.fame=Math.max(0,S.fame-loss);
    S.insight=Math.max(0,S.insight-insLoss);
    S.food=Math.max(20,S.food-30);
    if(S.mats>0) S.mats=Math.max(0,S.mats-Math.ceil(S.mats/2));
    if(S.ammo>0) S.ammo=Math.max(0,S.ammo-Math.ceil(S.ammo/2));
    if(S.bolt>0) S.bolt=Math.max(0,S.bolt-Math.ceil(S.bolt/2));
    S.stam=Math.max(40,S.stam+30); S.mind=Math.max(40,S.mind+25); S.temp=Math.max(40,S.temp+20); S.food=Math.max(40,S.food+15);
    S.water=Math.max(40,S.water+30);
    S.phase='arrive';
    S.arriveRescue=true;
    S.log.push({who:'sys','text':'你在'+S.destVillage+'醒了过来。'+txt});
    S.log.push({who:'sys','text':'这次死里逃生让你名望受损（-'+loss+'），见闻也折损了些（-'+insLoss+'）。你记住的东西，也不是白记的。'});
    addTrack('❉','被救起 · 名望-'+loss+' 见闻-'+insLoss);
    sargonArrive(true);

  // 补给处：功勋购买启航信物（消耗品，本局生效）
  function buyRelic(id){
    if(S.phase!=='config') return;
    var rc=relicById(id);

    if(S.relics.indexOf(id)>=0 || GLORY_BALANCE<rc.price) return;

  function buyUpgrade(id){
    if(S.phase!=='config') return;
    var u=upgradeById(id); if(!u) return;
    var lv=upLv(id); if(lv>=u.lvs) return;

  function gearBlocked(id){
    if(S && S.mission==='beacon' && id==='flare') return true;
    var g=gearById(id);
    if(S && S.mission==='observatory' && (!g.sys || g.sys!=='observatory')) return true;   // 观测站只允许站内应急装备
    if(g && g.sys && S && S.mission!==g.sys) return true;   // 任务专属装备：其他任务锁定（已购可卸载）
    return false;
  }
  function toggleGear(id){
    if(S.phase!=='config') return;
    var idx=S.gear.indexOf(id);
    if(idx>=0){ S.gear.splice(idx,1); render(); return; }   // 已选 → 卸载（不受任务锁定限制）
    if(gearBlocked(id)) return;
    if(idx<0){
      var g=gearById(id);
      var money=S.gear.reduce(function(m,x){return m+gearById(x).price;},0)+g.price;
      // 点选背架时信标即按减重后计算
      var hasBack=(S.gear.indexOf('beaconpack')>=0)||id==='beaconpack';
      var bw=S.beaconUnit?(hasBack?1.5:3.5):0;
      var w=S.gear.reduce(function(m,x){return m+gearById(x).w;},0)+g.w + bw;
      if(money>S.moneyBudget){ return; }
      if(w>loadCap()+0.001){ return; }
      S.gear.push(id);
      seenAdd('gear', id);
      if(id==='bow') S.arrow=Math.max(S.arrow||0,6);   // 购弓附箭六支
      if(id==='bandage') S.bandage=Math.max(S.bandage||0,2);   // 购绷带附 2 卷
      if(id==='tinder') S.tinder=Math.max(S.tinder||0,3);      // 购引火物附 3 份
      if(id==='bait') S.bait=Math.max(S.bait||0,2);            // 购诱饵附 2 个
    }
    render();
  }

  function depart(){
    // 萨尔贡无尽：先接第一个委托（quest 选择），选完确认后出发（config2）
    if(S.mission==='sargon'){
      if(S.phase==='config'){ S.questDiff='mid'; S.phase='quest'; render(); return; }
      if(S.phase==='config2'){ sargonDepart(); return; }
      return;
    }
    // 玻利瓦尔坠机：无配装，直接从坠机开始
    if(S.mission==='crash'){
      if(S.phase!=='config') return;
      crashDepart();
      return;
    }
    // 观测站 · 无人应答：无配装，直接进入序幕
    if(S.mission==='observatory'){
      if(S.phase!=='config') return;
      recordDepartSeen();
      S.phase='obsvintro'; render(); return;
    }
    // 旧名 · 师徒测绘：强制填写姓名后出发（新档或续档）
    if(S.mission==='mentor'){
      if(S.phase!=='config') return;
      mentorBegin();
      return;
    }
    // 裂谷勘探 · 荒野求生：从罗德岛出发，勘探前哨站选址
    if(S.mission==='survival'){
      if(S.phase!=='config') return;
      bumpCareer('deps');
      S.turn=0; S.phase='travel';
      S.stam=90; S.temp=80; S.food=70; S.mind=80; S.water=70;
      S.fame=50; S.mats=0; S.saved=0; S.fought=0; S.robbed=0;
      S.obs=0; S.crystal=0; S.track=[]; S.echoUsed={}; S.finalEcho=[]; S.echoText=null;
      S.crisisUsed={}; S.weather=null; S.wchain=[]; S.lastContact=null;
      S.surv={ day:1, depth:0, usedEv:[], rations:6, waterLeft:3, tent:false, flares:2, beaconsLeft:1, flareGun:true, evacPending:false, evacAtTurn:-1, evacMethod:'', rescued:0, nights:0 };
      var f0=gearFx();
      S.medLeft=(f0.med||0);
      S.ammo=(f0.pistol||f0.rifle)?(S.race==='sankta'?9:(S.race==='mythfeli'?11:6)):0;
      S.bolt=f0.xbow?6:0;
      S.trapLeft=f0.trap?1:0;
      S.huntBuff=0;
      S.moneyBudget = BUDGET + (UPS.log>=2?50:(UPS.log===1?30:0));
      if(UPS.obs>0) S.obs+=UPS.obs;
      var ac0=activeColls(); S.collNow=ac0;
      for(var ai0=0;ai0<ac0.length;ai0++){ var cc0=collectionById(ac0[ai0]); if(!cc0) continue; }
      addTrack('生','进入裂谷勘探 · 第 1 天 · 清晨');
      addLog('sys','你站在裂谷边缘。脚下是被天灾撕开的红砂岩峡谷，远处台地平线上闪着本舰的航行灯。这片区域信号不好，终端叫不到人——勘探数据全靠你走出来。活下来，带数据回来。');
      recordDepartSeen();
      setCurEv();
      render();
      return;
    }
    if(S.phase!=='config') return;
    bumpCareer('deps');
    var availPeers=peersAvailable();
    var guests=shuffle(availPeers).slice(0,2);
    var hostile=shuffle(HOSTILE).slice(0,3);
    var forkSlots=[4,10,16];                    // 岔路探索（固定槽位）
    var hostileSlots=[9,12,15];                 // 敌对剧情
    var queue=new Array(SEGS);
    for(var i=0;i<3;i++){ queue[forkSlots[i]]=FORKS[Math.floor(Math.random()*FORKS.length)]; }
    for(i=0;i<3;i++){ queue[hostileSlots[i]]=hostile[i]; }
    // 罗德岛联络处（局外经济试行）：每区域中段出现
    for(var ct=0;ct<CONTACT_SLOTS.length;ct++){ queue[CONTACT_SLOTS[ct]]=CONTACT_EV; }
    // 区域专属事件：每区域 1 个，放该区域 span 内的空位（V9 按动态区域）
    var sysEv=sysRegionEvents();
    for(var r=0;r<REGIONS.length;r++){
      var rp=sysEv[REGIONS[r].id];
      if(!rp||!rp.length) continue;
      var ev=rp[Math.floor(Math.random()*rp.length)];
      var start=REGIONS[r].span[0], end=REGIONS[r].span[1], candidates=[];
      for(var t=start;t<=end;t++){ if(queue[t]===undefined && forkSlots.indexOf(t)<0 && hostileSlots.indexOf(t)<0) candidates.push(t); }
      if(candidates.length){ queue[candidates[Math.floor(Math.random()*candidates.length)]]=ev; }
    }
    // 路线专属事件：2 个放入该路线主区域空位（北线→乱石岗、南线→盐碱滩、中线→旧城废墟；基础区恒在前）
    var routeRegionIdx = Math.min({ north:1, south:0, center:2 }[S.route], REGIONS.length-1);
    var rteCand=[];
    for(t=0;t<SEGS;t++){
      if(regionOf(t)===routeRegionIdx && queue[t]===undefined && forkSlots.indexOf(t)<0 && hostileSlots.indexOf(t)<0) rteCand.push(t);
    }
    rteCand=shuffle(rteCand);
    var rtePick=shuffle(ROUTE_EVENTS[S.route]).slice(0, Math.min(2, rteCand.length));
    for(var ri=0;ri<rtePick.length;ri++){ queue[rteCand[ri]]=rtePick[ri]; }
    // 剩余空位用 主池+同行 洗牌填满（按空位数量动态扩容，适配长途/远征档位）
    var rest=[];
    for(i=0;i<SEGS;i++){ if(queue[i]===undefined) rest.push(i); }
    var need=rest.length;
    var pool=shuffle(EVENTS);
    while(pool.length < need-2){ pool=pool.concat(shuffle(EVENTS)); }
    var mix=shuffle(pool.slice(0, Math.max(0,need-2)).concat(guests));
    for(i=0;i<rest.length;i++){ queue[rest[i]]=mix[i]; }
    S.queue=queue;
    var f=gearFx();
    S.medLeft=(f.med||0);
    S.ammo=(f.pistol||f.rifle)?(S.race==='sankta'?9:(S.race==='mythfeli'?11:6)):0;
    S.bolt=f.xbow?6:0;
    S.trapLeft=f.trap?1:0;
    S.huntBuff=0; S.mats=0; S.saved=0; S.fought=0; S.robbed=0;
    S.finalPts=0; S.finalStage=0; S.finalSuccess=false; S.metPeer=false; S.lastLose=null;
    S.beaconLit=false; S.flareCnt=0; S.litBuff=0;
    S.cityHeart=65;   // V10.5：移动城市线「城心」（城市同心），居民互助/维护 +城心，兽潮/无视求助 -城心；V10.8 初始 65 让积累更顺
    S.crisisUsed={};  // V10.6：绝处逢生每属性一次（修复可无限触发的 bug）
    S.fame=50; S.crystal=0; S.track=[]; S.echoUsed={}; S.finalEcho=[]; S.echoText=null; S.lastContact=null;
    // 永久升级 + 评级加成（跨局生效）：预算含装备物流（覆盖式计算，避免 selectTire 后重复叠加）
    S.moneyBudget = BUDGET + (UPS.log>=2?50:(UPS.log===1?30:0));
    if(UPS.obs>0) S.obs+=UPS.obs;
    var rI=ratingIdx();
    if(rI>=0){ var rFx=RATINGS[rI].fx; if(rFx.fame) S.fame=Math.min(100,S.fame+rFx.fame); if(rFx.obs) S.obs+=rFx.obs; }
    // 藏品携带（自选或随机）
    var ac=activeColls(); S.collNow=ac;
    for(var ai=0;ai<ac.length;ai++){
      var cc=collectionById(ac[ai]); if(!cc) continue;
      if(cc.fx.obs) S.obs+=cc.fx.obs;
      if(cc.fx.fame) S.fame=Math.min(100,S.fame+cc.fx.fame);
    }
    if(S.relics.length){ addLog('sys','启航信物随行：'+S.relics.map(function(x){var r=relicById(x);return r?r.name:'';}).join('、')+'。'); }
    if(ac.length){ addLog('sys','本次出勤携带藏品：'+ac.map(function(x){var cc=collectionById(x);return cc?cc.name:'';}).join('、')+'。'); }
    S.timeLeft = TIME_BASE + (routeById(S.route)||routeById('center')).time;
    S.gearOpen=false; S.lastHunt=null; S.lastFork=null;
    S.wchain=genWeather();
    S.weather=S.wchain[0];
    var msn=missionById(S.mission);
    var ftNames=(msn&&msn.finals)?msn.finals:['storm','beast','sand'];
    S.finalType=ftNames[Math.floor(Math.random()*ftNames.length)];
    setCurEv();
    S.phase='trans';
    var rt=routeById(S.route);
    var stepTxt = msn&&msn.id==='beacon' ? '踏入谢拉格雪原' : (msn&&msn.id==='launch' ? '登上移动城市' : '踏入荒原');
    addLog('sys','配装确认。你选定'+routeSysName(rt)+'，背上行囊，'+stepTxt+'。');
    addTrack('◎','出发 · 选定「'+rt.name+'」');
    var r=raceById(S.race);
    addLog('sys','信使档案 · '+r.name+'：'+r.eff+'。');
    S.transit=makeTransit();
    applyMarch();
    recordDepartSeen();
    checkDead();
    render();
  }

  function marchCosts(){
    var f=gearFx();
    var c={
      stam:Math.max(2,4-(f.pack||0)*2-(f.map||0)),
      food:Math.max(2,3-(f.food||0)*2-(f.map||0)),
      temp:Math.max(1,2-(f.tempRes||0)*2),
      mind:2
    };
    // 雪山信标：信标组件强制随行，拖累行军（每段额外体力）
    if(S.beaconUnit) c.stam+=1;
    // 种族减耗
    if(S.race==='sarkaz') c.mind=Math.max(1,Math.round(c.mind*0.6));
    if(S.race==='savra') c.temp=Math.max(1,Math.round(c.temp*0.7));
    if(S.race==='lupo') c.stam=Math.max(1,Math.round(c.stam*0.75));
    if(S.race==='ursus') c.stam=Math.max(1,Math.round(c.stam*0.8));
    if(S.race==='feline' && tod()==='night'){
      c.stam=Math.max(1,Math.round(c.stam*0.75));
      c.food=Math.max(1,Math.round(c.food*0.75));
      c.temp=Math.max(1,Math.round(c.temp*0.75));
      c.mind=Math.max(1,Math.round(c.mind*0.75));
    }
    if(S.race==='mythfeli' && tod()==='night'){
      c.stam=Math.max(1,Math.round(c.stam*0.85));
    }
    // 天象修正
    var w=weatherById(S.weather);
    if(w){
      if(w.id==='heat') c.temp+=1;
      else if(w.id==='chill') c.temp+=2;
      else if(w.id==='sandstorm'){ c.stam+=1; c.mind+=1; }
      else if(w.id==='origdust') c.mind+=(f.mask?0:2);
      else if(w.id==='storm'){ c.temp+=3; c.stam+=1; }
      else if(w.id==='polar'){ c.temp+=4; }
      else if(w.id==='whiteout'){ c.temp+=3; c.stam+=1; c.mind+=(f.goggle?0:1); }
      else if(w.id==='snowgust'){ c.temp+=2; }
      else if(w.id==='gust'){ c.stam+=(f.rope?0:1); }
    }
    // 萨尔贡无尽：饮水消耗 + 荒漠天象修正（水源是荒漠的第一资源）
    if(S.mission==='sargon'){
      var wfs=gearFx();
      c.water = Math.max(1, 3 - (wfs.waterSkin?1:0) - (wfs.filter?1:0));
      var ws=weatherById(S.weather);
      if(ws){
        if(ws.id==='heat'||ws.id==='sandstorm'||ws.id==='fohn') c.water+=2;
        else if(ws.id==='cloudy') c.water+=1;
        if(ws.id==='coldnight') c.temp+=2;
        if(ws.id==='heat' && !wfs.awning) c.stam+=1;   // 无遮阳篷 → 灼浪额外体力消耗
      }
      if(wfs.cloak){
        var wsc=weatherById(S.weather);
        if(wsc && (wsc.id==='heat'||wsc.id==='coldnight')) c.temp=Math.max(0,Math.ceil(c.temp/2));
      }
    }
    // 启航信物：补给/体温消耗减免
    if(S.relics.indexOf('ration')>=0) c.food=Math.max(1,Math.round(c.food*0.9));
    if(S.relics.indexOf('heater')>=0) c.temp=Math.max(1,Math.round(c.temp*0.9));
    // 玻利瓦尔坠机：腿伤拖慢脚步（每段额外体力）
    if(S.mission==='crash' && S.crashWounds && S.crashWounds.leg>=1){
      c.stam+=S.crashWounds.leg;
    }
    // 永久升级 / 评级 / 藏品：补给、体力、体温百分比减免（蚊子腿）
    var fp2=0, sp2=0, tp2=0;
    var rI2=ratingIdx();
    if(rI2>=0){ var rf2=RATINGS[rI2].fx; if(rf2.foodPct) fp2+=rf2.foodPct; if(rf2.stamPct) sp2+=rf2.stamPct; }
    var ac2=S.collNow||[];
    for(var ai2=0;ai2<ac2.length;ai2++){
      var cc2=collectionById(ac2[ai2]); if(!cc2) continue;
      if(cc2.fx.foodPct) fp2+=cc2.fx.foodPct;
      if(cc2.fx.stamPct) sp2+=cc2.fx.stamPct;
      if(cc2.fx.tempPct) tp2+=cc2.fx.tempPct;
    }
    if(fp2>0) c.food=Math.max(1,Math.round(c.food*(1-fp2/100)));
    if(sp2>0) c.stam=Math.max(1,Math.round(c.stam*(1-sp2/100)));
    if(tp2>0) c.temp=Math.max(1,Math.round(c.temp*(1-tp2/100)));
    // 装备 V10.4：融雪净水器（补给 -1/段）、登山镐（雪线体力 -1，抵消信标拖累）
    if((f.filter||0)>0) c.food=Math.max(1,c.food-1);
    if((f.crampon||0)>0 && S.beaconUnit) c.stam=Math.max(1,c.stam-1);
    // 永久升级硬减（与藏品叠加，每级固定 -1，肉眼可见）：surv=补给/体力、warm=体温
    if(UPS.surv>=1) c.food=Math.max(1,c.food-1);
    if(UPS.surv>=2) c.stam=Math.max(1,c.stam-1);
    if(UPS.warm>=1) c.temp=Math.max(1,c.temp-1);
    // 藏品硬减（蚊子腿但肉眼可见：每段固定 -1，不叠加）
    var hFood=0,hStam=0,hTemp=0;
    for(var ai3=0;ai3<ac2.length;ai3++){
      var cc3=collectionById(ac2[ai3]); if(!cc3) continue;
      if(cc3.fx.foodHard) hFood=1;
      if(cc3.fx.stamHard) hStam=1;
      if(cc3.fx.tempHard) hTemp=1;
    }
    if(hFood) c.food=Math.max(1,c.food-1);
    if(hStam) c.stam=Math.max(1,c.stam-1);
    if(hTemp) c.temp=Math.max(1,c.temp-1);
    // V10.4 谢拉格御寒术 Lv2：极寒/白毛风天额外 -1 体温
    if(UPS.warm>=2 && (S.weather==='polar'||S.weather==='whiteout')) c.temp=Math.max(1,c.temp-1);
    return c;
  }

  function applyMarch(){
    var c=marchCosts();
    S.stam-=c.stam; S.food-=c.food; S.temp-=c.temp; S.mind-=c.mind;
    S.foodSpent+=c.food;
    if(S.mission==='crash' && S.crashWounds && S.crashWounds.wound>=2){
      S.stam=Math.max(1,S.stam-1);   // 未处理的伤口：每段行军持续流血
    }
    if(S.mission==='sargon'){
      var wc = (S.water===undefined?80:S.water);
      S.water = Math.max(0, wc - (c.water||0));
      if(S.water<=0){ S.stam-=3; S.mind-=2; }   // 脱水：水尽后体力与精神双耗
    }
    S.timeLeft--;   // 每段行军消耗 1 点时间（送信任务不扣——低压缓冲）
    if(S.mission==='sargon' && S.quest && S.quest.mail){ S.timeLeft++; }
    clamp();
  }

  function choose(idx){
    if(S.phase!=='travel') return;
    var ev=S.curEv;
    if(!ev) return;
    // 裂谷勘探：独立推进逻辑
    if(S.mission==='survival'){
      var opt=ev.opts[idx];
      if(optDisabled(opt)) return;
      if(opt.evac){ survivalEvacuate(S.surv.evacMethod||'飞行器'); return; }
      applyFx(raceFx(ev,opt));
      addLog('sys', ev.title+'：你选择了「'+opt.t+'」');
      if(checkDead()){ render(); return; }
      survivalAdvance();
      setCurEv();
      render();
      return;
    }
    if(ev.who){ S.metPeer=true; CAREER.meets++; saveCareer(); }
    var opt=ev.opts[idx];
    if(optDisabled(opt)) return;
    if(opt.reqMed){ S.medLeft--; }
    S.lastContact=null;
    var fx=raceFx(ev,opt);
    if(opt.saved){ fx.saved=(fx.saved||0)+opt.saved; }   // V12.4：选项层 saved:1 并入 fx，让"施以援手"真正计入 S.saved（修复评级/档案救人恒为 0）
    if(S.mission==='crash'){
      if(S.crashFight && S.crashFight.needCrisis){
        // 战斗绝境：选完绝处逢生选项后回到战斗，不走行军
        crashHandleOption(ev,opt,fx);
        S.crashFight.needCrisis=false;
        S.phase='crashfight';
        render(); return;
      }
      crashHandleOption(ev,opt,fx);
      if(S.phase==='crashfight'||S.phase==='crashcaptive'){ render(); return; }
    }
    else if(opt.hunt){ S.lastHunt=hunt(ev); S.lastFork=null; }
    else if(opt.combat){ S.lastHunt=fight(ev); S.lastFork=null; }
    else if(ev.fork){
      S.lastHunt=null;
      if(opt.prob!==undefined){
        if(Math.random()<opt.prob){ applyFx(opt.fx); S.lastFork=opt.ok; sndPlay('success'); }
        else { applyFx(opt.failFx||{}); S.lastFork=opt.fail; sndPlay('danger'); }
      } else { S.lastFork=''; }
    }
    else if(opt.sellMats){
      S.lastHunt=null; S.lastFork=null;
      var mn=S.mats;
      if(mn>0){
        var rate=3+(collHas('sellPlus')?1:0);
        var g=mn*rate;
        S.mats=0;
        addGlory(g);
        CAREER.soldMats+=mn; saveCareer();
        S.lastContact='你把 '+mn+' 份材料交给值守干员，换来 <b class="hl">'+g+' 功勋</b>（汇率 '+rate+'），已存入罗德岛账户。';
        addTrack('◆','在联络处出售材料 x'+mn+' · 功勋 +'+g);
      } else {
        S.lastContact='你摸了摸空空的材料袋——这一路没攒下什么可卖的。';
      }
    }
    else { S.lastHunt=null; S.lastFork=null; applyFx(fx); }
    // 便携星象仪：天象事件额外观测
    if(ev._wx && collHas('wx')) S.obs+=1;
    // 时间消耗（耗时选项）
    if(opt.time){ S.timeLeft--; }
    // 旅途轨迹记录
    if(ev.who) addTrack('✦','遇见同行信使 · '+ev.name);
    if(ev.enemy) addTrack('⚔','遭遇'+ev.enemy);
    if(ev.fork) addTrack('◈','岔路探索：'+opt.t);
    if(opt.saved) addTrack('♥','施以援手');
    if(opt.fx && opt.fx.crystal) addTrack('❖','采集源石结晶');
    addLog('sys', ev.title+'：你选择了「'+opt.t+'」');
    if(checkDead()){ render(); return; }
    S.phase='trans';
    S.transit=makeTransit();
    applyMarch();
    if(checkDead()){ render(); return; }
    render();
  }

  // —— crash 事件生成（setCurEv 调） ——
  function crashEvent(){
    var rgnId=REGIONS[regionOf(S.turn)].id;
    if(S.crashRetrieveNow && crashDocsCaptive()>0){ S.curEv=crashRetrieveEv(); return; }
    // 绝处逢生：每属性一次的绝境事件（V12.2 接入 crash，缓解开局重伤期）
    var crit=criticalStat();
    if(crit){
      S.curEv=CRISIS_CRASH[crit]; S.curEv._crisis=true; sndPlay('danger');
      if(!S.crisisUsed) S.crisisUsed={};
      S.crisisUsed[crit]=true;
      addTrack('⚠','绝境时刻 · '+CRISIS_CRASH[crit].title);
      return;
    }
    // 开局急救：坠机区前几段高概率给一次止血/拿药机会（V12.6，解决开局流血无治疗）
    if(rgnId==='alti' && !S.crashFirstAid && S.turn<=4 && Math.random()<0.6){ S.curEv=crashFirstAidEv(); return; }
    // F28 保底：若到高原最后一段（第 5 段）仍没给急救，强制给一次，避免开局流血无治疗
    if(!S.crashFirstAid && rgnId==='alti' && S.turn>=5){ S.curEv=crashFirstAidEv(); return; }
    // 电台（V12.6 重调概率）：丛林 12% 起步，战区 20% 并在末段逐段加码，避免被单区域 8% 卡死、被迫反复回头
    if(!S.crashRadio && S.turn>=12){
      var pRadio=0;
      if(rgnId==='jungle') pRadio=0.12;
      else if(rgnId==='warzone'){
        var wzIdx=S.turn-18;
        pRadio=0.20+(wzIdx>=3?0.06:0)+(wzIdx>=5?0.05:0);
      }
      if(pRadio>0 && Math.random()<pRadio){ S.curEv=crashRadioEv(); return; }
    }
    // F28 保底：电台（撤离路径）到第 22 段（进入战区）仍未修复则强制给一次，此后每再隔 4 段没修好就再强制，直到能撤离
    if(!S.crashRadio && S.turn>=22 && (S.turn-22)%4===0){ S.curEv=crashRadioEv(true); return; }
    if(crashDocsMoved()>0 && (rgnId==='warzone'||rgnId==='jungle') && Math.random()<0.4){ S.curEv=crashTraceEv(); return; }
    // 势力护送（V12.6 修复死路径）：不再依赖无法获得的 facWarlord 前置，战区进入后直接以 28% 概率遇军阀谈判
    if(!S.crashDeal && rgnId==='warzone' && S.turn>=18 && Math.random()<0.28){ S.curEv=crashDealEv(); return; }
    // 民众庇护（V12.6）：战区末段 30% / 边境 45% 遇到逃难村民，一次施援即可攒够信任
    if(!S.crashPeopleMet && S.facPeople<2 && (((rgnId==='warzone'&&S.turn>=20)&&Math.random()<0.30)||(rgnId==='border'&&Math.random()<0.45))){ S.curEv=crashPeopleEv(); return; }
    var pool=REGION_EVENTS_CRASH[rgnId]||REGION_EVENTS_CRASH.alti;
    // 去重：避免连续抽到同一个事件（如反复撞上战斗）
    var idx=Math.floor(Math.random()*pool.length);
    if(pool.length>1 && idx===S.crashLastIdx){ idx=(idx+1)%pool.length; }
    S.crashLastIdx=idx;
    S.curEv=pool[idx];
    S.curEv._wx=false; S.curEv._crisis=false; S.curEv._fame=false;
  }

  // —— 战斗（V12.2 三回合交锋制；V12.4 行动成本模型：进攻2/防守3/突围4，僵持也有战利品） ——
  function crashFightStart(ev,opt){
    var hunt=!!(opt&&opt.hunt);
    S.crashFight={
      hunt:hunt,
      will:hunt?1:3,
      max:hunt?1:3,
      round:0,
      gain:(opt&&opt.gain)||12,
      label:(opt&&opt.enemy)||(hunt?'猎物':'武装分子'),
      base:(opt&&opt.fbase)||(hunt?'猎物嗅到了你的气味，绷紧了身子，想跑。':'对方端着枪，杀气腾腾地围了上来。'),
      hits:0, guardBonus:false,
      msg:'', over:false, won:false, fled:false, needCrisis:false, finalText:''
    };
    S.phase='crashfight';
    addLog('sys','遭遇战：'+(hunt?'狩猎 '+S.crashFight.label:'战斗 vs '+S.crashFight.label));
    render();
  }
  function crashFightPct(){
    var w=bestWeapon();
    var pct=w?w.pct:22;
    // V12.4：坠机线战斗命中率上调（弓50 / 弩65 / 手铳80），避免三回合打不穿战意
    if(w){
      if(w.id==='bow') pct=50;
      else if(w.id==='xbow') pct=65;
      else if(w.id==='pistol') pct=80;
    }
    if(S.crashWounds.shoulder) pct-=15;
    if(S.crashWounds.wound>=2) pct-=8;
    return Math.max(5,pct);
  }
  function crashFightAct(mode){
    if(S.phase!=='crashfight'||!S.crashFight||S.crashFight.over) return;
    var F=S.crashFight;
    F.round++;
    var w=bestWeapon();
    if(mode==='attack'){
      S.stam=Math.max(0,S.stam-2);
      var pct=crashFightPct();
      if(F.guardBonus){ pct+=15; }
      F.guardBonus=false;
      if(Math.random()<pct/100){
        F.will--; F.hits++;
        if(w&&w.cost==='ammo'){ S.ammo=Math.max(0,S.ammo-1); }
        F.msg='**'+(w?w.label:'拳脚')+'命中要害**，'+(F.hunt?'猎物':'对方')+'气势受挫'+(w&&w.cost==='ammo'?'（消耗弹药）':'')+'。';
      } else {
        S.stam=Math.max(0,S.stam-2);
        F.msg=(F.hunt?'你出手落空，猎物惊跳而起。':'你出手落空，被对方逼退两步（体力-2）。');
      }
    } else if(mode==='guard'){
      S.stam=Math.max(0,S.stam-3);
      F.guardBonus=true;
      F.msg='你收住身形护住要害，观察对方的破绽（体力-3 · 下回合进攻 +15%）。';
    } else if(mode==='flee'){
      S.stam=Math.max(0,S.stam-4);
      var fleePct=S.gear.length?50:35;
      if(Math.random()<fleePct/100){
        F.over=true; F.fled=true;
        finishFight(false,'你抓住空隙，脱离战圈，'+(F.hunt?'空手而归，但人没事。':'对方没有追上来。'));
        return;
      }
      S.stam=Math.max(0,S.stam-5);
      F.msg='你转身想跑，却被逼了回来（体力-4，挣扎中又被逼退体力-5）。';
    }
    addTrack('⚔','战斗第 '+F.round+' 回合'+(F.hunt?' · 狩猎':' · 对 '+F.label));
    // 判定：胜
    if(F.will<=0){
      F.over=true; F.won=true;
      S.fought++; CAREER.fightWin++; saveCareer();
      if(F.hunt){ S.lastHunt='你放倒猎物，今晚有肉吃了（**补给+'+F.gain+'**）。'; addTrack('猎','狩猎成功 · 补给+'+F.gain); }
      else {
        var g=optGain();
        applyFx(g);
        S.stam=Math.min(100,S.stam+8);
        S.lastHunt='对方战意崩溃，丢下东西跑了——你搜刮到些补给（**补给+'+g.food+' · 弹药+'+g.ammo+' · 材料+'+g.mats+'**），士气大振（**体力+8**）。';
        addTrack('⚔','击退'+F.label+' · 战利品');
      }
      finishFight(true,S.lastHunt);
      return;
    }
    // 判定：体力归零 → 绝处逢生（stam 一次）或被俘
    if(S.stam<=0){
      if(!(S.crisisUsed&&S.crisisUsed.stam)){
        if(!S.crisisUsed) S.crisisUsed={};
        S.crisisUsed.stam=true;
        S.curEv=CRISIS_CRASH.stam; S.curEv._crisis=true; sndPlay('danger');
        F.needCrisis=true;
        addTrack('⚠','绝境时刻 · '+CRISIS_CRASH.stam.title);
        render();
        return;
      }
      F.over=true;
      S.lastHunt=F.hunt?'你脱力倒地，猎物跑远了。':'你脱力倒地，被对方拖走了。';
      finishCaptured();
      return;
    }
    // 判定：回合耗尽 → 僵持脱身（命中过就给点战利品，不再白打）
    if(F.round>=F.max){
      F.over=true;
      if(F.hunt){
        applyFx({food:2});
        S.lastHunt='猎物惊逃而去——但你在林子里捡回几颗野果（**补给+2**）。';
        addTrack('猎','狩猎落空 · 捡到野果');
      } else if(F.hits>0){
        applyFx({food:8,ammo:1});
        S.lastHunt='你没能在回合内彻底击退对方，但对方也不愿再纠缠，丢下点东西撤了（**补给+8 · 弹药+1**）。';
        addTrack('⚔','僵持 · 对方丢下补给');
      } else {
        S.lastHunt='三个回合都没占到上风，对方冷笑一声撤了。你白耗了体力，什么也没捞着。';
        addTrack('⚔','僵持 · 空手');
      }
      finishFight(false,S.lastHunt);
      return;
    }
    render();
  }

  function crashCaptiveTry(mode){

    if(S.crashTurnsCaptured===4 && S.crashDocs.disk==='captive'){ S.crashDocs.disk='moved'; S.crashTip='一个守卫嘟囔着「**盘要从黑市过手**」——数据盘也被带走了。'; }
    var succ=false, msg='', dmg=0;
    if(mode==='sneak'){ succ=Math.random()<0.45; msg=succ?'你贴住阴影，趁守卫换岗的间隙摸了出去。':'你刚碰到栅栏，探照灯就扫了过来——被按回柱子边。'; }
    else if(mode==='fight'){ var hasW=S.gear.length>0; var p=hasW?50:30; if(S.crashWounds.shoulder) p-=15; succ=Math.random()<p/100; msg=succ?'你撂倒两个守卫，夺门而出。':'那个壮汉的拳头比你的命还硬。'; dmg=10; }
    else if(mode==='bribe'){ if((S.moneyBudget||0)>=40){ S.moneyBudget-=40; succ=Math.random()<0.8; msg=succ?'守卫掂了掂钱袋，背过身去当没看见。':'守卫收了钱，转头就把你卖了。'; } else { succ=false; msg='你翻遍口袋也凑不出像样的数目。'; } }
    else if(mode==='wait'){ succ=Math.random()<0.3; msg=succ?'黎明前看守最松，你趁乱溜了出去。':'你等了一夜，营地反而加强了戒备。'; }
    if(succ){
      S.capturedNow=false; S.escapeFails=0; S.crashRetrieveNow=true;
      addTrack('⛓→','越狱成功');
      addLog('sys','你从敌营逃了出来。');
      S.transit={txt:msg+'，你踉跄着逃进夜色，回头望向那顶帐篷——文件还在里面。',tail:''};
      S.phase='trans';
      applyMarch(); checkDead(); render();
      return;
    }
    S.escapeFails++;
    // V12.3：越狱失败不再扣除体力/精神——否则试两次就力竭倒地，完全没有搏的余地。失败只累积次数，剩 2 次机会后触发处决/劫狱。
    if(S.escapeFails>=2){
      if(S.facPeople>=2 && Math.random()<0.55){
        S.capturedNow=false; S.escapeFails=0; S.crashRetrieveNow=true; S.crashTip=null;
        S.facPeople--;

        S.phase='trans';
        applyMarch(); checkDead(); render();
        return;
      }
      settleOnce();
      S.phase='end'; S.ended='crash'; S.death='exec'; S.arrived=false;
      S.score=Math.round((S.stam+S.temp+S.food+S.mind)/4);
      S.ending='c_exec';
      recordEnding('c_exec');
      bumpFlag('cExec'); bumpCareer('deaths');
      addLog('pro','……观测员。回答我。');
      aftermath();
      render();
      return;
    }
    S.captiveLastFail=msg;
    render();

  function crashHandleOption(ev,opt,fx){

    if(ev._crashType==='armory'){
      S.lastHunt=null;
      if(Math.random()<(opt.prob!==undefined?opt.prob:1)){
        if(S.gear.indexOf('rifle')<0){ S.gear.push('rifle'); S.ammo=(S.ammo||0)+4; S.lastFork='**源石长铳**——战前正规军的制式装备，保养良好，带着整整四发铳弹。你握紧了这把枪（长铳到手 · 弹药+4）。'; addTrack('铳','拾获源石长铳'); }
        else { S.ammo=(S.ammo||0)+3; S.lastFork='箱子里还有**三发铳弹**，你小心地收进怀里（弹药+3）。'; addTrack('铳','拾获铳弹'); }
        applyFx(opt.fx||{});
      }
      else { applyFx(opt.failFx||{}); S.lastFork=opt.fail||'撬锁时弄出大动静，惊动了附近的巡逻队。你撒腿就跑（体力-10 · 精神-4）。'; }
      return;
    }
    if(ev._crashType==='retrieve'){
      S.lastHunt=null;

      else { applyFx(opt.failFx||{}); S.lastFork=opt.fail||'夺回失败。'; }
      return;
    }
    if(ev._crashType==='radio'){
      S.lastHunt=null;
      if(opt.give && opt.prob!==undefined){
        // 无材料徒手硬拼：成功才修好，失败不获得无线电（V12.6）
        if(Math.random()<opt.prob){ S.crashRadio=true; applyFx(opt.fx||{}); S.lastFork=opt.ok; addTrack('讯','联络罗德岛'); }
        else { applyFx(opt.failFx||{}); S.lastFork=opt.fail; }
        return;
      }
      if(opt.give){ S.crashRadio=true; applyFx(opt.fx||{}); S.lastFork=opt.ok||'你修好了电台。'; addTrack('讯','联络罗德岛'); }
      else { applyFx(opt.fx||{}); S.lastFork=opt.ok||opt.t; }

      return;
    }
    if(ev._crashType==='deal'){
      S.lastHunt=null;
      if(opt.give){ S.crashDeal=true; S.facWarlord=Math.max(1,S.facWarlord||0); applyFx(opt.fx||{}); S.lastFork=opt.ok||'协议达成。'; addTrack('盟','达成势力护送'); }
      else { applyFx(opt.fx||{}); S.lastFork=opt.ok||opt.t; }

      var fmap={people:'People',warlord:'Warlord',corp:'Corp'};
